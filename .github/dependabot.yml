# Weekly version updates. Minor and patch updates arrive as one grouped PR per
# ecosystem; each major arrives alone. Exact pins in package.json stay exact.
# See docs/decisions/ADR-0056-dependency-update-and-audit-gates.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node is pinned to the 24 LTS line (.nvmrc, engines); its types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.71.2 (latest) declares typescript ">=4.8.4 <6.1.0", so
      # TypeScript 7 fails npm ci (ERESOLVE; PR #534). Remove this entry when a
      # typescript-eslint release accepts TypeScript 7, then take the bump with it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
