name: Work orders focused assurance
on:
  pull_request:
    paths:
      - "src/components/work-order*"
      - "src/service/work-order*"
      - "src/service/work-scope-validation.ts"
      - "src/app/api/v1/service/work-orders/**"
      - "tests/**/work-order*"
      - "playwright.work-orders.config.ts"
      - ".github/workflows/service-work-orders.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  work-orders:
    name: SV-03 native rules, complete counts and compiled desktop/phone
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install existing pinned runtime and browser
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Register, types, lint, focused units and compiled application
        run: |
          npm run studio:check
          npm run typecheck
          npm run lint
          node --import tsx --test tests/unit/work-order-register.test.ts
          npm run build
      - name: Configure disposable PostgreSQL lock capacity
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/configure-test-postgres.sh
      - name: Configure disposable synthetic database
        run: |
          cp .env.example .env.local
          python3 - <<'PYENV'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PYENV
          npm run db:migrate
          npm run db:seed
      - name: Native authority, source permissions, successors and more-than-page totals
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/work-order-register.test.ts tests/database/work-orders.test.ts
      - name: Native HTTP compatibility, authority and recovery
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > /tmp/work-orders-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/http/work-order-register.test.ts
      - name: Reset synthetic journeys
        run: PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
      - name: Actual compiled desktop and phone handovers, recovery and captures
        run: npx playwright test --config=playwright.work-orders.config.ts --reporter=list
      # Only these named PNGs of the fresh seeded synthetic app are retained.
      # Never upload server logs, traces, request/response files or session state.
      - name: Retain named synthetic register screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-orders-desktop-phone-captures
          path: |
            test-results/**/register.png
            test-results/**/snapshot.png
            test-results/**/register-320.png
          if-no-files-found: ignore
          retention-days: 14
