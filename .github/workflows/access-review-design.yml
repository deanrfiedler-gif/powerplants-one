name: Access review design review
on:
  pull_request:
    paths:
      - 'docs/design/access-review/**'
      - 'docs/reference/ui/access-review/**'
      - 'scripts/*access-review*'
      - 'src/platform/permissions.ts'
      - 'scripts/demo-database.ts'
      - '.github/workflows/access-review-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: Access review model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify generated capabilities, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/access-review
          python3 scripts/build-access-review.py
          git diff --exit-code -- docs/design/access-review/capabilities.js docs/design/access-review/access-review.html
          node scripts/check-access-review-model.mjs > verification-evidence/access-review/model-results.json
          node scripts/check-access-review-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Access-review-design-evidence
          path: verification-evidence/access-review/
          retention-days: 14
