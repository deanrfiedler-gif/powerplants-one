name: Output actions backend assurance
on:
  pull_request:
    paths:
      - "src/outputs/**"
      - "src/app/api/v1/document-outputs/**"
      - "src/shared/receipts.ts"
      - "src/platform/permissions.ts"
      - "src/access/capabilities.ts"
      - "src/documents/**"
      - "src/reports/**"
      - "db/**"
      - "scripts/migration-registry.ts"
      - "scripts/output-actions-restart-proof.ts"
      - "tests/**/output-actions*"
      - "tests/helpers/output-register.ts"
      - "tests/helpers/reports.ts"
      - ".github/workflows/output-actions-backend.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned tools and build
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
          npm run check
      - name: Configure disposable PostgreSQL lock capacity
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/configure-test-postgres.sh
      - name: Configure disposable database
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
      - name: Native issue recovery, exact recipient operations, races and populated upgrade
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/output-actions.test.ts
      - name: Historical registry and reserved Products upgrade
        run: |
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 --test-name-pattern="DK-B09|PD upgrade from (25|90|91) " tests/database/document-library.test.ts tests/database/products-upgrade.test.ts
      - name: Compiled controlled output actions HTTP
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > /tmp/output-register-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/http/output-actions.test.ts
      - name: Exact originals across PostgreSQL and application-process restart
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/output-actions-restart-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/output-actions-restart-proof.ts verify
      - name: Retain bounded synthetic restart evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Output-actions-backend
          path: verification-evidence/output-actions-restart/result.json
          if-no-files-found: ignore
          retention-days: 14
