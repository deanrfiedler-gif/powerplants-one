          mkdir -p verification-evidence/http
          # Exercise the deterministic fixture overlap early; the full HTTP suite still runs every case.
          node --env-file=.env.local --import tsx --test --test-reporter=tap --test-name-pattern='^P07 HTTP independent work orders' tests/http/field.test.ts 2>&1 | tee verification-evidence/http/field-fixture-isolation.tap
      - name: Prepare HTTP review diagnostics
