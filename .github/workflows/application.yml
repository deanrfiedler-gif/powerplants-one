name: Application assurance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  p01:
    name: P01–P11 and CRM I1–I2 local application and PostgreSQL proof
    needs: p01_suites
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every retained suite to complete successfully
        env:
          PPO_SUITE_RESULT: ${{ needs.p01_suites.result }}
        run: test "$PPO_SUITE_RESULT" = success

  p01_suites:
    name: P01–P11 ${{ matrix.suite }} proof
    runs-on: ubuntu-24.04
    # Each lane owns its disposable database; all original phases remain serial
    # within their lane. The stable p01 gate below requires every lane to pass.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, finance, reports, database]
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_PROOF_DIAGNOSTICS: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install exact package manager and locked dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          git rev-parse HEAD
          npm ls --depth=0
      - name: Install pinned controlled PDF renderer
        run: npm run browser:install
      - name: Static, unit and build checks
        run: npm run check
      - name: Configure disposable loopback database
        id: database_setup
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: CS-05 compiled facilities proof
        if: matrix.suite == 'browser'
        # Run the dedicated CS-05 proof once in the retained browser lane.
        run: npx playwright test tests/browser/facilities.spec.ts --config=playwright.compiled.config.ts --no-deps --output verification-evidence/facilities --reporter=list
      - name: Mobile CRM projections, scoped links and complete phone journey
        if: matrix.suite == 'browser'
        run: |
          node --env-file=.env.local --import tsx --test --test-concurrency=1 tests/database/mobile-crm.test.ts
          npx playwright test --config=playwright.compiled.config.ts tests/browser/mobile-crm.spec.ts tests/browser/crm.spec.ts --output verification-evidence/mobile-crm --reporter=list
      - name: Focused I2 identity, query equivalence and responsive presentation proof
        if: ${{ matrix.suite == 'browser' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: npx playwright test --config=playwright.compiled.config.ts tests/browser/crm-i2.spec.ts --output verification-evidence/i2-focused-browser --reporter=list
      - name: CRM I1 accepted journey across application and PostgreSQL restarts
        if: ${{ matrix.suite == 'browser' && !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --env-file=.env.local --import tsx scripts/crm-restart-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/crm-restart-proof.ts verify
      - name: Desktop and mobile browser checks
        if: ${{ matrix.suite == 'browser' && !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-evidence/p11-full-browser/results.json
        run: |
          npm run browser:install
          npm run test:browser -- --config=playwright.compiled.config.ts --reporter=list,json
      - name: Prepare retained browser review diagnostics immediately
        if: ${{ matrix.suite == 'browser' && always() && steps.database_setup.outcome == 'success' }}
        id: browser_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve original retained browser evidence immediately
        if: ${{ matrix.suite == 'browser' && always() && steps.browser_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-retained-browser-evidence
          path: |
            test-results/
            verification-evidence/
            !**/trace.zip
          retention-days: 14
      - name: Focused P10 desktop and phone review, allocation and reconciliation
        if: ${{ matrix.suite == 'finance' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          npx playwright test --config=playwright.compiled.config.ts tests/browser/finance.spec.ts --output verification-evidence/p10-focused-browser --reporter=list
      - name: P10 original claim, unknown acceptance and exact output through three database and four application/browser restarts
        if: ${{ matrix.suite == 'finance' && !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/finance-restart-proof.ts write
          for phase in accept reconcile verify; do
            docker restart "$PPO_POSTGRES_CONTAINER"
            for attempt in $(seq 1 30); do
              docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
              sleep 1
            done
            node --env-file=.env.local --import tsx scripts/finance-restart-proof.ts "$phase"
          done
      - name: Focused P10 Finance source, processing and account proof
        if: ${{ matrix.suite == 'finance' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/finance*.test.ts
      - name: Verify documented synthetic reset command
        if: ${{ matrix.suite == 'reports' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: |
          if npm run db:reset; then exit 1; fi
          if PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic npm run db:reset; then exit 1; fi
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          npm run db:health
      - name: P09 exact submission and response across three database and four application/browser restarts
        if: ${{ matrix.suite == 'reports' && !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --env-file=.env.local --import tsx scripts/report-restart-proof.ts write
          for phase in submit respond verify; do
            docker restart "$PPO_POSTGRES_CONTAINER"
            for attempt in $(seq 1 30); do
              docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
              sleep 1
            done
            node --env-file=.env.local --import tsx scripts/report-restart-proof.ts "$phase"
          done
      - name: Focused P09 exact return proposal and customer presentation proof
        if: ${{ matrix.suite == 'reports' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: npx playwright test --config=playwright.compiled.config.ts tests/browser/reports.spec.ts --output verification-evidence/p09-focused-browser --reporter=list
      - name: Real PostgreSQL behaviour and competing transactions
        if: ${{ matrix.suite == 'database' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: npm run test:db
      - name: Restore deterministic fixtures for HTTP and browser suites
        if: ${{ matrix.suite == 'database' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
      - name: Prove persistence across PostgreSQL process restart
        if: ${{ matrix.suite == 'database' && !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --env-file=.env.local --import tsx scripts/persistence-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/persistence-proof.ts verify
      - name: Actual HTTP routes and startup boundary
        if: ${{ matrix.suite == 'database' && !cancelled() && steps.database_setup.outcome == 'success' }}
        run: |
          if npm start; then exit 1; fi
          node --env-file=.env.local --import tsx scripts/local-server.ts > "$RUNNER_TEMP/ppo-http.log" 2>&1 &
          ppo_server_pid=$!
          ppo_http_cleanup() {
            kill "$ppo_server_pid" 2>/dev/null || true
            mkdir -p verification-evidence/http
            cp "$RUNNER_TEMP/ppo-http.log" verification-evidence/http/server.log
          }
          trap ppo_http_cleanup EXIT
          ppo_http_ready=0
          for attempt in $(seq 1 60); do
            kill -0 "$ppo_server_pid" 2>/dev/null || exit 1
            if grep -Fq 'Powerplants One — local synthetic only — http://127.0.0.1:3000' "$RUNNER_TEMP/ppo-http.log" && curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ppo_http_ready=1
              break
            fi
            sleep 1
          done
          test "$ppo_http_ready" = 1
          npm run test:http
          mkdir -p verification-evidence/p11-http
          node --env-file=.env.local --import tsx --test --test-reporter=tap tests/integration/quality-http.test.ts 2>&1 | tee verification-evidence/p11-http/results.tap
      - name: Prepare HTTP review diagnostics
        if: ${{ matrix.suite == 'database' && always() }}
        id: http_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve original HTTP component evidence immediately
        if: ${{ matrix.suite == 'database' && always() && steps.http_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-HTTP-evidence
          path: |
            verification-evidence/review-diagnostic-redactions.json
            verification-evidence/p11-http/
            verification-evidence/http/
          retention-days: 14
      - name: Offline originals across application, PostgreSQL and browser process restarts
        if: ${{ matrix.suite == 'database' && !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --env-file=.env.local --import tsx scripts/offline-restart-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/offline-restart-proof.ts accept
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/offline-restart-proof.ts verify
      - name: Prepare full review diagnostics
        if: always()
        id: full_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve synthetic visual and failure evidence
        if: ${{ always() && steps.full_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-${{ matrix.suite }}-foundation-evidence
          path: |
            verification-evidence/review-diagnostic-redactions.json
            test-results/
            verification-evidence/
            !**/trace.zip
          retention-days: 14

  p11_quality:
    name: P11 focused integrated quality and access proof
    runs-on: ubuntu-24.04
    # All retained tests and uploads finished at 30 minutes on c01dc5e,
    # but cleanup crossed the job limit by two seconds. Keep test deadlines
    # and cold development coverage; give the complete job bounded headroom.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_PROOF_DIAGNOSTICS: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install exact package manager and locked dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          git rev-parse HEAD
          npm ls --depth=0
      - name: Install pinned controlled PDF renderer
        run: npm run browser:install
      - name: Static, unit and build checks
        run: npm run check
      - name: Configure disposable loopback database
        id: database_setup
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: Focused P11 Travel guards and actual P10 current-main record upgrade
        run: |
          mkdir -p verification-evidence/p11-focused-db
          python3 - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          Path('verification-evidence/p11-focused-db/provenance.json').write_text(json.dumps({'source_head':os.environ['PPO_SOURCE_HEAD'],'executed_checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'executed_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'environment':'Disposable GitHub CI; exact repository pins; fresh and current-main/P10 records'},indent=2))
          PY
          node --env-file=.env.local --import tsx --test --test-reporter=tap --test-concurrency=1 --test-timeout=120000 tests/database/quality-travel.test.ts tests/database/quality-upgrade.test.ts tests/database/quality-planner.test.ts tests/database/quality-templates.test.ts tests/database/quality-reports.test.ts 2>&1 | tee verification-evidence/p11-focused-db/results.tap
      # Reuse the build verified above. Three cold dev warm-ups each took 4.9 minutes
      # in run 35600720445, exhausting the 30-minute job during otherwise passing tests.
      # Keep every test, warm-up dependency, assertion and timeout unchanged.
      - name: Focused P11 complete selected Service and Finance journey
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-evidence/p11-journey-browser/results.json
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          npx playwright test --config=playwright.compiled.config.ts tests/browser/quality-journey.spec.ts --output verification-evidence/p11-journey-browser --reporter=list,json
      - name: Prepare journey review diagnostics
        if: always()
        id: journey_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve original selected P11 journey immediately
        if: ${{ always() && steps.journey_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-selected-journey-evidence
          path: |
            verification-evidence/review-diagnostic-redactions.json
            verification-evidence/transport-diagnostics/
            verification-evidence/p11-journey-browser/
            verification-evidence/p11-focused-db/
            verification-evidence/p11-template-db/
            !**/trace.zip
          retention-days: 14
      - name: Retained P10 allocation and original-recovery cases after P11 Travel
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-evidence/p11-retained-finance-browser/results.json
        run: |
          # The preceding upgrade proof deliberately revokes grants and may fail
          # before its normal cleanup. Retained browser evidence owns fresh fixtures.
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          npx playwright test --config=playwright.compiled.config.ts tests/browser/finance.spec.ts --grep 'P10 PT-17/PT-19|P10 stale browser proposal|P10 lost save response' --output verification-evidence/p11-retained-finance-browser --reporter=list,json
      - name: Prepare retained Finance review diagnostics
        if: always()
        id: retained_finance_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve original retained Finance fixture evidence immediately
        if: ${{ always() && steps.retained_finance_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-retained-Finance-fixture-evidence
          path: |
            verification-evidence/review-diagnostic-redactions.json
            verification-evidence/p11-retained-finance-browser/
            !**/trace.zip
          retention-days: 14
      - name: Focused P11 identity, validation and retained recovery proof
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-evidence/p11-focused-browser/results.json
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          npx playwright test --config=playwright.compiled.config.ts tests/browser/quality.spec.ts tests/browser/quality-states.spec.ts --output verification-evidence/p11-focused-browser --reporter=list,json
      - name: Prepare focused review diagnostics
        if: always()
        id: focused_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve original focused P11 evidence immediately
        if: ${{ always() && steps.focused_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-focused-quality-evidence
          path: |
            verification-evidence/review-diagnostic-redactions.json
            verification-evidence/p11-focused-browser/
            verification-evidence/transport-diagnostics/
            verification-evidence/p11-journey-browser/
            verification-evidence/p11-focused-db/
            verification-evidence/p11-template-db/
            !**/trace.zip
          retention-days: 14

