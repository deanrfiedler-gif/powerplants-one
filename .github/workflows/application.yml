          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: Focused P11 original HTTP isolation from fresh synthetic seed
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' }}
        run: |
          if npm start; then exit 1; fi
          node --env-file=.env.local --import tsx scripts/local-server.ts > "$RUNNER_TEMP/ppo-http.log" 2>&1 &
          ppo_server_pid=$!
