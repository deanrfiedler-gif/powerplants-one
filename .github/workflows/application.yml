          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_PROOF_DIAGNOSTICS: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install exact package manager and locked dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          git rev-parse HEAD
          npm ls --depth=0
      - name: Install pinned controlled PDF renderer
        run: npm run browser:install
      - name: Static, unit and build checks
        run: npm run check
      - name: Configure disposable loopback database
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: P11 declared load, raw browser timings and cold-warm p95
        timeout-minutes: 25
        env:
          PPO_BENCHMARK_FIXTURE: add-synthetic-load
          PPO_NETLOG_DIRECTORY: ${{ runner.temp }}/ppo-pt27-netlog
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/quality-performance-proof.ts
      - name: Retain allowlisted network metadata and remove raw capture
        if: always()
        env:
          PPO_NETLOG_DIRECTORY: ${{ runner.temp }}/ppo-pt27-netlog
        run: node --import tsx scripts/netlog-metadata.ts
      - name: Prepare performance review diagnostics
        if: always()
        id: performance_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve original P11 performance samples immediately
        if: ${{ always() && steps.performance_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-performance-evidence
          path: |
            verification-evidence/review-diagnostic-redactions.json
            verification-evidence/p11-performance/
            verification-evidence/transport-diagnostics/
          retention-days: 14

  p11_browser_diagnostics:
    name: P11 three original browser failures diagnostic replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_PROOF_DIAGNOSTICS: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install exact package manager and locked dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          git rev-parse HEAD
          npm ls --depth=0
      - name: Install pinned controlled PDF renderer
        run: npm run browser:install
      - name: Static, unit and build checks
        run: npm run check
      - name: Configure disposable loopback database
        id: database_setup
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      # Reuse the build produced above, as the other browser lanes do. Cold dev
      # compilation must not prevent the diagnostic procedures from executing.
      - name: Replay three original phone procedures with lifecycle diagnostics
        timeout-minutes: 25
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-evidence/p11-failure-replay/results.json
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          npx playwright test --config=playwright.compiled.config.ts tests/browser/quality-journey.spec.ts tests/browser/quality-states.spec.ts tests/browser/reports.spec.ts --project=mobile-chromium --grep 'P11 selected UI service-to-Finance journey|P11 PT-29 all fifteen screen families|P09 complete UI return' --output verification-evidence/p11-failure-replay --reporter=list,json
      - name: Prepare original failure replay diagnostics
        if: always()
        id: failure_replay_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve original failure replay evidence
        if: ${{ always() && steps.failure_replay_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P11-original-failure-replay-evidence
          path: |
            verification-evidence/review-diagnostic-redactions.json
            verification-evidence/p11-failure-replay/
            verification-evidence/transport-diagnostics/
            !**/trace.zip
          retention-days: 14
