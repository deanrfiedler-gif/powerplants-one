name: Estimating E1 assurance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  scope:
    name: Change scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      # Pull requests only. Skipping the suites below is safe only for a
      # documentation-only change (scripts/ci_scope.py); any other event, or a fault
      # in this job, runs every suite.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            scripts
            src
            tests
            db
            public
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_scope.py

  estimating_suites:
    name: E1 ${{ matrix.suite }} proof
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [database, browser, quality]
        include:
          - suite: database
            database_shard: 1/2
          - suite: database-2
            database_shard: 2/2
    runs-on: ubuntu-24.04
    # Native shards retain the full file selection and serial execution, each
    # with its own disposable database. Keep every assertion and existing deadline.
    timeout-minutes: ${{ startsWith(matrix.suite, 'database') && 45 || 30 }}
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Configure disposable PostgreSQL lock capacity
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/configure-test-postgres.sh
      - name: Pinned runtime
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          npm ls --depth=0
      - name: Static and unit proof
        if: matrix.suite == 'database'
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
      - name: Controlled browser and PDF renderer
        run: npm run browser:install
      - name: Disposable database configuration
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
      - name: E1 PostgreSQL proof
        if: startsWith(matrix.suite, 'database')
        env:
          PPO_E1_DATABASE_SHARD: ${{ matrix.database_shard }}
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 --test-shard="$PPO_E1_DATABASE_SHARD" tests/database/estimating.test.ts tests/database/estimating-workspaces.test.ts tests/database/estimating-discovery-context.test.ts tests/database/excel-import-review.test.ts tests/database/excel-import-persistence.test.ts tests/database/excel-import-upgrade.test.ts tests/database/excel-reimport.test.ts tests/database/excel-reimport-upgrade.test.ts tests/database/excel-quotation.test.ts tests/database/excel-capacity.test.ts tests/database/excel-capacity-upgrade.test.ts tests/database/excel-source-pricing.test.ts tests/database/excel-source-pricing-upgrade.test.ts tests/database/excel-fx.test.ts tests/database/excel-fx-upgrade.test.ts tests/database/excel-landed.test.ts tests/database/excel-landed-upgrade.test.ts tests/database/estimating-workload.test.ts tests/database/estimating-sources.test.ts tests/database/estimating-review.test.ts tests/database/quotation-release.test.ts tests/database/estimating-configuration.test.ts tests/database/estimating-catalogue.test.ts tests/database/cpq.test.ts tests/database/cpq-costs.test.ts tests/database/cpq-rebase.test.ts tests/database/cpq-packages.test.ts tests/database/cpq-packages-upgrade.test.ts tests/database/specialist.test.ts tests/database/fertigation.test.ts tests/database/fertigation-artifacts.test.ts tests/database/fertigation-import.test.ts tests/database/nursery-automation.test.ts tests/database/nursery-assessment.test.ts
      - name: Exact CPQ release quality, impact, authority and recovery database proof
        if: matrix.suite == 'quality'
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/cpq-quality.test.ts
      - name: Compile the exact E1 E2 ES-02 application
        if: matrix.suite == 'browser'
        run: npm run build
      - name: Record the actual compiled checkout and fertigation and CPQ package source hashes
        if: matrix.suite == 'browser'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files','-z'],text=True).split('\0')
          paths=[p for p in files if p and ('fertigation' in p or p in ['src/app/styles/my-work.css','src/components/estimation-wizard.tsx','src/components/discovery-costing.tsx','src/estimating/discovery-workspaces.ts','src/estimating/cost-basis-service.ts','src/shared/receipts.ts','src/shell/navigation.ts','src/shell/module-workspaces.ts','.github/workflows/estimating-e1.yml']) and not p.startswith('docs/testing/evidence/')]
          root=Path('verification-evidence/fertigation-build');root.mkdir(parents=True,exist_ok=True)
          data={'source_head':os.environ['PPO_SOURCE_HEAD'],'executed_checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'executed_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'build_id':Path('.next/BUILD_ID').read_text().strip(),'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(paths)}}
          (root/'source-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          paths=[p for p in files if p and (p.startswith(('src/cpq/','src/app/api/v1/cpq/')) or p in ['db/migrations/0102-cpq-packages.sql','scripts/cpq-worker.mjs','scripts/cpq-packages-restart.ts','src/platform/operations.ts','src/shared/receipts.ts','tests/helpers/cpq-packages-http.ts','package-lock.json','.github/workflows/estimating-e1.yml'])]
          root=Path('verification-evidence/cpq-packages-build');root.mkdir(parents=True,exist_ok=True)
          data['sha256']={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(paths)}
          (root/'source-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: E1 real direct HTTP proof
        if: matrix.suite == 'browser'
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > "$RUNNER_TEMP/ppo-e1-http.log" 2>&1 &
          ppo_e1_server_pid=$!
          trap 'kill "$ppo_e1_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/cpq-quality-restart.ts write
          # Enrolled impact assessments are complete and bounded to 25 open
          # estimates. Prove them before the later suites populate more cases.
          node --env-file=.env.local --import tsx scripts/cpq-packages-restart.ts write
          node --env-file=.env.local --import tsx --test tests/http/cpq-packages.test.ts
          node --env-file=.env.local --import tsx --test tests/http/cpq-quality.test.ts
          node --env-file=.env.local --import tsx --test tests/http/estimating.test.ts tests/http/estimating-workload.test.ts tests/http/estimating-sources.test.ts tests/http/estimating-review.test.ts tests/http/quotation-release.test.ts tests/http/estimating-configuration.test.ts tests/http/cpq.test.ts tests/http/specialist.test.ts tests/http/fertigation.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-import-review.test.ts
          node --env-file=.env.local --import tsx --test tests/http/cpq-products.test.ts
          node --env-file=.env.local --import tsx --test tests/http/cpq-costs.test.ts
          node --env-file=.env.local --import tsx --test tests/http/cpq-rebase.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-import-persistence.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-reimport.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-quotation.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-capacity.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-source-pricing.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-fx.test.ts
          node --env-file=.env.local --import tsx --test tests/http/excel-landed.test.ts
          node --import tsx scripts/excel-capacity-profile.ts candidate
          node --env-file=.env.local --import tsx scripts/excel-import-restart.ts write landed
          node --env-file=.env.local --import tsx scripts/cpq-products-restart.ts write
          node --env-file=.env.local --import tsx scripts/cpq-costs-restart.ts write
          node --env-file=.env.local --import tsx scripts/cpq-rebase-restart.ts write
          PPO_TEST_ORIGIN=http://127.0.0.1:3000 node --env-file=.env.local --import tsx scripts/estimating-review-restart.ts write
          PPO_TEST_ORIGIN=http://127.0.0.1:3000 node --env-file=.env.local --import tsx scripts/quotation-release-restart.ts write
          PPO_TEST_ORIGIN=http://127.0.0.1:3000 node --env-file=.env.local --import tsx scripts/fertigation-restart-proof.ts write
          node --env-file=.env.local --import tsx scripts/fertigation-capacity-proof.mjs
      - name: E1 journey through three application and browser processes and two PostgreSQL restarts
        if: matrix.suite == 'browser'
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PPO_PROOF_COMPILED: "1"
        run: |
          node --env-file=.env.local --import tsx scripts/estimating-restart-proof.ts write
          for phase in recover verify; do
            docker restart "$PPO_POSTGRES_CONTAINER"
            for attempt in $(seq 1 30); do
              docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
              sleep 1
            done
            node --env-file=.env.local --import tsx scripts/estimating-restart-proof.ts "$phase"
          done
      - name: Native fertigation exact bytes after the application and PostgreSQL restarts
        if: matrix.suite == 'browser'
        run: |
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > "$RUNNER_TEMP/ppo-fertigation-reopen.log" 2>&1 &
          ppo_fertigation_server_pid=$!
          trap 'kill "$ppo_fertigation_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          PPO_TEST_ORIGIN=http://127.0.0.1:3000 node --env-file=.env.local --import tsx scripts/estimating-review-restart.ts verify
          PPO_TEST_ORIGIN=http://127.0.0.1:3000 node --env-file=.env.local --import tsx scripts/quotation-release-restart.ts verify
          PPO_REQUIRE_RESTART=1 PPO_TEST_ORIGIN=http://127.0.0.1:3000 node --env-file=.env.local --import tsx scripts/fertigation-restart-proof.ts verify
          node --env-file=.env.local --import tsx scripts/excel-import-restart.ts verify
          node --env-file=.env.local --import tsx scripts/cpq-products-restart.ts verify
          node --env-file=.env.local --import tsx scripts/cpq-costs-restart.ts verify
          node --env-file=.env.local --import tsx scripts/cpq-rebase-restart.ts verify
          node --env-file=.env.local --import tsx scripts/cpq-quality-restart.ts verify
          node --env-file=.env.local --import tsx scripts/cpq-packages-restart.ts verify
      - name: Compiled E1 desktop, phone, 320px, uncertain response and long output
        if: matrix.suite == 'browser'
        # Reuse the build verified by HTTP/restart checks. The same assertions
        # also pass in the full compiled suite; a second dev compilation can
        # leave an otherwise permitted workbook loading past its 5s assertion.
        run: npx playwright test --config=playwright.compiled.config.ts tests/browser/estimating.spec.ts tests/browser/estimating-workload.spec.ts tests/browser/estimating-sources.spec.ts tests/browser/estimating-review.spec.ts tests/browser/quotation-release.spec.ts tests/browser/cpq.spec.ts tests/browser/nursery-automation.spec.ts tests/browser/nursery-assessment.spec.ts --output verification-evidence/estimating-e1-browser --reporter=list
      - name: Compiled ES-02, My Work, Engineering materials and shell regression
        if: matrix.suite == 'browser'
        env:
          PPO_PORT: "3012"
          PPO_TEST_ORIGIN: http://127.0.0.1:3012
        run: npx playwright test --config=playwright.es02.config.ts --output verification-evidence/estimating-es02-browser --reporter=list
      - name: Compiled ES-08 specialist workbench and recovery
        if: matrix.suite == 'browser'
        env:
          PPO_PORT: "3018"
        run: npx playwright test --config=playwright.es08.config.ts --output verification-evidence/estimating-es08-browser --reporter=list
      - name: Compiled native fertigation save, clean context, conflict and large registers
        if: matrix.suite == 'browser'
        env:
          PPO_PORT: "3042"
        run: npx playwright test --config=playwright.fertigation.config.ts --output verification-evidence/fertigation-browser --reporter=list
      - name: Retain exact synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite == 'browser' && 'Estimating-E1-evidence' || format('Estimating-E1-{0}-evidence', matrix.suite) }}
          path: |
            verification-evidence/estimating-e1-*/
            verification-evidence/estimating-es02-browser/
            verification-evidence/estimating-es08-browser/
            verification-evidence/fertigation-browser/
            verification-evidence/fertigation-restart/
            verification-evidence/excel-import-restart/
            verification-evidence/cpq-products-restart/verified.json
            verification-evidence/cpq-costs-restart/verified.json
            verification-evidence/cpq-rebase-restart/verified.json
            verification-evidence/cpq-quality-restart/verified.json
            verification-evidence/cpq-packages-restart/verified.json
            verification-evidence/cpq-packages-restart/workload.json
            verification-evidence/cpq-packages-build/source-manifest.json
            verification-evidence/excel-quotation/
            verification-evidence/excel-capacity/
            verification-evidence/fertigation-build/
            verification-evidence/fertigation-capacity/
            verification-evidence/fertigation-reports/
            test-results/
            !**/trace.zip
          retention-days: 14
  estimating:
    name: E1 manual estimate, draft output and restart proof
    if: ${{ always() && needs.scope.outputs.docs_only != 'true' }}
    needs: [scope, estimating_suites]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every E1 proof lane
        env:
          PPO_E1_RESULT: ${{ needs.estimating_suites.result }}
        run: test "$PPO_E1_RESULT" = success
