name: Screen Systems specialist design review r02-r03
on:
  pull_request:
    paths:
      - 'docs/design/specialist/**'
      - 'docs/reference/ui/specialist/**'
      - 'scripts/*specialist*'
      - '.github/workflows/specialist-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: Screen Systems model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify r02 source, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/specialist-r02
          python3 scripts/build-specialist-r02.py
          git diff --exit-code -- docs/reference/ui/specialist/PPO-Specialist-Configuration-Workbench-r02.html
          node node_modules/eslint/bin/eslint.js docs/design/specialist/r02/model.js docs/design/specialist/r02/workspace.js scripts/check-specialist-r02-model.mjs scripts/check-specialist-r02-browser.mjs
          node scripts/check-specialist-r02-model.mjs > verification-evidence/specialist-r02/model-results.json
          node scripts/check-specialist-r02-browser.mjs
      - name: Verify r03 source, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/specialist-r03
          python3 scripts/build-specialist-r03.py
          git diff --exit-code -- docs/reference/ui/specialist/PPO-Specialist-Configuration-Workbench-r03.html docs/reference/ui/specialist/PPO-Specialist-Configuration-Workbench-r02.html
          node node_modules/eslint/bin/eslint.js docs/design/specialist/r03/model.js docs/design/specialist/r03/workspace.js scripts/check-specialist-r03-model.mjs scripts/check-specialist-r03-browser.mjs
          node scripts/check-specialist-r03-model.mjs > verification-evidence/specialist-r03/model-results.json
          node scripts/check-specialist-r03-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Specialist-design-evidence
          path: |
            verification-evidence/specialist-r02/
            verification-evidence/specialist-r03/
          retention-days: 14
