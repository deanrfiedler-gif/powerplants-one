name: Estimate-to-actual outcome review design
on:
  pull_request:
    paths:
      - 'docs/design/estimate-actual-review/**'
      - 'docs/reference/ui/estimate-actual-review/**'
      - 'scripts/*estimate-actual-review*'
      - '.github/workflows/estimate-actual-review-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: ES-09 HTML model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify source, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/estimate-actual-review
          python3 scripts/build-estimate-actual-review.py
          git diff --exit-code -- docs/reference/ui/estimate-actual-review/PPO-Estimate-to-Actual-Outcome-Review-r01.html
          npx eslint docs/design/estimate-actual-review/*.js scripts/check-estimate-actual-review-*.mjs
          node scripts/check-estimate-actual-review-model.mjs > verification-evidence/estimate-actual-review/model-results.json
          node scripts/check-estimate-actual-review-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Estimate-actual-review-design-evidence
          path: verification-evidence/estimate-actual-review/
          retention-days: 14
