name: Notification workspace design review
on:
  pull_request:
    paths:
      - 'docs/design/notifications/**'
      - 'docs/reference/ui/notifications/**'
      - 'scripts/*notifications*'
      - '.github/workflows/notifications-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: Notification HTML model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify standalone design and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/notifications
          python3 scripts/build-notifications-design.py
          git diff --exit-code -- docs/reference/ui/notifications/PPO-Notification-Inbox-and-Preferences-r01.html
          npx eslint docs/design/notifications/*.js scripts/check-notifications-*.mjs
          node scripts/check-notifications-model.mjs > verification-evidence/notifications/model-results.json
          node scripts/check-notifications-browser.mjs
      - name: Retain original browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Notifications-design-evidence
          path: verification-evidence/notifications/
          retention-days: 14
