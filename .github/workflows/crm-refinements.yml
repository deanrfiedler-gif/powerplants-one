name: CRM refinements assurance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  crm-layout:
    name: CRM header and board visual checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Prepare isolated component review
        run: |
          npm install --global npm@11.19.0
          npm ci
          npx playwright install --with-deps chromium
          node scripts/build-crm-ui-review.mjs
      - name: Check desktop and phone layouts
        run: npx playwright test --config=playwright.crm-ui.config.ts
      - name: Retain component review screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CRM-header-board-review
          path: verification-evidence/crm-ui-tests
          retention-days: 14
  crm-refinements:
    name: CRM desktop and mobile persistence and interaction proof
    runs-on: ubuntu-24.04
    # Full retained suites include two ten-minute-bounded P11 journeys and
    # actual database/application/browser restarts. Keep individual deadlines.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_PROOF_DIAGNOSTICS: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install exact package manager and locked dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          git rev-parse HEAD
          npm ls --depth=0
      - name: Install pinned controlled PDF renderer
        run: npx playwright install --with-deps chromium
      - name: Static, unit and build checks
        run: npm run check
      - name: Configure disposable loopback database
        id: database_setup
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: CRM refinement database and browser journeys
        run: |
          node --env-file=.env.local --import tsx --test --test-concurrency=1 tests/database/crm-refinements.test.ts
          npx playwright test tests/browser/crm-refinements.spec.ts --output verification-evidence/crm-refinements --reporter=list
      - name: Retained I2 keyboard and long-text checks
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' }}
        run: npx playwright test tests/browser/crm-i2.spec.ts --output verification-evidence/crm-i2-integration --reporter=list
      - name: Retained CRM journey across application and database restarts
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --env-file=.env.local --import tsx scripts/crm-restart-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/crm-restart-proof.ts verify
      - name: Retain CRM interaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CRM-refinements-evidence
          path: |
            verification-evidence/crm-refinements
            verification-evidence/crm-i2-integration
            verification-evidence/crm-i1-restart
            !**/trace.zip
          if-no-files-found: ignore
