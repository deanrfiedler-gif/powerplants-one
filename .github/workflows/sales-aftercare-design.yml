name: Sales Aftercare recovery design review
on:
  pull_request:
    paths:
      - 'docs/design/sales-aftercare/**'
      - 'docs/reference/ui/sales-aftercare/**'
      - 'scripts/*sales-aftercare*'
      - '.github/workflows/sales-aftercare-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: CR-05 recovered model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify review model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/sales-aftercare-recovery
          python3 scripts/build-sales-aftercare.py
          git diff --exit-code -- docs/reference/ui/sales-aftercare/PPO-Sales-Aftercare-and-Renewal-Worklist-r01.html
          npx eslint docs/design/sales-aftercare/*.js scripts/check-sales-aftercare-*.mjs
          node scripts/check-sales-aftercare-model.mjs > verification-evidence/sales-aftercare-recovery/model-results.json
          node scripts/check-sales-aftercare-browser.mjs
      - name: Retain original verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CR05-sales-aftercare-recovery-evidence
          path: verification-evidence/sales-aftercare-recovery/
          retention-days: 14
