name: Update Azure private demo
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ppo-demo-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'deanrfiedler-gif/powerplants-one' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ppo-demo
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PPO_DEMO_SUFFIX: ${{ vars.PPO_DEMO_SUFFIX }}
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate demo resource names
        run: |
          set -euo pipefail
          [[ "$AZURE_RESOURCE_GROUP" == rg-ppo-demo-aue ]]
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        env:
          AZURE_CORE_OUTPUT: json
        with:
          client-id: ${{ secrets.AZURE_DEMO_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve demo suffix
        run: |
          set -euo pipefail
          if [[ -n "${PPO_DEMO_SUFFIX:-}" ]]; then
            [[ "$PPO_DEMO_SUFFIX" =~ ^[a-z0-9]{8,12}$ ]]
          else
            suffixes=$(
              {
                az resource list -g "$AZURE_RESOURCE_GROUP" --query "[?type=='Microsoft.App/containerApps'].name" --output tsv | sed -n 's/^ca-ppo-demo-//p'
                az resource list -g "$AZURE_RESOURCE_GROUP" --query "[?type=='Microsoft.App/jobs'].name" --output tsv | sed -n 's/^job-ppo-worker-//p'
                az resource list -g "$AZURE_RESOURCE_GROUP" --query "[?type=='Microsoft.ContainerRegistry/registries'].name" --output tsv | sed -n 's/^ppodemo//p'
              } | sed '/^$/d' | sort | uniq -c | awk '$1 == 3 {print $2}'
            )
            count=$(printf '%s\n' "$suffixes" | sed '/^$/d' | wc -l | tr -d ' ')
            if [[ "$count" != 1 ]]; then
              echo "::error::PPO_DEMO_SUFFIX is not configured and Azure did not expose exactly one matching demo suffix."
              exit 1
            fi
            PPO_DEMO_SUFFIX=$(printf '%s\n' "$suffixes")
          fi
          echo "PPO_DEMO_SUFFIX=$PPO_DEMO_SUFFIX" >> "$GITHUB_ENV"
      - name: Confirm existing demo resources
        run: |
          set -euo pipefail
          az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "ca-ppo-demo-$PPO_DEMO_SUFFIX" --output none
          az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "job-ppo-worker-$PPO_DEMO_SUFFIX" --output none
          az acr show -g "$AZURE_RESOURCE_GROUP" -n "ppodemo$PPO_DEMO_SUFFIX" --output none
      - name: Build the selected main commit
        run: |
          set -euo pipefail
          az acr build --registry "ppodemo$PPO_DEMO_SUFFIX" --image "ppo-demo:$GITHUB_SHA" --file infra/azure-demo/Dockerfile --no-logs .
      - name: Update web and draft worker images
        run: |
          set -euo pipefail
          registry=$(az acr show -g "$AZURE_RESOURCE_GROUP" -n "ppodemo$PPO_DEMO_SUFFIX" --query loginServer --output tsv)
          image="$registry/ppo-demo:$GITHUB_SHA"
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "ca-ppo-demo-$PPO_DEMO_SUFFIX" --image "$image" --output none
          az containerapp job update -g "$AZURE_RESOURCE_GROUP" -n "job-ppo-worker-$PPO_DEMO_SUFFIX" --image "$image" --output none
          fqdn=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "ca-ppo-demo-$PPO_DEMO_SUFFIX" --query properties.configuration.ingress.fqdn --output tsv)
          [[ "$fqdn" =~ ^[a-z0-9.-]+\.azurecontainerapps\.io$ ]]
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://$fqdn/crm/opportunities")
          [[ "$status" == 401 ]]
          {
            echo '### Demo image update completed'
            echo "Source: $GITHUB_SHA"
            echo "Open https://$fqdn and sign in with an invited account."
            echo 'Anonymous CRM access was refused. Check a saved record and draft after sign-in.'
            echo 'No database migration, seeding, tester grant or reset was run.'
          } >> "$GITHUB_STEP_SUMMARY"
