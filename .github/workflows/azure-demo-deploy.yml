name: Update Azure private demo
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check prerequisites first; deploy only after release and database review
        type: choice
        options: [check, deploy]
        default: check
        required: true
permissions: {}
concurrency:
  group: ppo-demo-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'deanrfiedler-gif/powerplants-one' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ppo-demo
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PPO_DEMO_SUFFIX: ${{ vars.PPO_DEMO_SUFFIX }}
      AZURE_DEMO_DEPLOY_CLIENT_ID: ${{ secrets.AZURE_DEMO_DEPLOY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CORE_OUTPUT: none
      DOCKER_CONFIG: ${{ runner.temp }}/ppo-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate demo configuration
        run: |
          set -euo pipefail
          guid='^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$'
          for key in AZURE_DEMO_DEPLOY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ ! "${!key}" =~ $guid ]]; then
              echo "::error::$key is missing or invalid in the ppo-demo environment."
              exit 1
            fi
          done
          if [[ "$AZURE_RESOURCE_GROUP" != rg-ppo-demo-aue || ! "$PPO_DEMO_SUFFIX" =~ ^[a-z0-9]{8,12}$ ]]; then
            echo '::error::Check AZURE_RESOURCE_GROUP and PPO_DEMO_SUFFIX in the ppo-demo environment.'
            exit 1
          fi
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        env:
          AZURE_CORE_OUTPUT: json
        with:
          client-id: ${{ secrets.AZURE_DEMO_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Confirm existing demo resources
        id: target
        run: |
          set -euo pipefail
          connected_subscription=$(az account show --query id --output tsv)
          connected_tenant=$(az account show --query tenantId --output tsv)
          state=$(az account show --query state --output tsv)
          [[ "${connected_subscription,,}" == "${AZURE_SUBSCRIPTION_ID,,}" &&
             "${connected_tenant,,}" == "${AZURE_TENANT_ID,,}" && "$state" == Enabled ]]
          registry=$(az acr show -g "$AZURE_RESOURCE_GROUP" -n "ppodemo$PPO_DEMO_SUFFIX" --query loginServer --output tsv)
          [[ "$registry" =~ ^[a-z0-9.-]+\.azurecr\.io$ ]]
          web_image=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "ca-ppo-demo-$PPO_DEMO_SUFFIX" --query 'properties.template.containers[0].image' --output tsv)
          worker_image=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "job-ppo-worker-$PPO_DEMO_SUFFIX" --query 'properties.template.containers[0].image' --output tsv)
          revision_mode=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "ca-ppo-demo-$PPO_DEMO_SUFFIX" --query properties.configuration.activeRevisionsMode --output tsv)
          if [[ "$revision_mode" != Single ]]; then
            echo '::error::This update procedure requires the existing Single revision mode; review the changed traffic configuration.'
            exit 1
          fi
          fqdn=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "ca-ppo-demo-$PPO_DEMO_SUFFIX" --query properties.configuration.ingress.fqdn --output tsv)
          [[ "$fqdn" =~ ^[a-z0-9.-]+\.azurecontainerapps\.io$ ]]
          # Accept only this demo's source tags or immutable digests in the receipt.
          for image in "$web_image" "$worker_image"; do
            [[ "$image" == "$registry/ppo-demo:"* || "$image" == "$registry/ppo-demo@sha256:"* ]]
            [[ "$image" =~ ^[a-z0-9./:@-]+$ ]]
          done
          printf 'registry=%s\nfqdn=%s\n' "$registry" "$fqdn" >> "$GITHUB_OUTPUT"
          {
            echo '### Existing deployment recorded'
            echo "Selected source: $GITHUB_SHA"
            echo "Previous web image: $web_image"
            echo "Previous worker image: $worker_image"
            echo 'These image references are recovery evidence, not a database backup.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check registry authentication and read access
        run: |
          set -euo pipefail
          az acr login --name "ppodemo$PPO_DEMO_SUFFIX" --output none
          az acr repository show --name "ppodemo$PPO_DEMO_SUFFIX" --repository ppo-demo --output none
          {
            echo '### Prerequisite check passed'
            echo 'Deployment identity login, target account, existing web/worker and registry read access passed.'
            echo 'This check does not prove push/update permissions, database compatibility or invited sign-in.'
            echo 'Check mode builds/pushes no image and changes no Azure resource or application data.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and push the selected main commit on GitHub
        if: inputs.operation == 'deploy'
        id: image
        env:
          PPO_REGISTRY: ${{ steps.target.outputs.registry }}
        run: |
          set -euo pipefail
          # A unique run tag prevents concurrent retries from replacing a selected image.
          tag="ppo-demo:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file infra/azure-demo/Dockerfile --tag "$PPO_REGISTRY/$tag" .
          docker push "$PPO_REGISTRY/$tag"
          digest=$(az acr repository show --name "ppodemo$PPO_DEMO_SUFFIX" --image "$tag" --query digest --output tsv)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'ref=%s/ppo-demo@%s\n' "$PPO_REGISTRY" "$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Built image'
            echo "Source: $GITHUB_SHA"
            echo "Image: $PPO_REGISTRY/ppo-demo@$digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update web and draft worker images
        if: inputs.operation == 'deploy'
        env:
          PPO_IMAGE: ${{ steps.image.outputs.ref }}
          PPO_FQDN: ${{ steps.target.outputs.fqdn }}
        run: |
          set -euo pipefail
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "ca-ppo-demo-$PPO_DEMO_SUFFIX" --image "$PPO_IMAGE" --output none
          python3 infra/azure-demo/verify_revision.py "$AZURE_RESOURCE_GROUP" "ca-ppo-demo-$PPO_DEMO_SUFFIX" "$PPO_IMAGE"
          # A failed web rollout leaves the worker configuration untouched.
          az containerapp job update -g "$AZURE_RESOURCE_GROUP" -n "job-ppo-worker-$PPO_DEMO_SUFFIX" --image "$PPO_IMAGE" --output none
          actual_worker=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "job-ppo-worker-$PPO_DEMO_SUFFIX" --query 'properties.template.containers[0].image' --output tsv)
          [[ "$actual_worker" == "$PPO_IMAGE" ]]
          # Do not follow redirects: an unexpected redirect must not count as a passed access check.
          health=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "https://$PPO_FQDN/healthz")
          [[ "$health" == 200 ]]
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "https://$PPO_FQDN/api/v1/crm/opportunities")
          [[ "$status" == 401 ]]
          {
            echo '### Demo image update completed'
            echo "Source: $GITHUB_SHA"
            echo "Open https://$PPO_FQDN and sign in with an invited account."
            echo 'The selected web revision is ready; the worker is configured with the same digest.'
            echo 'Health passed and anonymous CRM API access was refused. Verify a saved record and draft after sign-in.'
            echo 'No database migration, seeding, tester grant or reset was run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record incomplete deployment
        if: failure() && inputs.operation == 'deploy'
        run: |
          {
            echo '### Deployment did not complete'
            echo 'Inspect the failed step and actual web/worker images before retrying.'
            echo 'An image push or web update may have succeeded. No automatic rollback was attempted.'
            echo 'Use the previous image references above and the runbook; check database compatibility first.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
