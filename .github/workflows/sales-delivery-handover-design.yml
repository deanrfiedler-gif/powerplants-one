name: Sales-to-Delivery Handover design review
on:
  pull_request:
    paths:
      - 'docs/design/sales-delivery-handover/**'
      - 'docs/reference/ui/crm/PPO-Sales-to-Delivery-Handover*'
      - 'scripts/*sales-delivery-handover*'
      - '.github/workflows/sales-delivery-handover-design.yml'
  workflow_dispatch:
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  design:
    name: Handover HTML model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify source, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/sales-delivery-handover
          python3 scripts/build-sales-delivery-handover.py
          git diff --exit-code -- docs/reference/ui/crm/PPO-Sales-to-Delivery-Handover-Workspace-r01.html
          npx eslint docs/design/sales-delivery-handover/*.js scripts/check-sales-delivery-handover-*.mjs
          node scripts/check-sales-delivery-handover-model.mjs > verification-evidence/sales-delivery-handover/model-results.json
          node scripts/check-sales-delivery-handover-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sales-delivery-handover-design-evidence
          path: verification-evidence/sales-delivery-handover/
          retention-days: 14
