name: Reference cases and calibration design
on:
  pull_request:
    paths:
      - 'docs/design/reference-calibration/**'
      - 'docs/reference/ui/reference-calibration/**'
      - 'scripts/*reference-calibration*'
      - '.github/workflows/reference-calibration-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: ES-10 model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify deterministic output and model
        run: |
          mkdir -p verification-evidence/reference-calibration
          python3 scripts/build-reference-calibration.py
          git diff --exit-code -- docs/reference/ui/reference-calibration/PPO-Reference-Cases-and-Calibration-Proposals-r01.html
          npx eslint docs/design/reference-calibration/*.js scripts/check-reference-calibration-*.mjs
          node scripts/check-reference-calibration-model.mjs > verification-evidence/reference-calibration/model-results.json
      - name: Check repository documentation
        run: |
          python3 scripts/check_foundation.py
          python3 scripts/check_prototype.py
          python3 scripts/check_naming.py
      - name: Verify native interactions and responsive layouts
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-reference-calibration-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Reference-calibration-design-evidence
          path: verification-evidence/reference-calibration/
          retention-days: 14
