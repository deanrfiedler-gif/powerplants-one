name: Compiled application browser assurance
# Additional signal beside Application assurance: the same desktop and mobile
# browser suite, unchanged, driven against the compiled application that
# `npm run build` produces, served by the loopback synthetic-identity launcher in
# `--compiled` mode. See docs/decisions/ci-compiled-browser-suite.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compiled:
    name: Desktop and mobile browser suite against the compiled application
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_PROOF_DIAGNOSTICS: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install exact package manager and locked dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install pinned controlled PDF renderer and browser
        run: npm run browser:install
      - name: Compile the application
        # Separate step so a build failure is distinguishable from a test failure.
        id: build
        run: |
          npm run build
          test -f .next/BUILD_ID
          echo "build_id=$(cat .next/BUILD_ID)" >> "$GITHUB_OUTPUT"
      - name: Configure disposable loopback database
        id: database_setup
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: Desktop and mobile browser checks against the compiled application
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-evidence/compiled-browser/results.json
        run: |
          echo "Compiled build ${{ steps.build.outputs.build_id }} for source ${PPO_SOURCE_HEAD}"
          npx playwright test --config=playwright.compiled.config.ts --reporter=list,json
      - name: Scheduling Step 4 isolated publication and hold journeys
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-evidence/scheduling-step4-browser/results.json
        run: node --env-file=.env.local node_modules/@playwright/test/cli.js test --config=playwright.scheduling.config.ts --output verification-evidence/scheduling-step4-browser --reporter=list,json
      - name: Retain timer originals across real process restarts
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          ppo_timer_pid=
          trap 'if [ -n "$ppo_timer_pid" ]; then kill "$ppo_timer_pid" 2>/dev/null || true; fi' EXIT
          start_timer_app() {
            node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > "$RUNNER_TEMP/timer-$1.log" 2>&1 &
            ppo_timer_pid=$!
            ppo_timer_ready=0
            for attempt in $(seq 1 60); do
              kill -0 "$ppo_timer_pid" 2>/dev/null || exit 1
              if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then ppo_timer_ready=1; break; fi
              sleep 1
            done
            test "$ppo_timer_ready" = 1
          }
          start_timer_app before
          PPO_RESTART_SERVER_PID="$ppo_timer_pid" node --env-file=.env.local --import tsx scripts/field-timer-restart-proof.ts write
          kill "$ppo_timer_pid"
          wait "$ppo_timer_pid" || true
          ppo_timer_pid=
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          start_timer_app after
          PPO_RESTART_SERVER_PID="$ppo_timer_pid" node --env-file=.env.local --import tsx scripts/field-timer-restart-proof.ts verify
          node --env-file=.env.local --import tsx scripts/field-timer-zoom-proof.ts
          mkdir -p verification-evidence/field-timer-restart
          cp tmp/field-timer-restart/verified.json tmp/field-timer-restart/before.png tmp/field-timer-restart/after.png verification-evidence/field-timer-restart/
          cp tmp/field-timer-restart/zoom.json tmp/field-timer-restart/zoom-page.png tmp/field-timer-restart/zoom-dialog.png verification-evidence/field-timer-restart/
      - name: Scheduling policy originals across app and PostgreSQL restart
        if: ${{ !cancelled() && steps.database_setup.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PPO_POLICY_RESTART_DIRECTORY: ${{ runner.temp }}/ppo-scheduling-policy-restart
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          ppo_policy_pid=
          trap 'if [ -n "$ppo_policy_pid" ]; then kill "$ppo_policy_pid" 2>/dev/null || true; fi' EXIT
          start_policy_app() {
            node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > "$RUNNER_TEMP/policy-$1.log" 2>&1 &
            ppo_policy_pid=$!
            ppo_policy_ready=0
            for attempt in $(seq 1 60); do
              kill -0 "$ppo_policy_pid" 2>/dev/null || exit 1
              if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then ppo_policy_ready=1; break; fi
              sleep 1
            done
            test "$ppo_policy_ready" = 1
          }
          start_policy_app before
          PPO_RESTART_SERVER_PID="$ppo_policy_pid" node --env-file=.env.local --import tsx scripts/scheduling-policy-restart-proof.ts write
          kill "$ppo_policy_pid"
          wait "$ppo_policy_pid" || true
          ppo_policy_pid=
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          start_policy_app after
          PPO_RESTART_SERVER_PID="$ppo_policy_pid" node --env-file=.env.local --import tsx scripts/scheduling-policy-restart-proof.ts verify
          mkdir -p verification-evidence/scheduling-policy-restart
          cp "$PPO_POLICY_RESTART_DIRECTORY/verified.json" verification-evidence/scheduling-policy-restart/
      - name: Prepare retained browser review diagnostics immediately
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        id: browser_review
        run: python3 scripts/prepare-review-evidence.py
      - name: Preserve retained compiled-application browser evidence
        if: ${{ always() && steps.browser_review.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-application-browser-evidence
          path: |
            test-results/
            verification-evidence/
            !**/trace.zip
          retention-days: 14
