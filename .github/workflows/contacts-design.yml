name: Contacts design review
on:
  pull_request:
    paths:
      - 'docs/design/contacts/**'
      - 'docs/reference/ui/customers/PPO-Contacts-Stakeholders-and-Relationships-*'
      - 'scripts/*contacts*'
      - 'src/shared/reads.ts'
      - 'src/shared/commands.ts'
      - 'src/crm/directory.ts'
      - 'src/projects/service.ts'
      - 'db/migrations/0002-shared-foundation.sql'
      - 'db/migrations/0003-customer-intake.sql'
      - 'db/migrations/0010-crm-opportunities.sql'
      - 'db/migrations/0017-crm-ui-refinements.sql'
      - 'db/migrations/0018-crm-leads.sql'
      - 'db/migrations/0019-projects-gantt.sql'
      - 'src/shared/context.ts'
      - 'src/finance/context.ts'
      - 'src/scheduling/planner.ts'
      - 'src/reports/service.ts'
      - 'db/seed.sql'
      - 'docs/reference/ui/theme-style-board/powerplants-one-theme-style-board-r22.html'
      - 'docs/design/my-work/fonts.css'
      - 'docs/design/access-review/fonts.css'
      - 'src/platform/permissions.ts'
      - 'docs/decisions/ADR-0014-p09-service-reports.md'
      - 'db/migrations/*.sql'
      - 'docs/design/customer-360/model.js'
      - 'docs/contracts/service-data-dictionary.md'
      - 'docs/design/access-review/workspace.css'
      - 'docs/reference/ui/theme-style-board/powerplants-one-theme-style-board-r20.html'
      - '.github/workflows/contacts-design.yml'
  workflow_dispatch:
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  design:
    name: Contacts model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      # The builder refuses to run if a pinned contract source has changed, so a change
      # to any pinned contract source fails here rather than silently leaving
      # the design describing a rule that no longer exists. It also proves the rebuild is
      # byte for byte identical to the committed HTML.
      - name: Verify the deterministic build and the committed page
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/contacts
          python3 scripts/build-contacts-design.py --check
          git diff --exit-code -- docs/reference/ui/customers/PPO-Contacts-Stakeholders-and-Relationships-r01.html
      - name: Verify the model, the contract fidelity and the native interactions
        run: |
          node scripts/check-contacts-model.mjs --write-evidence
          node scripts/check-contacts-browser.mjs
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Contacts-design-evidence
          path: verification-evidence/contacts/
          retention-days: 14
