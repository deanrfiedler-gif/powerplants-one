name: Document register and linked library design
on:
  pull_request:
    paths:
      - 'docs/design/document-library/**'
      - 'docs/reference/ui/document-library/**'
      - 'scripts/*document-library*'
      - '.github/workflows/document-library-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: DK-01 DK-02 model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify deterministic output and model
        run: |
          mkdir -p verification-evidence/document-library
          python3 scripts/build-document-library.py
          git diff --exit-code -- docs/reference/ui/document-library/PPO-Document-Register-and-Linked-Library-r01.html
          npx eslint docs/design/document-library/*.js scripts/check-document-library-*.mjs
          node scripts/check-document-library-model.mjs > verification-evidence/document-library/model-results.json
      - name: Check repository documentation
        run: |
          python3 scripts/check_foundation.py
          python3 scripts/check_prototype.py
          python3 scripts/check_naming.py
      - name: Verify native interactions and responsive layouts
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-document-library-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Document-library-design-evidence
          path: verification-evidence/document-library/
          retention-days: 14
