name: CRM design assurance
on:
  pull_request:
    paths:
      - 'docs/blueprints/BP-03-crm.md'
      - 'docs/blueprints/crm-*'
      - 'docs/standards/ui-style-specification.md'
      - 'docs/standards/ui-assets/**'
      - 'docs/delivery/crm-*'
      - '.github/workflows/crm-design.yml'
  push:
    branches: [main]
    paths:
      - 'docs/blueprints/BP-03-crm.md'
      - 'docs/blueprints/crm-*'
      - 'docs/standards/ui-style-specification.md'
      - 'docs/standards/ui-assets/**'
      - 'docs/delivery/crm-*'
      - '.github/workflows/crm-design.yml'
  workflow_dispatch:
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  wireframes:
    name: Synthetic CRM wireframe checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use existing exact package and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Check standalone design and capture desktop and phone
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node docs/blueprints/crm-design-check.mjs
          node docs/blueprints/crm-ui-design-check.mjs
      - name: Retain synthetic design evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CRM-design-evidence
          path: verification-evidence/crm-design/
          retention-days: 14
