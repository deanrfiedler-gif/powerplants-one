name: CRM design assurance
on:
  pull_request:
    paths:
      - 'docs/blueprints/BP-03-crm.md'
      - 'docs/blueprints/crm-*'
      - 'docs/blueprints/crm-ui-mockups/**'
      - 'docs/standards/ui-style-specification.md'
      - 'docs/standards/ui-assets/**'
      - 'docs/delivery/crm-*'
      - '.github/workflows/crm-design.yml'
  push:
    branches: [main]
    paths:
      - 'docs/blueprints/BP-03-crm.md'
      - 'docs/blueprints/crm-*'
      - 'docs/blueprints/crm-ui-mockups/**'
      - 'docs/standards/ui-style-specification.md'
      - 'docs/standards/ui-assets/**'
      - 'docs/delivery/crm-*'
      - '.github/workflows/crm-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wireframes:
    name: Synthetic CRM wireframe checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing exact package and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npx playwright install --with-deps chromium
      - name: Check standalone design and capture desktop and phone
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node docs/blueprints/crm-design-check.mjs
          node docs/blueprints/crm-ui-design-check.mjs
      - name: Retain synthetic design evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CRM-design-evidence
          path: verification-evidence/crm-design/
          retention-days: 14
