name: My Work action centre design review
on:
  pull_request:
    paths:
      - 'docs/design/my-work/**'
      - 'docs/reference/ui/my-work/**'
      - 'scripts/*my-work*'
      - '.github/workflows/my-work-design.yml'
  workflow_dispatch:
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  design:
    name: My Work model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify source, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/my-work
          python3 scripts/build-my-work.py
          git diff --exit-code -- docs/reference/ui/my-work/PPO-My-Work-and-Action-Centre-r01.html
          node scripts/check-my-work-model.mjs > verification-evidence/my-work/model-results.json
          node scripts/check-my-work-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: My-Work-design-evidence
          path: verification-evidence/my-work/
          retention-days: 14
