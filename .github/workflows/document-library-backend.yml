name: Document library backend assurance
on:
  pull_request:
    paths:
      - "src/library/**"
      - "src/app/api/v1/document-library/**"
      - "src/app/api/v1/document-templates/**"
      - "src/app/api/v1/document-template-drafts/**"
      - "src/shared/receipts.ts"
      - "src/platform/permissions.ts"
      - "src/access/capabilities.ts"
      - "src/documents/**"
      - "src/reports/**"
      - "db/**"
      - "scripts/migration-registry.ts"
      - "scripts/document-library-restart-proof.ts"
      - "tests/**/document-library*"
      - "tests/**/template-catalogue*"
      - "tests/**/template-drafts*"
      - "tests/**/template-publication*"
      - "tests/**/template-use*"
      - "src/app/api/v1/document-template-use-assignments/**"
      - "src/app/api/v1/document-template-use-policies/**"
      - "scripts/template-use-restart-proof.ts"
      - "scripts/template-publication-restart-proof.ts"
      - "src/app/api/v1/document-template-publications/**"
      - "scripts/template-drafts-restart-proof.ts"
      - "tests/helpers/library.ts"
      - "tests/database/products-upgrade.test.ts"
      - ".github/workflows/document-library-backend.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned tools and build
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
          npm run check
      - name: Configure disposable PostgreSQL lock capacity
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/configure-test-postgres.sh
      - name: Configure disposable database
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
      - name: Exact revisions, scoped authority, findings, reviews, recovery and immutable SQL evidence
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/document-library.test.ts
      - name: Exact template catalogue and permission-scoped native usage
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/template-catalogue.test.ts
      - name: Managed template drafts and populated upgrade
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/template-drafts.test.ts tests/database/template-drafts-upgrade.test.ts tests/database/template-publication.test.ts tests/database/template-publication-upgrade.test.ts
      - name: Pending identity events across 0026 and reserved Products after newest history
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 --test-name-pattern='PD upgrade from (25|90|91|92|93|94|95|96) ' tests/database/products-upgrade.test.ts
      - name: Controlled template use and populated publication upgrade
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/template-use.test.ts tests/database/template-use-upgrade.test.ts
      - name: Compiled document library HTTP
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > /tmp/document-library-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/http/document-library.test.ts
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/http/template-catalogue.test.ts
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/http/template-drafts.test.ts
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/http/template-publication.test.ts tests/http/template-publication-base.test.ts
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/http/template-use.test.ts
      - name: Exact originals across PostgreSQL and application-process restart
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/document-library-restart-proof.ts write
          node --env-file=.env.local --import tsx scripts/template-drafts-restart-proof.ts write
          node --env-file=.env.local --import tsx scripts/template-publication-restart-proof.ts write
          node --env-file=.env.local --import tsx scripts/template-use-restart-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/document-library-restart-proof.ts verify
          node --env-file=.env.local --import tsx scripts/template-drafts-restart-proof.ts verify
          node --env-file=.env.local --import tsx scripts/template-publication-restart-proof.ts verify
          node --env-file=.env.local --import tsx scripts/template-use-restart-proof.ts verify
      - name: Retain bounded synthetic restart evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Document-library-backend
          path: |
            verification-evidence/document-library-restart/result.json
            verification-evidence/template-drafts-restart/result.json
            verification-evidence/template-publication-restart/result.json
            verification-evidence/template-use-restart/result.json
          if-no-files-found: ignore
          retention-days: 14
