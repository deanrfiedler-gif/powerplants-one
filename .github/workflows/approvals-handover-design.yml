name: Approvals and handover workspace design review
on:
  pull_request:
    paths:
      - 'docs/design/approvals-handover/**'
      - 'docs/reference/ui/approvals-handover/**'
      - 'scripts/*approvals-handover*'
      - '.github/workflows/approvals-handover-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: Approvals inbox model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use repository runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify standalone design and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/approvals-handover
          python3 scripts/build-approvals-handover.py
          git diff --exit-code -- docs/reference/ui/approvals-handover/PPO-Cross-Module-Approvals-and-Handover-Inbox-r01.html
          npx eslint docs/design/approvals-handover/*.js scripts/check-approvals-handover-*.mjs
          node scripts/check-approvals-handover-model.mjs > verification-evidence/approvals-handover/model-results.json
          node scripts/check-approvals-handover-browser.mjs
      - name: Retain original browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Approvals-handover-design-evidence
          path: verification-evidence/approvals-handover/
          retention-days: 14
