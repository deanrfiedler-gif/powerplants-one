name: Development register integrity
on:
  pull_request:
  push:
    branches: [main]
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run studio:check
      - run: node --import tsx --test tests/unit/development-workspace.test.ts tests/unit/development-history.test.ts tests/unit/component-catalogue.test.ts tests/unit/hosted-development.test.ts
