name: Email Calendar journey assurance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  email-calendar:
    name: Email Calendar persisted journey and server permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Pinned runtime and static checks
        run: |
          npm install --global npm@11.19.0
          npm ci
          node --version
          npm --version
          npm ls --depth=0
          npm run lint
          npm run typecheck
          npm run test:unit
          npx playwright install --with-deps chromium
      - name: PostgreSQL permissions and atomic persistence
        run: |
          cp .env.example .env.local
          python3 - <<'PYENV'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PYENV
          node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/email-calendar.test.ts
      - name: Retained upgrade paths reach schema 15 without rewriting originals
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 --test-name-pattern=upgrade tests/database/planner.test.ts tests/database/packs.test.ts tests/database/field.test.ts tests/database/offline.test.ts tests/database/finance-upgrade.test.ts
      - name: Retain follow-up through PostgreSQL and process restart
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --env-file=.env.local --import tsx scripts/email-restart-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/email-restart-proof.ts verify
      - name: Desktop and mobile journey, lost response, reload and layout
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          npx playwright test tests/browser/email-calendar.spec.ts --output verification-evidence/email-calendar-browser --reporter=list
      - name: Retain synthetic journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Email-Calendar-journey-evidence
          path: |
            verification-evidence/email-calendar-*/
            test-results/
            !**/trace.zip
          retention-days: 14
