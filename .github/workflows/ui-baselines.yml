name: UI design baseline assurance

on:
  pull_request:
    paths:
      - 'docs/standards/ui-baselines.json'
      - 'docs/standards/ui-style-specification.md'
      - 'docs/reference/ui/**'
      - 'docs/reference/powerplants-one-field-technicians-r04.html'
      - 'docs/reference/engineering-r02/**'
      - 'scripts/design-baseline-check.mjs'
      - '.github/workflows/ui-baselines.yml'
  push:
    branches: [main]
    paths:
      - 'docs/standards/ui-baselines.json'
      - 'docs/standards/ui-style-specification.md'
      - 'docs/reference/ui/**'
      - 'docs/reference/powerplants-one-field-technicians-r04.html'
      - 'docs/reference/engineering-r02/**'
      - 'scripts/design-baseline-check.mjs'
      - '.github/workflows/ui-baselines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: Registered UI design baseline integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing exact package and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify every registered baseline
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/design-baseline-check.mjs
      - name: Retain baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UI-baseline-evidence
          path: verification-evidence/ui-baselines/
          retention-days: 14
