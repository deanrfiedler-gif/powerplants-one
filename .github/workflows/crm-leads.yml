name: CRM Leads implementation
on:
  pull_request:
    paths:
      [
        "src/**",
        "db/**",
        "scripts/database.ts",
        "scripts/migration-registry.ts",
        "tests/**",
        ".github/workflows/crm-leads.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leads:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install exact dependencies and browser
        run: |
          npm install --global npm@11.19.0
          npm ci
          npx playwright install --with-deps chromium
      - name: Static checks and build
        run: npm run check
      - name: Configure disposable database
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
      - name: Combined Leads and Projects PostgreSQL acceptance
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 tests/database/leads-projects-integration.test.ts tests/database/leads.test.ts tests/database/projects-gantt.test.ts tests/database/desktop-shell.test.ts
      - name: Approved desktop and mobile journey
        run: npx playwright test tests/browser/leads.spec.ts tests/browser/projects-gantt.spec.ts
      - name: Retain Leads evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crm-leads-implementation
          path: |
            test-results/
            playwright-report/
          retention-days: 14
