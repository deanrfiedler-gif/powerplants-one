name: Projects Gantt assurance
on:
  pull_request:
    paths:
      - "src/projects/**"
      - "src/components/project*.tsx"
      - "src/app/**/projects/**"
      - "src/app/projects-gantt.css"
      - "src/shared/receipts.ts"
      - "src/shell/**"
      - "db/**"
      - "scripts/database.ts"
      - "scripts/projects-restart-proof.ts"
      - "scripts/build-projects-ui-review.mjs"
      - "tests/**/projects*"
      - "tests/projects-ui/**"
      - "playwright.projects-ui.config.ts"
      - ".github/workflows/projects-gantt.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projects:
    name: Projects r10 scoped persistence and desktop interaction
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned tools and run static assurance
        run: |
          npm install --global npm@11.19.0
          npm ci
          npx playwright install --with-deps chromium
          npm run check
      - name: Configure disposable database
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: Scoped commands, evidence, concurrency and selectors
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 tests/database/projects-gantt.test.ts tests/database/desktop-shell.test.ts
      - name: Original operation across PostgreSQL and application-process restarts
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --env-file=.env.local --import tsx scripts/projects-restart-proof.ts write
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/projects-restart-proof.ts verify
      - name: Actual React layout and resize interaction
        run: |
          node scripts/build-projects-ui-review.mjs
          npx playwright test --config=playwright.projects-ui.config.ts
      - name: Real HTTP and saved desktop and phone journeys
        run: npx playwright test tests/browser/projects-gantt.spec.ts --output verification-evidence/projects-browser --reporter=list
      - name: Retain bounded synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Projects-Gantt-review
          path: |
            verification-evidence/projects-ui-tests
            verification-evidence/projects-browser
            verification-evidence/projects-restart/result.json
            !**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
