name: Quality and site assurance design review
on:
  pull_request:
    paths:
      - 'docs/design/quality-site-assurance/**'
      - 'docs/reference/ui/quality-site-assurance/**'
      - 'scripts/*quality-site-assurance*'
      - '.github/workflows/quality-site-assurance-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: Quality HTML model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify source, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/quality-site-assurance
          python3 scripts/build-quality-site-assurance.py
          git diff --exit-code -- docs/reference/ui/quality-site-assurance/PPO-Quality-Safety-and-Site-Assurance-Workspace-r01.html
          node scripts/check-quality-site-assurance-model.mjs > verification-evidence/quality-site-assurance/model-results.json
          node scripts/check-quality-site-assurance-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Quality-site-assurance-design-evidence
          path: verification-evidence/quality-site-assurance/
          retention-days: 14
