name: Output issue and distribution design
on:
  pull_request:
    paths:
      - 'docs/design/output-distribution/**'
      - 'docs/reference/ui/output-distribution/**'
      - 'scripts/*output-distribution*'
      - '.github/workflows/output-distribution-design.yml'
  workflow_dispatch:
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  design:
    name: DK-03 model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify deterministic output and model
        run: |
          mkdir -p verification-evidence/output-distribution
          python3 scripts/build-output-distribution.py
          git diff --exit-code -- docs/reference/ui/output-distribution/PPO-Output-Issue-and-Distribution-Centre-r01.html
          npx eslint docs/design/output-distribution/*.js scripts/check-output-distribution-*.mjs
          node scripts/check-output-distribution-model.mjs > verification-evidence/output-distribution/model-results.json
      - name: Check repository documentation
        run: |
          python3 scripts/check_foundation.py
          python3 scripts/check_prototype.py
          python3 scripts/check_naming.py
      - name: Verify native interactions and responsive layouts
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-output-distribution-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Output-distribution-design-evidence
          path: verification-evidence/output-distribution/
          retention-days: 14
