name: Naming and filing design assurance
on:
  pull_request:
    paths:
      - 'docs/blueprints/naming-filing-prototype/**'
      - 'scripts/check-naming-assistance-design.mjs'
      - '.github/workflows/naming-design.yml'
  push:
    branches: [main]
    paths:
      - 'docs/blueprints/naming-filing-prototype/**'
      - 'scripts/check-naming-assistance-design.mjs'
      - '.github/workflows/naming-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: Synthetic naming and filing model checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check the synthetic model and exact standalone artifact
        run: |
          node --check docs/blueprints/naming-filing-prototype/app.js
          node --check docs/blueprints/naming-filing-prototype/model.js
          python3 docs/blueprints/naming-filing-prototype/build.py
          git diff --exit-code -- docs/blueprints/naming-filing-prototype/index.html
          node scripts/check-naming-assistance-design.mjs
