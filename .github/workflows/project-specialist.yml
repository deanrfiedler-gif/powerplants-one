name: PJ-06 specialist package assurance
on:
  pull_request:
    paths:
      - "src/projects/specialist/**"
      - "src/engineering/materials/**"
      - "src/app/api/v1/projects/**/specialist-packages/**"
      - "src/projects/commercial/**"
      - "src/shared/receipts.ts"
      - "src/platform/permissions.ts"
      - "db/**"
      - "scripts/migration-registry.ts"
      - "scripts/prove-project-specialist-restart.ts"
      - "scripts/prove-project-specialist-handover-restart.ts"
      - "tests/**/project-specialist*"
      - ".github/workflows/project-specialist.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  specialist:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ppo_local
          POSTGRES_PASSWORD: ppo_disposable_ci_only
          POSTGRES_DB: ppo_synthetic_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ppo_local -d ppo_synthetic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Pinned tools and full application checks
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
          npm run check
      - name: Disposable database lock capacity
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/configure-test-postgres.sh
      - name: Configure synthetic environment
        run: |
          cp .env.example .env.local
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.local')
          p.write_text(p.read_text().replace('<local-password>','ppo_disposable_ci_only').replace('/ppo_synthetic','/ppo_synthetic_test'))
          PY
      - name: Native package, immutable source, privacy, concurrency and populated upgrades
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 tests/database/project-specialist.test.ts tests/database/project-specialist-upgrade.test.ts tests/database/project-specialist-handover.test.ts tests/database/project-specialist-handover-upgrade.test.ts
      - name: Reserved Products installation after latest history
        run: node --env-file=.env.local --import tsx --test --test-concurrency=1 --test-timeout=120000 --test-name-pattern='^PD upgrade from (103|104|105) ' tests/database/products-upgrade.test.ts
      - name: Compiled API and actual database/application restart
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > /tmp/pj06-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          node --env-file=.env.local --import tsx --test --test-timeout=120000 tests/http/project-specialist.test.ts
          # Both proofs revoke shared fixture grants; preserve fresh-database isolation.
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx --test --test-timeout=120000 tests/http/project-specialist-handover.test.ts
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/prove-project-specialist-restart.ts write /tmp/pj06-checkpoint.json
          kill "$server"
          wait "$server" || true
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > /tmp/pj06-restarted.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          mkdir -p verification-evidence/project-specialist
          node --env-file=.env.local --import tsx scripts/prove-project-specialist-restart.ts verify /tmp/pj06-checkpoint.json > verification-evidence/project-specialist/restart.json
      - name: Specialist handover actual database/application restart
        env:
          PPO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > /tmp/pj06-r2-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          PPO_ALLOW_RESET=dispose-synthetic PPO_RESET_DATABASE=ppo_synthetic_test npm run db:reset
          node --env-file=.env.local --import tsx scripts/prove-project-specialist-handover-restart.ts write /tmp/pj06-r2-checkpoint.json
          kill "$server"
          wait "$server" || true
          docker restart "$PPO_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            docker exec "$PPO_POSTGRES_CONTAINER" pg_isready -U ppo_local -d ppo_synthetic_test && break
            sleep 1
          done
          node --env-file=.env.local --import tsx scripts/local-server.ts --compiled > /tmp/pj06-r2-restarted.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          mkdir -p verification-evidence/project-specialist
          node --env-file=.env.local --import tsx scripts/prove-project-specialist-handover-restart.ts verify /tmp/pj06-r2-checkpoint.json > verification-evidence/project-specialist/handover-restart.json
      - name: Retain bounded synthetic restart evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PJ06-restart-evidence
          path: verification-evidence/project-specialist/*restart.json
          if-no-files-found: ignore
          retention-days: 14
