name: Order Fulfilment and Customer Delivery design review
on:
  pull_request:
    paths:
      - 'docs/design/order-fulfilment/**'
      - 'docs/reference/ui/supply-chain/PPO-Order-Fulfilment-and-Customer-Delivery-Workspace-*'
      - 'scripts/*order-fulfilment*'
      - '.github/workflows/order-fulfilment-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    name: Order fulfilment model and native browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Verify source, model and native interactions
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p verification-evidence/order-fulfilment
          python3 scripts/build-order-fulfilment.py
          git diff --exit-code -- docs/reference/ui/supply-chain/PPO-Order-Fulfilment-and-Customer-Delivery-Workspace-r01.html
          node scripts/check-order-fulfilment-model.mjs > verification-evidence/order-fulfilment/model-results.json
          node scripts/check-order-fulfilment-browser.mjs
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Order-Fulfilment-design-evidence
          path: verification-evidence/order-fulfilment/
          retention-days: 14
