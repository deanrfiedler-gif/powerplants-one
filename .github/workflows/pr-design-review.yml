name: Standalone design browser review
on:
  pull_request:
    paths:
      - 'docs/blueprints/excel-estimate-import*'
      - 'docs/blueprints/excel-estimate-import/**'
      - 'docs/reference/ui/customers/**'
      - 'docs/reference/ui/equipment/**'
      - 'docs/design/myob-integration/**'
      - 'scripts/build-myob-handbook.py'
      - 'scripts/check-pr-design-review.mjs'
      - '.github/workflows/pr-design-review.yml'
  workflow_dispatch:
# A replacement PR commit supersedes only this workflow on that same PR.
# Keep push and manual runs separate; never cancel their running verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  standalone:
    name: Native standalone design rendering and interaction
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use existing runtime and browser pins
        run: |
          npm install --global npm@11.19.0
          npm ci
          npm run browser:install
      - name: Review four standalone designs at desktop and phone widths
        env:
          PPO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-pr-design-review.mjs
      - name: Retain native design evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-design-review
          path: verification-evidence/pr-design-review/
          retention-days: 14
