function download(data,name,type){const blob=data instanceof Blob?data:new Blob([data],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function referencesTo(k,id){const links=[];for(const [collection,schema]of Object.entries(SCHEMAS)){const rows=schema.singleton?[state[collection]]:state[collection];for(const r of rows){for(const f of schema.fields){if(f.collection===k&&(f.type==='ref'&&r[f.key]===id||f.type==='multi'&&r[f.key].includes(id)))links.push({collection,name:r.name||schema.title});}if(k==='cohorts'&&collection==='valves'&&r.allocations.some(a=>a.cohort_id===id))links.push({collection,name:r.name})}}return links}

const fact=(label,value,unit='',sub='',ico='chart')=>`<div class="stat"><div class="stat-icon">${icon(ico)}</div><div class="kicker">${esc(label)}</div><div class="value mono">${esc(value)}${unit?`<span class="unit">${esc(unit)}</span>`:''}</div><div class="small">${esc(sub)}</div></div>`;

function table(headers,rows,emptyText='No records captured yet.'){return rows.length?`<div class="table-scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty('Ready to capture',emptyText)}

function nameLink(kind,r,sub=''){return `<button class="table-button" data-action="edit" data-kind="${kind}" data-id="${esc(r.id)}">${esc(r.name||'Unnamed record')}</button>${sub?`<span class="small">${esc(sub)}</span>`:''}`}
function registerPanel(kind,title,columns,options={}){const rows=state[kind];return panel(title,table(columns.map(c=>c[0]),rows.map(r=>tr(columns.map(c=>c[1](r))))),{actions:addBtn(kind,options.addLabel||'Add '+SCHEMAS[kind].title.toLowerCase()),bodyClass:'no-pad',sub:options.sub||`${rows.length} record${rows.length===1?'':'s'}`,foot:options.foot||''})}
const TABS=[['overview','Overview','grid'],['farm','Farm layout','farm'],['water','Water & hydraulics','water'],['nutrition','Recipes & dosing','leaf'],['controls','Controls & I/O','controls'],['planning','Operating plan','clock'],['config','Unit configurator','layers'],['delivery','Evidence & delivery','file'],['review','Scope review','clipboard']];

function renderHeader(){const s=selectedScenario();document.getElementById('header-actions').innerHTML=btn('New project','new','','','plus')+btn('Open','open','','','upload')+btn('Save project','save','','primary','download')+btn('Report','report','','','print')+btn('Project tools','tools','aria-label="More project tools"','icon-only','more');document.getElementById('context').innerHTML=`<div class="context-bar"><div class="context-project"><div class="project-icon">${icon('leaf')}</div><div><strong>${esc(state.project.name)}</strong><span class="small">${esc(state.project.reference||'Reference not assigned')} · ${esc(state.project.project_type||'Project type to confirm')} · Revision ${state.revision}</span></div></div><div class="context-meta">${tag(state.project.stage||'Discovery')}<label class="sr-only" for="scenario-picker">Active operating scenario</label><select class="compact-control" id="scenario-picker" aria-label="Active operating scenario">${state.scenarios.map(sc=>`<option value="${esc(sc.id)}" ${sc.id===s?.id?'selected':''}>${esc(sc.name)}</option>`).join('')}</select><span id="save-state">${storageOK?'<span class="saved-dot"></span>':''}${storageOK?(saveTime?'Saved in this browser':'Ready · sample project'):'Browser save unavailable'}</span></div></div>${state.synthetic?`<div class="demo-note">${icon('info')}<div class="grow"><strong>Synthetic demonstration.</strong> Explore the linked calculations, then start a blank project for a real farm. Crop targets and supplier approvals are deliberately unconfirmed.</div>${btn('Start blank','new','','small')}</div>`:''}${!storageOK?`<div class="gap-top">${notice(esc(ui.recovery_error||ui.storage_message||'Browser storage is unavailable. Use Save project to keep a portable JSON copy.'),'warning')}</div>`:''}${ui.recovery_raw?`<div class="gap-top">${notice('The unreadable recovery data is preserved. '+btn('Download recovery data','recovery-download','','small')+' '+btn('Keep this working copy','recovery-replace','','small'),'warning')}</div>`:''}${storageConflict?`<div class="gap-top">${notice('Another tab changed the browser copy. Download your current project before reopening or explicitly keeping this copy. '+btn('Resolve','conflict','','small'),'warning')}</div>`:''}`;}
function readiness(){const blockers=findings.filter(x=>x.severity==='Blocker').length;const reviews=findings.filter(x=>x.severity==='Review').length;const steps=[['Farm & flow basis','farm',findings.filter(x=>x.tab==='farm'||x.tab==='planning').length],['Water, pump & dosing','water',findings.filter(x=>x.tab==='water'||x.tab==='nutrition').length],['Controller & unit','controls',findings.filter(x=>x.tab==='controls'||x.tab==='config').length],['Evidence & delivery','delivery',findings.filter(x=>x.tab==='delivery').length]];return `<div class="row-between"><div><span class="eyebrow">Technical review</span><h2 style="margin-top:5px">${blockers?'Resolve sizing blockers':'Develop the scope basis'}</h2></div>${tag(blockers+' blocker'+(blockers===1?'':'s'),blockers?'danger':'success')}</div><div class="progress-segments">${steps.map(s=>`<span class="${s[2]===0?'done':''}"></span>`).join('')}</div><p class="small muted">${reviews} items need review. Completion describes data readiness; technical acceptance is recorded separately.</p><div class="gap-top">${steps.map(([label,tab,n],i)=>`<div class="action-row"><span class="step-circle">${n===0?icon('check'):i+1}</span><div class="item-copy"><strong>${label}</strong><p>${n?n+' open check'+(n===1?'':'s'):'No automated findings'}</p></div>${btn('Review','tab',`data-tab="${tab}"`,'small quiet','chevron')}</div>`).join('')}</div>`;}
function renderOverview(){const d=derived,s=selectedScenario();return `${heading('Project overview','A shared scope basis for the grower, irrigation designer and Priva specialist.',editBtn('project','','Edit project'))}<div class="grid four metrics">${fact('Active planted area',fmt(d.area),'ha',fmt(d.blocks.length,0)+' blocks in this scenario','farm')}${fact('Active plant population',fmt(d.plants,0),'plants',fmt(d.containers,0)+' containers','leaf')}${fact('Peak operating flow',fmt(d.peak),'m³/h',fmt(d.connected)+' m³/h connected emitter flow','water')}${fact('Gross daily crop demand',fmt(d.daily),'m³/day','From entered crop water basis','chart')}</div><div class="grid main-aside"><div class="stack">${panel('System concept',`<div class="diagram-board">${systemDiagram()}</div>`,{sub:'One shared fertigation circuit · click a component to inspect',actions:btn('Export SVG','svg','data-diagram="system"','small','download'),bodyClass:'no-pad',foot:`<div class="diagram-legend"><span><i class="legend-dot" style="background:var(--navy)"></i>Existing</span><span><i class="legend-dot" style="background:var(--green)"></i>Proposed</span><span><i class="legend-dot" style="background:var(--hairline)"></i>Future</span></div><span>Concept only · not to scale</span>`})}${panel('Operating basis',`<div class="mini-facts">${mini('Irrigation valves',fmt(d.valves.length,0))}${mini('Mainline valves',fmt(state.mainlines.filter(m=>activeRecord(m,s)).length,0))}${mini('Operating groups',fmt(d.groups.length,0))}${mini('Fertiliser recipes',fmt(state.recipes.length,0))}${mini('Start strategies',fmt(state.strategies.length,0))}${mini('Water sources',fmt(state.sources.length,0))}</div><div class="divider"></div><div class="row-between"><div><strong>${esc(s?.name||'Scenario not defined')}</strong><p class="small muted">${d.groups.map(g=>esc(g.name)).join(' → ')||'Add an operating group to calculate simultaneous duty.'}</p></div>${btn('Open plan','tab','data-tab="planning"','small','arrow')}</div>`,{sub:'Current scenario drives the entire module'})}</div><div class="stack">${panel('Scope readiness',readiness())}${panel('Project brief',`<p class="secondary">${esc(state.project.outcomes||'Capture the project outcomes and current irrigation constraints.')}</p><div class="divider"></div>${definitionList([['Customer',esc(state.project.customer||'To confirm')],['Site',esc(state.project.site||'To confirm')],['Scope author',esc(state.project.author||'To confirm')],['Target date',esc(state.project.target_date||'To confirm')]])}`,{actions:editBtn('project')})}</div></div><div class="gap-top">${notice('Start with physical blocks and crop cohorts, allocate them to valves, then build groups that genuinely operate together. Unknown inputs stay visible through every calculation.')}</div>`;}
function renderFarm(){const d=derived;const selected=state.blocks.find(x=>x.id===ui.selected_block)||state.blocks[0];return `${heading('Farm layout & valve allocation','Keep physical blocks, crops and controlled irrigation areas connected.',btn('Import / export CSV','csv-tools','','','file'))}<div class="grid four metrics">${fact('Scenario area',fmt(d.area),'ha',fmt(state.blocks.filter(b=>b.phase==='Future').reduce((a,b)=>a+(b.area_ha||0),0))+' ha future recorded','farm')}${fact('Containers',fmt(d.containers,0),'','Actual counts take precedence','leaf')}${fact('Irrigation valves',fmt(d.valves.length,0),'',state.mainlines.length+' mainline valves recorded','controls')}${fact('Connected flow',fmt(d.connected),'m³/h','All included valves, before sequencing','water')}</div><div class="stack">${registerPanel('blocks','Physical irrigation blocks',[['Block',r=>nameLink('blocks',r,r.location)],['Phase',r=>phaseTag(r.phase)],['Area',r=>fmt(r.area_ha)+' ha'],['Cohorts',r=>state.cohorts.filter(c=>c.block_id===r.id).length],['Irrigation valves',r=>new Set(state.valves.filter(v=>v.allocations.some(a=>state.cohorts.find(c=>c.id===a.cohort_id)?.block_id===r.id)).map(v=>v.id)).size],['Evidence',r=>evidenceTag(r.evidence_status)],['Schematic',r=>btn('View','block-diagram',`data-id="${r.id}"`,'small quiet','layers')]],{addLabel:'Add block',foot:'Block area is a physical area. A valve can serve multiple allocations; the same plants must not be counted twice.'})}${panel('Block schematic',selected?`<div class="diagram-board">${blockDiagram(selected)}</div>`:empty('No block schematic yet','Add a block and a crop cohort to begin.'),{sub:'Block → irrigation valve → crop cohort → dripper / outlet arrangement',actions:`<select id="block-picker" class="compact-control" aria-label="Block schematic selection">${state.blocks.map(b=>`<option value="${b.id}" ${b.id===selected?.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>${btn('Export SVG','svg','data-diagram="block"','small','download')}`,bodyClass:'no-pad',foot:'Live allocation diagram · diagram positions are conceptual · manufacturer emitter details require confirmation.'})}${registerPanel('cohorts','Crop cohorts & emitter arrangements',[['Cohort',r=>nameLink('cohorts',r,recordName('blocks',r.block_id))],['Crop / system',r=>esc(r.crop||'Unknown')+'<span class="small">'+esc(r.system||'Unknown')+'</span>'],['Containers / plants',r=>fmt(cohortContainers(r,state),0)+' / '+fmt(cohortPlants(r,state),0)],['Flow per container',r=>fmt(containerFlow(r),2)+' L/h'],['Emitter basis',r=>r.flow_method==='Independent drippers'?fmt(r.emitters_per_container)+' × '+fmt(r.emitter_lph)+' L/h<span class="small">'+fmt(r.outlets_per_emitter,0)+' outlets per hub; '+fmt(r.containers_per_emitter)+' container(s) served</span>':esc(r.flow_method||'Unknown')],['Daily gross',r=>fmt(dailyDemand(r,state))+' m³/day']],{addLabel:'Add cohort'})}${registerPanel('valves','Irrigation valves & served crops',[['Valve',r=>nameLink('valves',r,recordName('mainlines',r.mainline_id))],['Phase',r=>phaseTag(r.phase)],['Allocations',r=>r.allocations.map(a=>`<span class="small">${esc(recordName('cohorts',a.cohort_id))} · ${fmt(a.containers,0)} pots</span>`).join('')||tag('Unallocated','warning')],['Demand',r=>fmt(valveFlow(r,state))+' m³/h'],['Basis',r=>esc(r.flow_basis||'Unknown')],['Pressure',r=>fmt(r.pressure_bar)+' bar']],{addLabel:'Add irrigation valve'})}${registerPanel('mainlines','Mainline / master valve register',[['Valve',r=>nameLink('mainlines',r,r.circuit)],['Phase',r=>phaseTag(r.phase)],['Source',r=>esc(recordName('sources',r.source_id))],['Operating pressure',r=>fmt(r.operating_pressure_bar)+' bar'],['Condition',r=>esc(r.condition||'Unknown')]],{addLabel:'Add mainline valve'})}</div>`;}
function svgWrap(content,width,height,title,desc){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><desc>${esc(desc)}</desc><style>text{font-family:Arial,sans-serif;fill:#242a37} .svg-label{fill:#667181} .clickable{cursor:pointer}</style>${content}</svg>`}
function systemDiagram(print=false){const d=derived||derive(),W=880;const blocks=state.blocks;const count=Math.max(1,blocks.length);const H=235+count*64;const prof=state.profiles.find(x=>x.id===state.selected_profile_id);const node=(x,y,w,label,sub,kind,id,phase='Existing')=>`<g ${print?'':`class="clickable" tabindex="0" role="button" aria-label="Inspect ${esc(label)}" data-action="edit" data-kind="${kind}" data-id="${esc(id||'')}"`}><rect x="${x}" y="${y}" width="${w}" height="63" rx="7" fill="#fff" stroke="${phase==='Proposed'?'#62bb46':'#cbd2dc'}" ${phase==='Future'?'stroke-dasharray="5 4"':''}/><rect x="${x}" y="${y}" width="5" height="63" rx="2" fill="${phase==='Proposed'?'#62bb46':phase==='Future'?'#cbd2dc':'#242a37'}"/><text x="${x+16}" y="${y+26}" font-size="13" font-weight="600">${esc(label)}</text><text class="svg-label" x="${x+16}" y="${y+46}" font-size="10">${esc(sub)}</text></g>`;
 let content=`<defs><marker id="flow-arrow-${print?'p':'s'}" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0l6 3.5L0 7" fill="none" stroke="#828e9f"/></marker></defs><text x="24" y="28" font-size="10" letter-spacing="1.2" class="svg-label">WATER &amp; FERTIGATION CIRCUIT</text><text x="856" y="28" text-anchor="end" font-size="10" class="svg-label">${esc(state.project.reference||'Project scope')} · r${state.revision}</text>`;

 content+=node(24,57,169,state.sources[0]?.type||'Water source',state.sources.length?state.sources[0].name.slice(0,24):'Capture supply basis','sources',state.sources[0]?.id)+node(232,57,165,'Supply pump',known(d.pump_peak)?fmt(d.pump_peak)+' m³/h peak duty':'Duty to be calculated','hydraulics')+node(436,57,165,'Filtration',state.filters.length+' process item(s)','filters',state.filters[0]?.id)+node(640,57,214,prof?.name||'Priva fertigation',prof?'Shortlisted · verify configuration':'Unit configuration to be selected','profiles',prof?.id,'Proposed');
 content+=`<path d="M747 120v51H110v${count*64-12}" fill="none" stroke="#828e9f" stroke-width="2"/><text x="24" y="161" font-size="10" class="svg-label">${state.mainlines.length} MAINLINE VALVE(S)</text><text x="853" y="158" text-anchor="end" font-size="10" class="svg-label">Pressure ${fmt(state.mainlines[0]?.operating_pressure_bar)} bar · dynamic basis to verify</text>`;

function pumpChart(print=false){const d=derived||derive(),h=state.hydraulics;const pts=state.curve_points,sys=state.system_curve_points;const qTarget=h.head_basis_flow_m3h,head=d.head;const values=[...pts,...sys];const xmax=Math.max(10,...values.map(p=>p.q),positive(qTarget)?qTarget*1.2:0,positive(d.pump_peak)?d.pump_peak*1.2:0),ymax=Math.max(10,...values.map(p=>p.h),positive(head)?head*1.2:0);const W=760,H=365,L=58,R=28,T=28,B=54;const x=q=>L+q/xmax*(W-L-R),y=v=>H-B-v/ymax*(H-T-B);let t='';for(let i=0;i<=5;i++){const xx=x(xmax*i/5),yy=y(ymax*i/5);t+=`<path d="M${L} ${yy}H${W-R}" stroke="#e9ecf1"/><path d="M${xx} ${T}V${H-B}" stroke="#e9ecf1"/><text x="${L-10}" y="${yy+4}" font-size="11" text-anchor="end" class="svg-label">${fmt(ymax*i/5)}</text><text x="${xx}" y="${H-B+23}" font-size="11" text-anchor="middle" class="svg-label">${fmt(xmax*i/5)}</text>`}t+=`<text x="${L}" y="16" font-size="11" class="svg-label">Total head (m)</text><text x="${W-R}" y="${H-7}" font-size="11" text-anchor="end" class="svg-label">Flow (m³/h)</text>`;const path=a=>a.map((p,i)=>(i?'L':'M')+x(p.q)+' '+y(p.h)).join(' ');if(pts.length)t+=`<path d="${path(pts)}" fill="none" stroke="#242a37" stroke-width="3"/>${pts.map(p=>`<circle cx="${x(p.q)}" cy="${y(p.h)}" r="3.5" fill="#fff" stroke="#242a37" stroke-width="2"><title>${fmt(p.q)} m³/h; ${fmt(p.h)} m</title></circle>`).join('')}`;if(sys.length)t+=`<path d="${path(sys)}" fill="none" stroke="#355b80" stroke-width="2" stroke-dasharray="6 4"/>`;if(known(qTarget)&&known(head)){t+=`<path d="M${L} ${y(head)}H${x(qTarget)}V${H-B}" fill="none" stroke="#62bb46" stroke-dasharray="4 4"/><circle cx="${x(qTarget)}" cy="${y(head)}" r="6" fill="#62bb46" stroke="#fff" stroke-width="2"/><text x="${Math.min(x(qTarget)+12,W-160)}" y="${Math.max(25,y(head)-15)}" font-size="12" font-weight="600">${fmt(qTarget)} m³/h · ${fmt(head)} m</text>`}if(known(h.measured_flow_m3h)&&known(h.measured_head_m)&&h.measured_flow_m3h<=xmax&&h.measured_head_m<=ymax)t+=`<rect x="${x(h function storageChart(sch){if(!sch.storage_complete||!sch.inventory?.length)return empty('Storage basis incomplete','Enter initial water, usable capacity, reserve and reliable refill.');const s=selectedScenario(),W=680,H=200,L=48,B=35,T=20,R=20;const xmax=Math.max(...sch.inventory.map(v=>v.t),1);const ymin=Math.min(0,...sch.inventory.map(p=>p.v)),ymax=Math.max(s.storage_capacity_m3,1);const x=t=>L+t/xmax*(W-L-R),y=v=>H-B-(v-ymin)/(ymax-ymin)*(H-B-T);let t='';for(let i=0;i<=3;i++){let v=ymin+(ymax-ymin)*i/3;t+=`<path d="M${L} ${y(v)}H${W-R}" stroke="#e9ecf1"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="10" class="svg-label">${fmt(v)}</text>`}t+=`<path d="M${L} ${y(s.reserve_m3)}H${W-R}" stroke="#993b2a" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(s.reserve_m3)-6}" text-anchor="end" font-size="10" class="svg-label">Protected reserve ${fmt(s.reserve_m3)} m³</text><path d="${sch.inventory.map((p,i)=>(i?'L':'M')+x(p.t)+' '+y(p.v)).join(' ')}" fill="none" stroke="#355b80" stroke-width="2"/><text x="${L}" y="12" font-size="10" class="svg-label">Usable inventory (m³)</text><text x="${L}" y="${H-10}" font-size="10" class="svg-label">Start</text><text x="${W-R}" y="${H-10}" text-anchor="end" font-size="10" class="svg-label">Last irrigation event · ${fmt(xmax/60)} min</text>`;return svgWrap(t,W,H,'Tank inventory during the operating sequence','Piecewise tank water balance from entered reliable refill and group withdrawals. Negative inventory indicates demand that cannot be supplied.');}

{definitionList([['Active scenario',esc(s?.name||'None')],['Future phase',esc(s?.include_future||'No')],['Window',esc((s?.start_time||'?')+' – '+(s?.end_time||'?'))],['Cycles',fmt(s?.cycles,0)],['Cycle start spacing',fmt(sch.spacing_seconds?sch.spacing_seconds/60:null)+' min'],['Maintenance downtime',fmt(s?.downtime_min)+' min'],['Total pump withdrawal',fmt(sch.total_m3)+' m³']])}<p class="footnote">Downtime is reserved after the sequence. The graph ends at the last irrigation event. One-cycle plans do not establish repeat dry intervals or overnight coverage.</p>`,{actions:editBtn('scenarios',s?.id)})}${panel('Timing checks',sch.complete?sch.reasons.length?sch.reasons.map(r=>notice(esc(r),'danger')).join('<div style="height:8px"></div>'):notice('The sequence fits the entered time window and explicit interval limits. Verify crop-by-crop delivery, minimum pulse duration and overnight requirements.','success'):notice(esc(sch.reasons[0]),'warning'))}</div></div><div class="stack gap-top">${registerPanel('groups','Operating group register',[['Group / case',r=>nameLink('groups',r,r.duty)],['Simultaneous valves',r=>r.valve_ids.map(id=>tag(recordName('valves',id))).join(' ')],['Recipe',r=>esc(recordName('recipes',r.recipe_id))],['Unit / pump flow',r=>{const q=groupFlow(r,state,s);return fmt(q.unit)+' / '+fmt(q.pump)+' m³/h'}],['Prepare / deliver / flush',r=>fmt(r.prepare_seconds)+' / '+fmt(r.delivery_seconds)+' / '+fmt(r.flush_seconds)+' s'],['Crop per event',r=>{const q=groupFlow(r,state,s).crop;return fmt(known(q)&&known(r.delivery_seconds)?q*r.delivery_seconds/3600*1000:null)+' L'}],['Order',r=>`<div class="actions">${btn('↑','move-group',`data-id="${r.id}" data-direction="-1" aria-label="Move ${esc(r.name)} earlier"`,'small quiet')}${btn('↓','move-group',`data-id="${r.id}" data-direction="1" aria-label="Move ${esc(r.name)} later"`,'small quiet')}</div>`]],{addLabel:'Add operating group',foot:'Register order sets the order in every scenario. To represent a different simultaneous demand, create a distinct group. Automatic optimisation and multiple parallel circuits are not modelled.'})}${panel('Dry intervals & crop delivery',table(['Group','Start-to-start','End-to-next-start','Allowed maximum dry','Selected cycles','Crop delivery volume'],(sch.intervals||[]).map(i=>{const g=state.groups.find(g=>g.id===i.group_id),q=groupFlow(g,state,s).crop;return tr([esc(g.name),fmt(i.starts)+' min',fmt(i.dry)+' min',fmt(g.maximum_dry_min)+' min',fmt(s.cycles,0),fmt(known(q)&&known(g.delivery_seconds)?q*g.delivery_seconds/3600*s.cycles:null)+' m³'])})),{bodyClass:'no-pad',sub:'Dry interval runs from the end of one crop-delivery phase to the start of the next',foot:'The table shows scheduled delivery volume only. Crop-directed flush is reported separately in the scenario total.'})}${panel('Compare operating scenarios',table(['Scenario','Phase basis','Unit min / peak','Daily crop demand','Planned crop volume','Duration / window','Status'],state.scenarios.map(sc=>{const x=derive(state,sc);return tr([nameLink('scenarios',sc),sc.include_future==='Yes'?'Existing + proposed + future':'Existing + proposed',fmt(x.minimum)+' / '+fmt(x.peak)+' m³/h',fmt(x.daily)+' m³',fmt(x.schedule.crop_m3)+' m³',fmt(x.schedule.elapsed_min)+' / '+fmt(x.schedule.window_minutes)+' min',tag(x.schedule.complete?(x.schedule.reasons.length?'Timing / storage conflict':'Timing checks fit'):'Incomplete',x.schedule.complete&&!x.schedule.reasons.length?'success':'warning')])})),{actions:addBtn('scenarios','Add scenario'),bodyClass:'no-pad',foot:'Scenario comparisons share the farm registers. Use a project snapshot or exported copy to retain a different physical design.'})}</div>`;}

function renderReview(){const counts=['Blocker','Review','Information'].map(k=>[k,findings.filter(f=>f.severity===k).length]);const filtered=findings.filter(f=>ui.issue_filter==='All'||f.severity===ui.issue_filter);return `${heading('Scope review & handover','Resolve open assumptions and capture a review against the exact project revision.',`${btn('Snapshot','snapshot','','','copy')}${btn('Prepare report','report','','primary','print')}`)}<div class="grid four metrics">${counts.map(([k,n])=>fact(k+' items',fmt(n,0),'',k==='Blocker'?'Resolve before relying on sizing':k==='Review'?'Evidence or specialist decision':'Recorded context',k==='Blocker'?'alert':'clipboard')).join('')}${fact('Local review',state.review?'Recorded':'Not recorded','','Applies to revision '+state.revision,'check')}</div><div class="grid main-aside"><div class="stack">${panel('Automated checks & open actions',`<div class="panel-body" style="padding-bottom:12px"><div class="segmented" aria-label="Filter findings">${['All','Blocker','Review','Information'].map(x=>`<button aria-pressed="${ui.issue_filter===x}" data-action="issue-filter" data-filter="${x}">${x}</button>`).join('')}</div></div>${filtered.length?filtered.map(f=>`<div class="issue ${f.severity==='Blocker'?'blocker':''}">${icon(f.severity==='Blocker'?'alert':'info')}<div class="issue-main"><h4>${esc(f.title)}</h4><p>${esc(f.detail)}</p></div>${btn('Resolve','finding',`data-finding="${esc(f.id)}"`,'small quiet','chevron')}</div>`).join(''):empty('No findings in this filter','Automated checks only cover the entered model and supported calculation boundaries.')}`,{actions:addBtn('issues','Add action'),bodyClass:'no-pad'})}</div><div class="stack">${panel('Technical review record',state.review?`<div>${tag('Local acknowledgement','success')}</div>${definitionList([['Reviewer',esc(state.review.name)],['Role',esc(state.review.role)],['Date',esc(new Date(state.review.date).toLocaleString('en-AU'))],['Revision',fmt(state.review.revision,0)]])}<p class="small secondary">${esc(state.review.note)}</p><p class="footnote">Local record only. No authenticated identity or supplier approval is implied. Editing scope data invalidates this acknowledgement.</p>`:`<p class="secondary">Record who reviewed this revision, their discipline and the remaining conditions.</p><div class="gap-top">${btn('Record review','review-dialog','','','clipboard')}</div><p class="footnote">Sizing blockers must be resolved before a readiness acknowledgement can be recorded. A report can be prepared at any stage with its open issues visible.</p>`) }${panel('Project snapshots',state.snapshots.length?state.snapshots.map(s=>`<div class="archive-row"><div class="row-between"><strong>${esc(s.name)}</strong>${tag('r'+s.revision)}</div><p class="small muted">${esc(new Date(s.date).toLocaleString('en-AU'))}</p><div class="actions gap-top">${btn('Compare','snapshot-compare',`data-id="${s.id}"`,'small')}${btn('Restore','snapshot-restore',`data-id="${s.id}"`,'small quiet')}${btn('Delete','snapshot-delete',`data-id="${s.id}"`,'small quiet')}</div></div>`).join(''):empty('No snapshots yet','Keep a named basis before changing the design.'),{actions:btn('Create','snapshot','','small','plus')})}${state.review_history?.length?panel('Superseded reviews',state.review_history.map(r=>`<div class="archive-row"><strong>${esc(r.name)}</strong> ${tag('Out of date','warning')}<p class="small muted">Revision ${esc(r.revision)} · ${esc(r.reason)}</p><p class="small">${esc(r.note)}</p></div>`).join('')):''}${panel('Recent activity',state.activity.slice(0,7).map(a=>`<div class="archive-row"><div class="small">${esc(a.action)}</div><div class="small muted">Revision ${a.revision} · ${esc(new Date(a.date).toLocaleString('en-AU'))}</div></div>`).join('')||'<p class="muted small">Changes will be recorded here.</p>')}${panel('Recovery',`<p class="small secondary">Portable JSON holds the complete project. Browser storage is a recovery convenience tied to this browser and file location.</p><div class="actions gap-top">${btn('Download project','save','','small','download')}${btn('Undo last edit','undo',undoStack.length?'':'disabled','small','undo')}</div>`)}</div></div><div class="stack gap-top">${registerPanel('issues','Owned decisions & open questions',[['Question / action',r=>nameLink('issues',r,r.notes)],['Priority',r=>tag(r.severity||'Review',r.severity==='Blocker'?'danger':'warning')],['Owner',r=>esc(r.owner||'Unassigned')],['Due date',r=>esc(r.due_date||'To confirm')],['State',r=>tag(r.status||'Open')],['Resolution evidence',r=>esc(r.resolution_ref||'Not recorded')]],{addLabel:'Add question / action'})}</div>`;}
function formField(f,r){if(f.type==='section')return `<div class="form-section-title">${esc(f.label)}</div>`;const v=r[f.key],id='f-'+f.key;const common=`id="${id}" name="${f.key}" ${f.required?'required':''} ${f.readonly?'readonly':''}`;let control='';if(f.type==='textarea')control=`<textarea ${common}>${esc(v)}</textarea>`;else if(f.type==='select'||f.type==='ref'){const opts=f.type==='select'?f.options.map(o=>[o,o]):state[f.collection].map(r=>[r.id,r.name]);control=`<select ${common}><option value="">Select / unknown</option>${opts.map(([val,label])=>`<option value="${esc(val)}" ${v===val?'selected':''}>${esc(label)}</option>`).join('')}</select>`}else if(f.type==='multi'){control=`<div class="check-grid" id="${id}">${state[f.collection].map(x=>`<label class="check"><input type="checkbox" name="${f.key}" value="${x.id}" ${(v||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')||'<span class="small muted">Create '+f.collection+' records first.</span>'}</div>`}else if(f.type==='allocations'){control=`<div id="allocation-rows">${(v||[]).map((a,i)=>allocationRow(a,i)).join('')}</div>${btn('Add crop allocation','add-allocation','','small','plus')}<p class="help">Allocate each container once. A valve may serve multiple cohorts, including cohorts in different physical blocks.</p>`}else control=`<input ${common} type="${f.type}" ${f.type==='number'?`step="${f.integer?'1':'any'}" ${f.signed?'':'min="0"'} ${finite(f.max)?`max="${f.max}"`:''}`:''} value="${esc(v??'')}" ${f.type==='number'?'placeholder="Unknown"':''}>`;return `<div class="form-field ${f.wide?'wide':''}"><label for="${id}">${esc(f.label)}${f.required?' <span aria-hidden="true">*</span>':''}</label>${control}${f.help?`<span class="help">${esc(f.help)}</span>`:''}</div>`;}
function allocationRow(a={},i=0){return `<div class="allocation-row grid" style="grid-template-columns:minmax(0,1fr) 130px 40px;gap:8px;margin-bottom:9px"><div><label class="sr-only" for="ac-${i}">Crop cohort ${i+1}</label><select class="control" id="ac-${i}" data-allocation="cohort" required><option value="">Choose crop cohort</option>${state.cohorts.map(c=>`<option value="${c.id}" ${c.id===a.cohort_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label class="sr-only" for="an-${i}">Allocated container count ${i+1}</label><input class="control" id="an-${i}" type="number" min="0" step="1" placeholder="Containers" value="${esc(a.containers??'')}" data-allocation="count" required></div>${btn('','remove-allocation','aria-label="Remove this allocation"','icon-only quiet','close')}</div>`;}
function openEditor(kind,id){if(!SCHEMAS[kind])return;if(kind==='profiles'&&!id){ui.tab='config';render();return}const schema=SCHEMAS[kind],record=schema.singleton?state[kind]:state[kind].find(x=>x.id===id)||emptyRecord(kind);editContext={kind,id:record.id||'',isNew:!schema.singleton&&!state[kind].some(x=>x.id===record.id),original:clone(record),dirty:false};lastFocus=document.activeElement;const dlg=document.getElementById('editor');dlg.innerHTML=`<div class="dialog-head"><div><h2 id="editor-title">${editContext.isNew?'Add ':''}${esc(schema.title)}</h2><p>${schema.singleton?'Project-wide scope basis':id?'Edit the recorded scope and evidence':'Capture only what is known; leave unknown quantities blank.'}</p></div>${btn('','close-editor','aria-label="Close editor"','icon-only quiet','close')}</div><form id="record-form" class="drawer-form"><div class="dialog-body"><div id="editor-error" class="notice danger drawer-error" role="alert"></div><div class="form-grid">${schema.fields.map(f=>formField(f,record)).join('')}</div>${kind==='evidence'&&record.attachment?`<p class="footnote">Attached: ${esc(record.attachment.name)}. Saving this form preserves the attachment.</p>`:''}</div><div class="dialog-foot"><div>${!schema.singleton&&!editContext.isNew&&kind!=='profiles'?btn('Delete','delete-record','','danger small','trash'):''}</div><div class="actions">${btn('Cancel','close-editor')}<button type="submit" class="btn primary">${icon('check')}Save changes</button></div></div></form>`;dlg.showModal();setTimeout(()=>dlg.querySelector('input:not([readonly]),select,textarea')?.focus(),0);}
function readRecordForm(){const {kind,original}=editContext;const data=clone(original),form=document.getElementById('record-form');for(const f of SCHEMAS[kind].fields){if(f.type==='section'||f.readonly)continue;if(f.type==='multi'){data[f.key]=Array.from(form.querySelectorAll(`input[name="${f.key}"]:checked`)).map(el=>el.value);if(f.required&&!data[f.key].length)throw Error('Select at least one '+f.label.toLowerCase()+'.')}else if(f.type==='allocations'){data[f.key]=Array.from(form.querySelectorAll('.allocation-row')).map(row=>({cohort_id:row.querySelector('[data-allocation=cohort]').value,containers:row.querySelector('[data-allocation=count]').value===''?null:Number(row.querySelector('[data-allocation=count]').value)}))}else{const el=form.elements.namedItem(f.key);data[f.key]=f.type==='number'?(el.value===''?null:Number(el.value)):el.value.trim();if(f.required&&!data[f.key])throw Error(f.label+' is required.')}}return data;}
function saveRecord(event){event.preventDefault();try{const r=readRecordForm(),{kind,isNew}=editContext;const candidate=clone(state);if(SCHEMAS[kind].singleton)candidate[kind]=r;else if(isNew)candidate[kind].push(r);else candidate[kind][candidate[kind].findIndex(x=>x.id===r.id)]=r;validateProjectObject(candidate);const name=r.name||SCHEMAS[kind].title;document.getElementById('editor').close();editContext=null;commit((isNew?'Added ':'Updated ')+name,()=>{if(SCHEMAS[kind].singleton)state[kind]=r;else if(isNew)state[kind].push(r);else state[kind][state[kind].findIndex(x=>x.id===r.id)]=r});toast('Saved '+name);lastFocus?.focus?.()}catch(e){const el=document.getElementById('editor-error');el.classList.add('visible');el.textContent=e.message;el.scrollIntoView({block:'nearest'});}}
function modal(title,body,footer='',wide=false){lastFocus=document.activeElement;const d=document.getElementById('modal');d.style.width=wide?'min(1000px, calc(100% - 32px))':'';d.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${title}</h2>${btn('','close-modal','aria-label="Close dialogue"','icon-only quiet','close')}</div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-foot">${footer}</div>`:''}`;if(!d.open)d.showModal();}
function closeModal(){document.getElementById('modal').close();lastFocus?.focus?.()}
function confirmDialog(title,text,action,label='Continue',attrs=''){modal(title,`<p class="secondary">${text}</p>`,`<span></span><div class="actions">${btn('Cancel','close-modal')}${btn(label,action,attrs,'primary')}</div>`)}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>el.classList.remove('show'),4500)}
function curveDialog(){modal('Pump and system curve data',`${notice('Enter exact supplier or field points. Flow must increase with no duplicate values. No extrapolation is performed. Synthetic example data remains labelled in the pump record.')}<div class="grid two gap-top"><div class="form-field"><label for="curve-data">Pump curve — flow, head[, efficiency %, power kW]</label><textarea id="curve-data" rows="10" style="min-height:240px" spellcheck="false">${state.curve_points.map(p=>[p.q,p.h,p.efficiency??'',p.power??''].join(',')).join('\n')}</textarea></div><div class="form-field"><label for="system-data">Optional system curve — flow, total head</label><textarea id="system-data" rows="10" style="min-height:240px" spellcheck="false">${state.system_curve_points.map(p=>[p.q,p.h].join(',')).join('\n')}</textarea></div></div><div class="form-grid gap-top"><div class="form-field"><label for="curve-flow-unit">Pasted flow units (both curves)</label><select id="curve-flow-unit"><option value="m3h">m³/h</option><option value="ls">L/s</option></select></div><div class="form-field"><label for="curve-head-unit">Pasted head units (both curves)</label><select id="curve-head-unit"><option value="m">Metres of water</option><option value="kpa">kPa</option><option value="bar">bar</option></select></div></div><p class="footnote">Conversion uses 998.2 kg/m³ and 9.80665 m/s². Existing values shown here are always m³/h and metres. Changing a unit selector interprets all pasted values in that unit.</p><div id="curve-error" class="notice danger drawer-error" role="alert"></div>`,`<span class="small muted">Comma, semicolon or tab separated. Blank curves are allowed.</span><div class="actions">${btn('Cancel','close-modal')}${btn('Save curve data','save-curve','','primary')}</div>`,true)}
function parseCurve(text,qFactor=1,hFactor=1){const lines=text.trim()?text.trim().split(/\r?\n/):[];return lines.map((l,i)=>{const cells=l.trim().split(/[,;\t]+/).map(v=>v.trim());if(cells.length<2||!cells[0]||!cells[1])throw Error('Curve row '+(i+1)+': enter flow and head.');const [q,h]=cells.slice(0,2).map(Number);if(!known(q)||!known(h))throw Error('Curve row '+(i+1)+': numbers must be finite and non-negative.');const p={q:q*qFactor,h:h*hFactor};if(cells[2]){p.efficiency=Number(cells[2]);if(!known(p.efficiency)||p.efficiency>100)throw Error('Efficiency must be between 0 and 100%.')}if(cells[3]){p.power=Number(cells[3]);if(!known(p.power))throw Error('Power must be non-negative.')}return p}).sort((a,b)=>a.q-b.q)}
function prepareReport(){const d=derived,s=selectedScenario(),issueRows=findings.map(f=>tr([esc(f.severity),esc(f.title),esc(f.detail)]));const registerSummary=(kind)=>{const schema=SCHEMAS[kind];const rows=schema.singleton?[state[kind]]:state[kind];if(!rows.length)return '<p>No records captured.</p>';return rows.map(r=>`<h3>${esc(r.name||schema.title)}</h3>${table(['Field','Recorded value'],schema.fields.filter(f=>f.type!=='section'&&f.key!=='name').map(f=>{const v=r[f.key];let out;if(f.type==='ref')out=recordName(f.collection,v);else if(f.type==='multi')out=(v||[]).map(id=>recordName(f.collection,id)).join('; ')||'None selected';else if(f.type==='allocations')out=(v||[]).map(a=>recordName('cohorts',a.cohort_id)+': '+fmt(a.containers,0)+' containers').join('; ')||'Not allocated';else if(f.type==='number')out=fmt(v,4);else out=v||'Not recorded';return tr([esc(f.label),esc(out)])}))}${r.attachment?`<p>Embedded attachment: ${esc(r.attachment.name)} · supplied in portable project JSON.</p>`:''}`).join('')};
 const report=`<div class="report-head"><div class="eyebrow">Powerplants One · Technical scoping</div><h1>Priva fertigation project scope</h1><p>${esc(state.project.name)}</p><div class="report-meta"><span>${esc(state.project.reference||'Reference unassigned')} · Project revision ${state.revision}</span><span>Prepared ${esc(new Date().toLocaleString('en-AU'))}</span></div></div>${notice(`${state.synthetic?'<strong>SYNTHETIC DEMONSTRATION DATA.</strong> ':''}Scoping document. ${findings.filter(f=>f.severity==='Blocker').length} sizing blockers and ${findings.filter(f=>f.severity==='Review').length} review items remain. This report records the entered basis; it is not a construction design, manufacturer approval or agronomic recommendation.`,findings.some(f=>f.severity==='Blocker')?'warning':'info')}<h2>1. Project and active operating basis</h2><p><strong>Scenario:</strong> ${esc(s?.name||'None')}; future phase ${esc(s?.include_future||'No')}.</p>${table(['Metric','Value'],[['Active area',fmt(d.area)+' ha'],['Plants / containers',fmt(d.plants,0)+' / '+fmt(d.containers,0)],['Irrigation / mainline valves',d.valves.length+' / '+state.mainlines.filter(m=>activeRecord(m,s)).length],['Connected valve flow',fmt(d.connected)+' m³/h'],['Unit minimum / peak flow',fmt(d.minimum)+' / '+fmt(d.peak)+' m³/h'],['Pump peak / required head',fmt(d.pump_peak)+' m³/h / '+fmt(d.head)+' m'],['Daily crop demand / planned crop application',fmt(d.daily)+' / '+fmt(d.schedule.crop_m3)+' m³'],['Scope boundaries',state.project.boundaries||'Not recorded']].map(x=>tr(x.map(esc))))}<h2>2. Concept schematic</h2>${systemDiagram(true)}<h2>3. Pump curve and stated duty</h2>${pumpChart(true)}<p>Curve source: ${esc(state.hydraulics.curve_ref||'Unverified')}. Curve status: ${esc(state.hydraulics.curve_status||'Unknown')}. Head-loss flow basis: ${fmt(state.hydraulics.head_basis_flow_m3h)} m³/h. Curve and system data are linearly interpolated within supplied points only; no predicted operating point is asserted by the required-duty marker.</p>${table(['Flow (m³/h)','Head (m)','Efficiency (%)','Power (kW)'],state.curve_points.map(p=>tr([fmt(p.q),fmt(p.h),fmt(p.efficiency),fmt(p.power)])))}<h2>4. Proposed Priva family</h2><p>${esc(state.profiles.find(p=>p.id===state.selected_profile_id)?.name||'No family shortlisted')}. Exact configuration, source and conditions are retained in the configuration register below.</p>${table(['Family','Check result','Exact configuration','Outstanding conditions'],state.profiles.map(p=>{const a=configuredAssessment(p);return tr([esc(p.name),esc(a.status),esc(p.configuration||'Not recorded'),esc([...a.failures,...a.unknown].join('; '))])}))}<h2>5. Open technical checks</h2>${table(['Priority','Finding','Required action / basis'],issueRows,'No automated findings. Specialist review still required.')}<h2>6. Review acknowledgement</h2><p>${state.review?'Local record by '+esc(state.review.name)+' ('+esc(state.review.role)+') on '+esc(state.review.date)+', revision '+state.review.revision+'. '+esc(state.review.note):'No local technical review recorded.'}</p><p>Local acknowledgements are not authenticated signatures. A data change invalidates the local current-revision acknowledgement.</p><h2 class="page-break">7. Full captured scope register</h2>${Object.keys(SCHEMAS).filter(k=>k!=='profiles'||state.profiles.some(p=>p.configuration)).map(k=>`<h2>${esc(SCHEMAS[k].title)}</h2>${registerSummary(k)}`).join('')}<h2>Calculation and schedule boundaries</h2><p>Unknown numerical inputs remain unknown. Emitter flow counts independent drippers / hubs; shared splitter outlets do not multiply hub flow. Group flow counts each physical valve once. Other simultaneous consumers are assigned separately to pump and dosing-unit paths.</p><p>Injection demand (L/h) = final delivered flow (m³/h) × entered stock dose (L/m³). Dose is not inferred from EC or pH. Pipe volume uses actual internal diameter; volume / flow is a preliminary displacement estimate. Head converts pressure using 998.2 kg/m³ and 9.80665 m/s², then adds entered static lift and losses at their stated flow basis.</p><p>The sequential shared-circuit planner consumes entered pump flow throughout preparation, delivery and flush. Preparation receives no crop-volume credit. Flush receives crop credit only when its crop destination is explicitly declared. Tank refill is continuous at the entered reliable rate and is capped at usable capacity; negative inventory exposes supply shortfall. Additional downtime is reserved after the irrigation sequence. Interval checks apply to repeated deliveries inside the window, not overnight or sensor-driven schedules. The planner is deterministic and does not optimise parallel circuits.</p><h2>Source references</h2><p>Research basis reviewed 21 September 2026. Product-family publications are descriptive references, not project-specific limits.</p><ol class="sources-list">${SOURCE_LINKS.map(([label,url])=>`<li>${esc(label)} — <a href="${url}">${url}</a></li>`).join('')}</ol><div class="report-footer">Powerplants One · Priva Fertigation Scoping Workbench r01 · App ${APP_VERSION} · Schema ${SCHEMA_VERSION} · Project ${esc(state.project_id)}<br>Preserve this report with its corresponding JSON project. Embedded attachments are provided in the project file and are not reproduced in this print report.</div>`;
 document.getElementById('print-report').innerHTML=report;
 modal('Prepare scope report',`<p class="secondary">The report includes the active scenario, full capture register, diagrams, pump curve, unit comparisons, open checks and review status.</p><div class="mini-facts gap-top">${mini('Project revision','r'+state.revision)}${mini('Sizing blockers',findings.filter(f=>f.severity==='Blocker').length)}${mini('Review items',findings.filter(f=>f.severity==='Review').length)}</div><p class="footnote">Choose Print / Save PDF to use the browser print dialogue. The HTML report is an additional self-contained readable copy. Files embedded in evidence remain in the project JSON.</p>`,`<div>${btn('Download report HTML','download-report','','','download')}</div><div class="actions">${btn('Cancel','close-modal')}${btn('Print / Save PDF','print','','primary','print')}</div>`,true);
}
function about(){modal('Calculation basis & module information',`<div class="about-content"><p><strong>Priva Fertigation Scoping Workbench · r01</strong><br>Standalone guided form with planning, comparison and review views. Designed as the interior of a Powerplants One module.</p><p>Theme: supplied Powerplants One r22 style board, including embedded Roboto, navy / green tokens, cards, forms, tabs, tables and side inspectors. The global shell is omitted as requested.</p><details class="disclosure" open><summary>Supported calculation model</summary><div class="disclosure-body"><ul><li>Actual crop counts override density estimates. Blanks remain unknown.</li><li>Independent emitter flow, or a verified per-container flow, contributes to demand once. Hub outlet count does not multiply flow.</li><li>Groups are simultaneous valves. Scenarios are sequential groups on one shared circuit. Connected flow and operating peak are different outputs.</li><li>Stock injection = final delivered flow × entered stock dose. No automated chemistry or universal crop setpoints.</li><li>Pressure head uses 998.2 kg/m³ and 9.80665 m/s². Losses are entered engineering evidence, not automatically sized pipes.</li><li>Curve segments are interpolated; points beyond the supplied curve are unknown. Pump selection still needs configuration, suction, motor and hydraulic review.</li><li>Preparation / flush use full entered pump flow as a conservative assumption. Crop credit is limited to delivery and declared crop flush. Storage refill is continuous, overflow is tracked and negative inventory exposes shortage.</li><li>Repeated dry intervals are checked inside the scenario window. Overnight, arbitrary parallel circuits and sensor-triggered scheduling are not simulated.</li><li>Priva family envelopes are published context. Only entered exact configuration limits drive capability checks.</li></ul></div></details><details class="disclosure"><summary>Units & quick conversions</summary><div class="disclosure-body">${table(['Quantity','Conversion'],[['Flow','1 L/s = 3.6 m³/h'],['Conductivity','1 mS/cm = 1 dS/m = 1,000 µS/cm'],['Pressure','1 bar = 100 kPa'],['Applied water','1 mm over 1 ha = 10 m³'],['Radiation sum','1 MJ/m² = 100 J/cm²']].map(x=>tr(x.map(esc))))}</div></details><details class="disclosure"><summary>Module conformance & handover</summary><div class="disclosure-body"><p>Scope identity: Priva fertigation specialist scoping within the existing Fertigation equipment family; no new PPO module identifier allocated. Guided workflow with planning and comparison workspaces.</p><p>Incoming handover: project / sales brief, farm layouts, source analyses, equipment surveys and customer requirements. Outgoing handover: revisioned technical scope, evidence references, capacity checks, open actions, responsibility and commissioning schedules.</p><p>Interfaces to the parent PPO application are represented by portable JSON, CSV and reports. This file does not connect to controllers, live customer data, commercial approval or the application database.</p><p>Basis: build plan r01 (SHA-256 7eb6a7174ca4a4cc222dea73bb0c54bf4853dbab68b9abbe94b5d64ef1391a41); theme r22 (SHA-256 a305361c5d937296a8837e751f1a80ac7e6ca7615013705c7ad55ad794957df0). GitHub guidance inspected on 21 September 2026, main reference 460cf0b2655daa371cd35169b4a600e3c1af29b7.</p></div></details><details class="disclosure"><summary>Recovery, privacy & portability</summary><div class="disclosure-body"><p>All calculations run in this file. No external scripts, fonts, analytics or live data requests are required. Reference links open only when selected.</p><p>Browser storage is best effort. Save project downloads schema-versioned JSON with all records and supported evidence files. Keep the HTML and JSON together. A download-start message does not confirm a file has been saved to disk.</p><p>Imports are validated before replacing the working project. Local revisions and review acknowledgements are editable records, not authenticated audit signatures. Use the parent system for access control and formal approval.</p></div></details><details class="disclosure"><summary>Official product & engineering references</summary><div class="disclosure-body"><p>Research basis reviewed 21 September 2026. Published ranges may differ across versions; get current project-specific confirmation.</p><ol class="sources-list">${SOURCE_LINKS.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(name)}</a></li>`).join('')}</ol></div></details></div>`,btn('Close','close-modal'),true)}
function csvTools(){modal('Register CSV import & export',`<p class="secondary">Use the template headers and permanent record IDs when preparing register data. Imports update matching IDs and add new records after validation.</p><div class="form-field gap-top"><label for="csv-kind">Register</label><select id="csv-kind">${Object.entries(SCHEMAS).filter(([k,s])=>!s.singleton&&k!=='profiles').map(([k,s])=>`<option value="${k}">${s.title}</option>`).join('')}</select></div><p class="footnote">Reference columns use record IDs. Lists and allocations are JSON inside quoted CSV cells. Spreadsheet formula prefixes are escaped on export; an intentionally escaped leading apostrophe is retained on import. Embedded evidence files are carried in project JSON, not CSV.</p><div class="actions gap-top">${btn('Download populated CSV','csv-export','','','download')}${btn('Download template','csv-template','','','file')}${btn('Choose CSV to import','csv-import','','primary','upload')}</div><div id="csv-error" class="notice danger drawer-error gap-top" role="alert"></div>`,btn('Close','close-modal'),true)}
function csvCell(v){let str=typeof v==='object'&&v!==null?JSON.stringify(v):String(v??'');if(/^[\s]*[=+@-]/.test(str)&&!/^\s*-?\d+(\.\d+)?\s*$/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"'}
function exportCSV(kind,template=false){const fields=['id',...SCHEMAS[kind].fields.filter(f=>f.type!=='section').map(f=>f.key)];const unique=[...new Set(fields)];const rows=template?[]:state[kind];download('\ufeff'+[unique.map(csvCell).join(','),...rows.map(r=>unique.map(k=>csvCell(r[k])).join(','))].join('\r\n'),fileStem()+'-'+kind+(template?'-template':'')+'.csv','text/csv;charset=utf-8');toast('CSV download started.');}
function parseCSV(text){text=text.replace(/^\ufeff/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else if(!quoted&&cell.length)throw Error('Unexpected quote in CSV cell.');else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV contains an unclosed quote.');row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows;}
function csvCandidate(text,kind){const rows=parseCSV(text);if(rows.length<2)throw Error('The CSV needs a header and at least one data row.');const headers=rows.shift().map(x=>x.trim());if(new Set(headers).size!==headers.length)throw Error('Duplicate CSV column names.');const schema=SCHEMAS[kind],allowed=new Set(['id',...schema.fields.map(f=>f.key)]);if(headers.some(k=>!allowed.has(k)))throw Error('Unknown CSV column: '+headers.find(k=>!allowed.has(k)));if(!headers.includes('name'))throw Error('The CSV must include a name column.');const next=clone(state);let added=0,updated=0;for(const cells of rows){if(cells.length!==headers.length)throw Error('A CSV row has a different column count from the header.');const map=Object.fromEntries(headers.map((h,i)=>[h,cells[i]])),old=map.id?next[kind].find(r=>r.id===map.id):null,r=old?clone(old):emptyRecord(kind);if(map.id)r.id=map.id;for(const f of schema.fields){if(!(f.key in map))continue;let v=map[f.key];if(f.type==='number'){v=v.trim()===''?null:Number(v)}else if(['multi','allocations'].includes(f.type))v=v.trim()?JSON.parse(v):[];r[f.key]=v}if(!r.name)throw Error('Every row requires a name.');if(old){next[kind][next[kind].findIndex(x=>x.id===r.id)]=r;updated++}else{next[kind].push(r);added++}}validateProjectObject(next);return {next,added,updated,kind};}
function projectTools(){modal('Project tools',`<div class="grid two">${panel('Portable project',`<p class="small muted">Save all data and embedded evidence in a JSON project.</p><div class="actions gap-top">${btn('Save project','save','','small','download')}${btn('Open JSON','open','','small','upload')}</div>`)}${panel('Recovery',`<p class="small muted">Restore the previous edit or preserve a named project basis.</p><div class="actions gap-top">${btn('Undo','undo',undoStack.length?'':'disabled','small','undo')}${btn('Snapshot','snapshot','','small','copy')}</div>`)}${panel('Register exchange',`<p class="small muted">Use templates to capture blocks, valves and other registers.</p><div class="gap-top">${btn('CSV tools','csv-tools','','small','file')}</div>`)}${panel('Demonstration',`<p class="small muted">Explore a labelled berry-farm example with intentional scope gaps.</p><div class="gap-top">${btn('Load demonstration','demo','','small','layers')}</div>`)}</div><div class="gap-top">${btn('Calculation basis & module information','about','','quiet','info')}</div>`,btn('Close','close-modal'),true)}
function renderComparison(){modal('Configuration comparison',`${table(['Family','Exact variant','Entered flow range','Channels','Pressure range','Control support','Status','Budget basis'],state.profiles.map(p=>{const a=configuredAssessment(p);return tr([esc(p.name),esc(p.configuration||'Unverified'),fmt(p.minimum_m3h)+'–'+fmt(p.maximum_m3h)+' m³/h',fmt(p.channels,0),fmt(p.minimum_pressure_bar)+'–'+fmt(p.maximum_pressure_bar)+' bar',esc(p.control_verified||'Unknown'),tag(a.status,a.tone),known(p.budget)?fmt(p.budget,2)+' '+esc(p.currency)+'<span class="small">'+esc(p.cost_date||'Date unknown')+'</span>':'Not entered'])}))}<div class="gap-top">${notice('Option costs are user-entered supplier budget indications. Compare currency, date, inclusions and exclusions before using them in an estimate.')}</div>`,btn('Close','close-modal'),true)}
function snapshotDialog(){modal('Capture a project snapshot',`<p class="secondary">Retain the exact project data, evidence and calculated basis before further changes. Up to five snapshots are retained; project size is limited to 28 MB for portable handling.</p><div class="form-field gap-top"><label for="snapshot-name">Snapshot name</label><input id="snapshot-name" value="${esc('Scope basis · r'+state.revision)}" maxlength="140" required></div><div id="snapshot-error" class="notice danger drawer-error gap-top" role="alert"></div>`,`<span></span><div class="actions">${btn('Cancel','close-modal')}${btn('Capture snapshot','snapshot-save','','primary')}</div>`)}
function reviewDialog(){const blockers=findings.filter(f=>f.severity==='Blocker');if(blockers.length){modal('Sizing blockers remain',`<p class="secondary">Resolve ${blockers.length} blocker${blockers.length===1?'':'s'} before recording a readiness acknowledgement. You can still save the project, capture a snapshot and prepare a draft report with its open checks.</p>`,btn('Return to findings','close-modal'));return}modal('Record review of this revision',`<form id="review-form"><div class="form-grid"><div class="form-field"><label for="review-name">Reviewer name</label><input id="review-name" required></div><div class="form-field"><label for="review-role">Role / discipline</label><input id="review-role" required></div><div class="form-field wide"><label for="review-note">Review outcome and remaining conditions</label><textarea id="review-note" required></textarea></div><label class="check form-field wide"><input id="review-confirm" type="checkbox" required>I reviewed revision ${state.revision}, including the open items and calculation limits.</label></div><p class="footnote">This is a local record without authenticated identity. It does not grant supplier, agronomic or construction approval.</p><div class="actions gap-top"><button type="submit" class="btn primary">Record local review</button>${btn('Cancel','close-modal')}</div></form>`)}
function snapshotCompare(id){const s=state.snapshots.find(s=>s.id===id);if(!s)return;let prior;try{prior=derive(validateProjectObject(s.data))}catch(e){toast('Snapshot is invalid: '+e.message);return}const d=derived,metrics=[['Active area (ha)',prior.area,d.area],['Plants',prior.plants,d.plants],['Connected flow (m³/h)',prior.connected,d.connected],['Peak unit flow (m³/h)',prior.peak,d.peak],['Daily crop demand (m³)',prior.daily,d.daily],['Planned crop application (m³)',prior.schedule.crop_m3,d.schedule.crop_m3],['Pump head (m)',prior.head,d.head]];modal('Compare with '+esc(s.name),table(['Metric','Snapshot r'+s.revision,'Current r'+state.revision,'Change'],metrics.map(([label,a,b])=>tr([label,fmt(a,2),fmt(b,2),finite(a)&&finite(b)?(b-a>0?'+':'')+fmt(b-a,2):'Unknown'])))+table(['Register','Snapshot','Current'],Object.entries(SCHEMAS).filter(([k,v])=>!v.singleton).map(([k,v])=>tr([esc(v.title),s.data[k].length,state[k].length]))),btn('Close','close-modal'),true)}
function replaceWorkingProject(next,action){undoStack.push(clone(state));if(undoStack.length>12)undoStack.shift();state=next;state.activity.unshift({date:now(),action,revision:state.revision});storageConflict=false;ui.recovery_error='';ui.selected_block=null;persist();ui.tab='overview';render();}
async function readProjectFile(file){if(!file)return;if(file.size>32*1024*1024){toast('Project exceeds the 32 MB import limit.');return}try{const p=validateProjectObject(JSON.parse(await file.text()));pendingImport={type:'project',next:p};modal('Open project — review before replacing',`<p class="secondary">The file passed structural, unit-type and relationship validation. Opening it replaces the working view. Download the current project first if you need a separate portable copy.</p><div class="gap-top">${definitionList([['Project',esc(p.project.name)],['Reference',esc(p.project.reference||'Unassigned')],['Revision',fmt(p.revision,0)],['Blocks / irrigation valves',p.blocks.length+' / '+p.valves.length],['Data label',p.synthetic?'Synthetic demonstration':'Project scope data']])}</div>`,`<div>${btn('Save current project','save','','','download')}</div><div class="actions">${btn('Cancel','close-modal')}${btn('Open validated project','apply-import','','primary')}</div>`)}catch(e){modal('Project could not be opened',notice(esc(e.message),'danger'),btn('Close','close-modal'))}}
document.addEventListener('click',async event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;try{switch(a){
 case 'tab':ui.tab=b.dataset.tab;render();document.getElementById('tab-'+ui.tab).focus();break;
 case 'edit':openEditor(b.dataset.kind,b.dataset.id);break;
 case 'close-editor':if(editContext?.dirty)confirmDialog('Discard unsaved changes?','The saved project is unchanged. Discard the edits in this inspector?','discard-editor','Discard edits');else{document.getElementById('editor').close();editContext=null;lastFocus?.focus?.()}break;
 case 'discard-editor':closeModal();document.getElementById('editor').close();editContext=null;break;
 case 'close-modal':closeModal();break;
 case 'recovery-download':download(ui.recovery_raw,'fertigation-recovery-unvalidated.json','application/json');toast('Unvalidated recovery download started.');break;
 case 'recovery-replace':confirmDialog('Replace unreadable recovery data?','Save the preserved recovery data first if you need to inspect it later. This will replace the browser recovery entry with the current working project.','recovery-replace-confirm','Keep working project');break;
 case 'recovery-replace-confirm':ui.recovery_raw=null;ui.recovery_error='';persist();closeModal();render();break;
 case 'new':confirmDialog('Start a blank project?','This replaces the working view with an empty scope. Save the current project first to keep a portable copy. The previous view remains available through Undo.','new-confirm','Start blank project');break;
 case 'new-confirm':closeModal();replaceWorkingProject(blankProject(),'Started blank project');toast('Blank project ready. Begin with the project brief.');openEditor('project');break;
 case 'demo':confirmDialog('Load the demonstration?','This replaces the working view with labelled synthetic data. Save the current project if you need a portable copy.','demo-confirm','Load demonstration');break;
 case 'demo-confirm':closeModal();replaceWorkingProject(demoProject(),'Loaded synthetic demonstration');toast('Synthetic demonstration loaded.');break;
 case 'save':exportProject();break;
 case 'open':document.getElementById('json-file').click();break;
 case 'tools':projectTools();break;
 case 'about':about();break;

 case 'download-report':{const css=Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');const html='<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>'+esc(state.project.name)+' — scope report</title><style>'+css+'\n.print-report{display:block;max-width:1050px;margin:35px auto;padding:30px;background:white}.print-report h2{margin:24px 0 12px}.print-report h3{margin:16px 0 8px}.print-report .report-head{border-bottom:3px solid #62bb46;padding-bottom:16px;margin-bottom:20px}.print-report .report-meta{display:flex;justify-content:space-between;gap:20px;margin-top:10px}.print-report svg{max-width:100%;height:auto}.print-report p{margin:10px 0}.print-report .report-footer{font-size:11px;color:#667181;margin-top:30px}@media print{.print-report{padding:0;margin:0}}</style><body><main class="print-report">'+document.getElementById('print-report').innerHTML+'</main></body></html>';download(html,fileStem()+'-scope-r'+state.revision+'.html','text/html');toast('Scope report download started.');break;}

 case 'move-group':{const i=state.groups.findIndex(g=>g.id===b.dataset.id),j=i+Number(b.dataset.direction);if(j<0||j>=state.groups.length)break;commit('Changed operating-group sequence',()=>{[state.groups[i],state.groups[j]]=[state.groups[j],state.groups[i]];for(const s of state.scenarios)s.group_ids=state.groups.filter(g=>s.group_ids.includes(g.id)).map(g=>g.id)});break;}

 case 'view-attachment':{const e=state.evidence.find(e=>e.id===b.dataset.id);if(!e?.attachment)break;modal(esc(e.name),e.attachment.data.startsWith('data:image/')?`<img class="photo-large" src="${e.attachment.data}" alt="${esc(e.name)}">`:`<p>PDF evidence: ${esc(e.attachment.name)}</p><p class="footnote">Download the embedded original to open it in your PDF viewer.</p>`,`<div>${btn('Download original','download-attachment',`data-id="${e.id}"`,'','download')}</div><div class="actions">${btn('Remove file','remove-attachment',`data-id="${e.id}"`,'danger small','trash')}${btn('Close','close-modal')}</div>`,true);break;}
 case 'download-attachment':{const e=state.evidence.find(e=>e.id===b.dataset.id),[meta,base64]=e.attachment.data.split(','),bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));download(new Blob([bytes],{type:meta.slice(5).split(';')[0]}),e.attachment.name);break;}

 case 'snapshot-save':{const name=document.getElementById('snapshot-name').value.trim();if(!name){toast('Name the snapshot first.');break}if(state.snapshots.length>=5){toast('Five snapshots retained. Download a project archive before deleting an older snapshot.');break}const data=clone(state);data.snapshots=[];const snapshot={id:uid(),name,date:now(),revision:state.revision,data};if(new Blob([JSON.stringify(state),JSON.stringify(snapshot)]).size>28*1024*1024){const err=document.getElementById('snapshot-error');err.textContent='This snapshot would exceed the 28 MB portable size limit. Download the current project as your archive instead.';err.classList.add('visible');break}state.snapshots.push(snapshot);state.activity.unshift({date:now(),action:'Captured snapshot: '+name,revision:state.revision});persist();closeModal();render();toast('Snapshot retained at revision '+snapshot.revision);break;}

 case 'snapshot-restore-confirm':{const sn=state.snapshots.find(s=>s.id===b.dataset.id);if(!sn)break;const restored=validateProjectObject(clone(sn.data)),history=state.snapshots,rev=state.revision;closeModal();commit('Restored snapshot '+sn.name,()=>{state=restored;state.snapshots=history;state.revision=rev});break;}

document.addEventListener('submit',e=>{if(e.target.id==='record-form')saveRecord(e);if(e.target.id==='review-form'){e.preventDefault();if(findings.some(f=>f.severity==='Blocker')){toast('Resolve the current sizing blockers first.');return}state.review={name:document.getElementById('review-name').value.trim(),role:document.getElementById('review-role').value.trim(),note:document.getElementById('review-note').value.trim(),date:now(),revision:state.revision};state.activity.unshift({date:now(),action:'Recorded local review by '+state.review.name,revision:state.revision});persist();closeModal();render();toast('Local review recorded for revision '+state.revision);}});
document.addEventListener('input',e=>{if(e.target.closest('#record-form')&&editContext)editContext.dirty=true});
document.addEventListener('change',async e=>{if(e.target.closest('#record-form')&&editContext)editContext.dirty=true;switch(e.target.id){case 'scenario-picker':commit('Changed active operating scenario',()=>state.selected_scenario_id=e.target.value);break;case 'block-picker':ui.selected_block=e.target.value;render();break;case 'json-file':await readProjectFile(e.target.files[0]);e.target.value='';break;case 'csv-file':{const file=e.target.files[0];e.target.value='';if(!file)break;try{if(file.size>5*1024*1024)throw Error('CSV exceeds the 5 MB limit.');const r=csvCandidate(await file.text(),ui.csv_kind);pendingImport={type:'csv',...r};modal('Confirm validated CSV changes',`<p><strong>${r.added}</strong> new records and <strong>${r.updated}</strong> updated records in ${esc(SCHEMAS[r.kind].title)}.</p><p class="footnote">The proposed register passed ID, numeric and relationship validation. Existing records absent from this CSV are retained.</p>`,`<span></span><div class="actions">${btn('Cancel','close-modal')}${btn('Apply import','apply-import','','primary')}</div>`)}catch(err){modal('CSV import could not be prepared',notice(esc(err.message),'danger'),btn('Close','close-modal'))}break;}
 case 'attachment-file':{const file=e.target.files[0];e.target.value='';if(!file)break;try{if(!['image/png','image/jpeg','image/webp','application/pdf'].includes(file.type))throw Error('Use a PNG, JPEG, WebP image or PDF.');if(file.size>4*1024*1024)throw Error('This file exceeds 4 MB. Record it as an external reference or use a smaller file.');const existing=state.evidence.filter(x=>x.id!==ui.attachment_id).reduce((n,r)=>n+(r.attachment?.size||0),0);if(existing+file.size>16*1024*1024)throw Error('Embedded evidence would exceed the 16 MB total limit.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const id=ui.attachment_id;commit('Attached evidence: '+file.name,()=>{const r=state.evidence.find(r=>r.id===id);if(!r)throw Error('Evidence record no longer exists.');r.attachment={name:file.name,type:file.type,size:file.size,data,date:now()}});toast('Evidence embedded. Download the updated project JSON to retain it.')}catch(err){toast(err.message)}break;}}});
document.addEventListener('keydown',e=>{if(e.target.closest('#tabs')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let i=TABS.findIndex(t=>t[0]===ui.tab);i=e.key==='Home'?0:e.key==='End'?TABS.length-1:(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;ui.tab=TABS[i][0];render();document.getElementById('tab-'+ui.tab).focus()}if(e.target.matches('svg [role=button]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
