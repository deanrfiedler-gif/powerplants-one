    if (views.some(v => v[0] === action)) {navigate(action, action === 'queue' && !M.accessible(s, actor, selected) ? M.visible(s,actor)[0]?.id || '' : selected);return;}
    if (action === 'open-record') {navigate(actor === 'reader' ? 'publication' : 'draft', el.dataset.id, el.dataset.revision || '');return;}
    if (action === 'exact-revision') {navigate('history', selected, el.dataset.revision);return;}
    if (action === 'clear-filters') {query = '';savedView = 'All work';route();render();return;}
    if (action === 'new-intake') return modal('Capture new learning', field('Learning title','title','','text','required') + area('Original observation','observation','','required') + field('Exact origin reference','origin_id','','text','required') + field('Origin revision','origin_revision','r01') + select('Evidence source','source_id',s.sources.filter(x => x.classification === 'Internal technical').map(x => [x.id,`${x.ref} · ${x.revision}`]),'source-1-r02') + select('Accountable owner','owner',[['','Unassigned'],['author','SYN Alex · Author'],['reviewer','SYN Morgan · Reviewer']],'author') + select('Recorded context','context',F.CONTEXTS.map(c => [c.id,c.label]),'unknown') + field('Due date','due','','date'), 'Capture learning', d => {run('newIntake',d);view='queue';selectedRevision='';route();render();});
    if (action === 'edit-intake') return modal('Manage learning intake', select('Owner','owner',[['','Unassigned'],['author','SYN Alex · Author'],['reviewer','SYN Morgan · Reviewer']],i.owner) + select('Intake state','state',['New','Assigned','Needs information','Linked to draft'],i.state) + select('Recorded context','context',F.CONTEXTS.map(c => [c.id,c.label]),i.context.id) + field('Due date','due',i.due,'date') + area('Clarification requested','clarification',i.clarification) + area('Change reason','reason','','required') + '<div class="row">' + btn('close-intake','Close with disposition','close') + btn('duplicate-intake','Link duplicate','layers') + '</div>', 'Save intake', d => run('updateIntake',d));
    if (action === 'close-intake') return reasonDialog('Close learning intake','Retained disposition reason',d => run('closeIntake',d),note('Original contribution is retained','Closing intake does not delete an article or its decisions.'));
    if (action === 'duplicate-intake') return modal('Retain duplicate contribution',select('Receiving record','target',M.visible(s,actor).filter(a=>a.id!==selected).map(a=>[a.id,`${a.ref} · ${M.intake(s,a.id).title}`]),'')+area('Duplicate disposition reason','reason','','required'),'Record duplicate',d=>run('duplicate',d));
    if (action === 'create-draft') {run('createDraft');view='draft';route();render();return;}
    if (action === 'save-draft') {run('saveDraft',draftFields());return;}
    if (['add-section','move-section','remove-section'].includes(action)) {
      const data = draftFields(), n = Number(el.dataset.index);
      if (action === 'add-section') data.body.sections.push({id:'section-'+s.serial+'-'+data.body.sections.length,title:'New learning section',text:'',sources:[]});
      if (action === 'move-section') {const to=n+Number(el.dataset.direction);[data.body.sections[n],data.body.sections[to]]=[data.body.sections[to],data.body.sections[n]];}
      if (action === 'remove-section') return reasonDialog('Remove working section','Reason for removing this draft section',d=>{data.body.sections.splice(n,1);run('saveDraft',{body:data.body,change:d.reason});});
      data.change = action === 'add-section' ? 'Added a bounded learning section.' : 'Reordered retained section identities.';run('saveDraft',data);return;
    }
    if (action === 'submit') {
      if ($('#draft-form') && dirty) run('saveDraft',draftFields());
      const exact = current();return modal('Submit exact revision',note('Freeze this content for technical review',`${esc(M.label(exact))} retains its sources, applicability and audience. Corrections after a returned decision use a successor revision.`)+facts([['SHA-256',exact.digest]]),'Submit for review',()=>{run('submit');view='review';route();render();});
    }
    if (action === 'successor') return reasonDialog('Create corrected draft','Reason for a successor',d=>{run('successor',d);view='draft';route();render();},note('Earlier content remains exact','Technical approval and publication do not carry into the new working revision.'));
    if (action === 'edit-scope') return modal('Edit explicit applicability',note('Use a comma between allowed values','An empty dimension stays unknown; it never means every context.')+F.DIMENSIONS.map(([k,label])=>field(label,k,r.body.scope[k].join(', '))).join('')+area('Scope change reason','reason','','required'),'Save draft scope',d=>{const body=M.clone(r.body);for(const [k] of F.DIMENSIONS)body.scope[k]=[...new Set(d[k].split(',').map(x=>x.trim()).filter(Boolean))];run('saveDraft',{body,change:d.reason});});
    if (action === 'edit-sources') return modal('Select exact source versions',note('Required evidence must support each section','Removing a source clears its section mappings. Retarget each section in Article draft before submitting.')+s.sources.filter(x=>x.classification==='Internal technical'||['author','reviewer','publisher'].includes(actor)).map(x=>{const link=r.body.sources.find(c=>c.version_id===x.id);return `<div class="source-row"><label><input type="checkbox" name="source-${x.id}" ${link?'checked':''}> ${esc(x.ref)} ${esc(x.revision)} · ${esc(x.title)}</label><label><input type="checkbox" name="required-${x.id}" ${link?.required?'checked':''}> Required supporting evidence</label></div>`;}).join('')+area('Evidence change reason','reason','','required'),'Save exact sources',d=>{const body=M.clone(r.body);body.sources=s.sources.filter(x=>d['source-'+x.id]).map(x=>({version_id:x.id,required:!!d['required-'+x.id]}));for(const section of body.sections)section.sources=section.sources.filter(id=>body.sources.some(x=>x.version_id===id));run('saveDraft',{body,change:d.reason});});
    if (action === 'source') {const src=M.source(s,el.dataset.source),obs=s.observations[src?.id];if(!src||actor==='reader'||actor==='denied'||src.classification!=='Internal technical'&&!['author','reviewer','publisher'].includes(actor))throw new Error('Exact source unavailable in this scope.');snapshot('Exact supporting evidence',`<span class="ref">${esc(src.ref)} · ${esc(src.revision)}</span><h2>${esc(src.title)}</h2><div class="pills">${badge(obs.availability)}${badge(obs.current?'Current observation':'Source changed')}</div><p>${esc(obs.availability === 'Available' ? src.excerpt : 'Exact source content is unavailable. Metadata is retained for recovery.')}</p>${facts([['Section',src.section],['Reviewer',src.reviewer],['Reviewed',src.reviewed],['Expiry',src.expiry],['Classification',src.classification],['SHA-256',src.hash]])}${note('Retained source version',esc(obs.note))}`);return;}
    if (action === 'add-finding') return modal('Record technical finding',select('Reviewed section','section',[['applicability','Applicability'],...r.body.sections.map(x=>[x.id,x.title])],'applicability')+area('Finding and required correction','text','','required')+'<label><input type="checkbox" name="blocking" checked> Blocks technical acceptance</label>','Record finding',d=>run('addFinding',{...d,blocking:!!d.blocking}));
    if (action === 'respond') return modal('Respond to retained finding',note('Response is tied to the current content','Any later content edit requires a fresh response and reviewer acceptance.')+area('Correction and evidence','text','','required'),'Record response',d=>run('respond',{...d,finding_id:el.dataset.finding}));
    if (action === 'accept-response') return reasonDialog('Accept exact correction','Independent acceptance rationale',d=>run('acceptResponse',{...d,finding_id:el.dataset.finding}));
    if (action === 'review-decision') return modal('Record technical decision',select('Review outcome','outcome',['Accepted','Returned','Declined','Hypothesis retained'],'Accepted')+area('Decision rationale','reason','','required')+note('Technical decision only','The publisher separately checks publication readiness.'),'Record exact decision',d=>run('review',d));
    if (action === 'publish') return modal('Publish internally',note('Make this exact reviewed revision available',`${esc(M.label(r))} · Internal technical team. This local action does not issue an output, send a message or acknowledge reading.`)+'<label><input type="checkbox" name="interrupt"> Demonstrate interrupted outcome and reconciliation</label>','Publish exact revision',d=>run('publish',{interrupt:!!d.interrupt}));
    if (action === 'reconcile') return modal('Reconcile original publication',note('Resolve the retained original operation',esc(el.dataset.operation)+' is rechecked against its original content and current evidence.'),'Reconcile original result',()=>run('reconcile',{operation_id:el.dataset.operation}));
    if (action === 'withdraw') return reasonDialog('Withdraw internal publication','Withdrawal reason',d=>run('withdraw',d),note('Earlier use remains retained','Issued pack content and previous acknowledgements are unchanged. Prepare owned follow-up where needed.','warn'));
    if (action === 'expand-snapshot') {$('#snapshot').classList.toggle('reader-preview');el.textContent=$('#snapshot').classList.contains('reader-preview')?'Use compact inspection':'Expand inspection';return;}
    if (action === 'reader') {$('#snapshot').classList.add('reader-preview');snapshot('Article receiving preview',readerArticle(r,true));return;}
    if (action === 'citation') {const p=M.projection(s,r,actor,context()),text=`${p.id} ${p.revision} · ${p.title}\nSHA-256 ${p.digest}\n${p.classification} · ${p.publication} · ${p.applicability}\nSynthetic reference, evaluated ${s.clock}.`;modal('Exact article reference',area('Copy this reference','citation',text,'readonly'),null,null);return;}
    if (action === 'usage') {const u=s.usage.find(x=>x.id===el.dataset.usage);snapshot('Retained usage snapshot',facts([['Target',u.target],['Original revision',u.revision_id],['Original acknowledgement',u.acknowledged],['Original SHA-256',u.digest]])+`<pre>${esc(u.bytes)}</pre>`+note('Historical content remains exact','Withdrawal or new knowledge publication does not rewrite this pack.'));return;}
    if (action === 'impact' || action === 'output-handover' || action === 'review-followup') {const u=s.usage.find(x=>x.id===el.dataset.usage),review=action==='review-followup',target=u?.target||(review?'Knowledge author · source reassessment':'DK-03 · OUT-18 capability review'),origin=u?'usage-'+u.id:review?'source-review-'+(s.events.filter(e=>e.article_id===selected&&e.kind==='Source observation changed').at(-1)?.id||r.id):'OUT18-'+r.id;return modal('Prepare owned follow-up',note('Prepared locally only','No receiving domain is updated and no person is notified.')+field('Receiving target','target',target,'text','readonly')+field('Accountable receiving owner','owner',u?.owner||(review?'SYN Alex · Knowledge author':'Document coordinator'),'text','required')+field('Due date','due','','date')+area('Reason and required next action','reason',u?'Reassess this retained usage after the knowledge or evidence change.':review?'Reassess the exact article and its required source before any new use.':'Confirm the OUT-18 receiving capability and applicable template before any formal output.','required'),'Prepare follow-up',d=>run('followup',{...d,origin}));}
    if (action === 'dispose-feedback') return modal('Review feedback request',select('Disposition','outcome',['Under review','More information needed','Closed with reason','Linked to successor'],'Under review')+select('Successor if linked','target',[['','No linked successor'],...M.versions(s,selected).map(v=>[v.id,M.label(v)])],'')+area('Retained rationale','reason','','required'),'Record disposition',d=>run('disposeFeedback',{...d,feedback_id:el.dataset.feedback}));
    if (action === 'feedback') return modal('Record exact-revision feedback',select('Feedback type','kind',['Possible error','Context mismatch','Source changed','Improvement suggestion'],'Possible error')+select('Observed context','context',F.CONTEXTS.map(c=>[c.id,c.label]),contextId)+area('Observation and requested review','text','','required'),'Capture review request',d=>run('feedback',d));
    if (action === 'compare') {const prev=M.revision(s,r.predecessor);const keys=['title','summary','classification','scope','audience','sources','sections','review_due','expiry'];snapshot('Exact predecessor comparison',`<p>${M.label(prev)} → ${M.label(r)}. Only these retained snapshots are compared.</p>`+keys.map(k=>{const before=JSON.stringify(prev.body[k],null,2),after=JSON.stringify(r.body[k],null,2);return `<details ${before!==after?'open':''}><summary>${esc(k)} · ${before===after?'Unchanged':'Changed'}</summary><h4>Predecessor</h4><pre>${esc(before)}</pre><h4>Selected revision</h4><pre>${esc(after)}</pre></details>`;}).join(''));return;}
    if (action === 'guide' && actor === 'denied') return modal('Knowledge workspace help','<p>No record guidance is available in this preview scope. Choose a permitted preview identity to explore the synthetic workspace.</p>',null,null);
    if (action === 'guide') return modal('Explore the knowledge lifecycle',`<p>Start with <strong>Intermittent irrigation readings</strong> in the worklist.</p><ol><li>As Author, manage the intake and confirm the Tunnel 04 context.</li><li>Create a draft, inspect exact sources and submit.</li><li>As Reviewer, add a blocking finding and return the revision.</li><li>As Author, create a corrected draft, save the correction, respond and submit.</li><li>As Reviewer, accept the correction and record acceptance.</li><li>As Publisher, publish with the interrupted-outcome option, then reconcile.</li><li>Preview the reader article. Use Preview options to change the evidence observation.</li><li>Withdraw where appropriate and prepare owned follow-up for retained usage.</li></ol>${note('Additional starting points','Try the returned lesson, changed-source publication, interrupted publication, missing manual and policy-not-configured fixtures. All twelve situations are fictional.')}`,null,null);
    if (action === 'options') return modal('Preview options',note('Demonstration controls','These controls simulate observations and read results. They are not user permissions or operational commands.')+select('Read response','read_state',['Ready','Partial','Loading','Failed','Empty'],readState)+field('Evaluation date · Australia/Brisbane','clock',s.clock,'date')+select('First required source observation','source_state',['Leave unchanged','Available','Changed','Unavailable'],'Leave unchanged')+select('Known usage response','usage_state',['Leave unchanged','Complete','Partial'],'Leave unchanged')+`<label><input type="checkbox" name="save_failure" ${simulateSaveFailure?'checked':''}> Demonstrate the next local-save failure</label><div class="rule"></div>${btn('reset','Reset this demonstration','refresh')}`,'Apply preview options',d=>{if(dirty)throw new Error('Save or discard draft edits before applying preview options.');readState=d.read_state;simulateSaveFailure=!!d.save_failure;if(d.clock!==s.clock||d.source_state!=='Leave unchanged'||d.usage_state!=='Leave unchanged'){if(blocked())throw new Error('Resolve saved-state recovery first.');checkStoredBase();if(d.clock!==s.clock)s=M.scenario(s,'clock',selected,d.clock);if(d.source_state!=='Leave unchanged')s=M.scenario(s,'source',selected,d.source_state);if(d.usage_state!=='Leave unchanged')s=M.scenario(s,'usage',selected,d.usage_state);persist();}render();});
    if (action === 'retry-read') {readState='Ready';render();return;}
    if (action === 'retry-save') {simulateSaveFailure=false;persist();render();toast(failedSave?'Save still unavailable; in-tab work is retained.':'The original in-tab state is now saved.');return;}
    if (action === 'reload-saved') return modal('Load newer saved state',note('This replaces the in-tab working copy','Export your local review first if you need to retain it. Unsaved form edits will be discarded.','warn'),'Load saved version',()=>{const raw=localStorage.getItem(KEY),parsed=raw?JSON.parse(raw):M.initial();if(!M.validState(parsed))throw new Error('Saved version is invalid. Retained local work has not been replaced.');s=parsed;savedRaw=raw;failedSave=false;conflict=false;dirty=false;render();});
    if (action === 'recover-export') {download('PPO-DK-05-Retained-Recovery.txt',savedRaw||'No readable saved bytes.','text/plain');return;}
    if (action === 'reset') return modal('Reset this demonstration',note('Replace only the DK-05 local demonstration','All edits, decisions and follow-ups in this copy will be removed. Export the review first if needed.','warn'),'Reset DK-05',()=>{localStorage.removeItem(KEY);savedRaw=null;s=M.initial();dirty=false;corrupt=false;failedSave=false;conflict=false;simulateSaveFailure=false;actor='author';selected='a1';selectedRevision='';view='queue';readState='Ready';query='';savedView='All work';persist();route();render();});
    if (action === 'export') {exportReview();return;}
    throw new Error('This action is unavailable.');
  }
  document.addEventListener('click',event=>{
    const el=event.target.closest('button');if(!el||el.disabled)return;
    try {
      if(el.hasAttribute('data-close-dialog')){closeDialog();return;}
      if(el.hasAttribute('data-close-snapshot')){closeSnapshot();return;}
      if(el.dataset.view){navigate(el.dataset.view);return;}
      if(el.dataset.select){selected=el.dataset.select;selectedRevision='';route();render();return;}
      if(el.dataset.filter){savedView=el.dataset.filter;route();render();return;}
      if(el.dataset.action)act(el.dataset.action,el);
    }catch(e){if($('#dialog').open)$('#dialog-error').textContent=e.message;else alertError(e);}
  });
  $('#dialog-form').addEventListener('submit',event=>{event.preventDefault();try{dialogCallback?.(Object.fromEntries(new FormData(event.target)));closeDialog();}catch(e){$('#dialog-error').textContent=e.message;}});
  document.addEventListener('submit',event=>{if(event.target.id==='draft-form'){event.preventDefault();try{run('saveDraft',draftFields());}catch(e){alertError(e);}}});
  document.addEventListener('input',event=>{
    if(event.target.closest('#draft-form')){dirty=true;$('#draft-save-state').textContent='Unsaved edits in this tab';}
    if(event.target.id==='search'){const start=event.target.selectionStart;query=event.target.value;route(false);render();$('#search').focus();$('#search').setSelectionRange(start,start);}
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.id==='actor'){
      const next=el.value;const apply=()=>{actor=next;dirty=false;selectedRevision='';if(!M.accessible(s,actor,selected))selected=M.visible(s,actor)[0]?.id||'';if(actor==='reader')view='queue';savedView='All work';query='';route();render();};
      if(dirty){el.value=actor;modal('Change preview identity?',note('Unsaved draft fields will be discarded','Save first if you need to retain them.','warn'),'Discard edits and change identity',apply);}else apply();
    }else if(el.id==='saved-view'){savedView=el.value;route();render();}else if(el.id==='sort'){sort=el.value;render();}else if(el.id==='context-picker'){contextId=el.value;route();render();}else if(el.id==='revision-picker'){const next=el.value;el.value=current()?.id;navigate(view,selected,next);}
  });
  $('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  $('#snapshot').addEventListener('cancel',event=>{event.preventDefault();closeSnapshot();});
  $('#snapshot').addEventListener('close',()=>$('#snapshot').classList.remove('reader-preview'));
  addEventListener('storage',event=>{if(event.key===KEY&&event.newValue!==savedRaw){conflict=true;if(dirty){$('#save-notice').innerHTML=note('A newer saved version exists','Your unsaved fields remain in this tab. Export before loading the saved version. '+btn('export','Export local review','download')+' '+btn('reload-saved','Load saved version','refresh'),'warn');}else render();}});
  addEventListener('beforeunload',event=>{if(dirty||failedSave){event.preventDefault();event.returnValue='';}});
  addEventListener('popstate',()=>{if(dirty){const wanted=location.hash;route(false);modal('Open another retained view?',note('Unsaved edits will be discarded','Your saved draft remains available.'),'Discard and continue',()=>{dirty=false;history.replaceState(null,'',wanted);readRoute();render();});}else{readRoute();render();}});
  readRoute();render();
})();
</script>
