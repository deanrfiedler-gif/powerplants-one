html,body{margin:0;background:#f5f6f8}*{box-sizing:border-box}
#ppo-equipment{--navy:#242a37;--green:#62bb46;--paper:#f5f6f8;--surface:#f6f7f9;--hover:#f0f2f5;--ink:#242a37;--muted:#667181;--secondary:#596779;--line:#e1e5eb;--soft:#e9ecf1;--hairline:#cbd2dc;--control:#828e9f;--link:#355b80;--focus:#365d8b;--success:#416d33;--success-bg:#edf5e9;--warning:#80530e;--warning-bg:#fff2d9;--danger:#993b2a;--danger-bg:#fff1ed;--info:#346580;--info-bg:#e9f2f8;--shadow:0 16px 52px rgba(36,42,55,.17),0 2px 8px rgba(36,42,55,.06);font:14px/1.5 PPOBoardRoboto,Roboto,Verdana,sans-serif;color:var(--ink);min-height:100dvh}
#ppo-equipment :where(h1,h2,h3,p,ul,ol,dl,dd,figure){margin:0}#ppo-equipment :where(button,input,select,textarea){font:inherit;color:inherit}#ppo-equipment button{cursor:pointer}#ppo-equipment button:disabled{cursor:not-allowed;opacity:.5}#ppo-equipment a{color:var(--link)}#ppo-equipment [hidden]{display:none!important}#ppo-equipment :focus-visible{outline:3px solid var(--focus);outline-offset:3px}#ppo-equipment .icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}#ppo-equipment .small{font-size:12px;color:var(--secondary)}#ppo-equipment .muted{color:var(--muted)}#ppo-equipment .mono{font-variant-numeric:tabular-nums}#ppo-equipment .nowrap{white-space:nowrap}#ppo-equipment h1{font-size:26px;line-height:1.3;letter-spacing:-.35px;font-weight:700}#ppo-equipment h2{font-size:18px;line-height:1.4;font-weight:500}#ppo-equipment h3{font-size:14px;font-weight:500}#ppo-equipment strong{font-weight:500}#ppo-equipment .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#ppo-equipment .skip{position:fixed;left:90px;top:-60px;z-index:100;background:white;padding:12px}#ppo-equipment .skip:focus{top:10px}
#ppo-equipment .rail{position:fixed;inset:0 auto 0 0;width:76px;background:var(--navy);color:white;display:flex;align-items:center;flex-direction:column;z-index:30;padding:16px 0;gap:16px}#ppo-equipment .rail-mark{height:42px;display:flex;align-items:center;margin-bottom:9px}#ppo-equipment .rail-mark img{width:32px;height:32px}#ppo-equipment .rail button{border:0;background:transparent;color:white;width:52px;min-height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}#ppo-equipment .rail button .icon{width:27px;height:27px}#ppo-equipment .rail button:hover,#ppo-equipment .rail button[aria-current=page]{background:#3b4351}#ppo-equipment .rail button[aria-current=page]:before{content:'';position:absolute;left:-12px;top:12px;bottom:12px;width:4px;background:var(--green);border-radius:0 3px 3px 0}#ppo-equipment .rail .bottom{margin-top:auto}#ppo-equipment .rail button:focus-visible{outline-color:#a8d8ff}#ppo-equipment .app{margin-left:76px}#ppo-equipment .global{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 28px}#ppo-equipment .brand{font-size:16px;font-weight:700;white-space:nowrap}#ppo-equipment .crumb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--secondary);border-left:1px solid var(--line);padding-left:24px}#ppo-equipment .global-end{margin-left:auto;display:flex;gap:12px;align-items:center}#ppo-equipment .actor{border:0;background:transparent;font-size:12px;max-width:185px;min-height:40px}#ppo-equipment .avatar{display:inline-grid;place-items:center;flex:none;width:29px;height:29px;border-radius:50%;background:#e9edf2;color:#425267;font-size:11px;font-weight:500}#ppo-equipment .env{display:flex;gap:6px;align-items:center;color:var(--secondary);font-size:11px;white-space:nowrap}#ppo-equipment .env:before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%}#ppo-equipment main{padding:26px 28px 20px;max-width:1800px;margin:auto;min-width:0}#ppo-equipment .page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}#ppo-equipment .page-head p{font-size:13px;color:var(--secondary);margin-top:6px}#ppo-equipment .head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#ppo-equipment .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--hairline);border-radius:6px;padding:8px 13px;background:white;font-weight:500;font-size:13px;text-decoration:none;line-height:1.4}#ppo-equipment .button:hover{background:var(--hover)}#ppo-equipment .button.primary{background:var(--navy);border-color:var(--navy);color:white}#ppo-equipment .button.primary:hover{background:#3b4351}#ppo-equipment .button.subtle{background:transparent;border-color:transparent;color:var(--secondary)}#ppo-equipment .button.compact{padding:5px 9px;min-height:34px;font-size:12px}#ppo-equipment .icon-button{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid transparent;border-radius:6px;background:transparent;flex:none}#ppo-equipment .icon-button:hover{background:var(--hover)}#ppo-equipment .text-button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:3px 0;color:var(--link);font-weight:500;text-align:left}#ppo-equipment .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;background:#edf0f5;color:#526078;font-size:11px;font-weight:500;line-height:1.5;max-width:100%;white-space:normal}#ppo-equipment .badge .icon{width:13px;height:13px}#ppo-equipment .badge.success{background:var(--success-bg);color:var(--success)}#ppo-equipment .badge.warning{background:var(--warning-bg);color:var(--warning)}#ppo-equipment .badge.danger{background:var(--danger-bg);color:var(--danger)}#ppo-equipment .badge.info{background:var(--info-bg);color:var(--info)}#ppo-equipment .section-tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:23px;overflow-x:auto}#ppo-equipment .section-tabs button{display:flex;gap:7px;align-items:center;border:0;border-bottom:3px solid transparent;background:transparent;padding:12px 1px;color:var(--secondary);font-size:13px;white-space:nowrap;min-height:47px}#ppo-equipment .section-tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--green);font-weight:500}#ppo-equipment .section-tabs .count{font-size:11px;border-radius:4px;background:#e8ebf0;padding:1px 6px}
#ppo-equipment .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}#ppo-equipment .metric{background:white;border:1px solid var(--line);border-radius:7px;padding:17px 19px;display:flex;align-items:center;gap:15px}#ppo-equipment .metric .metric-icon{display:grid;place-items:center;width:40px;height:40px;background:var(--surface);border-radius:7px;color:var(--secondary)}#ppo-equipment .metric .metric-icon .icon{width:22px;height:22px}#ppo-equipment .metric strong{display:block;font-size:27px;line-height:1.2;font-variant-numeric:tabular-nums}#ppo-equipment .metric span{font-size:12px;color:var(--secondary)}#ppo-equipment .metric .metric-note{font-size:11px;color:var(--muted);margin-left:auto;max-width:110px;text-align:right}#ppo-equipment .visit-banner{display:flex;align-items:center;gap:17px;border:1px solid #cddaca;border-left:3px solid var(--green);background:#f3f7f1;border-radius:6px;padding:16px 18px;margin-bottom:20px}#ppo-equipment .visit-banner .visit-icon{display:grid;place-items:center;width:38px;height:38px;background:white;border:1px solid #dae4d5;border-radius:7px;flex:none;color:var(--success)}#ppo-equipment .visit-banner p{font-size:12px;color:var(--secondary);margin-top:4px}#ppo-equipment .visit-banner .button{margin-left:auto;flex:none}#ppo-equipment .panel{background:white;border:1px solid var(--line);border-radius:7px;overflow:hidden}#ppo-equipment .panel-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}#ppo-equipment .panel-head h2{font-size:15px}#ppo-equipment .panel-body{padding:20px}#ppo-equipment .toolbar{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}#ppo-equipment .search{position:relative;flex:1;min-width:180px;max-width:410px}#ppo-equipment .search input{border:1px solid var(--control);border-radius:6px;width:100%;height:40px;padding:8px 12px 8px 36px;font-size:13px;     {id:'e07',uuid:'11111111-1111-4111-8111-111111111107',ref:'SYN-PPO-AST-00107',name:'Legacy dosing unit',type:'Fertigation',customer:'Northbank Nursery',site:'Propagation site',area:'Stores / Retired equipment',model:'SYN Dose D10',serial:'SYN-D10-16009',identity:'Confirmed',condition:'Retired',installed:'11 May 2016',owner:'Alex Morgan',system:'Irrigation & nutrition',next:'Not applicable',note:'Replaced in June 2024. Prior service and document records remain available.'}
  ];
  const template = Object.freeze({id:'SYN-PPO-TPL-00012',revision:'r03',label:'Fertigation performance check',pressure:{min:4,max:5,unit:'bar'},ec:{min:1.8,max:2.2,unit:'mS/cm'},notice:'Fictional limits for design review only; not operating instructions.'});
  const makeDraft = (revision=1) => ({revision,pressure:'',ec:'',visual:'',notes:'',photo:null,photoCaption:'',instrument:'',identity:false,access:false,isolation:false,savedAt:null});
  const initial = () => ({schema:1,role:'technician',view:'register',selected:'e01',tab:'overview',filter:{q:'',customer:'',condition:'',sort:'name'},draft:makeDraft(),submissions:[],review:null,defect:null,followups:[],audit:[],visitConfirmed:false,aiDraft:null});
  const assert = (ok,msg) => {if(!ok) throw new Error(msg);};
  function validateState(s){
    assert(s && s.schema===1 && assets.some(a=>a.id===s.selected),'Saved design data is incompatible.');
    assert(['technician','reviewer'].includes(s.role),'Saved role is invalid.');
    assert(s.draft && Number.isInteger(s.draft.revision) && Array.isArray(s.submissions) && Array.isArray(s.followups) && Array.isArray(s.audit),'Saved design data is incomplete.');
    assert(s.submissions.every(x=>x.asset==='e01' && x.template===template.id && x.templateRevision===template.revision && x.readings && x.id),'Saved inspection evidence is incompatible.');
    return s;
  }
  function list(filters){
    const q=filters.q.trim().toLowerCase();
    return assets.filter(a=>(!q || [a.ref,a.name,a.customer,a.site,a.area,a.model,a.serial,a.system].join(' ').toLowerCase().includes(q)) && (!filters.customer || a.customer===filters.customer) && (!filters.condition || a.condition===filters.condition)).sort((a,b)=>String(a[filters.sort==='customer'?'customer':'name']).localeCompare(String(b[filters.sort==='customer'?'customer':'name'])));
  }
  function resolve(code){const value=code.trim().toLowerCase();return assets.filter(a=>[a.ref,a.serial,a.uuid].some(v=>v.toLowerCase()===value && v!=='Not confirmed'));}
  function outcome(value,range){if(value==='' || value===null || !/^\d+(?:\.\d{1,2})?$/.test(String(value)) || !Number.isFinite(Number(value)))return 'Missing';return Number(value)>=range.min && Number(value)<=range.max?'Within limits':'Outside limits';}
  function dateValid(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const d=new Date(value+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value;}
  function readiness(d){return [['identity','Confirm the physical equipment identity.'],['access','Confirm the approved crop-access window.'],['isolation','Review the approved isolation document.']].filter(([key])=>!d[key]).map(([,label])=>label).concat(d.instrument==='valid'?[]:['Choose an instrument with current calibration evidence.']);}
  function inspectionErrors(d){return readiness(d).concat(outcome(d.pressure,template.pressure)==='Missing'?['Enter delivery pressure using up to two decimal places and no negative values.']:[],outcome(d.ec,template.ec)==='Missing'?['Enter solution EC using up to two decimal places and no negative values.']:[],!['Satisfactory','Concern found'].includes(d.visual)?['Record the visual check.']:[],!d.notes.trim()?['Record the inspection finding.']:[],!d.photo?['Attach evidence or use the clearly labelled sample.']:[],!d.photoCaption.trim()?['Describe the attached evidence.']:[]);}
  function event(s,action,now){s.audit.push({action,actor:s.role==='technician'?'Alex Morgan · Technician':'Casey Reed · Reviewer',at:now});}
  function submit(state,now){
    const s=clone(state);assert(s.role==='technician','Only the technician can submit captured evidence.');
    assert(s.selected==='e01','This review scenario is assigned to Fertigation unit 01.');
    const original=s.submissions.find(x=>x.revision===s.draft.revision);if(original)return s;
    assert(!s.review || s.review.status!=='Reviewed','This inspection cycle has already been reviewed.');
    const errors=inspectionErrors(s.draft);assert(!errors.length,errors[0]);
    const d=s.draft,failed=outcome(d.pressure,template.pressure)==='Outside limits'||outcome(d.ec,template.ec)==='Outside limits'||d.visual==='Concern found';
    const id=`SYN-PPO-INSP-00018-r${String(d.revision).padStart(2,'0')}`;
    s.submissions.push({id,revision:d.revision,asset:'e01',assetRef:assets[0].ref,assetUuid:assets[0].uuid,site:assets[0].site,area:assets[0].area,configuration:'SYN-PPO-CFG-00101-r02',template:template.id,templateRevision:template.revision,limits:clone(template),instrument:'SYN-PPO-INS-00009 / CAL-r02',author:'Alex Morgan',at:now,readings:{pressure:Number(d.pressure),pressureUnit:'bar',ec:Number(d.ec),ecUnit:'mS/cm',visual:d.visual},notes:d.notes,photo:d.photo,photoCaption:d.photoCaption,failed});
    s.review={status:'Awaiting review',submission:id,note:'',at:null};s.reviewDraft={note:'',owner:'',due:'2026-09-16'};
    if(failed && !s.defect)s.defect={id:'SYN-PPO-DEF-00048',source:id,status:'Awaiting assignment',owner:'',due:'',reason:'',closure:null};
    else if(failed)s.defect.status='Retest failed';
    event(s,`Submitted inspection r${String(d.revision).padStart(2,'0')} with ${failed?'failed checks':'all checks within the fictional limits'}.`,now);return s;
  }
  function returnForRetest(state,{owner,due,reason},now){
    const s=clone(state);assert(s.role==='reviewer','Switch to the reviewer to allocate a retest.');
    assert(s.review?.status==='Awaiting review','Review the current submission first.');
    assert(s.defect && s.submissions.at(-1)?.failed,'A failed inspection is required.');
    assert(owner==='Alex Morgan' && dateValid(due) && reason.trim(),'Choose an owner, valid due date and reason.');
    assert(due>='2026-09-15','Use a retest date on or after the fictional visit date.');
    s.defect={...s.defect,owner,due,reason:reason.trim(),status:'Retest required'};
    s.review={...s.review,status:'Returned for retest',note:reason.trim(),at:now};event(s,'Assigned the defect and returned the inspection for retest.',now);return s;
  }
  function startRetest(state,now){
    const s=clone(state);assert(s.role==='technician','Switch to the technician to capture the retest.');
    if(s.defect?.status==='Retest in progress' && s.draft.revision>s.submissions.at(-1).revision)return s;
    assert(s.defect?.status==='Retest required','An owned retest must be assigned first.');
    s.draft=makeDraft(s.submissions.at(-1).revision+1);s.defect.status='Retest in progress';event(s,'Opened a new retest draft; previous submitted evidence retained.',now);return s;
  }
  function accept(state,note,now){
    const s=clone(state);assert(s.role==='reviewer','Only the reviewer can accept an inspection.');
    if(s.review?.status==='Reviewed')return s;
    assert(s.review?.status==='Awaiting review' && s.submissions.length,'A current submission is required.');
    assert(!s.submissions.at(-1).failed,'A failed check cannot be accepted as a passed inspection.');
    assert(note.trim(),'Record the review outcome.');
    s.review={...s.review,status:'Reviewed',note:note.trim(),at:now};
    if(s.defect)s.defect={...s.defect,status:'Closed after retest',closure:{submission:s.review.submission,note:note.trim(),at:now,reviewer:'Casey Reed'}};
    event(s,'Reviewed the exact inspection submission; unrelated defect 00047 remains open.',now);return s;
  }
  function followup(state,{asset,summary,owner,due},now){
    const s=clone(state);assert(assets.some(a=>a.id===asset),'Select equipment.');assert(summary.trim() && ['Alex Morgan','Sam Taylor','Jordan Lee'].includes(owner) && dateValid(due),'Enter the action, eligible owner and valid due date.');
    const prior=s.followups.find(x=>x.asset===asset && x.summary===summary.trim() && x.owner===owner && x.due===due);if(prior)return s;
    s.followups.push({id:`22222222-2222-4222-8222-${String(300+s.followups.length).padStart(12,'0')}`,label:`Follow-up ${s.followups.length+1}`,asset,summary:summary.trim(),owner,due,status:'Open',source:'Reviewed assistant draft',at:now});s.aiDraft=null;event(s,'Saved a reviewed follow-up in the local design.',now);return s;
  }
  return {assets,template,initial,validateState,list,resolve,outcome,readiness,inspectionErrors,submit,returnForRetest,startRetest,accept,followup,clone};
})();
</script>
<script id="equipment-interface">/* UI for the standalone r01 design. No network, model or production API calls. */
(() => {
  'use strict';
  const M=EquipmentModel,root=document.getElementById('ppo-equipment'),$=s=>root.querySelector(s),key='ppo-equipment-workspace-r01';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const typeIcon=a=>({'Fertigation':'pump','Climate control':'sliders','Pumping':'pump','Monitoring':'signal','Ventilation':'fan','Lighting':'sun'}[a.type]||'box');
  const button=(label,action,extra='',cls='')=>`<button type="button" class="button ${cls}" data-action="${action}" ${extra}>${label}</button>`;
  const tone=t=>/Needs|needed|Awaiting|Retest required|Returned/.test(t)?'warning':/Outside|Out of service|failed/.test(t)?'danger':/Reviewed|Within|Confirmed|Closed|In service/.test(t)?'success':'info';
  const badge=t=>`<span class="badge ${tone(t)}">${icon(/Needs|needed|Outside|failed/.test(t)?'alert':/Reviewed|Within|Confirmed|Closed/.test(t)?'check':'dot')}${esc(t)}</span>`;
  let s=M.initial(),persistent=true,loadWarning='',toastTimer,aiAsset=null,dialogOpener=null,mainFocus=false;
  try{const saved=localStorage.getItem(key);if(saved)s=M.validateState(JSON.parse(saved));}catch{persistent=false;loadWarning='Saved design data could not be loaded. This session starts with the sample records; the previous data has not been overwritten.';}
  const now=()=>new Date().toISOString();
  const when=iso=>new Date(iso).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short',timeZone:'Australia/Brisbane'})+' AEST';
  const asset=()=>M.assets.find(a=>a.id===s.selected)||M.assets[0];
  const safeDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(x)?new Date(x+'T00:00:00+10:00').toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric',timeZone:'Australia/Brisbane'}):x;
  function save(){try{if(!persistent)return false;localStorage.setItem(key,JSON.stringify(s));return true;}catch{persistent=false;loadWarning='Browser storage is unavailable or full. Changes are kept for this session only. Download the evidence before closing.';renderStorage();return false;}}
  function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4500);}
  function error(message){const box=$('#form-errors');if(box){box.hidden=false;box.innerHTML=esc(message);box.scrollIntoView({block:'nearest'});}else toast(message);}
  function commit(next,message){s=next;const stored=save();render();toast(message+(stored?' · Saved in this browser':' · Session only'));}
  function navigate(view,id,tab){if(id)s.selected=id;if(tab)s.tab=tab;s.view=view;$('#assistant').hidden=true;aiAsset=null;save();mainFocus=true;render();window.scrollTo({top:0,behavior:'instant'});}
  function showDialog(title,subtitle,body,foot='',drawer=true){dialogOpener=document.activeElement;const d=$('#dialog');d.className=drawer?'drawer':'';$('#dialog-title').textContent=title;$('#dialog-subtitle').textContent=subtitle;$('#dialog-body').innerHTML=body;$('#dialog-foot').innerHTML=foot||button('Close','close-dialog');if(!d.open)d.showModal();}
  function closeDialog(){$('#dialog').close();if(dialogOpener?.isConnected)dialogOpener.focus();}
  function renderStorage(){$('#storage-note').hidden=!loadWarning;$('#storage-note').textContent=loadWarning;}
  function render(){
    $('#actor').value=s.role;$('#avatar').textContent=s.role==='technician'?'AM':'CR';renderStorage();
    root.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===s.view || b.dataset.nav==='register' && s.view==='asset')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    $('#crumb-current').textContent=s.view==='register'?'Installed base':s.view==='asset'?asset().name:s.view==='queue'?'Inspections':'Inspection 00018';
    const body=s.view==='register'?register():s.view==='asset'?detail():s.view==='queue'?queue():inspection();
    $('#content').innerHTML=body;
    if(mainFocus){$('#content h1')?.focus();mainFocus=false;}
  }
  const footer=()=>`<footer class="footer"><span>All records are fictional · ${persistent?'Saved locally in this browser':'Session only'} · No external connections</span><button class="text-button" data-action="about">Design r01 ${icon('arrow-up-right')}</button><span>Australia/Brisbane · AEST</span></footer>`;
  const head=(title,desc,actions)=>`<div class="page-head"><div><h1 tabindex="-1">${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`;
  const navTabs=()=>`<nav class="section-tabs" aria-label="Equipment workspace"><button data-action="register" ${s.view==='register'?'aria-current="page"':''}>${icon('box')}Equipment register <span class="count">7</span></button><button data-action="queue" ${s.view==='queue'?'aria-current="page"':''}>${icon('clipboard')}Inspections <span class="count">1</span></button></nav>`;
  function register(){const list=M.list(s.filter);return `${head('Equipment & installed base','Know what is installed, where it belongs and what needs attention.',button(icon('sparkles')+' Ask AI','ai')+button(icon('scan')+' Identify equipment','scan','','primary'))}${navTabs()}
    <div class="metrics"><div class="metric"><div class="metric-icon">${icon('box')}</div><div><strong>7</strong><span>Equipment records</span></div><span class="metric-note">Across 3 customer sites</span></div><div class="metric"><div class="metric-icon">${icon('alert')}</div><div><strong>3</strong><span>Need attention</span></div><span class="metric-note">Condition or identity</span></div><div class="metric"><div class="metric-icon">${icon('clipboard')}</div><div><strong>${s.review?.status==='Reviewed'?'0':'1'}</strong><span>Inspection to complete</span></div><span class="metric-note">Fictional visit · 15 Sep</span></div></div>
    <div class="visit-banner"><div class="visit-icon">${icon('calendar')}</div><div><h3>${s.review?.status==='Reviewed'?'Inspection reviewed · original evidence retained':'Next visit · Fertigation performance check'}</h3><p>Northbank Nursery · Propagation site · 15 Sep 2026, 07:30–10:00 AEST</p></div>${button((s.review?.status==='Reviewed'?'View inspection':'Continue visit')+' '+icon('arrow-right'),'inspection','data-id="e01"')}</div>
    <section class="panel" aria-label="Equipment register"><div class="toolbar"><label class="search">${icon('search')}<span class="sr-only">Search equipment</span><input id="search" placeholder="Search equipment, serial, customer or site" value="${esc(s.filter.q)}" autocomplete="off"></label>${button(icon('filter')+' Filters'+(s.filter.customer||s.filter.condition?' · Active':''),'filters') }<label class="push"><span class="sr-only">Sort equipment</span><select id="sort" class="sort"><option value="name" ${s.filter.sort==='name'?'selected':''}>Equipment name</option><option value="customer" ${s.filter.sort==='customer'?'selected':''}>Customer</option></select></label><div class="chips">${s.filter.customer?`<button data-action="clear-customer">${esc(s.filter.customer)} ×</button>`:''}${s.filter.condition?`<button data-action="clear-condition">${esc(s.filter.condition)} ×</button>`:''}</div></div>
    <div id="register-results">${registerResults(list)}</div></section>${footer()}`;}
  function registerResults(list){return list.length?`<table class="equipment-table"><caption class="sr-only">Equipment records matching the current search and filters</caption><colgroup><col style="width:25%"><col style="width:21%"><col class="table-model" style="width:18%"><col style="width:16%"><col class="table-owner" style="width:12%"><col style="width:8%"></colgroup><thead><tr><th scope="col">Equipment</th><th scope="col">Customer / location</th><th scope="col" class="table-model">Model / serial</th><th scope="col">Condition</th><th scope="col" class="table-owner">Owner</th><th scope="col"><span class="sr-only">Open record</span></th></tr></thead><tbody>${list.map(a=>`<tr><td><div class="equipment-cell"><span class="equipment-symbol">${icon(typeIcon(a))}</span><div><button type="button" class="text-button" data-action="asset" data-id="${a.id}">${esc(a.name)}</button><small>${a.ref}</small></div></div></td><td>${esc(a.customer)}<small>${esc(a.site)}</small></td><td class="table-model">${esc(a.model)}<small>${esc(a.serial)}</small></td><td>${badge(a.condition)}</td><td class="table-owner"><span class="avatar" title="${esc(a.owner)}">${a.owner.split(' ').map(x=>x[0]).join('')}</span><small>${esc(a.owner)}</small></td><td><button class="icon-button" data-action="asset" data-id="${a.id}" aria-label="Open ${esc(a.name)}">${icon('chevron-right')}</button></td></tr>`).join('')}</tbody></table>
    <div class="mobile-list">${list.map(a=>`<article class="equipment-card"><div class="equipment-cell"><span class="equipment-symbol">${icon(typeIcon(a))}</span><div><button class="text-button" data-action="asset" data-id="${a.id}">${esc(a.name)}</button><small>${a.ref}</small></div></div><div class="card-facts"><div><small>Customer / site</small>${esc(a.customer)}<br><span class="muted">${esc(a.site)}</span></div><div><small>Model / serial</small>${esc(a.model)}<br><span class="muted">${esc(a.serial)}</span></div></div><div class="row between">${badge(a.condition)}<span class="small">${esc(a.owner)}</span></div></article>`).join('')}</div><div class="table-foot"><span role="status">${list.length} of 7 equipment records</span><span class="optional">Names, serial numbers and locations remain separate facts</span></div>`:`<div class="empty">${icon('search')}<h2>No equipment matches</h2><p>Try a different serial number, customer or condition.</p>${button('Clear search & filters','clear-filters')}</div>`;}
  function detail(){const a=asset(),tabs=[['overview','Overview'],['history','Service history'],['documents','Documents'],['configuration','Configuration & location']];return `<div class="backline"><button class="text-button small" data-action="register">${icon('arrow-left')}Equipment register</button><span class="small">${a.ref}</span></div><div class="page-head"><div class="asset-heading"><div class="equipment-symbol">${icon(typeIcon(a))}</div><div><div class="reference">${esc(a.type)} ${badge(a.identity)}</div><h1 tabindex="-1">${esc(a.name)}</h1><div class="asset-subline"><span>${esc(a.customer)}</span><span>·</span><span>${esc(a.site)}</span>${badge(a.condition)}</div></div></div><div class="head-actions">${button(icon('sparkles')+' Ask AI','ai')}${a.id==='e01'?button(icon('clipboard')+' Open inspection','inspection','data-id="e01"','primary'):button(icon('scan')+' Check identity','scan')}</div></div><nav class="section-tabs" aria-label="Equipment record sections">${tabs.map(([id,label])=>`<button data-action="asset-tab" data-tab="${id}" ${s.tab===id?'aria-current="page"':''}>${label}</button>`).join('')}</nav>${s.tab==='history'?history(a):s.tab==='documents'?documents(a):s.tab==='configuration'?configuration(a):overview(a)}${footer()}`;}
  function overview(a){return `<div class="detail-grid"><div class="stack"><section class="panel"><div class="panel-head"><h2>Equipment details</h2><span class="small">Current record</span></div><div class="panel-body"><dl class="facts">${[['Equipment reference',a.ref],['Serial number',a.serial],['Manufacturer / model',a.model+' · fictional product'],['System',a.system],['Installed',a.installed],['Record owner',a.owner],['Location',a.area],['Identity',a.identity]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div></section><section class="panel"><div class="panel-head"><h2>Current service context</h2>${a.id==='e01'?badge('Needs attention'):badge(a.condition)}</div><div class="panel-body"><div class="callout ${a.condition==='In service'?'':'warning'}">${icon(a.condition==='In service'?'info':'alert')}<div><strong>${esc(a.note)}</strong><p>${a.id==='e01'?'Previous cable replacement did not resolve the pressure variation. The OEM clarification remains open.':'The current record is the starting point for a scoped inspection, service visit or identification task.'}</p></div></div>${a.id==='e01'?`<div class="document-row"><div><h3>Confirm OEM pressure-control response</h3><p>SYN-PPO-DEF-00047 · Alex Morgan · Due 17 Sep 2026</p></div>${badge('Open')}</div>${s.defect?`<div class="document-row"><div><h3>Inspection follow-up</h3><p>${s.defect.id} · ${esc(s.defect.owner||'Reviewer to assign')}</p></div>${badge(s.defect.status)}</div>`:''}`:''}<div class="spaced">${button('View service history '+icon('arrow-right'),'asset-tab','data-tab="history"','','')}</div></div></section>${followups(a)}</div><aside class="stack"><section class="panel"><div class="panel-head"><h2>Where it belongs</h2>${icon('pin')}</div><div class="panel-body"><ul class="tree"><li>${icon('building')}${esc(a.customer)}</li><li>${icon('pin')}${esc(a.site)}</li><li>${icon('layers')}${esc(a.area.split(' / ')[0])}</li><li>${icon(typeIcon(a))}${esc(a.name)}</li></ul><hr class="divider"><p class="small">Work location is distinct from the billing account. Historical work retains the location recorded at the time.</p></div></section><section class="panel"><div class="panel-head"><h2>Lifecycle</h2>${icon('clock')}</div><div class="panel-body"><dl class="facts"><div><dt>Operating condition</dt><dd>${esc(a.condition)}</dd></div><div><dt>Next planned visit</dt><dd>${esc(a.next)}</dd></div><div><dt>Warranty evidence</dt><dd>Not confirmed</dd></div><div><dt>Service agreement</dt><dd>Coverage review needed</dd></div></dl><p class="small spaced">Dates alone do not establish warranty entitlement or service coverage.</p></div></section><section class="panel"><div class="panel-head"><h2>Record assistance</h2>${icon('sparkles')}</div><div class="panel-body"><p class="small">Summarise this equipment’s history, inspect the source records and prepare an owned follow-up.</p><div class="spaced">${button('Summarise history','ai')}</div></div></section></aside></div>`;}
  function followups(a){const rows=s.followups.filter(x=>x.asset===a.id);return rows.length?`<section class="panel"><div class="panel-head"><h2>Owned follow-ups</h2><span class="count">${rows.length}</span></div><div class="panel-body">${rows.map(x=>`<div class="document-row"><div><h3>${esc(x.summary)}</h3><p>${esc(x.label)} · ${esc(x.owner)} · ${safeDate(x.due)}</p></div>${badge(x.status)}</div>`).join('')}</div></section>`:'';}

    else{title=isMain?'Service report extract · r02':'Equipment history extract';body=isMain?`<dl class="facts"><div><dt>Report</dt><dd>SYN-PPO-SR-00062</dd></div><div><dt>Occurred</dt><dd>09 Sep 2026</dd></div><div><dt>Author</dt><dd>Alex Morgan</dd></div><div><dt>Review</dt><dd>Casey Reed · r02</dd></div></dl><hr class="divider"><h3>Finding</h3><p class="small spaced">Intermittent delivery-pressure variation remained after a cable replacement. The cause was not established.</p><h3 class="spaced">Owned next action</h3><p class="small spaced">Alex Morgan to obtain OEM clarification by 17 Sep 2026. SYN-PPO-DEF-00047 remains open.</p>`:`<h3>${esc(a.name)}</h3><p class="small spaced">${esc(a.note)}</p><p class="small spaced">Identity: ${esc(a.identity)} · Current condition: ${esc(a.condition)}</p>`;}
    showDialog(title,`${a.ref} · Embedded synthetic source`,body,button('Close source','close-dialog'));}
  function ai(){aiAsset=s.selected;const a=asset();$('#assistant').hidden=false;$('#assistant-context').innerHTML=`<strong>${esc(a.name)}</strong>${a.ref} · ${esc(a.site)}`;$('#assistant-body').innerHTML=`<div class="chat-message user">Summarise this equipment’s history and what needs attention.</div><div class="chat-label">${icon('sparkles')}PPO Assistant · Scripted design preview</div><div class="chat-message"><strong>${esc(a.name)}</strong>${a.id==='e01'?`<ul><li>Pressure variation remained after the 09 September visit. The cause is unconfirmed. <strong>[1]</strong></li><li>The current installation is recorded in configuration r02. <strong>[2]</strong></li><li>Alex Morgan owns the OEM clarification, due 17 September. That issue remains open. <strong>[1]</strong></li></ul><p class="small spaced">${s.review?.status==='Reviewed'?'This local design also holds a reviewed inspection. It has not closed the separate OEM issue.':'The scheduled inspection has its own preparation, capture and review steps.'}</p>`:`<p class="spaced">${esc(a.note)} <strong>[1]</strong></p><p class="spaced">The record identifies ${esc(a.model)} at ${esc(a.area)}. ${a.identity==='Confirmed'?'':'Physical identity needs clarification before equipment-specific work.'} <strong>[2]</strong></p>`}<div class="source-links"><button data-action="source" data-source="history">[1] ${a.id==='e01'?'Report r02':'History'}</button><button data-action="source" data-source="configuration">[2] ${a.id==='e01'?'Configuration r02':'Record'}</button></div></div><div class="assistant-actions">${button('Draft follow-up','draft-followup','','compact')}${button('Open record','ai-open-record','','compact')}</div><div id="ai-draft"></div>`;if(s.aiDraft?.asset===aiAsset)renderAIDraft();$('#assistant-close').focus();}
  function renderAIDraft(){const d=s.aiDraft;$('#ai-draft').innerHTML=`<section class="evidence-card"><div class="row between"><h3>Review follow-up</h3>${badge('Draft')}</div><p>No action is created until you review and save.</p><label class="field spaced"><span>Action</span><textarea id="ai-summary" maxlength="2000">${esc(d.summary)}</textarea></label><div class="form-grid spaced"><label class="field"><span>Owner</span><select id="ai-owner"><option ${d.owner==='Alex Morgan'?'selected':''}>Alex Morgan</option><option ${d.owner==='Sam Taylor'?'selected':''}>Sam Taylor</option><option ${d.owner==='Jordan Lee'?'selected':''}>Jordan Lee</option></select></label><label class="field"><span>Due date</span><input type="date" id="ai-due" value="${esc(d.due)}"></label></div><div class="spaced">${button('Save reviewed follow-up','save-followup','','primary')}</div></section>`;}
  function samplePhoto(){const pressure=s.draft.pressure||'—',ec=s.draft.ec||'—';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#edf1f4"/><rect x="160" y="52" width="580" height="306" rx="18" fill="#242a37"/><rect x="190" y="85" width="520" height="200" rx="8" fill="#dae7d7"/><text x="220" y="124" fill="#42533d" font-size="18" font-family="sans-serif">SYNTHETIC TEST KIT · ILLUSTRATION</text><text x="220" y="185" fill="#242a37" font-size="42" font-family="sans-serif">${esc(pressure)} bar</text><text x="220" y="244" fill="#242a37" font-size="32" font-family="sans-serif">${esc(ec)} mS/cm</text><text x="210" y="329" fill="white" font-size="18" font-family="sans-serif">SYN-PPO-INS-00009 · Example evidence</text><text x="230" y="399" fill="#596779" font-size="16" font-family="sans-serif">Illustrative sample — not a photograph or live reading</text></svg>`;s.draft.photo='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);s.draft.photoCaption='Illustrative sample of the entered readings; not a photograph or live measurement.';s.draft.savedAt=now();save();render();}
  function about(){showDialog('Equipment workspace · Design r01','Powerplants One · 14 September 2026',`<div class="stack"><p class="small">A connected synthetic equipment → preparation → inspection → defect → retest journey, with exact original evidence and contextual assistance.</p><div class="callout">${icon('info')}<div><strong>Try the complete journey</strong><p>Continue visit → confirm all preparation checks → select the current instrument → enter 5.60 bar and 2.00 mS/cm → record a finding and sample evidence → submit → switch to Casey Reed → assign a retest → switch to Alex Morgan → capture a new revision at 4.60 bar → switch to Casey Reed → review.</p></div></div><h3>What this file demonstrates</h3><p class="small">Seven equipment records, search and filters, exact-match identification, location/configuration history, immutable submitted inspection snapshots, one owned defect, reviewed retest, local photo evidence and a scripted AI summary with sources.</p><h3>Reference & verification</h3><p class="small">The supplied theme file internally identifies r16. Embedded fonts and brand colours are retained. The attachment label r18 could not be verified from the supplied bytes. Desktop/mobile CSS is included; browser rendering, camera operation and native focus behaviour require visual review.</p><h3>Local design only</h3><p class="small">The role picker illustrates workflow responsibilities, not real authentication. Data stays in this browser where storage permits. There is no live AI, ERP, SharePoint, server synchronisation, offline queue, document issue or customer communication.</p><div class="row">${button('Download current evidence','export')}${button('Reset this design','reset-prompt')}</div></div>`,button('Close','close-dialog'));}
  function download(){const payload={design:'PPO-Equipment-and-Installed-Base-Workspace-r01',synthetic:true,exportedAt:now(),template:M.template,equipment:M.assets.find(a=>a.id==='e01'),submissions:s.submissions,review:s.review,defect:s.defect,existingDefect:{id:'SYN-PPO-DEF-00047',status:'Open',owner:'Alex Morgan'},followups:s.followups,audit:s.audit,draft:s.draft};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='SYN-PPO-Equipment-Inspection-Evidence-r01.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Evidence download prepared.');}
  root.addEventListener('click',evt=>{const b=evt.target.closest('[data-action]');if(!b || b.disabled)return;const act=b.dataset.action;try{
    if(act==='register')navigate('register');
    else if(act==='queue')navigate('queue');
    else if(act==='asset')navigate('asset',b.dataset.id,'overview');
    else if(act==='asset-tab')navigate('asset',s.selected,b.dataset.tab);
    else if(act==='history')navigate('asset','e01','history');
    else if(act==='inspection')navigate('inspection',b.dataset.id||'e01');
    else if(act==='filters')filters();
    else if(act==='apply-filters'){s.filter.customer=$('#filter-customer').value;s.filter.condition=$('#filter-condition').value;closeDialog();save();render();}
    else if(act==='reset-dialog-filters'){$('#filter-customer').value='';$('#filter-condition').value='';}
    else if(act==='clear-customer'||act==='clear-condition'){s.filter[act==='clear-customer'?'customer':'condition']='';save();render();}
    else if(act==='clear-filters'){s.filter={q:'',customer:'',condition:'',sort:'name'};save();render();}
    else if(act==='scan')scan();
    else if(act==='sample-scan'){$('#scan-code').value='SYN-PPO-AST-00101';resolveScan();}
    else if(act==='resolve-scan')resolveScan();
    else if(act==='confirm-scan'){closeDialog();navigate('asset',b.dataset.id,'overview');toast('Equipment record confirmed for review.');}
    else if(act==='close-dialog')closeDialog();
    else if(act==='source')source(b.dataset.source);
    else if(act==='begin'){if(s.role!=='technician')throw new Error('Switch to Alex Morgan to capture the inspection.');const problems=M.readiness(s.draft);if(problems.length)throw new Error(problems.join(' '));s.visitConfirmed=true;s.draft.savedAt=now();save();render();}
    else if(act==='edit-preparation'){s.visitConfirmed=false;save();render();}
    else if(act==='sample-photo'){if(s.role!=='technician')throw new Error('Only the technician can edit draft evidence.');samplePhoto();}
    else if(act==='remove-photo'){if(s.role!=='technician')throw new Error('Only the technician can edit draft evidence.');s.draft.photo=null;s.draft.photoCaption='';save();render();}
    else if(act==='submit')commit(M.submit(s,now()),'Inspection submitted for review');
    else if(act==='request-retest')commit(M.returnForRetest(s,{owner:$('#retest-owner').value,due:$('#retest-due').value,reason:$('#review-note').value},now()),'Defect assigned; retest requested');
    else if(act==='start-retest'){const next=M.startRetest(s,now());next.visitConfirmed=false;commit(next,'New retest revision opened');}
    else if(act==='accept')commit(M.accept(s,$('#review-note').value,now()),'Inspection reviewed');
    else if(act==='ai')ai();
    else if(act==='close-ai'){$('#assistant').hidden=true;root.querySelector('[data-action="ai"]')?.focus();}
    else if(act==='ai-open-record'){const id=aiAsset;navigate('asset',id,'overview');}
    else if(act==='draft-followup'){const a=M.assets.find(x=>x.id===aiAsset);s.aiDraft={asset:aiAsset,summary:a.id==='e01'?'Review the inspection evidence with the OEM and record the outstanding pressure-control clarification.':`Review the ${a.identity==='Confirmed'?'current service context':'equipment identity'} for ${a.name}.`,owner:a.owner,due:'2026-09-17'};save();renderAIDraft();}
    else if(act==='save-followup'){const id=aiAsset;s=M.followup(s,{asset:id,summary:$('#ai-summary').value,owner:$('#ai-owner').value,due:$('#ai-due').value},now());save();$('#assistant').hidden=true;aiAsset=null;s.view='asset';s.selected=id;s.tab='overview';render();toast('Reviewed follow-up saved locally.');}
    else if(act==='about')about();
    else if(act==='export')download();
    else if(act==='reset-prompt')showDialog('Reset the sample journey?','Only this standalone design’s local records will be reset.',`<p class="small">This removes local drafts, uploaded evidence, submissions and follow-ups from this design. Download the evidence first if you want to keep it.</p>`,button('Keep current design','close-dialog')+button('Reset sample journey','reset-confirm','','primary'),false);
    else if(act==='reset-confirm'){localStorage.removeItem(key);s=M.initial();persistent=true;loadWarning='';save();closeDialog();render();toast('Sample journey reset.');}
  }catch(err){error(err.message);}});
  function updateDraft(target){if(s.role!=='technician'){toast('This role can review submitted evidence. Switch to Alex Morgan to edit the draft.');render();return;}const prop=target.dataset.draft;if(s.submissions.some(x=>x.revision===s.draft.revision)){error('Submitted evidence is read-only.');return;}s.draft[prop]=target.type==='checkbox'?target.checked:target.value;s.draft.savedAt=now();save();if(prop==='pressure')$('#pressure-state').innerHTML=readingState(s.draft.pressure,M.template.pressure);if(prop==='ec')$('#ec-state').innerHTML=readingState(s.draft.ec,M.template.ec);if($('#draft-save-status'))$('#draft-save-status').textContent=persistent?'Draft saved in this browser':'Draft kept for this session only';}
  root.addEventListener('input',evt=>{const t=evt.target;if(t.id==='search'){s.filter.q=t.value;save();$('#register-results').innerHTML=registerResults(M.list(s.filter));}else if(t.dataset.draft && !['checkbox','select-one'].includes(t.type))updateDraft(t);else if(['review-note','retest-owner','retest-due'].includes(t.id)&&s.role==='reviewer'){s.reviewDraft={note:$('#review-note')?.value||'',owner:$('#retest-owner')?.value||'',due:$('#retest-due')?.value||'2026-09-16'};save();}else if(['ai-summary','ai-owner','ai-due'].includes(t.id)&&s.aiDraft){s.aiDraft={...s.aiDraft,summary:$('#ai-summary').value,owner:$('#ai-owner').value,due:$('#ai-due').value};save();}});
  root.addEventListener('change',async evt=>{const t=evt.target;if(t.id==='actor'){s.role=t.value;save();render();toast(s.role==='reviewer'?'Reviewing as Casey Reed · simulated role':'Capturing as Alex Morgan · simulated role');}else if(t.id==='sort'){s.filter.sort=t.value;save();$('#register-results').innerHTML=registerResults(M.list(s.filter));}else if(t.dataset.draft&&['checkbox','select-one'].includes(t.type))updateDraft(t);else if(['review-note','retest-owner','retest-due'].includes(t.id)&&s.role==='reviewer'){s.reviewDraft={note:$('#review-note')?.value||'',owner:$('#retest-owner')?.value||'',due:$('#retest-due')?.value||'2026-09-16'};save();}else if(t.id==='photo-file'){const file=t.files?.[0];if(!file)return;if(s.role!=='technician'){error('Only the technician can attach draft evidence.');return;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>1024*1024){error('Use a JPEG, PNG or WebP image no larger than 1 MB.');t.value='';return;}const targetRevision=s.draft.revision;const reader=new FileReader();reader.onload=()=>{if(s.role!=='technician'||s.draft.revision!==targetRevision||s.submissions.some(x=>x.revision===targetRevision)){toast('The draft changed while the file was being read. Attach it again to the intended draft.');return;}s.draft.photo=String(reader.result);s.draft.photoCaption=file.name;s.draft.savedAt=now();save();render();toast('Draft evidence attached locally.');};reader.onerror=()=>error('The image could not be read. Your draft is unchanged.');reader.readAsDataURL(file);}});
  root.addEventListener('keydown',evt=>{if(evt.key==='Escape'&&!$('#assistant').hidden&&!$('#dialog').open){$('#assistant').hidden=true;root.querySelector('[data-action="ai"]')?.focus();}if(evt.key==='Enter'&&evt.target.id==='scan-code'){evt.preventDefault();resolveScan();}});
  $('#dialog').addEventListener('close',()=>{if(dialogOpener?.isConnected)dialogOpener.focus();});
  render();
})();
</script>
