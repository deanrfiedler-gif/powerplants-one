html,body{margin:0;background:#f5f6f8}*{box-sizing:border-box}
#ppo-equipment{--navy:#242a37;--green:#62bb46;--paper:#f5f6f8;--surface:#f6f7f9;--hover:#f0f2f5;--ink:#242a37;--muted:#667181;--secondary:#596779;--line:#e1e5eb;--soft:#e9ecf1;--hairline:#cbd2dc;--control:#828e9f;--link:#355b80;--focus:#365d8b;--success:#416d33;--success-bg:#edf5e9;--warning:#80530e;--warning-bg:#fff2d9;--danger:#993b2a;--danger-bg:#fff1ed;--info:#346580;--info-bg:#e9f2f8;--shadow:0 16px 52px rgba(36,42,55,.17),0 2px 8px rgba(36,42,55,.06);font:14px/1.5 PPOBoardRoboto,Roboto,Verdana,sans-serif;color:var(--ink);min-height:100dvh}
#ppo-equipment :where(h1,h2,h3,p,ul,ol,dl,dd,figure){margin:0}#ppo-equipment :where(button,input,select,textarea){font:inherit;color:inherit}#ppo-equipment button{cursor:pointer}#ppo-equipment button:disabled{cursor:not-allowed;opacity:.5}#ppo-equipment a{color:var(--link)}#ppo-equipment [hidden]{display:none!important}#ppo-equipment :focus-visible{outline:3px solid var(--focus);outline-offset:3px}#ppo-equipment .icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}#ppo-equipment .small{font-size:12px;color:var(--secondary)}#ppo-equipment .muted{color:var(--muted)}#ppo-equipment .mono{font-variant-numeric:tabular-nums}#ppo-equipment .nowrap{white-space:nowrap}#ppo-equipment h1{font-size:26px;line-height:1.3;letter-spacing:-.35px;font-weight:700}#ppo-equipment h2{font-size:18px;line-height:1.4;font-weight:500}#ppo-equipment h3{font-size:14px;font-weight:500}#ppo-equipment strong{font-weight:500}#ppo-equipment .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#ppo-equipment .skip{position:fixed;left:90px;top:-60px;z-index:100;background:white;padding:12px}#ppo-equipment .skip:focus{top:10px}
#ppo-equipment .rail{position:fixed;inset:0 auto 0 0;width:76px;background:var(--navy);color:white;display:flex;align-items:center;flex-direction:column;z-index:30;padding:16px 0;gap:16px}#ppo-equipment .rail-mark{height:42px;display:flex;align-items:center;margin-bottom:9px}#ppo-equipment .rail-mark img{width:32px;height:32px}#ppo-equipment .rail button{border:0;background:transparent;color:white;width:52px;min-height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}#ppo-equipment .rail button .icon{width:27px;height:27px}#ppo-equipment .rail button:hover,#ppo-equipment .rail button[aria-current=page]{background:#3b4351}#ppo-equipment .rail button[aria-current=page]:before{content:'';position:absolute;left:-12px;top:12px;bottom:12px;width:4px;background:var(--green);border-radius:0 3px 3px 0}#ppo-equipment .rail .bottom{margin-top:auto}#ppo-equipment .rail button:focus-visible{outline-color:#a8d8ff}#ppo-equipment .app{margin-left:76px}#ppo-equipment .global{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 28px}#ppo-equipment .brand{font-size:16px;font-weight:700;white-space:nowrap}#ppo-equipment .crumb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--secondary);border-left:1px solid var(--line);padding-left:24px}#ppo-equipment .global-end{margin-left:auto;display:flex;gap:12px;align-items:center}#ppo-equipment .actor{border:0;background:transparent;font-size:12px;max-width:185px;min-height:40px}#ppo-equipment .avatar{display:inline-grid;place-items:center;flex:none;width:29px;height:29px;border-radius:50%;background:#e9edf2;color:#425267;font-size:11px;font-weight:500}#ppo-equipment .env{display:flex;gap:6px;align-items:center;color:var(--secondary);font-size:11px;white-space:nowrap}#ppo-equipment .env:before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%}#ppo-equipment main{padding:26px 28px 20px;max-width:1800px;margin:auto;min-width:0}#ppo-equipment .page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}#ppo-equipment .page-head p{font-size:13px;color:var(--secondary);margin-top:6px}#ppo-equipment .head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#ppo-equipment .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--hairline);border-radius:6px;padding:8px 13px;background:white;font-weight:500;font-size:13px;text-decoration:none;line-height:1.4}#ppo-equipment .button:hover{background:var(--hover)}#ppo-equipment .button.primary{background:var(--navy);border-color:var(--navy);color:white}#ppo-equipment .button.primary:hover{background:#3b4351}#ppo-equipment .button.subtle{background:transparent;border-color:transparent;color:var(--secondary)}#ppo-equipment .button.compact{padding:5px 9px;min-height:34px;font-size:12px}#ppo-equipment .icon-button{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid transparent;border-radius:6px;background:transparent;flex:none}#ppo-equipment .icon-button:hover{background:var(--hover)}#ppo-equipment .text-button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:3px 0;color:var(--link);font-weight:500;text-align:left}#ppo-equipment .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;background:#edf0f5;color:#526078;font-size:11px;font-weight:500;line-height:1.5;max-width:100%;white-space:normal}#ppo-equipment .badge .icon{width:13px;height:13px}#ppo-equipment .badge.success{background:var(--success-bg);color:var(--success)}#ppo-equipment .badge.warning{background:var(--warning-bg);color:var(--warning)}#ppo-equipment .badge.danger{background:var(--danger-bg);color:var(--danger)}#ppo-equipment .badge.info{background:var(--info-bg);color:var(--info)}#ppo-equipment .section-tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:23px;overflow-x:auto}#ppo-equipment .section-tabs button{display:flex;gap:7px;align-items:center;border:0;border-bottom:3px solid transparent;background:transparent;padding:12px 1px;color:var(--secondary);font-size:13px;white-space:nowrap;min-height:47px}#ppo-equipment .section-tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--green);font-weight:500}#ppo-equipment .section-tabs .count{font-size:11px;border-radius:4px;background:#e8ebf0;padding:1px 6px}
#ppo-equipment .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}#ppo-equipment .metric{background:white;border:1px solid var(--line);border-radius:7px;padding:17px 19px;display:flex;align-items:center;gap:15px}#ppo-equipment .metric .metric-icon{display:grid;place-items:center;width:40px;height:40px;background:var(--surface);border-radius:7px;color:var(--secondary)}#ppo-equipment .metric .metric-icon .icon{width:22px;height:22px}#ppo-equipment .metric strong{display:block;font-size:27px;line-height:1.2;font-variant-numeric:tabular-nums}#ppo-equipment .metric span{font-size:12px;color:var(--secondary)}#ppo-equipment .metric .metric-note{font-size:11px;color:var(--muted);margin-left:auto;max-width:110px;text-align:right}#ppo-equipment .visit-banner{display:flex;align-items:center;gap:17px;border:1px solid #cddaca;border-left:3px solid var(--green);background:#f3f7f1;border-radius:6px;padding:16px 18px;margin-bottom:20px}#ppo-equipment .visit-banner .visit-icon{display:grid;place-items:center;width:38px;height:38px;background:white;border:1px solid #dae4d5;border-radius:7px;flex:none;color:var(--success)}#ppo-equipment .visit-banner p{font-size:12px;color:var(--secondary);margin-top:4px}#ppo-equipment .visit-banner .button{margin-left:auto;flex:none}#ppo-equipment .panel{background:white;border:1px solid var(--line);border-radius:7px;overflow:hidden}#ppo-equipment .panel-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}#ppo-equipment .panel-head h2{font-size:15px}#ppo-equipment .panel-body{padding:20px}#ppo-equipment .toolbar{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}#ppo-equipment .search{position:relative;flex:1;min-width:180px;max-width:410px}#ppo-equipment .search input{border:1px solid var(--control);border-radius:6px;width:100%;height:40px;padding:8px 12px 8px 36px;font-size:13px; <script id="equipment-model">const EquipmentModel = (() => {
  'use strict';
  const copy = value => JSON.parse(JSON.stringify(value));
  const TODAY = '2026-09-14';
  const people = {technician:'Alex Morgan',reviewer:'Casey Reed'};
  const organisations = [{id:'o1',name:'Northbank Nursery'},{id:'o2',name:'Greenhaven Berries'},{id:'o3',name:'Cedar Vale Growers'}];
  const sites = [
    {id:'s1',organisationId:'o1',name:'Propagation site',address:'18 Example Lane, Sampleton VIC 3999, AU',timezone:'Australia/Melbourne',contact:'Sam Ellis · Synthetic site contact'},

    ['f4','s1',null,'Services yard','Facility'],['f5','s1','f4','Irrigation shed','Plant room'],['f6','s1',null,'Trial area / irrigation bench','Growing area'],

    ['e02','Climate controller 02','Climate control','s1','f3',['f1'],'ClimaLogic','CX2','SYN-CC02-24008','Active','Operational','Verified',100,'2024-03-12','2024-03-20','4.2.0','High','Ventilation and climate control'],
    ['e03','Pump 03','Pump','s1','f5',['f7','f8','f9'],'AquaDrive','P30','SYN-P30-24012','Active','Operational','Verified',100,'2024-06-18','2024-06-20','Not applicable','High','Irrigation supply to three growing blocks'],
    ['e04','Monitoring hub 04','Monitoring','s3','f11',['f11'],'GrowSense','M4','SYN-SHARED-004','Active','Unknown','Unconfirmed',72,'2025-02-04','2025-02-10','Not recorded','Medium','Tunnel sensor collection'],
    ['e05','Vent drive 05','Ventilation','s3','f12',['f12'],'VentMotion','V6','SYN-VD-25005','Active','Operational','Verified',96,'2025-02-04','2025-02-10','Not applicable','High','Tunnel ventilation'],
    ['e06','Lighting circuit 06','Lighting','s4','f13',['f13'],'LumaGrow','L3','SYN-LC-23006','Active','Out of service','Verified',89,'2023-08-22','2023-08-25','Not recorded','Medium','Supplemental lighting in Bay 03'],
    ['e07','Legacy dosing unit 07','Fertigation','s1','f14',[],'MixFlow','20','SYN-MF20-19007','Decommissioned','Not applicable','Verified',100,'2019-02-01','2019-02-04','1.2.0','Low','No current service area'],
    ['e08','Monitoring hub 08','Monitoring','s2','f10',['f10'],'GrowSense','M4','SYN-SHARED-004','Active','Operational','Verified',94,'2026-01-12','2026-01-15','3.1.0','Medium','Hardening bay environmental monitoring']
  ].map((a,i)=>({id:a[0],uuid:`11111111-1111-4111-8111-${String(i+1).padStart(12,'0')}`,ref:`SYN-PPO-AST-${String(101+i).padStart(6,'0')}`,name:a[1],type:a[2],siteId:a[3],facilityId:a[4],serves:a[5],manufacturer:a[6],model:a[7],serial:a[8],lifecycle:a[9],condition:a[10],identity:a[11],completeness:a[12],installed:a[13],commissioned:a[14],firmware:a[15],criticality:a[16],impact:a[17],owner:i===5?'Casey Reed':'Alex Morgan',due:i===3?'2026-09-10':'2026-09-15',parentId:null,predecessorId:i===0?'e07':null,configRevision:2,labelRevision:2}));
  // Preserve the seven canonical r01 UUIDs; readable references are normalised only.
  seedAssets.forEach((a,i)=>{if(i<7)a.uuid=`11111111-1111-4111-8111-11111111110${i+1}`;});
  seedAssets.push({...copy(seedAssets[0]),id:'e09',uuid:'11111111-1111-4111-8111-000000000009',ref:'SYN-PPO-AST-000109',name:'Dosing pump component 09',type:'Pump',manufacturer:'DoseMotion',model:'DP9',serial:'SYN-DP9-24009',condition:'Operational',serves:['f1'],parentId:'e01',predecessorId:null,firmware:'Not applicable',impact:'Nutrient dosing component within Fertigation unit 01'});
  function location(a) {const site=sites.find(x=>x.id===a.siteId),facility=facilities.find(x=>x.id===a.facilityId);return {siteId:site.id,site:site.name,address:site.address,timezone:site.timezone,facilityId:facility.id,facility:facility.name,serves:copy(a.serves)};}
  function source(id,revision,title,content,owner='Casey Reed') {return {id,revision,title,content,owner,reviewedOn:'2026-09-14',synthetic:true};}
  function template(a) {
    const numeric=(id,label,unit,min,max,extra={})=>({id,label,kind:'number',unit,min,max,photo:true,...extra});
    let checks;
    if(a.type==='Fertigation')checks=[numeric('pressure','Delivery pressure','bar',4,5),numeric('ec','Nutrient conductivity','mS/cm',1.8,2.2)];
    else if(a.type==='Pump')checks=[numeric('pressure','Discharge pressure','bar',3,4),numeric('vibration','Vibration reading','mm/s',0,3)];
    else if(a.type==='Climate control')checks=[numeric('temperature','Sensor comparison difference','°C',0,1),{id:'alarm',label:'Alarm indication',kind:'choice',choices:['Clear','Present'],photo:true}];
    else if(a.type==='Monitoring')checks=[numeric('signal','Signal strength','dBm',null,null)];
    else if(a.type==='Ventilation')checks=[numeric('travel','Travel time','s',20,30)];
    else checks=[numeric('current','Operating current','A',null,null)];
    checks.push({id:'visual',label:'Visible condition',kind:'choice',choices:['Satisfactory','Issue observed'],photo:false});
    checks.push({id:'finding',label:'Condition detail',kind:'text',when:{checkId:'visual',equals:'Issue observed'},photo:true});
    return {id:`SYN-PPO-TPL-${String(12+['Fertigation','Pump','Climate control','Monitoring','Ventilation','Lighting'].indexOf(a.type)).padStart(6,'0')}`,revision:4,title:`${a.type} inspection`,synthetic:true,criteriaNotice:'Fictional design criteria. Never use these limits for real equipment.',checks};
  }
  function draft(a,revision=1){return {assetId:a.id,revision,values:{},notes:'',evidence:[],instrument:'',visitSlot:'inside',acknowledged:{identity:false,access:false,isolation:false,restrictions:false},readinessRevision:1,savedAt:null};}
  function initial(){const assets=copy(seedAssets);return {schema:2,role:'technician',view:'register',selected:'e01',tab:'overview',filter:{q:'',site:'',facility:'',type:'',owner:'',due:'',condition:''},assets,drafts:Object.fromEntries(assets.map(a=>[a.id,draft(a)])),readiness:Object.fromEntries(assets.map(a=>[a.id,1])),submissions:[],reviews:[],defects:[{id:'SYN-PPO-DEF-000047',assetId:'e01',checkId:'legacy-oem',status:'Open',owner:'Casey Reed',due:'2026-09-18',summary:'Obtain OEM clarification for intermittent dosing behaviour',sourceIds:[{id:'SYN-PPO-RPT-000031',revision:2}],submissionIds:[]}],activities:[],events:assets.flatMap(a=>{const old=copy(a);if(a.id==='e03')old.facilityId='f6';const list=[{id:`event-install-${a.id}`,assetId:a.id,action:'Installed',at:`${a.installed}T00:00:00Z`,actor:'Casey Reed',reason:'Synthetic installation record',location:location(old),source:{id:`installation-${a.id}`,revision:1}}];if(a.id==='e03')list.push({id:'event-move-e03',assetId:a.id,action:'Relocated',at:'2026-08-20T01:00:00Z',actor:'Casey Reed',reason:'Moved from trial bench; serves Growing blocks A, B and C',location:location(a),beforeLocation:location(old),source:{id:'move-e03',revision:1}});return list;})};}
  const asset=(s,id=s.selected)=>s.assets.find(a=>a.id===id);
  const latest=(s,id=s.selected)=>s.submissions.filter(x=>x.assetId===id).at(-1)||null;
  const reviewsFor=(s,id)=>s.reviews.filter(r=>r.submissionId===id);
  const decision=(s,id)=>reviewsFor(s,id).at(-1)?.decision||'Awaiting review';
  const editable=(s,id=s.selected)=>s.role==='technician'&&asset(s,id)?.lifecycle==='Active'&&(!latest(s,id)||s.drafts[id].revision>latest(s,id).revision);
  function event(s,id,action,reason,details={}) {s.events.push({id:`event-${s.events.length+1}`,assetId:id,action,reason,actor:people[s.role],at:new Date().toISOString(),location:location(asset(s,id)),...copy(details)});}
  function readiness(s,id=s.selected){const a=asset(s,id),site=sites.find(x=>x.id===a.siteId),revision=s.readiness[id];return {workOrder:{id:`SYN-PPO-WO-${String(241+s.assets.indexOf(a)).padStart(6,'0')}`,revision:2},visit:{id:`visit-${id}-20260915`,date:'2026-09-15',start:'07:30',end:'10:00',timezone:site.timezone,contact:site.contact},location:location(a),access:source(`visit-access-${id}`,revision,'Site access and crop restrictions',revision===1?'Access 07:30–10:00. Use marked paths; no entry to crop rows without site contact.':'Changed restriction: Growing block B closed to all visits until site review; use service aisle only. Confirm revised briefing.'),isolation:source(`isolation-${id}`,2,'Equipment isolation and access authority','Site-authorised person must confirm equipment-specific isolation before inspection; this synthetic extract is not an isolation procedure.'),prerequisites:[{id:'biosecurity',title:'Biosecurity',detail:'Clean footwear and tools; sign site biosecurity register',owner:'Sam Ellis',reviewedOn:'2026-09-14'},{id:'induction',title:'Induction',detail:'Current site induction and contact briefing required',owner:'Casey Reed',reviewedOn:'2026-09-14'},{id:'crop',title:'Crop access',detail:revision===1?'No crop-row access without contact escort':'Block B closed; changed restrictions require renewed confirmation',owner:'Sam Ellis',reviewedOn:'2026-09-14'},{id:'shutdown',title:'Irrigation / shutdown',detail:'Contact to approve shutdown within visit window; never infer permission from a work order',owner:'Sam Ellis',reviewedOn:'2026-09-14'},{id:'tools',title:'Required tools',detail:a.type==='Fertigation'?'Fictional pressure gauge, conductivity meter, clean sample vessel':'Equipment-specific calibrated instrument, camera and clean hand tools',owner:'Alex Morgan',reviewedOn:'2026-09-14'}]};}
  function activeChecks(t,d){return t.checks.filter(c=>!c.when||d.values[c.when.checkId]===c.when.equals);}
  function assess(c,value){if(c.kind==='number'){if(!/^-?\d+(\.\d{1,2})?$/.test(String(value??'')))return 'Missing / invalid';if(c.min===null||c.max===null)return 'Assessment unavailable';return Number(value)<c.min||Number(value)>c.max?'Fail':'Pass';}if(c.kind==='choice')return !c.choices.includes(value)?'Missing / invalid':['Present','Issue observed'].includes(value)?'Fail':'Pass';return String(value||'').trim()?'Recorded':'Missing / invalid';}
  function imageShape(e){return !!e&&typeof e.id==='string'&&typeof e.name==='string'&&['image/png','image/jpeg','image/webp'].includes(e.type)&&Number.isInteger(e.size)&&e.size>0&&e.size<=8*1024*1024&&Number.isInteger(e.width)&&e.width>0&&Number.isInteger(e.height)&&e.height>0&&e.width*e.height<=40000000&&typeof e.data==='string'&&new RegExp(`^data:${e.type};base64,[A-Za-z0-9+/]+={0,2}$`).test(e.data)&&Math.abs(Math.floor(e.data.split(',')[1].length*3/4)-e.size)<=2&&Array.isArray(e.checkIds)&&e.checkIds.length>0&&e.checkIds.every(x=>typeof x==='string')&&typeof e.caption==='string'&&typeof e.synthetic==='boolean';}
  function errors(s,id=s.selected){const a=asset(s,id),d=s.drafts[id],t=template(a),e={};if(!editable(s,id))e.form='This revision is read-only.';if(d.visitSlot!=='inside')e.visitSlot='Visit is outside the access window. Arrange an approved window before submitting.';if(d.readinessRevision!==s.readiness[id])e.restrictions='Restrictions changed. Read and reconfirm the current preparation sources.';for(const k of Object.keys(d.acknowledged))if(!d.acknowledged[k]&&!e[k])e[k]=`Confirm ${k} before submitting.`;if(d.instrument!=='valid')e.instrument='Select current instrument evidence.';for(const c of activeChecks(t,d)){if(assess(c,d.values[c.id])==='Missing / invalid')e[c.id]='Enter the required value in the stated format.';if(c.photo&&!d.evidence.some(p=>imageShape(p)&&p.checkIds.includes(c.id)&&p.caption.trim()))e[`photo-${c.id}`]=`Attach a readable, captioned image to ${c.label.toLowerCase()}.`;}if(!d.notes.trim())e.notes='Describe the inspection finding, including any uncertainty.';return e;}
  function requireThat(ok,message){if(!ok)throw Error(message);}
  function submit(s,id=s.selected){const issues=errors(s,id);requireThat(!Object.keys(issues).length,Object.values(issues)[0]);const a=asset(s,id),d=s.drafts[id],t=template(a),checks=activeChecks(t,d).map(c=>({...copy(c),value:d.values[c.id],outcome:assess(c,d.values[c.id])}));const snap={id:`inspection-${id}-r${d.revision}`,assetId:id,revision:d.revision,author:people[s.role],at:new Date().toISOString(),equipment:copy(a),location:location(a),configuration:source(`configuration-${id}`,a.configRevision,'Equipment configuration',`${a.manufacturer} ${a.model}; firmware ${a.firmware}; installed ${a.installed}; commissioned ${a.commissioned}`),preparation:{...readiness(s,id),acknowledged:copy(d.acknowledged),readinessRevision:d.readinessRevision,visitSlot:d.visitSlot},template:t,instrument:source('SYN-PPO-INS-000009',2,'Instrument evidence','Fictional calibration CAL-r02; applicable to this synthetic template; valid through 2026-12-31'),checks,notes:d.notes,evidence:copy(d.evidence)};s.submissions.push(snap);for(const c of checks.filter(x=>x.outcome==='Fail')){let defect=s.defects.find(x=>x.assetId===id&&x.checkId===c.id&&x.status!=='Closed');if(!defect){defect={id:`SYN-PPO-DEF-${String(48+s.defects.length-1).padStart(6,'0')}`,assetId:id,checkId:c.id,status:'Awaiting assignment',owner:'',due:'',summary:`${c.label}: failed inspection check`,sourceIds:[{id:snap.id,revision:snap.revision}],submissionIds:[]};s.defects.push(defect);}defect.submissionIds.push(snap.id);}event(s,id,'Inspection submitted',`Revision ${d.revision}`,{source:{id:snap.id,revision:d.revision}});return snap;}
  const validDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v;
  function review(s,id,decisionValue,reason,owner,due){const snap=s.submissions.find(x=>x.id===id);requireThat(s.role==='reviewer'&&snap,'Only the reviewer can record this decision.');requireThat(latest(s,snap.assetId).id===id&&s.drafts[snap.assetId].revision===snap.revision,'Review the current submitted revision before a successor draft is opened.');const prior=decision(s,id);requireThat(!['Accepted','Return for correction','Return for retest'].includes(prior),'This decision is complete. Start a new revision for further work.');requireThat(['Accepted','Return for correction','Request clarification','Hold review','Return for retest'].includes(decisionValue),'Choose a review decision.');requireThat(String(reason||'').trim(),'Record a review reason.');requireThat(['Alex Morgan','Casey Reed'].includes(owner)&&validDate(due)&&due>=TODAY,'Choose an accountable owner and a valid due date.');if(decisionValue==='Accepted')requireThat(!snap.checks.some(c=>['Fail','Assessment unavailable'].includes(c.outcome)),'Acceptance requires resolved failures and available criteria.');const r={id:`review-${s.reviews.length+1}`,submissionId:id,assetId:snap.assetId,revision:snap.revision,reviewer:people[s.role],decision:decisionValue,reason:reason.trim(),owner,due,at:new Date().toISOString()};s.reviews.push(r);for(const d of s.defects.filter(x=>x.assetId===snap.assetId&&x.checkId!=='legacy-oem'&&x.status!=='Closed')){if(decisionValue==='Accepted'&&snap.checks.find(c=>c.id===d.checkId)?.outcome==='Pass'){d.status='Closed';d.closedByReviewId=r.id;}else {d.status=decisionValue;d.owner=owner;d.due=due;}}event(s,snap.assetId,'Review recorded',`${decisionValue}: ${reason}`,{source:{id:r.id,revision:snap.revision}});return r;}
  function startRevision(s,id=s.selected){const snap=latest(s,id);requireThat(s.role==='technician'&&snap&&['Return for correction','Return for retest','Request clarification','Accepted'].includes(decision(s,snap.id)),'The review must release this inspection before a new revision.');requireThat(s.drafts[id].revision===snap.revision,'A new revision is already in progress.');s.drafts[id]=draft(asset(s,id),snap.revision+1);s.drafts[id].readinessRevision=s.readiness[id];event(s,id,'New inspection revision',`Revision ${snap.revision+1} opened`);}

function register(){const rows=M.filtered(s),active=s.assets.filter(a=>a.lifecycle==='Active'),due=active.filter(a=>a.due<'2026-09-15').length,work=s.defects.filter(x=>x.status!=='Closed').length+s.activities.filter(x=>x.status!=='Closed').length;return head('Equipment & installed base','Trace every asset from installation to the areas it supports.',button(icon('scan')+' Identify equipment','scan')+button(icon('box')+' Create equipment','maintenance','data-mode="create"','primary'))+`<div class="metrics">${[[s.assets.length,'Equipment records','Whole register'],[active.length,'Active equipment','Whole register'],[due,'Overdue inspections','Active equipment'],[work,'Open obligations','Defects and follow-ups']].map(([n,t,sub])=>`<div class="metric"><div><strong>${n}</strong><span>${t}</span><p class="small">${sub}</p></div></div>`).join('')}</div><div class="visit-banner"><div class="visit-icon">${icon('calendar')}</div><div><h3>Northbank Nursery · Prepared visit</h3><p>15 Sep · 07:30–10:00 AEST · Fertigation unit 01 · ${M.latest(s,'e01')?esc(M.decision(s,M.latest(s,'e01').id)):'Inspection ready to prepare'}</p></div>${button('Open visit & inspection','inspection','data-id="e01"','primary')}</div><nav class="section-tabs" aria-label="Workspace"><button aria-current="page" data-action="register">Equipment register</button><button data-action="queue">Inspection queue</button></nav><section class="panel">${filters()}<div class="result-strip"><strong>${rows.length} of ${s.assets.length} equipment records</strong><span>Filters apply to the results below</span></div>${rows.length?`<div class="table-scroll"><table class="equipment-table"><thead><tr><th>Equipment / identity</th><th>Organisation / site</th><th>Installed at / serves</th><th>Operating condition</th><th>Next inspection</th></tr></thead><tbody>${rows.map(a=>`<tr><td><button class="text-button" data-action="asset" data-id="${a.id}">${esc(a.name)}</button><p class="small">${a.ref} · ${esc(a.type)}</p><p class="small">${esc(a.serial)} · ${esc(a.identity)}</p></td><td>${esc(organisation(a))}<p class="small">${esc(M.location(a).site)}</p></td><td>${esc(M.location(a).facility)}<p class="small">Serves ${a.serves.map(facilityName).map(esc).join(', ')||'no current areas'}</p></td><td>${badge(a.condition)}<p class="small">Lifecycle: ${esc(a.lifecycle)}</p></td><td>${a.lifecycle==='Active'?a.due:'—'}<p class="small">${esc(a.owner)}</p></td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${rows.map(a=>`<article class="equipment-card"><button class="text-button" data-action="asset" data-id="${a.id}">${esc(a.name)} ${icon('arrow-right')}</button><p class="small">${a.ref} · ${esc(organisation(a))}</p><div class="card-facts"><div><small>Installed at</small>${esc(M.location(a).site)} / ${esc(M.location(a).facility)}</div><div><small>Next inspection</small>${a.lifecycle==='Active'?a.due:'Not applicable'}<br>${esc(a.owner)}</div></div>${badge(a.condition)} <span class="small">${esc(a.lifecycle)} · ${esc(a.identity)}</span></article>`).join('')}</div>`:empty('No equipment matches these filters','Try a serial, customer or broader location.',button('Clear filters','clear-filters'))}</section>`;}
function empty(title,body,action=''){return `<div class="empty-state"><h2>${esc(title)}</h2><p>${esc(body)}</p>${action}</div>`;}
function obligations(a){const items=[...s.defects,...s.activities].filter(x=>x.assetId===a.id);return items.length?items.map(d=>`<div class="obligation"><div class="row between"><strong>${esc(d.summary)}</strong>${badge(d.status)}</div><p class="small">${esc(d.id)}${d.checkId?` · Check ${esc(d.checkId)}`:''}</p><p class="small">${esc(d.owner||'Assignment required')} · ${esc(d.due||'Due date required')}</p>${d.assistantReviews?.map(r=>`<details><summary>${esc(r.mode)} reviewed by ${esc(r.reviewer)} · ${when(r.at)}</summary><div><p>${esc(r.summary)}</p>${sourceCards(r.sources)}</div></details>`).join('')||''}</div>`).join(''):empty('No open follow-up recorded','The absence of a record does not confirm equipment health.');}
function detail(){const a=asset(),l=M.location(a);return `<div class="backline">${button(icon('arrow-left')+' Equipment register','register','','ghost')}<span class="small">${esc(a.ref)}</span></div>`+head(a.name,`${organisation(a)} · ${l.site}`,button('Maintain record','maintenance','data-mode="correct"')+button(icon('sparkles')+' Assistant','ai')+(a.lifecycle==='Active'?button('Open inspection','inspection',`data-id="${a.id}"`,'primary'):''))+`<div class="status-dimensions">${[['Lifecycle',a.lifecycle],['Operating condition',a.condition],['Identity confidence',a.identity],['Data completeness',`${a.completeness}% · ${a.completeness===100?'Core fields recorded':'Review missing fields'}`]].map(([k,v])=>`<div><small>${k}</small>${badge(v)}</div>`).join('')}</div><nav class="section-tabs" aria-label="Equipment record">${[['overview','Overview'],['history','Service history'],['configuration','Configuration'],['documents','Documents'],['lifecycle','Lifecycle']].map(([id,title])=>`<button data-action="tab" data-tab="${id}" ${s.tab===id?'aria-current="page"':''}>${title}</button>`).join('')}</nav>${s.tab==='overview'?`<div class="detail-grid"><div class="stack">${panel('Equipment identity',facts([['Manufacturer',a.manufacturer],['Model',a.model],['Serial number',a.serial],['Equipment type',a.type],['Commissioned',a.commissioned],['Firmware / software',a.firmware],['Owner',a.owner],['Criticality',a.criticality],['Operational impact',a.impact],['Stable equipment ID',a.uuid]]))}${panel('Outstanding work',obligations(a))}</div><div class="stack">${panel('Installed location',`<ol class="location-path"><li>${esc(organisation(a))}<small>Organisation · Operator</small></li><li>${esc(l.site)}<small>${esc(l.address)}<br>${esc(l.timezone)}</small></li><li>${esc(l.facility)}<small>Installed facility</small></li></ol><hr class="divider"><h3>Areas served</h3><div class="serves-list">${a.serves.map(x=>`<span>${icon('layers')}${esc(facilityName(x))}</span>`).join('')||'<p class="small">No current service area recorded.</p>'}</div><p class="small spaced">Service areas are distinct from the equipment’s installed location.</p>`)}${panel('Visit readiness',facts([['Next inspection',a.lifecycle==='Active'?a.due:'Not applicable'],['Site contact',M.readiness(s).visit.contact]])+`<div class="spaced">${button('Inspect preparation sources','readiness')}</div>`)}</div></div>`:s.tab==='history'?history(a):s.tab==='configuration'?configuration(a):s.tab==='documents'?documents(a):lifecycle(a)}`;}
function history(a){const events=s.events.filter(e=>e.assetId===a.id).slice().reverse();return `<div class="detail-grid"><div class="stack">${panel('Retained equipment history',`<ol class="timeline">${events.map(e=>`<li><div class="when">${when(e.at)} · ${esc(e.actor)}</div><h3>${esc(e.action)}</h3><p>${esc(e.reason)}</p><p>Location at event: <strong>${esc(e.location.site)} / ${esc(e.location.facility)}</strong></p>${e.beforeLocation?`<p>Previous location: ${esc(e.beforeLocation.site)} / ${esc(e.beforeLocation.facility)}</p>`:''}${e.source?`<p class="small">Source ${esc(e.source.id)} · r${e.source.revision}</p>`:''}${e.sources?sourceCards(e.sources):''}</li>`).join('')}</ol>`)}${a.id==='e01'?panel('Earlier service record',callout('Unresolved OEM clarification','Reviewed synthetic report SYN-PPO-RPT-000031 r02 records an unsuccessful intermittent-dosing repair. No root cause or closure is inferred.','warning')+'<div class="spaced">'+button('Read report extract','report')+'</div>'):''}</div><div class="stack">${panel('Review decisions',reviewHistory(a.id))}${panel('Linked obligations',obligations(a))}</div></div>`;}
function configuration(a){const parent=a.parentId?M.asset(s,a.parentId):null,children=s.assets.filter(x=>x.parentId===a.id);return panel(`Configuration r${a.configRevision}`,facts([['Manufacturer / model',`${a.manufacturer} / ${a.model}`],['Serial',a.serial],['Firmware / software',a.firmware],['Installed',a.installed],['Commissioned',a.commissioned],['Parent assembly',parent?`${parent.ref} · ${parent.name}`:'Standalone equipment'],['Components',children.length?children.map(x=>`${x.ref} · ${x.name}`).join('; '):'No component records linked'],['Predecessor',a.predecessorId?M.asset(s,a.predecessorId).ref:'None recorded']])+`<div class="row spaced">${parent?button('Open parent','asset',`data-id="${parent.id}"`):''}${children.map(c=>button('Open '+esc(c.name),'asset',`data-id="${c.id}"`)).join('')}</div><div class="spaced">${callout('Attributed changes','Use Maintain record to correct, relocate, replace or retire. Every change retains its reason, actor and previous context.')}</div>`);}
function sourceCards(sources){return sources.map(x=>`<details><summary>${esc(x.title)} · ${esc(x.id)} r${x.revision}</summary><div><p>${esc(x.content)}</p><p class="small spaced">Synthetic extract · Source owner ${esc(x.owner)} · Reviewed ${esc(x.reviewedOn)}</p></div></details>`).join('');}
function documents(a){return panel('Equipment sources',sourceCards(M.sourcesFor(s,a.id))+sourceCards([M.readiness(s).access,M.readiness(s).isolation])+callout('Document ownership','These are fictional source extracts. Controlled business documents belong in SharePoint; no operational document is issued from this design.'));}
function lifecycle(a){const links=[['Maintenance plan','Service planning','Quarterly inspection proposal; plan confirmation required'],['Service agreement','Service agreements','Coverage unverified; inspect agreement scope before promising work'],['Warranty evidence','Warranty management',a.predecessorId?'Replacement does not inherit or restart warranty without evidence':'Start/end evidence not recorded; no coverage decision inferred'],['Service bulletins','Technical bulletin review','One synthetic applicability assessment pending; serial and firmware match requires reviewer confirmation']];return `<div class="detail-grid"><div class="stack">${panel('Lifecycle relationships',links.map(([t,owner,status],i)=>`<div class="document-row">${icon('file')}<div><h3>${t}</h3><p>${esc(status)}</p><p>Owner workflow: ${owner}</p></div>${button('Inspect','lifecycle-link',`data-index="${i}"`)}</div>`).join(''))}</div><div class="stack">${panel('Replacement history',a.predecessorId?`<p>Predecessor: ${esc(M.asset(s,a.predecessorId).name)}</p><div class="spaced">${button('Open predecessor','asset',`data-id="${a.predecessorId}"`)}</div>`:s.assets.some(x=>x.predecessorId===a.id)?s.assets.filter(x=>x.predecessorId===a.id).map(x=>button('Open replacement','asset',`data-id="${x.id}"`)).join(''):'<p class="small">No replacement relationship recorded.</p>')}${panel('Boundary',callout('Read-only linked context','Planning, agreements, warranty decisions and bulletin applicability remain with their owning workflows.'))}</div></div>`;}
function queue(){const rows=M.filtered(s).filter(a=>a.lifecycle==='Active');return head('Inspection queue','Prepare visits, review evidence and resolve owned retests.',button(icon('scan')+' Identify equipment','scan','', 'primary'))+`<nav class="section-tabs" aria-label="Workspace"><button data-action="register">Equipment register</button><button aria-current="page" data-action="queue">Inspection queue</button></nav><section class="panel">${filters()}<div class="result-strip"><strong>${rows.length} active equipment in these results</strong><span>${s.submissions.filter(x=>M.latest(s,x.assetId)?.id===x.id&&M.decision(s,x.id)!=='Accepted').length} submitted inspections awaiting resolution across the register</span></div>${rows.map(a=>{const last=M.latest(s,a.id);return `<article class="queue-row"><div><h3>${esc(a.name)}</h3><p>${a.ref} · ${esc(M.location(a).site)} · ${esc(M.location(a).facility)}</p><p>${esc(a.owner)} · Due ${a.due}</p></div><div>${badge(last?M.decision(s,last.id):a.due<M.TODAY?'Overdue preparation':'Preparation required')}<p>${last?`Submitted r${last.revision}`:'No submission yet'}</p></div>${button(last?'Open inspection':'Prepare inspection','inspection',`data-id="${a.id}"`,'primary')}</article>`;}).join('')||empty('No inspections in these results','Clear a filter to see more active equipment.',button('Clear filters','clear-filters'))}</section>`;}
function preparation(a,d,locked){const r=M.readiness(s,a.id);return panel('1 · Visit & preparation',`<div class="row between"><p class="small">${r.workOrder.id} · r${r.workOrder.revision}</p>${button('View exact sources','readiness')}</div><div class="spaced">${facts([['Visit',`${r.visit.date} · ${r.visit.start}–${r.visit.end} AEST`],['Site contact',r.visit.contact]])}</div><div class="spaced">${select('visitSlot','Planned arrival',[['inside','07:30 AEST · inside access window'],['outside','11:00 AEST · outside access window']],d.visitSlot,undefined,`data-draft="visitSlot" ${locked?'disabled':''}`)}</div>${d.visitSlot==='outside'?'<div class="spaced">'+callout('Outside access window','Arrange an approved visit window with the site contact before submitting.','warning')+'</div>':''}<div class="spaced">${['identity','access','isolation','restrictions'].map(k=>`<label class="check-row"><input id="${k}" type="checkbox" data-ack="${k}" ${d.acknowledged[k]?'checked':''} ${locked?'disabled':''}><span><strong>${{identity:'Confirm correct physical equipment',access:'Confirm approved access and induction',isolation:'Confirm isolation with authorised site person',restrictions:`Confirm crop, biosecurity and shutdown restrictions · r${r.access.revision}`}[k]}</strong><p>${{identity:`Compare ${a.ref}, serial ${a.serial} and installed location.`,access:'Read the current source and contact briefing.',isolation:'The source reference is retained with this revision.',restrictions:r.access.content}[k]}</p></span></label>`).join('')}</div><div class="spaced">${select('instrument','Instrument evidence',[['valid','SYN-PPO-INS-000009 · CAL-r02 · current'],['expired','CAL-r01 · expired'],['missing','No evidence available']],d.instrument,'Choose evidence',`data-draft="instrument" ${locked?'disabled':''}`)}</div>`);}
function evidenceCards(d,locked){return d.evidence.map((e,i)=>`<article class="evidence-tile"><img src="${e.data}" alt="${esc(e.caption||'Evidence awaiting caption')}"><div><strong>${esc(e.name)}</strong><p class="small">${(e.size/1024).toFixed(1)} KiB · ${e.width} × ${e.height} · ${esc(e.type)}</p><p class="small">Checks: ${e.checkIds.map(esc).join(', ')}${e.synthetic?' · Synthetic illustration':''}</p>${locked?`<p class="spaced">${esc(e.caption)}</p>`:textarea('caption-'+i,'Evidence caption',e.caption,`data-caption="${i}"`)}${!locked?button('Remove / replace','remove-evidence',`data-index="${i}"`):''}</div></article>`).join('');}
function inspection(){const a=asset(),d=s.drafts[a.id],last=M.latest(s),locked=!M.editable(s),t=M.template(a),status=last?M.decision(s,last.id):'Draft';return `<div class="backline">${button(icon('arrow-left')+' Inspection queue','queue','','ghost')}${button('Open equipment record','asset',`data-id="${a.id}"`)}</div>`+head(a.name+' · inspection',`${a.ref} · ${M.location(a).site} / ${M.location(a).facility}`,button('Export session','export')+button(icon('sparkles')+' Assistant','ai'))+errorsBox()+`<div class="inspection-state">${badge(locked?'Read-only revision':`Editable draft r${d.revision}`)}${last?badge(`r${last.revision} · ${status}`):''}<span class="small">${t.id} r${t.revision} · ${s.role==='reviewer'?'Reviewer':'Technician'}</span></div>${last&&d.revision===last.revision?submitted(last):''}${!locked?`<div class="inspection-layout"><div class="stack">${preparation(a,d,false)}${panel('2 · Equipment checks',callout('Synthetic criteria',t.criteriaNotice,'warning')+`<div class="check-fields">${M.activeChecks(t,d).map(c=>`<div class="inspection-check" data-check="${c.id}"><div class="row between"><h3>${esc(c.label)}</h3>${badge(M.assess(c,d.values[c.id]))}</div><p class="small">${c.kind==='number'?(c.min===null?'Criteria unavailable — record the reading, then request criteria review.':`Fictional range ${c.min}–${c.max} ${c.unit} · up to 2 decimal places`):c.when?'Required because a visible issue was observed.':'Record the observed condition.'}</p><div class="spaced">${c.kind==='choice'?select('check-'+c.id,c.label,c.choices,d.values[c.id]||'','Choose result',`data-value="${c.id}"`):c.kind==='text'?textarea('check-'+c.id,c.label,d.values[c.id]||'',`data-value="${c.id}"`):input('check-'+c.id,`${c.label} (${c.unit})`,d.values[c.id]||'','text',`inputmode="decimal" data-value="${c.id}"`)}</div>${c.photo?`<p id="photo-${c.id}" class="small spaced">Evidence required for this check.</p>`:''}</div>`).join('')}</div><div class="spaced">${textarea('notes','Inspection findings and uncertainty',d.notes,'data-draft="notes"')}</div>`)}${panel('3 · Photographs & evidence',`<p class="small">Up to 8 JPEG, PNG or WebP originals · 8 MiB each · 20 MiB per revision. Larger or HEIC phone images need a compatible smaller original. Source images are retained without compression.</p><div class="form-grid spaced">${select('upload-check','Associate new photographs',M.activeChecks(t,d).map(c=>[c.id,c.label]),M.activeChecks(t,d).find(c=>c.photo)?.id)}<label class="field"><span>Add photographs</span><input id="upload" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div><div id="upload-status" class="spaced" role="status" aria-live="polite"></div><div class="evidence-grid spaced">${evidenceCards(d,false)}</div><div class="spaced">${button('Add labelled example for selected check','sample-evidence')}<p class="small spaced">The example is an illustration for this demonstration, not a real inspection photograph.</p></div>`)}<div class="action-bar"><p class="small">Preparation, sources and evidence are frozen on submission.</p>${button('Save draft','save-draft')}${button('Submit for review','submit','','primary')}</div></div><aside class="stack">${panel('Inspection context',facts([['Installed at',M.location(a).facility],['Serves',a.serves.map(facilityName).join(', ')||'No areas recorded'],['Configuration',`r${a.configRevision}`],['Draft revision',`r${d.revision}`]]))}${panel('Linked defects',obligations(a))}${panel('Demonstration tools',button('Apply changed crop restrictions','change-restrictions')+'<p class="small spaced">Revises the preparation source and requires renewed confirmation.</p>')}</aside></div>`:last?reviewActions(last):callout('Technician preparation required','Switch to Alex Morgan to prepare an inspection draft.')}${s.submissions.some(x=>x.assetId===a.id)?panel('Revision & review archive',s.submissions.filter(x=>x.assetId===a.id).map(x=>`<details><summary>Submission r${x.revision} · ${esc(M.decision(s,x.id))} · ${when(x.at)}</summary><div>${snapshotBody(x)}${reviewHistory(a.id,x.id)}</div></details>`).join('')):''}`;}
function snapshotBody(x){return `<p class="small">Read-only · ${esc(x.id)} · Submitted by ${esc(x.author)} · ${when(x.at)}</p><div class="spaced">${facts([['Equipment',`${x.equipment.ref} · ${x.equipment.name}`],['Location at submission',`${x.location.site} / ${x.location.facility}`],['Areas served',x.location.serves.map(facilityName).join(', ')||'None'],['Work order',`${x.preparation.workOrder.id} r${x.preparation.workOrder.revision}`],['Visit',`${x.preparation.visit.date} ${x.preparation.visit.start}–${x.preparation.visit.end} · ${x.preparation.visit.timezone}`],['Site contact',x.preparation.visit.contact]])}</div><div class="spaced">${x.checks.map(c=>`<div class="snapshot-check"><div><strong>${esc(c.label)}</strong><p class="small">${esc(c.value)} ${esc(c.unit||'')} · Check ${esc(c.id)}</p></div>${badge(c.outcome)}</div>`).join('')}</div><p class="spaced">${esc(x.notes)}</p><details><summary>Frozen preparation, configuration and instrument sources</summary><div>${sourceCards([x.configuration,x.instrument,x.preparation.access,x.preparation.isolation])}<div class="spaced">${x.preparation.prerequisites.map(p=>`<p class="spaced"><strong>${esc(p.title)}</strong> · ${esc(p.detail)}<br><span class="small">Owner ${esc(p.owner)} · Reviewed ${p.reviewedOn}</span></p>`).join('')}</div><p class="small spaced">Identity, access, isolation and restriction confirmations retained.</p></div></details><details><summary>Evidence · ${x.evidence.length} retained images</summary><div>${evidenceCards(x,true)}</div></details>`;}
function submitted(x){return panel(`Submitted revision ${x.revision}`,snapshotBody(x));}
function reviewHistory(id,submissionId){const reviews=s.reviews.filter(r=>r.assetId===id&&(!submissionId||r.submissionId===submissionId));return reviews.length?reviews.map(r=>`<article class="review-record"><div class="row between"><strong>r${r.revision} · ${esc(r.decision)}</strong><span class="small">${esc(r.id)}</span></div><p>${esc(r.reason)}</p><p class="small">Reviewer ${esc(r.reviewer)} · ${when(r.at)}</p><p class="small">Owner ${esc(r.owner)} · Due ${r.due} · ${esc(r.submissionId)}</p></article>`).join(''):'<p class="small">No review decision recorded yet.</p>';}
function reviewActions(x){const status=M.decision(s,x.id),canReview=s.role==='reviewer'&&!['Accepted','Return for correction','Return for retest'].includes(status),canStart=s.role==='technician'&&['Accepted','Return for correction','Return for retest','Request clarification'].includes(status);return `<div class="spaced">${panel('Review & next action',canReview?`${callout('Evidence quality is a separate decision','Return, clarify or hold any submitted inspection, including one whose numeric checks pass.')}<div class="form-grid spaced">${select('review-decision','Decision',['Accepted','Return for correction','Request clarification','Hold review','Return for retest'],x.checks.some(c=>c.outcome==='Fail')?'Return for retest':'Return for correction')}${select('review-owner','Accountable owner',['Alex Morgan','Casey Reed'],'Alex Morgan')}${input('review-due','Due date','2026-09-16','date','min="2026-09-14"')}<div class="full">${textarea('review-reason','Review reason')}</div></div><div class="row spaced">${button('Record review decision','review','','primary')}</div>`:canStart?`<p>Review outcome: <strong>${esc(status)}</strong>. Earlier submissions and decisions remain available below.</p><div class="spaced">${button(status==='Accepted'?'Start next inspection revision':'Start corrected / retest revision','start-revision','','primary')}</div>`:`<p class="small">${s.role==='technician'?'Waiting for a reviewer decision. Switch to Casey Reed to review the submitted evidence.':'This review is complete. The technician can prepare a new revision.'}</p>`+reviewHistory(x.assetId,x.id))}</div>`;}
function readinessDialog(){const a=asset(),r=M.readiness(s);showDialog('Visit readiness',`${a.ref} · Exact current sources`,facts([['Work order',`${r.workOrder.id} r${r.workOrder.revision}`],['Visit',`${r.visit.date} · ${r.visit.start}–${r.visit.end} AEST`],['Location',`${r.location.site} / ${r.location.facility}`],['Contact',r.visit.contact]])+sourceCards([r.access,r.isolation])+`<div class="spaced">${r.prerequisites.map(p=>`<div class="obligation"><h3>${esc(p.title)}</h3><p>${esc(p.detail)}</p><p class="small">${esc(p.owner)} · Reviewed ${p.reviewedOn}</p></div>`).join('')}</div>`);}

function lookup(){const result=M.lookup(s,$('#lookup').value);const messages={empty:['Enter a reference','Use a known serial, equipment reference or UUID.'],unknown:['No matching equipment','Check the reference with the site contact. Creating a record is a separate controlled action.'],ambiguous:['More than one match','Serial numbers are not globally unique. Compare the customer, site, facility and equipment reference.'],retired:['Retired / removed equipment','Historical record only. Confirm whether a replacement is installed before proceeding.'],damaged:['Label unreadable','Use manual reference or serial lookup and compare the physical nameplate.'], 'replaced-label':['Label has been replaced','This old label is not proof of identity. Use the current label or manually confirm the nameplate and location.'],unavailable:['Record temporarily unavailable','Retry lookup, or contact the coordinator. No cached match is assumed.'],restricted:['Access restricted','Ask the record owner for access through the normal workflow. Identification does not grant access.'],malformed:['Unrecognised QR format','Use manual lookup or scan the issued equipment label.'],found:['Compare the physical equipment','Confirm the reference, serial and installed location before opening.']};const [title,body]=messages[result.state];$('#lookup-result').innerHTML='<div class="spaced">'+callout(title,body,['found'].includes(result.state)?'':'warning')+'</div>'+result.items.map(a=>`<article class="scan-candidate"><h3>${esc(a.name)}</h3><p>${esc(a.ref)} · ${esc(a.serial)}</p><p>${esc(organisation(a))} · ${esc(M.location(a).site)} / ${esc(M.location(a).facility)}</p><p>${esc(a.lifecycle)} · ${esc(a.identity)}</p>${result.state==='replaced-label'?'<p class="small">Type the current equipment reference above to confirm manually.</p>':button(a.lifecycle==='Active'?'Confirm match & open':'Open historical record','confirm-identity',`data-id="${a.id}"`,'primary')}</article>`).join('')+(result.state==='unavailable' function guide(){showDialog('Workspace guide · r02','Standalone Equipment & Installed Base design',`<p>This file connects equipment identification, visit readiness, inspection evidence, review decisions and retained history using fictional records.</p><details open><summary>Walk through the primary journey</summary><div><ol class="guide-list"><li>Open Fertigation unit 01 and inspect its visit sources.</li><li>Confirm preparation; select current instrument evidence. Enter pressure 5.60 and conductivity 2.00, select Satisfactory and record a finding.</li><li>Add a labelled example image for pressure and conductivity, or upload readable photographs with captions.</li><li>Submit. Switch to Casey Reed; return for retest with an owner, due date and detailed reason.</li><li>Switch to Alex Morgan; start the next revision, reconfirm preparation and use 4.60 bar with fresh evidence.</li><li>Submit and accept as Casey Reed. The linked pressure defect closes; the OEM clarification remains open.</li></ol></div></details><details><summary>Explore the r02 refinements</summary><div><ul class="guide-list"><li>Return a numerically passing submission for evidence correction; hold it or request clarification.</li><li>Repeat failed retests, then inspect every review reason in the archive.</li><li>Open Pump 03 for previous installation location and several served growing blocks.</li><li>Filter Northbank’s two sites, or test ambiguous shared serials in Identify.</li><li>Apply changed restrictions or choose an 11:00 visit to see readiness blocks.</li><li>Monitoring and lighting have unavailable example criteria; acceptance stays blocked.</li><li>Use Maintain record as Casey Reed for reasoned, reviewed lifecycle changes.</li><li>In Assistant, link or update an existing obligation; inspect retained citations and reviewer attribution.</li></ul></div></details><details><summary>Evidence, storage and recovery</summary><div><p>Readable image decoding, nonempty bytes, dimensions, MIME signatures and file budgets are checked before attachment. Original images are retained; large sessions may exceed browser storage. Export includes all revisions and source snapshots.</p><p class="spaced">Saved r02 state is validated before rendering and images are decoded again on restore. Corrupt data opens a recovery screen with original export and a confirmed reset. The r01 key and source file are independent.</p><p class="spaced">Client role controls and local files are a design demonstration, not server authentication, durable storage, malware screening or controlled document issue. QR scanning and AI provider calls are simulated; no external request is made.</p></div></details><details><summary>Provenance & outstanding verification</summary><div><p>Theme attachment is labelled r18, but supplied bytes identify r16. The embedded Roboto, supplied mark, navy #242a37, green #62bb46, 1 px borders and bottom-only drawer corners follow those available bytes.</p><p class="spaced">Model and DOM checks are distinct from native browser verification. Visual layout, real file decoding, assistive technology, phone capture and modal behaviour need browser/device sign-off. Preview access was blocked in this session.</p><p class="spaced">Canonical Asset/Site/Facility/Activity concepts remain with the application. Agreements, plans, warranty and bulletin panels are read-only handoffs to their owning workflows. All data and criteria are synthetic.</p></div></details><div class="row spaced">${button('Export session','export')}${button('Reset r02 session','reset')}</div>`);}

function showErrors(errors){root.querySelectorAll('.field-error').forEach(el=>el.remove());root.querySelectorAll('[aria-invalid]').forEach(el=>{el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby');});const box=$('#dialog[open] #form-errors')||$('#form-errors');if(!box){toast(typeof errors==='string'?errors:Object.values(errors)[0]);return;}box.hidden=false;box.innerHTML=typeof errors==='string'?esc(errors):'<strong>Complete these items before submitting</strong><ul>'+Object.entries(errors).map(([key,text])=>`<li><a href="#${key.startsWith('photo-')?key:['identity','access','isolation','restrictions','instrument','notes','visitSlot'].includes(key)?key:'check-'+key}">${esc(text)}</a></li>`).join('')+'</ul>';if(typeof errors==='object')Object.entries(errors).forEach(([k,message])=>{const target=$('#'+(['identity','access','isolation','restrictions','instrument','notes','visitSlot'].includes(k)?k:'check-'+k));if(target){target.setAttribute('aria-invalid','true');const id='error-'+k;target.setAttribute('aria-describedby',id);const field=document.createElement('small');field.id=id;field.className='field-error';field.textContent=message;target.parentElement.append(field);}});box.focus();}
function signature(data,type){const b=atob(data.split(',')[1]||'');return type==='image/png'?b.length>24&&b.slice(0,8)==='\x89PNG\r\n\x1a\n':type==='image/jpeg'?b.length>4&&b.charCodeAt(0)===255&&b.charCodeAt(1)===216&&b.charCodeAt(2)===255:type==='image/webp'&&b.length>16&&b.slice(0,4)==='RIFF'&&b.slice(8,12)==='WEBP';}
function decodeImage(data){return new Promise((resolve,reject)=>{const image=new Image();const timer=setTimeout(()=>{image.src='';reject(Error('Image decoding timed out. Choose another image and retry.'));},10000);image.onload=()=>{clearTimeout(timer);if(!image.naturalWidth||!image.naturalHeight||image.naturalWidth*image.naturalHeight>40000000)reject(Error('Image dimensions are invalid or exceed 40 megapixels. Choose a smaller original.'));else resolve({width:image.naturalWidth,height:image.naturalHeight});};image.onerror=()=>{clearTimeout(timer);reject(Error('This file does not contain a readable image. Choose a replacement and retry.'));};image.src=data;});}
function readFile(file,progress){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onprogress=e=>{if(e.lengthComputable)progress(Math.round(e.loaded/e.total*85));};reader.onerror=()=>reject(Error('The file could not be read. Choose it again to retry.'));reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);});}
async function upload(files){if(uploadBusy)return;const id=s.selected,revision=s.drafts[id].revision,generation=++uploadGeneration,checkId=$('#upload-check').value;uploadBusy=true;const current=()=>generation===uploadGeneration&&s.selected===id&&s.drafts[id].revision===revision&&M.editable(s,id);const messages=[];try{for(const file of files){if(!current())break;const status=percent=>{const el=$('#upload-status');if(el)el.innerHTML=`<p>${esc(file.name)} · ${percent}%</p><progress max="100" value="${percent}" aria-label="Image validation progress"></progress>`;};try{if(file.size===0)throw Error('File is empty. Choose a replacement and retry.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choose a JPEG, PNG or WebP original; HEIC is not supported here.');if(file.size>8*1024*1024)throw Error('File exceeds 8 MiB. Choose a smaller original and retry.');status(0);const data=await readFile(file,status);if(!signature(data,file.type))throw Error('File contents do not match the image type. Choose a replacement.');status(90);const dimensions=await decodeImage(data);if(!current())break;M.addEvidence(s,id,{id:`photo-${Date.now()}-${s.drafts[id].evidence.length}`,name:file.name,type:file.type,size:file.size,...dimensions,data,checkIds:[checkId],caption:'',synthetic:false});status(100);messages.push(`${file.name}: image validated; add a caption.`);}catch(e){messages.push(`${file.name}: ${e.message}`);}}}finally{uploadBusy=false;if(current()){save();render();$('#upload-status').innerHTML=messages.map(m=>`<p>${esc(m)}</p>`).join('');$('#upload-status').setAttribute('tabindex','-1');$('#upload-status').focus();}}}

root.addEventListener('input',e=>{const el=e.target;if(recovery||loading)return;if(el.dataset.filter==='q'){s.filter.q=el.value;save();return;}if(!M.editable(s))return;if(el.dataset.value){s.drafts[s.selected].values[el.dataset.value]=el.value;}else if(el.dataset.draft&&el.tagName!=='SELECT')s.drafts[s.selected][el.dataset.draft]=el.value;else if(el.dataset.caption!==undefined){s.drafts[s.selected].evidence[Number(el.dataset.caption)].caption=el.value;}else return;s.drafts[s.selected].savedAt=new Date().toISOString();el.removeAttribute('aria-invalid');save();});
root.addEventListener('change',e=>{const el=e.target;if(recovery||loading)return;try{if(el.id==='actor'){s.role=el.value;uploadGeneration++;uploadBusy=false;save();render(true);return;}if(el.dataset.filter){const id=el.id;s.filter[el.dataset.filter]=el.value;if(el.dataset.filter==='site')s.filter.facility='';save();render();$('#'+id)?.focus();return;}if(el.id==='maint-action'||el.id==='maint-facility'){updateMaintenanceFields();return;}if(el.id==='ai-mode'){$('#ai-target').disabled=el.value==='new';return;}if(el.id==='upload'){void upload([...el.files]);return;}if(M.editable(s)){if(el.dataset.ack){s.drafts[s.selected].acknowledged[el.dataset.ack]=el.checked;if(el.dataset.ack==='restrictions'&&el.checked)s.drafts[s.selected].readinessRevision=s.readiness[s.selected];}else if(el.dataset.value)s.drafts[s.selected].values[el.dataset.value]=el.value;else if(el.dataset.draft)s.drafts[s.selected][el.dataset.draft]=el.value;else return;s.drafts[s.selected].savedAt=new Date().toISOString();save();if(el.tagName==='SELECT'||el.dataset.value){const id=el.id;render();$('#'+id)?.focus();}}}catch(err){showErrors(err.message);}});
root.addEventListener('keydown',e=>{if(e.target.id==='lookup'&&e.key==='Enter'){e.preventDefault();lookup();}if(e.target.id==='filter-q'&&e.key==='Enter'){e.preventDefault();render();$('#filter-q')?.focus();}if(e.key==='Tab'&&$('#dialog').open){const nodes=[...$('#dialog').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],summary')].filter(el=>!el.closest('[hidden]')&&(!el.closest('details')||el.tagName==='SUMMARY'||el.closest('details').open));const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(loading)return;if(recovery&&!['export-raw','reset','confirm-reset','close-dialog'].includes(action))return;try{switch(action){
case 'register':case 'queue':navigate(action);break;
case 'asset':case 'inspection':navigate(action,b.dataset.id||s.selected,action==='asset'?'overview':undefined);break;
case 'tab':s.tab=b.dataset.tab;save();render(true);break;
case 'clear-filters':s.filter=M.initial().filter;save();render(true);break;
case 'scan':scanDialog();break;
case 'scan-case':$('#lookup').value=b.dataset.query;lookup();break;
case 'lookup':lookup();break;
case 'confirm-identity':navigate('asset',b.dataset.id,'overview');toast('Record opened. Confirm physical identity again when preparing the inspection.');break;
case 'close-dialog':closeDialog();break;
case 'readiness':readinessDialog();break;
case 'report':showDialog('Earlier service report','SYN-PPO-RPT-000031 r02 · Synthetic reviewed extract',sourceCards([M.source('SYN-PPO-RPT-000031',2,'Intermittent dosing investigation','Repair attempt did not resolve intermittent dosing. Await OEM response under SYN-PPO-DEF-000047. No confirmed root cause or closure.') ]));break;
case 'about':guide();break;
case 'export':download(JSON.stringify({design:'PPO Equipment workspace r02',synthetic:true,exportedAt:new Date().toISOString(),...s},null,2),'PPO-Equipment-r02-session.json');toast('Session export prepared.');break;
case 'export-raw':download(rawSaved||'No original saved data was available.','PPO-Equipment-r02-recovery.txt','text/plain');break;
case 'reset':showDialog('Reset this r02 session?','This removes locally saved r02 work',callout('Export first if you need this work','All r02 drafts, submissions, review decisions and record changes will return to the synthetic starting data.','warning'),button('Cancel','close-dialog')+button('Reset r02 session','confirm-reset','','primary'));break;
case 'confirm-reset':closeDialog();s=M.initial();recovery=null;rawSaved=null;uploadGeneration++;$('#actor').disabled=false;try{localStorage.removeItem(key);}catch{persistent=false;}save();render(true);toast('r02 session reset.');break;
case 'save-draft':s.drafts[s.selected].savedAt=new Date().toISOString();save();toast(persistent?'Draft saved in this browser.':'Draft retained for this session. Export before closing.');break;
case 'submit':if(uploadBusy)throw Error('Wait for image validation to finish.');{const errors=M.errors(s);if(Object.keys(errors).length){showErrors(errors);break;}transact(n=>M.submit(n),'Submitted snapshot retained. Switch to Casey Reed for review.');}break;
case 'review':{const decision=$('#review-decision').value,reason=$('#review-reason').value,owner=$('#review-owner').value,due=$('#review-due').value;transact(n=>M.review(n,M.latest(n).id,decision,reason,owner,due),'Review decision retained.');}break;
case 'start-revision':transact(n=>M.startRevision(n),'New revision opened; earlier evidence is read-only.');break;
case 'change-restrictions':transact(n=>M.changeRestrictions(n),'Preparation source changed. Read and reconfirm restrictions.');break;
case 'remove-evidence':if(!M.editable(s))throw Error('Submitted evidence is read-only.');s.drafts[s.selected].evidence.splice(Number(b.dataset.index),1);save();render();$('#upload')?.focus();break;
case 'sample-evidence':void addSample().catch(err=>showErrors(err.message));break;
case 'ai':assistant();break;
case 'save-ai':{const id=aiAsset,p={summary:$('#ai-summary').value,owner:$('#ai-owner').value,due:$('#ai-due').value,mode:$('#ai-mode').value,targetId:$('#ai-target').value,sources:aiSources};const next=M.copy(s);M.followup(next,id,p);s=next;save();closeDialog();render(true);toast('Reviewed follow-up and exact citations saved.');}break;
case 'maintenance':maintenanceDialog(b.dataset.mode||'correct');break;
case 'review-maintenance':{pendingMaintenance={action:$('#maint-action').value,name:$('#maint-name').value,serial:$('#maint-serial').value,manufacturer:$('#maint-manufacturer').value,model:$('#maint-model').value,type:$('#maint-type').value,facilityId:$('#maint-facility').value,serves:$('#maint-serves').value?[$('#maint-serves').value]:[],reason:$('#maint-reason').value,parentId:$('#maint-parent').value||null};M.maintain(M.copy(s),s.selected,pendingMaintenance);showDialog('Confirm record change',`${pendingMaintenance.action} · ${asset().ref}`,facts([['Action',pendingMaintenance.action],['Name',pendingMaintenance.name],['Serial',pendingMaintenance.serial],['Installed facility',facilityName(pendingMaintenance.facilityId)],['Reason',pendingMaintenance.reason]])+'<p class="small spaced">The equipment history will retain this decision and its previous context.</p>',button('Cancel','close-dialog')+button('Apply reviewed change','apply-maintenance','','primary'));}break;
case 'apply-maintenance':{const next=M.copy(s),a=M.maintain(next,s.selected,pendingMaintenance);next.selected=a.id;next.view='asset';next.tab='overview';s=next;pendingMaintenance=null;save();closeDialog();render(true);toast('Record change retained in equipment history.');}break;
case 'lifecycle-link':{const links=[['Maintenance plan','Service planning','Draft quarterly inspection schedule; owner Casey Reed; next review 2026-09-21'],['Service agreement','Service agreements','Coverage evidence missing; obtain the authorised agreement and applicable equipment schedule'],['Warranty evidence','Warranty management','No verified start/end evidence. Replacement history does not establish warranty terms'],['Service bulletin','Technical bulletin review','SYN-PPO-SB-000004 r01: fictional firmware review; applicability not decided']];const [title,owner,content]=links[Number(b.dataset.index)];showDialog(title,`${asset().ref} · Owner workflow: ${owner}`,sourceCards([M.source(`lifecycle-${s.selected}-${b.dataset.index}`,1,title,content)])+callout('Read-only workflow handoff',`Continue in ${owner} when integrated. This design does not create or approve that workflow record.`));}break;
}}catch(err){showErrors(err.message);}});
async function boot(){$('#actor').disabled=true;try{rawSaved=localStorage.getItem(key);}catch{persistent=false;storageMessage='Session only — browser storage is unavailable. Export before closing.';}if(rawSaved){try{const parsed=JSON.parse(rawSaved),result=M.validateState(parsed);if(!result.ok)throw Error(result.reason);s=parsed;const evidence=[...Object.values(s.drafts).flatMap(d=>d.evidence),...s.submissions.flatMap(x=>x.evidence)];if(evidence.length){$('#content').innerHTML=head('Checking saved evidence','Validating the retained images before opening this session.');for(const e of new Map(evidence.map(x=>[x.data,x])).values()){if(!signature(e.data,e.type))throw Error('A saved image has an invalid file signature');const dims=await decodeImage(e.data);if(dims.width!==e.width||dims.height!==e.height)throw Error('A saved image has inconsistent dimensions');}}}catch(e){recovery=`Saved session validation failed: ${e.message}. The original data has not been overwritten.`;}}loading=false;$('#actor').disabled=!!recovery;render();}
void boot();
})();
