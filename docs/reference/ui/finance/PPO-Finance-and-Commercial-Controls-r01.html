#ppo-finance{--navy:#242a37;--green:#62bb46;--ink:var(--navy);--paper:#f5f6f8;--surface-white:#fff;--surface:#f6f7f9;--surface-2:#f7f8fa;--surface-3:#fcfcfd;--surface-hover:#f0f2f5;--muted:#667181;--text-secondary:#596779;--link:#355b80;--line:#e1e5eb;--line-strong:#dce2e9;--line-soft:#e9ecf1;--hairline:#cbd2dc;--control-border:#828e9f;--focus:#365d8b;--success:#416d33;--success-surface:#edf5e9;--success-border:#d4e3cb;--success-tint:#f3f7f1;--warning:#80530e;--warning-surface:#fff2d9;--warning-border:#efdbb6;--danger:#993b2a;--danger-surface:#fff1ed;--danger-border:#edc6bd;--info:#346580;--info-surface:#e9f2f8;--info-border:#cfe0ec;--neutral:#526078;--neutral-surface:#edf0f5;--font:PPOBoardRoboto,Roboto,Verdana,sans-serif;--radius-control:6px;--radius-card:7px;--radius-dialog:10px;--shadow:0 16px 52px rgba(36,42,55,.17),0 2px 8px rgba(36,42,55,.06);--shadow-card:0 3px 10px rgba(36,42,55,.10),0 1px 2px rgba(36,42,55,.04);color:var(--ink);font:14px/1.5 var(--font);color-scheme:light;isolation:isolate;min-height:100vh}

#ppo-finance{min-height:100dvh;display:flex;flex-direction:column;font:14px/1.45 var(--font);color:var(--ink);background:var(--paper)}
body{margin:0}#ppo-finance *{box-sizing:border-box}#ppo-finance [hidden]{display:none!important}#ppo-finance button,#ppo-finance input,#ppo-finance select,#ppo-finance textarea{font:inherit;color:inherit}#ppo-finance button{cursor:pointer}#ppo-finance button:disabled{cursor:not-allowed;opacity:.55}#ppo-finance :focus-visible{outline:3px solid var(--focus);outline-offset:3px}#ppo-finance h1,#ppo-finance h2,#ppo-finance h3,#ppo-finance p{margin:0}#ppo-finance h1{font-size:23px;line-height:1.25;font-weight:700}#ppo-finance h2{font-size:19px;font-weight:700}#ppo-finance h3{font-size:14px;font-weight:500}#ppo-finance .icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none;vertical-align:middle}#ppo-finance .skip{position:fixed;top:-100px;left:20px;z-index:100;background:white;padding:12px}#ppo-finance .skip:focus{top:8px!important}
#ppo-finance .module-header{padding:25px 28px 21px;display:flex;align-items:center;justify-content:space-between;gap:24px;background:white;border-bottom:1px solid var(--line)}#ppo-finance .heading{display:flex;align-items:center;gap:14px}#ppo-finance .module-symbol{width:43px;height:43px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;background:var(--surface)}#ppo-finance .module-symbol .icon{width:24px;height:24px}#ppo-finance .eyebrow{font-size:10px;letter-spacing:1.05px;font-weight:700;color:var(--text-secondary);margin-bottom:5px}#ppo-finance .eyebrow span{border-left:1px solid var(--hairline);padding-left:9px;margin-left:6px;color:var(--success)}#ppo-finance .header-actions{display:flex;align-items:center;gap:14px}#ppo-finance .demo-tag{display:flex;align-items:center;gap:7px;font-size:11px;white-space:nowrap;color:var(--text-secondary)}#ppo-finance .dot{width:6px;height:6px;background:var(--green);border-radius:50%}#ppo-finance .role-picker{display:grid;gap:3px;font-size:11px;color:var(--text-secondary)}#ppo-finance select{background:white;border:1px solid var(--control-border);border-radius:6px;min-height:36px;padding:6px 30px 6px 10px;max-width:100%}#ppo-finance .role-picker select{font-size:12px;color:var(--ink)}#ppo-finance .button{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border:1px solid var(--control-border);border-radius:6px;background:white;white-space:nowrap;font-weight:500;font-size:12px;line-height:1.4}#ppo-finance .button:hover{background:var(--surface-hover)}#ppo-finance .button.primary{background:var(--navy);border-color:var(--navy);color:white}#ppo-finance .button.primary:hover{background:#343e50}#ppo-finance .button.quiet{border-color:transparent;background:transparent}#ppo-finance .button.danger{color:var(--danger);border-color:var(--danger-border)}#ppo-finance .icon-button{width:36px;padding:7px}#ppo-finance .link-button{background:transparent;border:0;color:var(--link);padding:4px 0;font-size:12px;font-weight:500;text-align:left;text-decoration:none}#ppo-finance .link-button:hover{text-decoration:underline;text-underline-offset:3px}
#ppo-finance .tabs{display:flex;gap:24px;background:white;padding:0 28px;border-bottom:1px solid var(--line);overflow-x:auto}#ppo-finance .tabs>button{border:0;border-bottom:3px solid transparent;background:none;padding:15px 0 13px;display:flex;gap:8px;align-items:center;white-space:nowrap;font-weight:500;font-size:13px;color:var(--text-secondary)}#ppo-finance .tabs>button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--green)}#ppo-finance .tab-count{padding:1px 6px;border-radius:5px;background:var(--surface-hover);font-size:11px}#ppo-finance #workspace{padding:23px 28px 28px;flex:1;min-width:0;outline-offset:-4px}#ppo-finance .summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:21px}#ppo-finance .summary-card{border:1px solid var(--line);border-radius:7px;background:white;padding:16px 18px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}#ppo-finance .summary-card:hover{border-color:var(--hairline)}#ppo-finance .summary-card strong{font-size:27px;font-weight:500;line-height:1.2;display:block;margin:6px 0 3px;font-variant-numeric:tabular-nums}#ppo-finance .summary-card .summary-label{font-size:12px;font-weight:500}#ppo-finance .summary-card small{display:block;font-size:11px;color:var(--text-secondary)}#ppo-finance .summary-icon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--neutral-surface);color:var(--neutral)}#ppo-finance .summary-icon.warning{background:var(--warning-surface);color:var(--warning)}#ppo-finance .summary-icon.info{background:var(--info-surface);color:var(--info)}#ppo-finance .summary-icon.success{background:var(--success-surface);color:var(--success)}#ppo-finance .section-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:13px}#ppo-finance .section-top p{color:var(--text-secondary);font-size:12px;margin-top:4px}#ppo-finance .section-top h2{font-size:17px}#ppo-finance .panel{background:white;border:1px solid var(--line);border-radius:8px;min-width:0;overflow:hidden}#ppo-finance .toolbar{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}#ppo-finance .search{display:flex;align-items:center;gap:8px;border:1px solid var(--control-border);border-radius:6px;background:white;padding:0 10px;max-width:340px;flex:1;min-width:180px;color:var(--text-secondary)}#ppo-finance .search input{border:0;outline:0;min-height:35px;width:100%;font-size:12px;background:transparent}#ppo-finance .search:focus-within{outline:2px solid var(--focus);outline-offset:2px}#ppo-finance .push{margin-left:auto}#ppo-finance .muted{color:var(--text-secondary)}#ppo-finance .small{font-size:12px}#ppo-finance .micro{font-size:11px}#ppo-finance .chips{display:flex;gap:6px;flex-wrap:wrap}#ppo-finance .chip{font-size:11px;background:var(--surface-hover);border:1px solid var(--line);border-radius:5px;padding:4px 7px;display:flex;gap:7px;align-items:center}#ppo-finance .daily{display:flex;gap:7px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line)}#ppo-finance .daily button{border:1px solid var(--line);border-radius:6px;background:var(--surface-3);padding:5px 9px;font-size:11px}#ppo-finance .daily button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:white}#ppo-finance .table-scroll{overflow-x:auto}#ppo-finance table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}#ppo-finance th{background:var(--surface);font-size:11px;font-weight:500;color:var(--text-secondary);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}#ppo-finance td{padding:15px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}#ppo-finance tbody tr:last-child td{border-bottom:0}#ppo-finance tbody tr:hover{background:var(--surface-3)}#ppo-finance .queue-table{min-width:960px}#ppo-finance .queue-table th:first-child,#ppo-finance .queue-table td:first-child{padd function reconcile(){const items=db.filter(x=>['OutcomeUnknown','ReconciliationRequired'].includes(x.state));return `<div class="section-top"><div><h2>Reconciliation & exceptions</h2><p>Resolve uncertainty and compare each result against its exact approved source.</p></div><span class="badge warning">${items.length} open ${items.length===1?'item':'items'}</span></div>${items.length?items.map(h=>{const diff=differences(h),unknown=h.state==='OutcomeUnknown';return `<section class="panel reconcile-card"><div class="record-header"><div><div class="ref-label">${h.ref} · handoff r${String(h.revision).padStart(2,'0')}</div><h2>${esc(h.customer)}</h2><p>${esc(h.job)}</p></div><div class="header-stamp">${badge(h.state)}${owner(ownerRole[h.state])}</div></div><div class="reconcile-body"><div>${unknown?notice('<strong>Was the original action processed?</strong><br>The demonstration timed out after a possible effect. Look up the original correlation; a fresh processing attempt is unavailable.','warning','alert'):diff.length?notice('<strong>The result does not match the approved quantity.</strong><br>Keep the original result. Record an owned correction request; a request alone does not reconcile this handoff.','warning','alert'):notice('<strong>Source and result quantities match.</strong><br>Review the exact original result and confirm reconciliation.','success','check')}${unknown?`<div class="compare-pair"><div><span class="fact-label">ORIGINAL CORRELATION</span><span class="fact-value">SYN-PPO-OP-${h.id}</span></div><div><span class="fact-label">OBSERVED OUTCOME</span><span class="fact-value">Unknown</span></div></div>`:`<div class="table-scroll" tabindex="0" aria-label="Reconciliation quantities"><table><thead><tr><th scope="col">Line</th><th scope="col" class="num">Approved billable</th><th scope="col" class="num">Result quantity</th><th scope="col">Comparison</th></tr></thead><tbody>${h.lines.map(l=>{const t=h.target?.lines.find(t=>t.id===l.id),match=t&&t.unit===l.unit&&t.qty===l.billable;return `<tr><td>${esc(l.title)}</td><td class="num">${l.billable} ${l.unit}</td><td class="num">${t?`${t.qty} ${t.unit}`:'Unavailable'}</td><td><span class="badge ${match?'success':'warning'}">${match?'Matches':'Difference'}</span></td></tr>`}).join('')}</tbody></table></div><p class="small muted" style="margin-top:12px">Original result: ${esc(h.target?.ref||'Unavailable')} · exact like-unit comparison.${diff.some(x=>x.kind!=='line')?' Missing or additional result lines require investigation.':''}</p>`}${h.correction?`<div style="margin-top:14px">${notice(`<strong>Correction requested · ${esc(h.correction.ref)}</strong><br>${esc(h.correction.reason)}<br>Owner: ${esc(h.correction.owner)}. Original quantities unchanged. Awaiting verified correction evidence.`,'info')}</div>`:''}</div><aside class="reconcile-side"><div><span class="fact-label">NEXT ACTION</span><h3>${unknown?'Find the original result':diff.length?'Obtain a verified correction':'Complete reconciliation'}</h3></div><p class="small muted">${unknown?'Processor action. Lookup recovers the original result; it creates no new transaction.':diff.length?'Reconciler action. Differences remain open until corrected evidence is verified.':'Reconciler action. Closure records this exact source/result comparison.'}</p><button class="button primary" data-reconcile-id="${h.id}" data-command="${unknown?'lookup':diff.length?'correction':'reconcile'}" ${(unknown?role!=='Processor':role!=='Reconciler')||(!unknown&&diff.length&&h.correction)?'disabled':''}>${unknown?'Look up original result':diff.length?h.correction?'Correction requested':'Request correction':'Confirm reconciliation'} ${icon(unknown?'search':'arrow')}</button><button class="link-button" data-open="${h.id}">Open handoff review</button></aside></div></section>`}).join(''):`<div class="panel empty">${icon('check')}<h3>No open reconciliation items</h3><p>The completed records and their evidence remain in the work queue.</p><button class="button" data-view="queue">View work queue</button></div>`}<p class="small muted">Synthetic processing only. A correction request does not change an ERP record, reverse a transaction or establish a reconciled result.</p>`}

function command(c,id=selected){const h=db.find(x=>x.id===id);if(!h||!canCommand(h,c))return toast('This action is not available in the current state and demo role.');selected=id;const expectedRevision=h.revision,expectedState=h.state;
 const settings={submit:['Submit for Finance review','Submit this exact Draft and hold its reviewed quantities for Finance review.','Submit to demo review'],approve:['Approve exact handoff','Confirm the source revision, allocation and financial treatment. Approval does not process or reconcile the handoff.','Approve in demo'],return:['Return for correction','Keep the submitted revision and allocation hold. The preparer will create a revised Draft.','Return with reason'],revise:['Create revised Draft','Preserve the returned revision and carry its allocation into a new Draft.','Create revised Draft'],claim:['Claim processing','Become the accountable processor before recording an external outcome. This preview uses a fictional processor and simulator.','Claim in demo'],outcome:['Record processing outcome','Record what the synthetic processing example observed. An uncertain result must be investigated before a repeat action.','Record demo outcome'],lookup:['Look up the original result','Search the simulator using the original correlation. The retained target is returned; no new result is created.','Look up original'],correction:['Request a correction','Record an owned correction request while retaining the original mismatched result. This action cannot reconcile the handoff.','Record correction request'],reconcile:['Confirm reconciliation','Confirm the like-unit comparison of the exact approved source and the original synthetic result. Non-billable quantities remain dispositioned.','Confirm in demo']}[c];
 const reasonNeeded=['return','revise','correction'].includes(c);
 let fields=`${notice(`<strong>${h.ref} · handoff r${String(h.revision).padStart(2,'0')}</strong><br>${settings[1]}`)}${reasonNeeded?`<label class="field">${c==='revise'?'Revision / coverage note':'Reason and required action'}<textarea name="reason" required maxlength="500" placeholder="Explain the evidence or correction needed…"></textarea></label>`:''}${c==='correction'?`<label class="field">Correction owner<select name="correction-owner"><option>Casey Reed · Processor</option><option>Jordan Taylor · Reconciler</option></select></label>`:''}${c==='outcome'?`<label class="field">Observed outcome<select name="outcome"><option value="Processed">Processed — synthetic result available</option><option value="NotProcessed">Not processed — no effect evidenced</option><option value="Unknown">Unknown — accepted, then timed out</option></select><small>All three are fictional fixtures. “Unknown” retains one original target for later lookup.</small></label>`:''}${c==='lookup'?`<div class="doc-sheet"><span class="fact-label">ORIGINAL CORRELATION</span><strong>SYN-PPO-OP-${h.id}</strong><p>Read-only lookup. The same target identity is retained.</p></div>`:''}<label class="check-label"><input type="checkbox" name="confirm" required><span>${c==='approve'?'I have reviewed this exact source revision and every financial treatment.':c==='reconcile'?'I have compared every source line, unit and original result.':'I understand this action changes only the synthetic example.'}</span></label>`;
 openDialog(settings[0],fields,`<button type="button" class="button" data-action="close-dialog">Cancel</button><button type="submit" class="button primary">${settings[2]}</button>`);
 $('#dialog-form').onsubmit=e=>{e.preventDefault();if(!canCommand(h,c)||h.revision!==expectedRevision||h.state!==expectedState)return error('The handoff context changed. Close this panel and review the current revision.');const f=new FormData(e.target),reason=String(f.get('reason')||'').trim();if(!f.get('confirm')||(reasonNeeded&&!reason))return error('Complete the confirmation and required reason.');

 event(h,settings[2]+(reason?': '+reason:'.'));closeNow();render();$('#tab-'+view).focus();applied(c==='lookup'?'Original result found. No new transaction was created.':c==='correction'?'Correction request recorded. Reconciliation remains open.':'Action recorded in this demo.');};

 if(action==='quantity-help')openDialog('Quantity definitions',`<div class="definition-list">${[['Captured','The technician’s original entry. It remains unchanged.'],['Reviewed','The quantity accepted by the exact Service review.'],['Allocated','The reviewed quantity held by this handoff, including non-billable work.'],['Billable','The portion with an explicit reviewed charging treatment.'],['Non-billable','The remaining allocation, with its own reason. It cannot silently be charged in another handoff.'],['Result quantity','The quantity observed on the original synthetic processing target. It is compared on the same declared unit.']].map(([h,p])=>`<div><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`);
 if(action==='revision-history'){const h=handoff();openDialog('Handoff revision history',`${[...h.originals,{revision:h.revision,state:h.state,lines:h.lines,report:h.report,reportRevision:h.reportRevision,sourceAt:h.sourceAt,reviewNote:h.reviewNote,note:h.note}].reverse().map(s=>`<details class="doc-sheet"><summary>Handoff r${String(s.revision).padStart(2,'0')} · ${labels[s.state]}${s.revision===h.revision?' · current':''}</summary><p>${esc(s.note)}</p>${s.reviewNote?'<p><strong>Revision / coverage note:</strong> '+esc(s.reviewNote)+'</p>':''}<p>${s.report} · r${String(s.reportRevision).padStart(2,'0')}</p>${s.lines.map(l=>`<p>${esc(l.title)}: ${l.allocated} ${l.unit} allocated; ${l.billable??'unresolved'} billable.<br>${esc(l.reason||'Treatment unresolved')}</p>`).join('')}</details>`).join('')}`)}
});
root.addEventListener('input',e=>{if(e.target.id==='queue-search'){query=e.target.value;$('#queue-results').innerHTML=queueResults()}if(e.target.id==='account-search'){accountQuery=e.target.value;$('#account-results').innerHTML=accountResults()}});
root.addEventListener('change',e=>{if(e.target.id==='actor'){role=e.target.value;render();toast('Demo role: '+role+'. This does not change real application permissions.')}if(e.target.id==='queue-sort'){sort=e.target.value;$('#queue-results').innerHTML=queueResults()}if(e.target.id==='account-type'){accountType=e.target.value;$('#account-results').innerHTML=accountResults()}});
$('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const items=$$('.tabs>button'),i=items.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowRight'?1:-1)+items.length)%items.length;setView(items[n].dataset.view,true)});
$('#drawer').addEventListener('cancel',e=>{e.preventDefault();requestClose()});
$('#keep').onclick=()=>{$('#confirm-leave').close();pendingLeave=null;$('#dialog-form')?.querySelector('textarea,input,select')?.focus()};
$('#discard').onclick=()=>{$('#confirm-leave').close();const fn=pendingLeave;pendingLeave=null;fn?.()};
$('#confirm-leave').addEventListener('cancel',()=>{pendingLeave=null});
$('#help').onclick=()=>openDialog('Finance page guide',`<div class="definition-list"><div><h3>1. Start with the work queue</h3><p>Use the search, owner/state filters and daily worklists. Dates are assessed against the fixed 14 September 2026 snapshot.</p></div><div><h3>2. Review the exact handoff</h3><p>Open Northbank’s irrigation service as Reviewer. Inspect quantities and sources, then approve or return it with a reason.</p></div><div><h3>3. Follow the responsible role</h3><p>Choose Processor to claim approved work and record a fictional outcome. Choose Reconciler to compare or raise an owned correction. Roles illustrate responsibility; they do not implement security.</p></div><div><h3>4. Check source completeness</h3><p>Customer accounts show complete, partial and failed-update examples. Unapplied cash never silently reduces invoice remaining.</p></div><div><h3>Changes and scope</h3><p>Changes remain in this tab and reset on reload. No information is sent to MYOB or a customer. The design is a review proposal, not a production Finance system.</p></div></div>`);
$('#reset').onclick=()=>{openDialog('Reset the synthetic example',`<p>Restore the seven original handoffs and three customer account examples. All changes made in this tab will be discarded.</p><label class="check-label"><input type="checkbox" name="confirm" required><span>Reset this demonstration.</span></label>`,`<button type="button" class="button" data-action="close-dialog">Cancel</button><button type="submit" class="button primary">Reset demo</button>`);$('#dialog-form').onsubmit=e=>{e.preventDefault();db=seed();selected='000241';query='';filterState='all';filterOwner='all';shortcut='all';accountQuery='';accountType='all';closeNow();render();$('#reset').focus();$('#save-state').innerHTML='<span class="status-dot"></span>Demo ready · changes reset on reload';toast('Original synthetic examples restored.')}};
hydrate();render();
</script></body></html>
