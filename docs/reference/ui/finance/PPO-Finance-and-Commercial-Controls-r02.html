/* r18 component profile. Finance tables retain their own labelled quantity columns. */
#ppo-finance h1{font-size:24px;line-height:30px}

#ppo-finance .micro,#ppo-finance .fact-label{font-size:11px}
#ppo-finance .badge{font-size:11px}
#ppo-finance .record-name,#ppo-finance .record-link,#ppo-finance .fact-value{font-size:13px}

#ppo-finance .source-foot{padding:14px 18px;display:grid;gap:7px;border-top:1px solid var(--line);font-size:12px;color:var(--text-secondary);line-height:1.6}

#ppo-finance .metric-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden}

#ppo-finance .metric-row small{font-size:11px;color:var(--text-secondary);display:block}
#ppo-finance .metric-row strong{display:block;font-size:13px;font-weight:500;margin-top:5px}
#ppo-finance .evidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 18px}

#ppo-finance .history-meta{font-size:11px;white-space:nowrap;color:var(--text-secondary)}

#ppo-finance .history-item small{display:block;color:var(--text-secondary);font-size:11px;margin-top:5px}
#ppo-finance .observation-label{font-size:12px;color:var(--text-secondary);display:flex;gap:10px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--line)}
#ppo-finance .historical{background:var(--surface);padding:16px 18px;border:1px solid var(--line);border-radius:7px;font-size:12px;line-height:1.7}
#ppo-finance .historical strong{font-weight:500}
#ppo-finance .historical>div{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px}
#ppo-finance .history-link-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#ppo-finance .source-chip{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;background:white;color:var(--link);padding:7px 9px;font-size:11px;text-align:left;gap:6px;align-items:center;min-height:34px}

#ppo-finance .read-state{min-height:330px;display:grid;place-items:center;text-align:center;padding:50px 24px}

#ppo-finance .read-state h2{margin:12px 0 8px}
#ppo-finance .read-state p{font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:18px}

#ppo-finance .field input,#ppo-finance .field textarea,#ppo-finance .field select{min-height:44px;font-size:14px}
#ppo-finance .check-label{font-size:13px}
#ppo-finance .dialog-head h2{font-size:20px}

    if (!Number.isSafeInteger(n) || n > 1000000000000) throw new Error('Quantity is outside this demonstration’s supported range.');

  }
  const qty = n => n == null ? 'Unresolved' : `${Math.floor(n / SCALE)}${n % SCALE ? '.' + String(n % SCALE).padStart(6, '0').replace(/0+$/, '') : ''}`;

  const note = value => { const v = String(value || '').trim(); if (!v || v.length > 1000) throw new Error('Enter a specific reason or evidence reference, up to 1,000 characters.'); return v; };
  const tick = state => new Date(Date.parse(state.now) + 60000).toISOString();
  const sourceLine = (id, title, captured, reviewed, allocated, unit, billable, reason, kind = 'Labour') => ({

  });
  const allNonBillable = h => h.lines.every(l => l.billable === 0 && l.reason.trim());
  const targetLines = h => h.lines.filter(l => l.billable > 0).map(l => ({

  }));
  function makeTarget(h, at, suffix = '') {
    if (!targetLines(h).length) throw new Error('No posting is required. A target must not be created.');

  }
  function event(h, at, role, type, text) {
    h.history.push({ id:`${h.id}-EV-${h.history.length + 1}`, at, actor:actors[role]?.name || role, role, type, revision:h.revision, state:h.state, text });

  const sourceSignature = h => JSON.stringify({ id:h.id, revision:h.revision, version:h.version, report:h.reportRevision, latest:h.latestReportRevision, state:h.state, target:h.state==='OutcomeUnknown'?null:effectiveTarget(h)?.ref, correction:h.correction?.status });
  function create() {

      h('000246','Bayview Nursery','C06','A06','Irrigation pressure investigation','000119','OutcomeUnknown','2026-09-11T00:05:00Z',[
        sourceLine('000609','Investigation labour',60,60,60,'MIN',60,'Fictional approved investigation.')],{note:'An outcome timed out after possible acceptance. Original lookup is required.',reviewTarget:'2026-09-14'}),
      h('000247','Northbank Glasshouses','C01','A01','Preventative maintenance visit','000101','Reconciled','2026-09-09T00:00:00Z',[
        sourceLine('000610','Maintenance labour',120,120,120,'MIN',120,'Reviewed fictional maintenance treatment.')],{reviewTarget:null}),
      h('000248','Riverbend Produce','C05','A05','Travel for site investigation','000122','ReadyForReview','2026-09-14T01:10:00Z',[
        sourceLine('000611','Travel',60,60,60,'MIN',0,'Non-billable Travel under the approved synthetic P11 v2 treatment; no payroll or cost inference.','Travel')],{note:'Review the whole Travel allocation. No posting will be required.'}),
      h('000249','Berryline Growers','C04','A04','Sensor follow-up report','000123','Returned','2026-09-14T01:20:00Z',[
        sourceLine('000612','Follow-up labour',45,45,45,'MIN',45,'Fictional follow-up scope.')],{sourceCurrent:false,latestReportRevision:3,note:'Service issued report r03 after this handoff was prepared. Review the successor in a new Draft.'}),
      h('000250','Greenridge Nursery','C02','A02','Irrigation line repair · allocation A','000124','ReadyForReview','2026-09-14T01:30:00Z',[
        sourceLine('000613','Repair labour',180,180,120,'MIN',90,'Allocation A: 90 billable and 30 non-billable MIN; B retains the other 60 MIN.'),
        sourceLine('000614','Irrigation hose',2.5,2.5,1.75,'M',1.25,'Allocation A: 1.25 billable and 0.5 non-billable M; B retains 0.75 M.','Material')]),
      h('000251','Greenridge Nursery','C02','A02','Irrigation line repair · allocation B','000124','Approved','2026-09-14T01:25:00Z',[

        sourceLine('000614','Irrigation hose',2.5,2.5,0.75,'M',0.75,'Allocation B: the remaining 0.75 M of the same reviewed source.','Material')])
    ];
    handoffs.forEach(x => {
      if (['OutcomeUnknown','ReconciliationRequired','Reconciled'].includes(x.state)) {
        x.processingAt = x.submittedAt; x.outcomeAt = x.submittedAt;

      if (x.submittedAt) {event(x, x.submittedAt, 'Preparer', 'Submitted', 'Exact reviewed allocations reserved for this handoff.');x.history.at(-1).state='ReadyForReview';}

  function accountFixtures() {
    const row = (id,type,date,amount,remaining,status,detail,links = []) => ({ id, ref:`SYN-PPO-${id}`, type,date,due:type==='Invoice'?'2026-09-30':null,amount,remaining,status,detail,links });

  function ledger(state,h,l) {

    const held = allocations.filter(x=>x.state!=='Unreserved').reduce((n,x)=>n+x.quantity,0);

  function blockers(state,h) {
    const list=[];
    if (!h.sourceCurrent) list.push(`Source changed: report r${h.latestReportRevision} is newer than this r${h.reportRevision} snapshot.`);
    list.push(...h.missingEvidence);

      if (l.billable==null || !l.reason.trim()) list.push(`${l.title}: financial treatment and reason required.`);
      if (l.kind==='Travel' && l.billable!==0) list.push('Travel must remain explicitly non-billable under synthetic P11 v2.');

function queueTable(items,partial=false){
  if(!items.length)return `<div class="empty">${icon('search')}<h3>No matching handoffs</h3><p>Your search and filters returned no records.</p><button class="button" data-act="clear-queue">Clear search & filters</button></div>`;
  return `<div class="table-scroll queue-desktop" tabindex="0" aria-label="Finance handoff table"><table class="queue-table"><thead><tr><th scope="col">Handoff / source</th><th scope="col">Customer & work</th><th scope="col">State / evidence</th><th scope="col">Action owner</th><th scope="col">Awaiting action</th><th scope="col">Next action</th><th scope="col">Open</th></tr></thead><tbody>${items.map(h=>{const b=F.blockers(ui.state,h);return `<tr><td><button class="record-link" data-open="${h.id}" ${partial?'disabled':''}>${h.ref}</button><span class="record-meta">${h.wo} · r${h.revision.toString().padStart(2,'0')}</span></td><td><button class="record-link" data-open="${h.id}" ${partial?'disabled':''}>${h.customer}</button><span class="record-meta">${h.job}</span></td><td>${stateBadge(h)}<span class="record-meta"><span class="readiness-dot ${b.length?'warning':''}"></span>${b.length?b.length+' evidence / treatment '+(b.length===1?'gap':'gaps'):'Source treatment recorded'}</span></td><td>${owner(h)}</td><td><span class="record-name">${age(h)}</span><span class="record-meta">Review target: ${F.day(h.reviewTarget)}</span></td><td><span class="record-name">${F.next[h.state]}</span><div class="record-note">${esc(h.note)}</div></td><td><button class="button quiet icon-button" data-open="${h.id}" aria-label="Open ${h.ref}" ${partial?'disabled':''}>${icon('chevron')}</button></td></tr>`;}).join('')}</tbody></table></div><div class="mobile-queue">${items.map(h=>`<article class="queue-card"><div class="queue-card-top"><div><button class="record-link" data-open="${h.id}" ${partial?'disabled':''}>${h.customer}</button><span class="record-meta">${h.job}</span></div>${stateBadge(h)}</div><span class="micro muted">${h.ref} · r${h.revision}</span><p class="small">${F.next[h.state]}</p><span class="small muted">${F.blockers(ui.state,h).length?F.blockers(ui.state,h).length+' evidence / treatment gaps':'Source treatment recorded'} · awaiting ${age(h)}</span><div class="queue-card-bottom">${owner(h)}<button class="button quiet" data-open="${h.id}" ${partial?'disabled':''}>Review ${icon('arrow')}</button></div></article>`).join('')}</div><div class="panel-foot"><span>${partial?items.length+' records from a partial read':items.length+' of '+ui.state.handoffs.length+' loaded handoffs'}</span><span>${partial?'Totals and record actions unavailable':'All synthetic records loaded · PPA-DEMO'}</span></div>`;
}
function handoffSelector(items=ui.state.handoffs,exceptions=false){return `<aside class="panel"><div class="list-title">${exceptions?'Reconciliation':'Handoffs'} <span class="muted">${items.length}</span></div>${exceptions?`<div style="padding:8px 12px"><label class="small"><input type="checkbox" id="show-resolved" ${ui.allExceptions?'checked':''}> Include reconciled</label></div>`:''}<div class="selector-list" aria-label="Choose ${exceptions?'reconciliation':'handoff'}">${items.map(h=>`<button class="select-record" data-select="${h.id}" aria-pressed="${h.id===ui.selected}"><span class="micro muted">${h.ref} · r${h.revision}</span><span class="record-meta record-name">${h.customer}</span><span class="record-meta">${h.job}</span>${stateBadge(h)}</button>`).join('')}</div></aside>`;}
function recordHeader(h){return `<div class="panel"><div class="record-header"><div><div class="ref-label">${h.ref}${badge('Handoff r'+String(h.revision).padStart(2,'0'))}</div><h2>${h.job}</h2><p>${h.customer} · ${h.wo}</p></div><div class="header-stamp">${stateBadge(h)}${owner(h)}</div></div><div class="keyfacts"><div><span class="fact-label">EXACT REPORT</span><button class="link-button" data-inspect="report">${h.report} · r${h.reportRevision}</button></div><div><span class="fact-label">ACCOUNT CONTEXT</span><button class="link-button" data-open-account="${h.account}">Open customer account ${icon('arrow')}</button></div><div><span class="fact-label">ALLOCATION STATE</span><span class="fact-value">${h.hold}</span></div><div><span class="fact-label">COMPANY / BASIS</span><span class="fact-value">${h.company} · quantities only</span></div></div>${flow(h)}</div>`;}
function flow(h){const phases=[['Review',h.reviewedAt],['Processing',h.processingAt],['Outcome',h.outcomeAt],['Reconciliation',h.reconciliation?.at]];const currentIndex=h.state==='ReadyForReview'||h.state==='Draft'||h.state==='Returned'?0:h.state==='Approved'?1:['AwaitingERP','OutcomeUnknown'].includes(h.state)?2:3;return `<div class="flow-strip" aria-label="Separate workflow stages">${phases.map(([name,at],i)=>`<div class="flow-step ${at?'done':currentIndex===i?'current':''}"><span class="step-dot">${at?'✓':i+1}</span><span><strong>${name}</strong><small>${at?F.date(at):h.state==='Cancelled'?'Cancelled':'Not recorded'}</small></span></div>`).join('')}</div>`;}
function readiness(h){const b=F.blockers(ui.state,h);if(b.length)return notice(`<strong>Review the source before proceeding</strong><ul class="plain-list">${b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,'warning');if(h.state==='OutcomeUnknown')return notice('<strong>Original outcome unconfirmed.</strong> Look up the existing correlation. No fresh processing or cancellation is available.','warning');if(h.state==='Cancelled')return notice('Cancelled before any possible effect. The original is retained; its allocation has been released.');if(h.reconciliation)return notice(`<strong>${h.reconciliation.result==='NoPostingRequired'?'No posting required — reconciled.':'Evidence reconciled.'}</strong> ${esc(h.reconciliation.basis)}`,'success');return notice(`<strong>${F.allNonBillable(h)?'No posting will be required.':'Source evidence is current in this example.'}</strong> ${F.allNonBillable(h)?'Keep the non-billable quantities and reasons; separate review and verified no-effect reconciliation still apply.':'Original captured work, reviewed quantities and financial treatment remain separate.'}`,F.allNonBillable(h)?'info':'success');}
function sourceTable(h,editable=false){return `<div class="table-scroll" tabindex="0" aria-label="Source quantities and financial treatments"><table class="comparison"><thead><tr><th scope="col">Source line / category</th><th scope="col" class="num">Captured</th><th scope="col" class="num">Reviewed</th><th scope="col" class="num">This allocation</th><th scope="col" class="num">Billable</th><th scope="col" class="num">Non-billable</th><th scope="col">Treatment</th></tr></thead><tbody>${h.lines.map(l=>`<tr><td><span class="record-name">${l.title}</span><span class="record-meta">${l.entry} · r${l.entryRevision}</span><span class="record-meta">${l.kind} · ${l.direction}</span></td>${[l.captured,l.reviewed,l.allocated,l.billable,l.billable==null?null:l.allocated-l.billable].map(n=>`<td class="num">${n==null?'—':F.qty(n)} ${n==null?'':`<span class="micro muted">${l.unit}</span>`}</td>`).join('')}<td>${badge(l.billable==null?'Needs review':l.billable===0?'Non-billable':l.billable<l.allocated?'Split treatment':'Billable',l.billable==null?'warning':'info')}${editable?`<br><button class="link-button" data-edit-line="${l.id}">Edit treatment</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;}
function sourceView(h){const editable=ui.role==='Preparer'&&h.state==='Draft';return `<section class="panel"><div class="subheading"><div><h3>Source quantities & financial treatment</h3><p>Report r${h.reportRevision} · ${F.date(h.sourceAt)}</p></div><button class="link-button" data-inspect="definitions">Definitions</button></div>${sourceTable(h,editable)}<div class="source-foot">${h.lines.map(l=>`<div><strong>${l.title}:</strong> ${esc(l.reason||'Treatment and reason are required.')}</div>`).join('')}<div>Non-billable quantities remain allocated. They do not imply zero cost or unpaid time. Rates, tax and invoice amounts are not calculated here.</div></div><div class="split-note">${icon('compare')}<span>Review shared source allocations and remaining quantities.</span><button class="link-button" data-inspect="ledger">Open allocation ledger</button></div></section>${h.reviewNote?`<div class="review-note"><strong>Revision / coverage note</strong>${esc(h.reviewNote)}</div>`:''}<div class="review-bottom"><section class="panel"><div class="subheading"><h3>Supporting evidence</h3>${badge('Exact snapshots')}</div>${[['report','Reviewed service report',h.report+' · r'+h.reportRevision],['treatment','Financial treatment basis','Explicit reasons by source line'],['revisions','Handoff revision history',(h.originals.length+1)+' retained revision'+(h.originals.length?'s':'')]].map(([key,title,sub])=>`<button class="document-link" data-inspect="${key}">${icon(key==='revisions'?'history':'document')}<span>${title}<small>${sub}</small></span>${icon('chevron')}</button>`).join('')}</section><section class="panel"><div class="subheading"><h3>Review assistance</h3>${aiMark}</div><div style="padding:16px 18px"><p class="small muted" style="line-height:1.7;margin-bottom:12px">Inspect evidence gaps, understand a difference or prepare wording for a reviewed note.</p>${aiButton('Ask what’s missing','gaps')}<p class="ai-disclaimer">Scripted responses · exact source context · no automatic approval.</p></div></section></div>`;}
function actionButton(h,action,label,primary=false){const why=F.availability(ui.state,h,ui.role,action);return `<button class="button ${primary?'primary':''}" data-command="${action}" ${why?'disabled':''} ${why?`title="${esc(why)}"`:''}>${label}</button>`;}
function actionBar(h){let buttons=[],main='';if(h.state==='Draft'){main='submit';buttons=[actionButton(h,'submit','Submit for review',true),actionButton(h,'cancel','Cancel handoff')];}if(h.state==='ReadyForReview'){main='approve';buttons=[actionButton(h,'return','Return with reason'),actionButton(h,'approve','Approve exact handoff',true)];if(ui.role==='Preparer')buttons.push(actionButton(h,'cancel','Cancel handoff'));}if(h.state==='Returned'){main='revise';buttons=[actionButton(h,'revise','Create revised Draft',true),actionButton(h,'cancel','Cancel handoff')];}if(h.state==='Approved'){main='claim';buttons=[actionButton(h,'claim','Claim processing review',true),actionButton(h,'return','Return approved handoff')];if(ui.role==='Preparer')buttons.push(actionButton(h,'cancel','Cancel handoff'));}if(h.state==='AwaitingERP'){main='outcome';buttons=[actionButton(h,'outcome',F.allNonBillable(h)?'Record no-posting evidence':'Record observed outcome',true)];}if(h.state==='OutcomeUnknown'){main='lookup';buttons=[actionButton(h,'lookup','Look up original outcome',true)];}if(h.state==='ReconciliationRequired')buttons=[`<button class="button primary" data-view="reconcile">Open reconciliation ${icon('arrow')}</button>`];if(h.state==='Reconciled')buttons=[badge(h.reconciliation?.result==='NoPostingRequired'?'No posting required · complete':'Reconciliation complete','success')];if(h.state==='Cancelled')buttons=[badge('Original retained · allocation released')];const why=main?F.availability(ui.state,h,ui.role,main):'';return `<div class="action-bar"><div><h3>${F.next[h.state]}</h3><p>${esc(why||h.note)}</p></div><div class="action-buttons">${buttons.join('')}</div></div>`;}
function review(){const h=current();return `<div class="section-top"><div><h2>Handoff review</h2><p>One exact source, a visible treatment and an accountable next step.</p></div><div class="intro-actions">${aiButton()}<button class="button" data-act="print">${icon('print')}Print review</button></div></div><div class="review-layout">${handoffSelector()}<section class="review-main">${recordHeader(h)}${readiness(h)}<div class="subtabs" aria-label="Handoff detail views">${[['source','Source & allocations'],['processing','Processing evidence'],['history','History · '+h.history.length]].map(([key,label])=>`<button data-sub="${key}" aria-pressed="${ui.sub===key}">${label}</button>`).join('')}</div>${ui.sub==='source'?sourceView(h):ui.sub==='history'?historyView(h):processingView(h)}${actionBar(h)}</section></div>`;}
function evidenceFacts(h,target){const rows=[['Company / account',`${h.company} / ${target?.account||h.account}`],['Customer / currency',`${h.customerId} / ${target?.currency||h.currency}`],['Document type',target?.type||'No processing target'],['Source status',target?.status||h.outcome?.type||'Not recorded'],['Observed',target?.observedAt?F.date(target.observedAt):F.date(h.outcome?.at)],['Original correlation',h.correlation],['Evidence reference',target?.evidence||h.outcome?.evidence||'Unavailable'],['Target reference',target?.ref||'None'],['Exact source',`${h.ref} r${target?.revision||h.revision} / report r${target?.reportRevision||h.reportRevision}`]];return `<div class="evidence-grid">${rows.map(([label,value])=>`<div><span class="fact-label">${label.toUpperCase()}</span><span class="fact-value">${esc(value)}</span></div>`).join('')}</div>`;}
function comparisonTable(h,target=F.effectiveTarget(h)){const c=F.comparison(h,target);return `<div class="table-scroll" tabindex="0" aria-label="Exact source to result comparison"><table class="result-table"><thead><tr><th scope="col">Source / result mapping</th><th scope="col" class="num">Approved billable</th><th scope="col" class="num">Observed result</th><th scope="col" class="num">Difference</th><th scope="col">Comparison</th></tr></thead><tbody>${c.rows.map(r=>`<tr class="${r.match?'':'row-warning'}"><td><span class="record-name">${esc(r.source?.title||'Unexpected result line')}</span><span class="record-meta">${esc(r.target?.id||r.source?.entry||'No mapping')}</span><span class="record-meta">${esc(r.target?.allocation||r.source?.kind||'')}${r.target?' · '+esc(r.target.direction):''}</span></td><td class="num">${r.source?F.qty(r.source.billable)+' '+r.source.unit:'—'}</td><td class="num">${r.target?F.qty(r.target.quantity)+' '+esc(r.target.unit):r.kind==='no-posting'?'Not applicable':'Missing'}</td><td class="num ${r.delta?'difference':''}">${r.kind==='no-posting'?'—':r.delta==null?'Not comparable':(r.delta>0?'+':r.delta<0?'−':'')+F.qty(Math.abs(r.delta))+' '+esc(r.expected.unit)}</td><td>${badge(r.kind==='no-posting'?'No posting required':r.match?'Matches':r.kind==='unexpected'?'Unexpected line':r.kind==='duplicate'?'Duplicate identity':r.kind==='missing'?'Missing line':r.kind==='mapping'?'Mapping differs':'Difference',r.match?'success':'warning')}</td></tr>`).join('')}</tbody></table></div>${c.issues.length?`<div class="result-foot"><strong>Keep reconciliation open</strong><ul>${c.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:`<div class="result-foot">${c.noPosting?'Every non-billable allocation remains dispositioned. Verified no-effect evidence replaces a processing target.':'Company, account, customer, currency, status, source revisions, mappings, units and quantities match the supplied evidence.'}</div>`}`;}
function processingView(h){if(h.state==='OutcomeUnknown')return `<section class="panel"><div class="subheading"><h3>Original processing outcome</h3>${badge('Unknown','warning')}</div><div style="padding:18px">${notice('<strong>Look up the original outcome first.</strong> A possibly accepted target is not exposed as established evidence.','warning')}<div class="compare-pair"><div><span class="fact-label">ORIGINAL CORRELATION</span>${h.correlation}</div><div><span class="fact-label">OBSERVATION</span>Outcome unknown</div></div><p class="small muted">${esc(h.outcome?.evidence||'Outcome observation pending')} · ${F.date(h.outcomeAt)}</p></div></section>${attemptsView(h)}`;if(!h.outcome)return `<section class="panel"><div class="subheading"><h3>Processing evidence</h3>${badge('Not recorded')}</div><div class="empty"><h3>${F.allNonBillable(h)?'No processing target will be required':'No evidenced processing outcome yet'}</h3><p>${F.allNonBillable(h)?'The processor records verified no-effect evidence after separate Finance approval.':'Approval and a processor claim do not establish a processed result.'}</p></div></section>${attemptsView(h)}`;return `<section class="panel"><div class="subheading"><h3>${F.allNonBillable(h)?'No-posting evidence':h.correction?.status==='Verified'||h.correction?.status==='Resolved'?'Verified linked correction':'Original processing evidence'}</h3><button class="link-button" data-inspect="result">Inspect evidence</button></div>${evidenceFacts(h,F.effectiveTarget(h))}${comparisonTable(h)}</section>${attemptsView(h)}`;}
function attemptsView(h){return `<section class="panel"><div class="subheading"><h3>Processing attempts</h3>${badge(h.attempts.length+' retained')}</div>${h.attempts.length?`<div class="history-list">${h.attempts.map(a=>`<div class="history-item">${icon('history')}<div><strong>${a.id}</strong><p>${a.actor} · source r${a.revision} · ${esc(a.outcome||'Original claim retained')}</p><small>${F.date(a.at)} · ${a.correlation}${a.evidence?' · '+esc(a.evidence):''}</small></div></div>`).join('')}</div>`:`<div style="padding:16px 18px" class="small muted">No processor claim has been recorded.</div>`}</section>`;}
function historyView(h){return `<section class="panel"><div class="history-filter"><label class="search">${icon('search')}<input type="search" id="history-search" placeholder="Search the full history…" value="${esc(ui.historyQuery)}" aria-label="Search handoff history"></label><select id="history-type" aria-label="History event type"><option value="all">All event types</option>${[...new Set(h.history.map(e=>e.type))].map(t=>`<option ${ui.historyType===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="history-actor" aria-label="History actor"><option value="all">All actors</option>${[...new Set(h.history.map(e=>e.actor))].map(a=>`<option ${ui.historyActor===a?'selected':''}>${a}</option>`).join('')}</select></div><div id="history-results">${historyResults(h)}</div></section><div class="metric-row">${[['Submitted',h.submittedAt],['Reviewed',h.reviewedAt],['Processing claimed',h.processingAt],['Outcome recorded',h.outcomeAt]].map(([label,at])=>`<div><small>${label}</small><strong>${F.date(at)}</strong></div>`).join('')}</div>`;}
function historyResults(h){const events=h.history.filter(e=>(ui.historyType==='all'||e.type===ui.historyType)&&(ui.historyActor==='all'||e.actor===ui.historyActor)&&(!ui.historyQuery||[e.text,e.type,e.actor,e.state].join(' ').toLowerCase().includes(ui.historyQuery.toLowerCase()))).slice().reverse();return `${events.length?`<div class="table-scroll" tabindex="0" aria-label="Complete handoff activity history"><table class="history-table"><thead><tr><th scope="col">When / who</th><th scope="col">Event</th><th scope="col">Revision / outcome</th><th scope="col">Recorded detail</th></tr></thead><tbody>${events.map(e=>`<tr><td><span class="history-meta">${F.date(e.at)}</span><span class="record-meta">${esc(e.actor)}</span></td><td>${esc(e.type)}</td><td>Handoff r${e.revision}<span class="record-meta">${F.labels[e.state]}</span></td><td>${esc(e.text)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>No matching events</h3><p>Clear the search or choose another event type.</p></div>`}<div class="panel-foot">${events.length} of ${h.history.length} retained events · page-session history · AEST</div>`;}
function reconciliation(){let items=ui.state.handoffs.filter(h=>['OutcomeUnknown','ReconciliationRequired'].includes(h.state)||(ui.allExceptions&&h.state==='Reconciled'));const h=current();if(!items.some(x=>x.id===h.id)&&h.state==='Reconciled'){items=[...items,h];}return `<div class="section-top"><div><h2>Reconciliation & exceptions</h2><p>Understand the difference, obtain the evidence and resolve the exact record.</p></div><div class="intro-actions">${aiButton('Explain this difference','difference')}</div></div>${items.length?`<div class="review-layout">${handoffSelector(items,true)}<section class="review-main">${recordHeader(h)}${readiness(h)}${processingView(h)}${correctionView(h)}${reconciliationActions(h)}<p class="small muted">A recorded correction is an observed synthetic fixture. It does not execute a ledger correction, reversal or MYOB posting.</p></section></div>`:`<div class="panel empty">${icon('check')}<h3>No open reconciliation items</h3><p>Completed records and their original evidence remain in the work queue.</p><button class="button" data-view="queue">Open work queue</button></div>`}`;}
function correctionView(h){if(!h.correction)return '';const c=h.correction,phases=['Requested','Evidence supplied','Verified','Resolved'],step=phases.indexOf(c.status);return `<section class="panel"><div class="subheading"><div><h3>Linked correction · ${c.ref}</h3><p>Original result ${esc(c.original||'not available')} remains unchanged.</p></div>${badge(c.status,tones[c.status])}</div><div class="correction-progress">${phases.map((s,i)=>`<span class="${i<=step?'reached':''}">${i+1}. ${s}</span>`).join('')}</div><div class="source-foot"><div><strong>Owner:</strong> ${esc(c.owner)}</div><div><strong>Required action:</strong> ${esc(c.reason)}</div><div><strong>Evidence required:</strong> ${esc(c.requiredEvidence)}</div></div>${c.evidence?`<div class="subheading"><h3>Observed correction evidence</h3><button class="link-button" data-inspect="correction">Inspect retained observations</button></div>${evidenceFacts(h,c.evidence)}${comparisonTable(h,c.evidence)}`:''}<div class="result-foot"><button class="link-button" data-inspect="original-result">Inspect original result</button>${c.verifiedBy?' · Verified by '+c.verifiedBy+' · '+F.date(c.verifiedAt):''}</div></section>`;}
function reconciliationActions(h){if(h.state==='OutcomeUnknown')return actionBar(h);if(h.state==='Reconciled')return `<div class="action-bar"><div><h3>${h.reconciliation?.result==='NoPostingRequired'?'No posting required':'Reconciliation complete'}</h3><p>${h.reconciliation?.actor||'Reconciler'} · ${F.date(h.reconciliation?.at)}</p></div><button class="button" data-open-history="${h.id}">Open full history</button></div>`;let action='reconcile',label='Confirm reconciliation';const c=F.comparison(h);if(h.correction?.status==='Requested'){action='supplyEvidence';label='Record correction evidence';}else if(h.correction?.status==='Evidence supplied'){action=ui.role==='Processor'?'supplyEvidence':'verifyCorrection';label=ui.role==='Processor'?'Record updated evidence':'Verify correction evidence';}else if(c.issues.length&&!h.correction){action='requestCorrection';label='Request a correction';}const why=F.availability(ui.state,h,ui.role,action);return `<div class="action-bar"><div><h3>${label}</h3><p>${esc(why||'Review the exact source, outcome and evidence before confirming this demonstration action.')}</p></div><div class="action-buttons">${actionButton(h,action,label,true)}<button class="button" data-open-history="${h.id}">Full history</button></div></div>`;}

function openChoice(id){const select=$('#'+id),trigger=$(`[data-choice="${id}"]`);if(!select||select.disabled)return;if(choice?.select===select)return closeChoice();closeChoice(false);const menu=document.createElement('div');menu.className='choice-menu';menu.id='list-'+id;menu.setAttribute('role','listbox');menu.setAttribute('aria-label',select.dataset.choiceLabel||'Choose');menu.innerHTML=[...select.options].map((o,i)=>`<button type="button" class="choice-option" role="option" data-choice-option="${i}" aria-selected="${o.selected}" ${o.disabled?'disabled':''}>${esc(o.text)}${o.selected?icon('check'):''}</button>`).join('');(select.closest('dialog')||root).append(menu);const rect=trigger.getBoundingClientRect(),width=Math.min(Math.max(rect.width,220),window.innerWidth-16);menu.style.width=width+'px';menu.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-width-8))+'px';const height=Math.min(menu.scrollHeight,300),space=window.innerHeight-rect.bottom-8;menu.style.top=(space>=Math.min(height,160)?rect.bottom+5:Math.max(8,rect.top-height-5))+'px';menu.style.maxHeight=Math.max(100,space>=160?Math.min(300,space):Math.min(300,rect.top-13))+'px';choice={menu,select,trigger,typed:'',typedAt:0};trigger.setAttribute('aria-expanded','true');trigger.setAttribute('aria-controls',menu.id);(menu.querySelector('[aria-selected="true"]:not(:disabled)')||menu.querySelector('button:not(:disabled)'))?.focus();}
function chooseOption(index){if(!choice)return;const {select,menu}=choice,option=select.options[index];if(!option||option.disabled)return;select.value=option.value;syncChoice(select);closeChoice();select.dispatchEvent(new Event('change',{bubbles:true}));}
function updatePrint(){const target=$('#print-document');if(!accessible()||!['review','reconcile'].includes(ui.view)){target.innerHTML='<h1>Powerplants One · Finance r02</h1><p>Open an available handoff review to print its source and review evidence.</p>';return;}const h=current();target.innerHTML=`<p>POWERPLANTS ONE · SYNTHETIC FINANCE DESIGN r02</p><h1>Finance handoff review</h1><p>${h.ref} · r${h.revision} · ${F.labels[h.state]}</p><h2>${h.customer}</h2><p>${h.job} · ${h.wo}</p><p>Exact source ${h.report} r${h.reportRevision} · ${h.company} · quantities only</p>${sourceTable(h)}<h2>Financial treatment basis</h2>${h.lines.map(l=>`<p><strong>${l.title}</strong>: ${esc(l.reason||'Treatment unresolved.')}</p>`).join('')}${h.reviewNote?`<p><strong>Review note</strong>: ${esc(h.reviewNote)}</p>`:''}<h2>Outcome & reconciliation</h2><p>${h.state==='OutcomeUnknown'?'Outcome unknown. Original lookup is required; target contents are not established evidence.':h.outcome?`${h.outcome.type} · ${esc(h.outcome.evidence)} · ${F.date(h.outcome.at)}`:'No outcome evidence recorded.'}</p>${h.outcome&&h.state!=='OutcomeUnknown'?comparisonTable(h):''}<p>${h.reconciliation?`${h.reconciliation.result} · ${h.reconciliation.actor} · ${F.date(h.reconciliation.at)}<br>${esc(h.reconciliation.basis)}`:'Reconciliation has not been confirmed.'}</p><h2>Retained activity</h2>${h.history.map(e=>`<p>${F.date(e.at)} · ${esc(e.actor)} · r${e.revision}<br>${esc(e.text)}</p>`).join('')}<p class="print-footer">Design review only. Fictional data; no rates, tax calculation, invoice issuance, MYOB posting or customer distribution. This print is not controlled OUT-14 output. Page-session example at ${F.date(ui.state.now)}.</p>`;}
/* UI bootstrap: interactions use the same guarded Finance model as the isolated checks. */
root.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.dataset.choice){e.preventDefault();openChoice(t.dataset.choice);return;}
  if(t.dataset.choiceOption!=null){chooseOption(Number(t.dataset.choiceOption));return;}
  if(t.dataset.view){if(t.dataset.view==='accounts')closeContext(false);navigate(t.dataset.view);return;}
  if(t.dataset.open){chooseHandoff(t.dataset.open,'review');return;}
  if(t.dataset.select){chooseHandoff(t.dataset.select);return;}
  if(t.dataset.openHistory){chooseHandoff(t.dataset.openHistory,'review','history');return;}
  if(t.dataset.openAccount){ui.account=t.dataset.openAccount;ui.accountType='all';ui.accountQuery='';closeContext(false);navigate('accounts');return;}
  if(t.dataset.account){ui.account=t.dataset.account;ui.accountType='all';ui.accountQuery='';const h=ui.state.handoffs.find(h=>h.account===ui.account);if(h)ui.selected=h.id;closeContext(false);render();$(`[data-account="${ui.account}"]`).focus();return;}
  if(t.dataset.shortcut){ui.shortcut=t.dataset.shortcut;render();$(`[data-shortcut="${ui.shortcut}"]`).focus();return;}
  if(t.dataset.summary){ui.query='';ui.fstate='all';ui.fowner='all';ui.shortcut=t.dataset.summary;render();$('#queue-search').focus();return;}
  if(t.dataset.clearFilter){if(t.dataset.clearFilter==='state')ui.fstate='all';else ui.fowner='all';render();$('#queue-search').focus();return;}
  if(t.dataset.sub){ui.sub=t.dataset.sub;render();$(`[data-sub="${ui.sub}"]`).focus();return;}
  if(t.dataset.command){actionForm(t.dataset.command);return;}
  if(t.dataset.editLine){editTreatment(t.dataset.editLine);return;}
  if(t.dataset.inspect){openContext(t.dataset.inspect,t.dataset.inspect==='account-history'?{account:F.clone(currentAccount())}:{});return;}
  if(t.dataset.transaction){openContext('transaction',{account:F.clone(currentAccount()),transaction:t.dataset.transaction});return;}
  if(t.dataset.linkedTransaction){ui.panelData.transaction=t.dataset.linkedTransaction;renderContext();$('#context-close').focus();return;}
  if(t.dataset.ledgerOpen){const id=t.dataset.ledgerOpen;closeContext(false);chooseHandoff(id,'review');return;}
  if(t.dataset.aiOpen){if(t.dataset.aiOpen==='open')openContext('assistant');else promptAI(t.dataset.aiOpen);return;}
  if(t.dataset.aiPrompt){promptAI(t.dataset.aiPrompt);return;}
  if(t.dataset.aiTab){ui.aiTab=t.dataset.aiTab;renderContext();$(`[data-ai-tab="${ui.aiTab}"]`)?.focus();return;}
  if(t.dataset.aiSource){const [m,i]=t.dataset.aiSource.split(':').map(Number),response=aiState().messages[m]?.response,source=response?.sources[i];if(!source)return;openContext(source.kind==='result'?'result':source.kind==='handoff'?'treatment':'report',{snapshot:F.clone(response.snapshot)});return;}
  if(t.dataset.aiSaveDraft!=null){saveAIDraft(Number(t.dataset.aiSaveDraft));return;}
  if(t.dataset.aiUseDraft){useAIDraft(t.dataset.aiUseDraft);return;}
  if(t.dataset.aiFeedback!=null){const a=aiState();a.activity.push({at:ui.state.now,text:'A response was flagged for human review; no record or financial rule changed.'});toast('Response flagged in this assistant session.');return;}
  const action=t.dataset.act;
  if(action==='close-editor')requestEditorClose();if(action==='close-context')closeContext();if(action==='states')openContext('states');if(action==='filters')filterForm();
  if(action==='clear-queue'){ui.query='';ui.fstate='all';ui.fowner='all';ui.shortcut='all';render();$('#queue-search').focus();}
  if(action==='clear-account'){ui.accountQuery='';ui.accountType='all';render();$('#account-search').focus();}
  if(action==='refresh-account')refreshAccountForm();if(action==='retry-read')runRead('Ready');if(action==='print'){updatePrint();window.print();}
  if(action==='stop-ai')stopAI();if(action==='retry-ai'){const a=aiState();sendAI(a.lastPrompt,a.lastIntent);}
  if(action==='new-response'){const a=aiState();a.follow=true;a.newResponse=false;const body=$('#context-body');body.scrollTop=body.scrollHeight;$('#new-response')?.remove();}
});
root.addEventListener('input',e=>{
  if(e.target.id==='queue-search'){ui.query=e.target.value;$('#queue-results').innerHTML=queueTable(listRows());}
  if(e.target.id==='history-search'){ui.historyQuery=e.target.value;$('#history-results').innerHTML=historyResults(current());}
  if(e.target.id==='account-search'){ui.accountQuery=e.target.value;$('#account-results').innerHTML=accountResults();}
  if(e.target.id==='ai-composer')aiState().composer=e.target.value;
  if(e.target.dataset.draftText){const d=aiState().drafts.find(d=>d.id===e.target.dataset.draftText);if(d&&!d.applied)d.text=e.target.value;}
});
root.addEventListener('change',e=>{
  if(e.target.id==='actor'){ui.role=e.target.value;render();toast('Demo access: '+F.actors[ui.role].name+'. This does not grant real application access.');}
  if(e.target.id==='queue-sort'){ui.sort=e.target.value;$('#queue-results').innerHTML=queueTable(listRows());}
  if(e.target.id==='account-type'){ui.accountType=e.target.value;$('#account-results').innerHTML=accountResults();}
  if(e.target.id==='history-type'){ui.historyType=e.target.value;$('#history-results').innerHTML=historyResults(current());}
  if(e.target.id==='history-actor'){ui.historyActor=e.target.value;$('#history-results').innerHTML=historyResults(current());}
  if(e.target.id==='show-resolved'){ui.allExceptions=e.target.checked;if(!ui.allExceptions&&current().state==='Reconciled'){const first=ui.state.handoffs.find(h=>['OutcomeUnknown','ReconciliationRequired'].includes(h.state));if(first)ui.selected=first.id;}render();$('#show-resolved')?.focus();}
});
$('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const buttons=$$('.tabs>button'),i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;navigate(buttons[n].dataset.view);});
document.addEventListener('keydown',e=>{
  if(choice){const options=[...choice.menu.querySelectorAll('button:not(:disabled)')],index=options.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?options.length-1:(index+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options[n]?.focus();return;}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeChoice();return;}if(e.key==='Tab'){closeChoice(false);return;}if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){const at=Date.now();choice.typed=at-choice.typedAt>700?e.key.toLowerCase():choice.typed+e.key.toLowerCase();choice.typedAt=at;const match=options.find(o=>o.textContent.trim().toLowerCase().startsWith(choice.typed));if(match){e.preventDefault();match.focus();}return;}}
  if(e.target.id==='ai-composer'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!e.isComposing){e.preventDefault();sendAI(aiState().composer);return;}
  if(e.key==='Escape'&&!e.defaultPrevented&&ui.panel&&!$('#editor').open&&!$('#discard-dialog').open){e.preventDefault();closeContext();}
});
document.addEventListener('pointerdown',e=>{if(choice&&!choice.menu.contains(e.target)&&!choice.trigger.contains(e.target))closeChoice(false);});
$('#editor').addEventListener('cancel',e=>{e.preventDefault();requestEditorClose();});
$('#context-panel').addEventListener('cancel',e=>{e.preventDefault();closeContext();});
$('#discard-dialog').addEventListener('cancel',()=>{pendingDiscard=null;});
$('#keep-work').onclick=()=>{$('#discard-dialog').close();pendingDiscard=null;$('#editor-form')?.querySelector('textarea,input,button')?.focus();};
$('#discard-work').onclick=()=>{$('#discard-dialog').close();const action=pendingDiscard;pendingDiscard=null;action?.();};
$('#help').onclick=()=>openContext('guide');$('#scenarios').onclick=scenarioForm;$('#reset').onclick=resetForm;
window.addEventListener('resize',()=>{closeChoice(false);const panel=$('#context-panel');if(panel.open){const active=document.activeElement,mobile=window.matchMedia('(max-width:780px)').matches;if(mobile!==panel.matches(':modal')){panel.close();if(mobile)panel.showModal();else panel.show();if(active?.isConnected)active.focus();}contextGeometry();}});
window.addEventListener('scroll',()=>{if($('#context-panel').open)contextGeometry();},{passive:true});
window.addEventListener('beforeprint',updatePrint);
hydrate();render();
/* PPO_FINANCE_UI_END */
</script>
</body></html>
