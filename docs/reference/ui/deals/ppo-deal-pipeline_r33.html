SUBSTITUTIONS / CONFLICTS:
1. Accepted r08's navy actions, fitting desktop columns and ONE shared vertical
   board scroll override brief §§7.1/18's independent columns and 280px minimum.
   All five stages fit at every supported Board width (1024px and above).
   Below 1024px, List is used. Side panels overlay without changing column widths.
2. The requested #deal-board root wraps #ppo-deals, the portable PPO scope.
   Tokens and local reset are scoped on #ppo-deals; only the document adapter
   sets the body margin/overflow. No application shell is drawn.
3. Expected close remains visible on cards per accepted UI card definition.
   Value sits on the close-date row so titles remain readable in fitting columns.
4. Governed exit statements are used verbatim, split only at explicit conjunctions.
5. Stage-rule table is applied conservatively. A paragraph in the stage decision
   also mentions direct Quoting-to-Closing acceptance; this conflicts with its
   one-stage-forward table. No silent skip exception is introduced here.
6. Page search is withdrawn by supplied brief §12.2 but the shell record and CI
   still expect it. data-page-search="off" is the reinstatement toggle. No route,
   global search or production contract is changed by this prototype.
7. Bulk movement is now requested in this design brief; it remains prototype
   behaviour, not acceptance of a production command or permission contract.

TOKEN PLAN: navy #242a37 (actions and text); green #62bb46 (progress/focus cues);
white #ffffff (records); workspace #f5f6f8 (canvas); divider #dce0e5; muted #606977.
Roboto when locally installed, Verdana/system fallback; no font requests.
Type: 11–12 metadata, 13 body, 14 toolbar, 14–16 stage, 20 detail. Four-pixel spacing base.
Radii: 6 controls / 7 cards / 10 panels. Semantic error/attention roles reuse PPO.
Principles: next action before secondary detail; changes visible in context;
consequences and recovery visible at the moment of a movement.

OPEN POINTS — deliberately not settled by this HTML:
1. Whether every move needs an explicit recorded reason or a generic one suffices.
2. Stage probabilities: 10/25/50/70/90% are assumed illustrative estimates.
3. What Won triggers for Projects: create, link or record a handover due.
4. Whether page-level search returns.
5. Stage entry reset / ordinal semantics on re-entry. Demo uses latest entry only.
6. Whether exit criteria ever gate moves. They are advisory in this prototype.
7. Forecast-category ownership and manager override permissions.

ASSUMPTIONS: histories track stages, not prior values/categories. Movement-value
deltas assume those fields unchanged in historical snapshots and state this on hover.
Forecast estimates exclude Omitted, show owner judgement separately, and use the
current filtered scope. Coverage targets are illustrative, configurable constants.
The 18 current opportunities reconcile to $1,189,150.50; two additional outcome-only
historical snapshots power the retrospective tray and never count as open records.
Two missing-action and two overdue examples give four high signals across 18 records.
Coloured initials denote internal staff; outlined people denote external contacts.
Primary contact names appear below the organisation on cards and in List.
Exit checkbox substructure, failure simulations and in-memory Undo are presentation
proposals. No fixture is evidence of business or production acceptance.

EXCLUSIONS: no WIP cap, opaque score, quotation status badge, second pipeline,
scatter/bubble view, gamification, card-size weighting or next-action quality score.
These add scope or contradict the deterministic, scannable working surface.

RESEARCH: W3C WCAG 2.2 SC 2.5.7 requires pointer alternatives in addition to keyboard:
https://www.w3.org/WAI/WCAG22/Understanding/dragging-movements.html
Pipedrive product reference: https://www.pipedrive.com/ (activity-centred pipeline).
Do not infer a claim that competitors lack comparable capabilities.

function openDeleteOpportunity(id,expectedVersion){const d=byId(id);if(!d||!isOpen(d))return;openDialog('delete-opportunity','Delete opportunity?',`<p class="delete-title">${esc(d.title)}</p><p class="panel-note">${esc(d.organisation)}</p><p style="margin-top:16px">This removes the opportunity from the board, List and forecast. You can restore it with Undo during this session.</p><div class="detail-facts delete-facts"><div><span class="fact-label">Opportunity value</span><strong>${money(d.value)}</strong></div><div><span class="fact-label">Weighted estimate removed</span><strong>${money(weighted(d))}</strong></div></div><p class="delete-feedback" role="status"></p>`,btn('close-dialog','Keep opportunity','','btn')+btn('confirm-delete','Delete opportunity','trash','danger-btn btn',`data-id="${id}" data-testid="confirm-delete"`),'',{testid:'delete-opportunity-dialog',id,expectedVersion:expectedVersion??d.version});}
async function deleteOpportunity(id,dialog){const rec=dialogStack.find(r=>r.dialog===dialog),d=byId(id),feedback=dialog.querySelector('.delete-feedback');if(!rec||!d||!isOpen(d)||d.version!==rec.expectedVersion||serverRecords.get(id)?.version!==d.version){if(feedback)feedback.textContent='This opportunity has changed. Close this window and review the latest record before deleting it.';return;}if(dialog.getAttribute('aria-busy')==='true')return;dialog.setAttribute('aria-busy','true');const button=dialog.querySelector('[data-action=confirm-delete]');button.disabled=true;const result=await patchDeals([id],{deletedAt:new Date().toISOString(),deletedBy:CURRENT_USER.id},'Deleted opportunity '+d.title);dialog.setAttribute('aria-busy','false');button.disabled=false;if(!result.count){feedback.textContent='The opportunity was not deleted. Please try again.';return;}state.selection.delete(id);if(triage){triage.ids=triage.ids.filter(x=>x!==id);triage.index=Math.min(triage.index,Math.max(0,triage.ids.length-1));}for(const panel of [...dialogStack].reverse())if(panel.id===id||panel.dialog===dialog)closeDialog(panel.dialog,true);if(activeDealId===id)backToBoard();else render();syncSelectionPanel();renderTriage();}
function openPipelineTransfer(id){const d=byId(id);if(!d||!isOpen(d))return;openDialog('pipeline-transfer','Move to another pipeline',`<p class="delete-title">${esc(d.title)}</p><p class="panel-note">${esc(d.organisation)}</p><div class="transfer-current">${icon('pipeline')}<div><span class="fact-label">Current pipeline</span><strong>Sales pipeline</strong><p class="panel-note">${esc(d.stage)}</p></div></div><label class="fact-label" for="pipeline-destination">Destination pipeline</label><select id="pipeline-destination" disabled aria-describedby="pipeline-unavailable"><option>No other pipelines configured</option></select><p class="panel-note" id="pipeline-unavailable">Another sales pipeline must be configured before this opportunity can be moved. It remains in Sales pipeline.</p>`,btn('close-dialog','Close','','btn'),'',{testid:'pipeline-transfer-dialog',id});}

root.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='confirm-delete'){e.preventDefault();e.stopImmediatePropagation();await deleteOpportunity(el.dataset.id,el.closest('dialog'));}else if(el.dataset.action==='drag-target'){e.preventDefault();e.stopImmediatePropagation();if(!drag||!dragDestinationAllowed(drag.from,el.dataset.dropOutcome))return;drag.to=el.dataset.dropOutcome;await finishDrag();}});


/* r22 documents and linked follow-through. Local demonstration only. */
function documentsFor(d){return (d.documentIds||[]).map(id=>DOCUMENTS.get(id)).filter(Boolean);}
function currentQuote(d){const q=d.quoteIssue,doc=q&&DOCUMENTS.get(q.documentId);return q&&doc&&(d.documentIds||[]).includes(doc.id)&&doc.status==='Issued'&&doc.sourceModule==='Estimating'?{...q,document:doc}:null;}
function quoteStatus(d){const q=currentQuote(d);if(!q)return null;const days=dayDiff(q.validUntil);return {q,days,label:days<0?'Expired '+Math.abs(days)+'d ago':days===0?'Expires today':days<=7?'Expires in '+days+'d':'Valid until '+shortDate(q.validUntil),tone:days<=7?'attention':'neutral'};}
function deliveryStatus(d){const p=d.delivery,unknown={state:'unknown',label:'Needs confirmation',explanation:'Record the customer’s required date and a sourced supplier lead time to compare the timing.'};if(!p)return unknown;const doc=DOCUMENTS.get(p.evidenceDocumentId),numbers=['leadDays','transitDays','installationDays'];if(!doc||!(d.documentIds||[]).includes(doc.id)||doc.category!=='Supplier'||numbers.some(k=>p[k]===null||p[k]===''||!Number.isFinite(Number(p[k]))||Number(p[k])<0)||['requiredDate','orderDate','confirmedAt'].some(k=>!p[k]||!Number.isFinite(Date.parse(p[k]))))return unknown;const age=-dayDiff(p.confirmedAt);if(age<0||age>30)return {...unknown,explanation:age<0?'The supplier confirmation date is in the future.':'Supplier evidence is more than 30 days old. Reconfirm it before using this planning comparison.'};const projected=new Date(p.orderDate);projected.setUTCDate(projected.getUTCDate()+numbers.reduce((n,k)=>n+Number(p[k]),0));const buffer=Math.round((Date.parse(dateOnly(p.requiredDate))-Date.parse(dateOnly(projected.toISOString())))/86400000);return {state:buffer<0?'late':'fits',label:buffer<0?Math.abs(buffer)+'d beyond requested date':buffer+'d planning buffer',projected:projected.toISOString(),buffer,document:doc,explanation:`${p.leadDays} days supply + ${p.transitDays} transport + ${p.installationDays} installation. Calendar days from the planned order date.`};}
function triageCandidates(){return derived.visible.filter(d=>(derived.health[d.id]||[]).some(h=>h.severity===3||['quote-expiring','quote-expired','delivery-late','task-overdue','task-blocked'].includes(h.id)));}
function canonicalOrganisation(name){const key=name.trim().replace(/\s+/g,' ').toLowerCase();if(!ORGANISATIONS.has(key))ORGANISATIONS.set(key,'SYN-PPO-ORG-'+String(ORGANISATIONS.size+1).padStart(6,'0'));return ORGANISATIONS.get(key);}
function relatedDeals(d){return deals.filter(x=>x.id!==d.id&&!x.deletedAt&&x.organisationId&&x.organisationId===d.organisationId);}
function docBadge(doc){return `<span class="document-state ${doc.status==='Issued'?'issued':doc.status==='Draft'?'draft':''}">${esc(doc.status)}</span>`;}
function docLink(d,id,label='Open document'){const doc=DOCUMENTS.get(id);return doc&&(d.documentIds||[]).includes(id)?btn('document-open',esc(label),'paperclip','document-link',`data-id="${d.id}" data-document="${id}" data-testid="document-open-${id}"`):'';}
function quoteSection(d){const st=quoteStatus(d);return `<section class="detail-section follow-section" data-testid="quotation-summary"><h3>Current issued quotation</h3>${st?`<div class="context-line"><strong>${esc(st.q.document.revision)} · ${money(st.q.value)}</strong><span class="context-status ${st.tone}">${st.label}</span></div>${docLink(d,st.q.document.id,st.q.document.name)}<p class="panel-note">Issued ${shortDate(st.q.issuedAt)} · Estimating owns this exact revision. ${documentsFor(d).some(x=>x.category==='Quotation'&&x.status==='Draft')?'A newer draft is available; it has not replaced this issue.':''}</p>`:'<p class="panel-note">No issued quotation is linked. Drafts and uploaded files do not count as an issued offer.</p>'}</section>`;}
function waitingSection(d){const a=d.nextActivity,w=a&&d.waitingOn;return `<section class="detail-section follow-section" data-testid="waiting-summary"><h3>Follow-up ${isOpen(d)?btn('waiting-edit',w?'Change':'Set waiting on','clock','quiet small-btn',`data-id="${d.id}"`):''}</h3>${w?`<p><strong>Waiting on ${esc(w.party)}</strong></p><p class="context-copy">${esc(w.note)}</p><p class="panel-note">${esc(a.title)} · ${dueText(a.dueAt)} · ${esc(a.owner.name)}</p>`:'<p class="panel-note">No dependency recorded. Use “waiting on” when the next activity depends on a response.</p>'}</section>`;}
function intakeLabel(state){return state==='AcceptedForEstimating'?'Accepted for estimating':state;}
function intakeSection(d){const p=d.intake,missing=p?.requirements.filter(x=>!x.met)||[];return `<section class="detail-section follow-section" data-testid="intake-summary"><h3>Estimating handover ${btn('intake-open',p?'Review':'Prepare','task','quiet small-btn',`data-id="${d.id}"`)}</h3><div class="context-line"><strong>${p?intakeLabel(p.state):'Not prepared'}</strong>${p?`<span class="view-note">r${String(p.revision).padStart(2,'0')}</span>`:''}</div><p class="panel-note">${p?`${esc(USERS.find(u=>u.id===p.ownerId)?.name||'Unassigned')} · ${missing.length?missing.length+' required item'+(missing.length===1?'':'s')+' incomplete':'Required items recorded'}`:'Prepare the brief for the receiving estimator.'}</p>${p?.clarification?`<p class="context-copy">${esc(p.clarification)}</p>`:''}</section>`;}
function deliverySection(d){const p=d.delivery,s=deliveryStatus(d);return `<section class="detail-section follow-section" data-testid="delivery-summary"><h3>Delivery timing ${isOpen(d)?btn('delivery-edit',p?'Review':'Add dates','calendar','quiet small-btn',`data-id="${d.id}"`):''}</h3><span class="context-status ${s.state==='late'?'attention':''}">${s.label}</span>${s.projected?`<div class="detail-facts compact-facts"><div><span class="fact-label">Customer needs it</span>${shortDate(p.requiredDate)}</div><div><span class="fact-label">Planning estimate</span>${shortDate(s.projected)}</div></div>`:''}<p class="panel-note">${esc(s.explanation)}</p>${s.document?docLink(d,s.document.id,'Supplier confirmation · '+shortDate(p.confirmedAt)):''}</section>`;}
function relatedSection(d){const arr=relatedDeals(d);return `<section class="detail-section follow-section" data-testid="related-summary"><h3>Related opportunities <span class="view-note">${arr.length}</span></h3><p class="panel-note">Same organisation · ${esc(d.organisation)}. Site relationships are not inferred.</p>${arr.map(x=>`<button class="related-record" data-action="deal-page" data-id="${x.id}"><span><strong>${esc(x.title)}</strong><small>${esc(x.stage)} · ${x.id}</small></span>${icon('right')}</button>`).join('')||'<p class="empty-inline">No other opportunities for this organisation in the sample session.</p>'}${btn('related-new','Create related opportunity','plus','quiet small-btn',`data-id="${d.id}"`)}</section>`;}
function followThrough(d){return waitingSection(d)+quoteSection(d)+intakeSection(d)+deliverySection(d)+relatedSection(d);}
function documentRow(d,doc){return `<li class="document-row" data-testid="document-row-${doc.id}"><span class="document-type" aria-hidden="true">${icon(doc.mime.startsWith('image/')?'image':'document')}</span><div class="document-copy">${docLink(d,doc.id,doc.name)}<p>${esc(doc.category)} · ${esc(doc.revision)} · ${shortDate(doc.updatedAt)}</p><p>${esc(doc.sourceModule)} · ${(doc.size/1024).toFixed(0)} KB</p></div>${docBadge(doc)}</li>`;}
function documentsBody(d,rec={}){const all=documentsFor(d),q=currentQuote(d),term=(rec.docSearch||'').toLowerCase(),category=rec.docFilter||'',history=!!rec.docHistory,matching=all.filter(doc=>(history||doc.status!=='Superseded')&&(!category||doc.category===category)&&(!term||[doc.name,doc.title,doc.sourceRef].some(x=>x.toLowerCase().includes(term)))).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));return `<div class="documents-content" data-testid="documents-content"><div class="documents-heading"><div><h3>Documents <span class="view-note">${all.length}</span></h3><p class="panel-note">Linked to this opportunity</p></div>${isOpen(d)?btn('document-add','Add document','plus','btn',`data-id="${d.id}" data-testid="document-add-button"`):''}</div>${q?`<section class="issued-document"><span class="eyebrow">Current issued quotation · ${q.document.revision}</span>${docLink(d,q.document.id,q.document.name)}<p>${money(q.value)} · ${quoteStatus(d).label}</p></section>`:''}${all.length?`<div class="document-controls"><label class="sr-only" for="doc-search-${d.id}">Search documents</label><input type="search" id="doc-search-${d.id}" data-document-search="${d.id}" value="${esc(rec.docSearch||'')}" placeholder="Find a document…"><label class="sr-only" for="doc-category-${d.id}">Document category</label><select id="doc-category-${d.id}" data-document-filter="${d.id}"><option value="">All types</option>${[...new Set(all.map(x=>x.category))].sort().map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select></div><label class="check-field document-history"><input type="checkbox" data-document-history="${d.id}" ${history?'checked':''}>Show previous revisions</label><ul class="document-list">${matching.map(doc=>documentRow(d,doc)).join('')}</ul>${!matching.length?'<p class="empty-inline">No documents match these filters.</p>':''}`:`<div class="document-empty">${icon('paperclip')}<h3>No documents yet</h3><p>Add a brief, drawing or supporting file to this opportunity.</p></div>`}<p class="document-footnote">Embedded files are fictional examples of linked source records. Files you add stay in this browser session and disappear on reload. Issued quotations remain owned by Estimating.</p></div>`;}


function snapshotReview(d,rec){const quote=quoteStatus(d),delivery=deliveryStatus(d),rows=[['waiting','Waiting on',d.nextActivity&&d.waitingOn?d.waitingOn.party:'No dependency',waitingSection(d)],['quote','Issued quotation',quote?quote.q.document.revision+' · '+quote.label:'Not linked',quoteSection(d)],['intake','Estimating handover',d.intake?intakeLabel(d.intake.state):'Not prepared',intakeSection(d)],['delivery','Delivery timing',delivery.label,deliverySection(d)],['related','Related opportunities',String(relatedDeals(d).length),relatedSection(d)]];return `<section class="detail-section snapshot-review"><h3>Deal follow-through</h3>${rows.map(([key,label,value,body])=>`<details class="snapshot-disclosure" data-followthrough="${key}" ${(rec.expanded||[]).includes(key)?'open':''}><summary><span>${label}</span><strong>${esc(value)}</strong>${icon('chevron')}</summary>${body}</details>`).join('')}</section>`;}
function snapshotContents(d,rec){const marker='<section class="detail-section" data-testid="exit-criteria-';return rec.detailMode==='documents'?documentsBody(d,rec):detailBody(d).replace(marker,snapshotReview(d,rec)+marker);}

function documentURL(doc){const raw=atob(doc.bytes),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return URL.createObjectURL(new Blob([bytes],{type:doc.mime}));}
function openDocument(id,documentId){const d=byId(id),doc=DOCUMENTS.get(documentId);if(!d||d.deletedAt||!(d.documentIds||[]).includes(documentId)||!doc){toast('This document is not linked to this opportunity.',{error:true});return;}const url=documentURL(doc),media=doc.mime==='application/pdf'?`<iframe class="document-pdf" title="${esc(doc.name)}" src="${url}#toolbar=1&navpanes=0"></iframe>`:doc.mime.startsWith('image/')?`<img class="document-image" src="${url}" alt="${esc(doc.title)}">`:`<pre class="document-text">${esc(doc.text||'No text content available.')}</pre>`;const dialog=openDialog('document-viewer',esc(doc.title),`<div class="document-viewer-bar"><div>${docBadge(doc)} <span>${esc(doc.revision)} · ${esc(doc.sourceModule)}</span></div><div class="viewer-actions">${doc.text&&doc.mime==='application/pdf'?btn('document-text-toggle','Text version','document','btn','aria-pressed="false"'):''}<a class="btn" href="${url}" download="${esc(doc.name)}" data-testid="document-download">${icon('download')}Download</a></div></div><div class="document-canvas" data-testid="document-preview">${media}</div>${doc.text&&doc.mime==='application/pdf'?`<pre class="document-text text-alternative" hidden>${esc(doc.title)}\n${esc(doc.sourceRef)} · ${esc(doc.revision)} · ${esc(doc.status)}\n\n${esc(doc.text)}</pre>`:''}<p class="viewer-caption">${esc(doc.name)} · ${doc.sourceModule==='CRM upload'?'Local attachment':'Fictional sample'}${doc.mime==='application/pdf'?' · If your browser cannot display the PDF, use Download'+(doc.text?' or Text version':'')+'.':''}</p>`,'','document-viewer',{id,documentId,objectURL:url,returnElement:document.activeElement,testid:'document-viewer',subtitle:esc(d.title)});return dialog;}
function openDocumentAdd(id){const d=byId(id);if(!d||!isOpen(d))return;openDialog('document-add','Add supporting document',`<p class="panel-note">Attach a local file for this review session. It will not create or replace an issued quotation.</p><form id="document-add-form" data-form="document-add" data-id="${id}" data-version="${d.version}">${field('file','Choose a file',input('file','file','','accept=".pdf,.png,.jpg,.jpeg,.webp,.txt" required'),'PDF, PNG, JPEG, WebP or plain text. Maximum 10 MB per file; 50 MB per session.')}${field('documentTitle','Display title',input('documentTitle','text','','maxlength="160" placeholder="Use the filename"'))}${field('documentCategory','Category',select('documentCategory',['Supporting file','Brief','Drawing','Supplier'],'Supporting file'))}<p class="form-status" role="status"></p></form>`,btn('close-dialog','Cancel','','btn')+'<button type="submit" form="document-add-form" class="primary">Add document</button>','',{testid:'document-add-dialog'});}
function readLocalFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(new Uint8Array(reader.result));reader.onerror=()=>reject(new Error('The file could not be read. Choose it again.'));reader.readAsArrayBuffer(file);});}
function fileMedia(name,bytes){const ext=name.toLowerCase().split('.').pop(),starts=a=>a.every((v,i)=>bytes[i]===v);if(ext==='pdf'&&starts([37,80,68,70,45]))return'application/pdf';if(ext==='png'&&starts([137,80,78,71,13,10,26,10]))return'image/png';if(['jpg','jpeg'].includes(ext)&&starts([255,216,255]))return'image/jpeg';if(ext==='webp'&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')return'image/webp';if(ext==='txt'&&!bytes.slice(0,4096).includes(0))return'text/plain';return null;}
async function saveDocument(form,v){const d=byId(v.id||form.dataset.id),file=form.elements.file.files[0];if(!file){setError(form,'file','Choose a file.');return false;}if(!file.size||file.size>10*1024*1024){setError(form,'file','Choose a non-empty file no larger than 10 MB.');return false;}const used=[...DOCUMENTS.values()].filter(x=>x.sourceModule==='CRM upload').reduce((n,x)=>n+x.size,0);if(used+file.size>50*1024*1024){setError(form,'file','The 50 MB session limit has been reached.');return false;}const bytes=await readLocalFile(file),mime=fileMedia(file.name,bytes);if(!mime){setError(form,'file','This file type or signature is not supported. Use PDF, PNG, JPEG, WebP or plain text.');return false;}let raw='';for(let i=0;i<bytes.length;i+=8192)raw+=String.fromCharCode(...bytes.slice(i,i+8192));const encoded=btoa(raw);if(documentsFor(d).some(x=>x.bytes===encoded)){setError(form,'file','This exact file is already linked to the opportunity.');return false;}const id='LOCAL-DOC-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),same=documentsFor(d).filter(x=>x.sourceModule==='CRM upload'&&x.name===file.name);const doc={id,dealId:d.id,title:v.documentTitle.trim()||file.name,name:file.name,category:v.documentCategory,revision:'v'+(same.length+1),status:'Attachment',sourceModule:'CRM upload',sourceRef:id,updatedAt:new Date().toISOString(),mime,bytes:encoded,size:file.size,text:mime==='text/plain'?new TextDecoder().decode(bytes):''};DOCUMENTS.set(id,doc);const result=await patchDeals([d.id],{documentIds:[...(d.documentIds||[]),id]},'Added document '+file.name);if(!result.count)DOCUMENTS.delete(id);return !!result.count;}
function openWaiting(id){const d=byId(id),a=d.nextActivity,w=d.waitingOn;if(!d||!isOpen(d))return;openDialog('waiting','Waiting on a response',`<p class="panel-note">The person and due date below belong to the opportunity’s next activity.</p><form id="waiting-form" data-form="waiting" data-id="${id}" data-version="${d.version}">${field('party','Waiting on',select('party',[['','No dependency'],'Customer','Supplier','Estimating','Engineering'],w?.party||''))}${field('waitingNote','What is needed?',textarea('waitingNote',w?.note||'','maxlength="1000"'))}${field('followTitle','Next activity',input('followTitle','text',a?.title||'','maxlength="200"'))}<div class="field-row">${field('followType','Type',select('followType',['Call','Meeting','Email','Note'],a?.type||'Task'))}${field('followDate','Follow-up due',input('followDate','date',dateOnly(a?.dueAt||at(2))))}</div>${field('followOwner','Activity owner',assigneeSelect(d,'followOwner',a?.owner.id||d.owner.id))}<p class="panel-note">Clearing the dependency keeps the existing next activity.</p><p class="form-status" role="status"></p></form>`,btn('close-dialog','Cancel','','btn')+'<button type="submit" form="waiting-form" class="primary">Save follow-up</button>');}
function blankIntake(d){return {id:d.id.replace('-OP-','-INT-'),revision:1,state:'Draft',ownerId:'',requirements:[['need','Customer objective recorded'],['site','Site and equipment context recorded'],['scope','Scope and measurements confirmed'],['timing','Required timing recorded']].map(([key,label])=>({key,label,met:false})),clarification:'',history:[]};}

async function simulateEmail(id){const d=byId(id),draft=emailDrafts.get(id);if(!d||!draft)return;const panel=dialogStack.find(r=>r.type==='email-preview');if(panel){panel.dialog.setAttribute('aria-busy','true');panel.dialog.querySelector('[data-action=simulate-email]').disabled=true;}const result=await patchDeals([id],{correspondence:[{id:'LOCAL-COM-'+Date.now(),direction:'Outgoing',localPreview:true,sample:true,at:new Date().toISOString(),from:'sales@example.invalid',to:draft.to,subject:draft.subject,body:draft.body,documentIds:[]},...(d.correspondence||[])],activityLog:[{at:new Date().toISOString(),text:`Email demonstration: ${draft.subject} — preview recorded, not sent.`,by:CURRENT_USER.name},...d.activityLog]},'Recorded email demonstration (not sent)');if(panel){panel.dialog.setAttribute('aria-busy','false');if(result.count)closeDialog(panel.dialog,true);else panel.dialog.querySelector('[data-action=simulate-email]').disabled=false;}if(result.count)toast('Email demonstration recorded. No message was sent.');}

function recordRoute(id){return '#deal/'+encodeURIComponent(id);}
function initialRoute(){const match=location.hash.match(/^#deal\/([^/]+)$/);if(match){try{const id=decodeURIComponent(match[1]);activeDealId=id;}catch(e){activeDealId=null;}}}
function openDealPage(id){if(!byId(id))return;for(const r of [...dialogStack])if(r.dirty){requestClose(r.dialog);return;}const sc=root.querySelector('.board-scroll,.list-scroll');if(!activeDealId){lastBoardScroll={x:sc?.scrollLeft||0,y:sc?.scrollTop||0};lastDealTrigger=document.activeElement?.dataset.testid;}for(const r of [...dialogStack].reverse())closeDialog(r.dialog,true);activeDealId=id;recordTab='overview';pageDocumentState={};const u=new URL(location.href);u.hash=recordRoute(id);try{history.pushState({ppoDeal:id,ppoFromBoard:true},'',u);}catch(e){/* File hosts may restrict URL changes; the view still opens. */}renderDealPage();requestAnimationFrame(()=>root.querySelector('#record-heading')?.focus());announce('Opened '+byId(id).title);}
function backToBoard(){for(const r of [...dialogStack])if(r.dirty){requestClose(r.dialog);return;}for(const r of [...dialogStack].reverse())closeDialog(r.dialog,true);activeDealId=null;const u=new URL(location.href);u.hash='';try{history.pushState({ppoBoard:true},'',u);}catch(e){}render();restoreBoardPosition();}
function restoreBoardPosition(){requestAnimationFrame(()=>{const sc=root.querySelector('.board-scroll,.list-scroll');if(sc){sc.scrollLeft=lastBoardScroll.x;sc.scrollTop=lastBoardScroll.y;}if(lastDealTrigger)root.querySelector(`[data-testid="${CSS.escape(lastDealTrigger)}"]`)?.focus({preventScroll:true});});}
function recordHealth(d){const hs=derived.health[d.id]||[];return `<section class="record-card"><h3>Deal health <span class="view-note">${hs.length} signals</span></h3>${hs.map(h=>`<div class="health-item ${severityName(h.severity)}">${icon(h.icon)}<div><strong>${h.label}</strong><p>${esc(h.explanation)}</p></div></div>`).join('')||'<p class="view-note">No health signals. The next activity is planned.</p>'}</section>`;}
function recordExit(d){return `<section class="record-card"><h3>${d.stage} exit conditions</h3><p class="panel-note">${d.exitCriteria.filter(c=>c.met).length} of ${d.exitCriteria.length} met. Check these with the customer before advancing. They remain advisory in this preview.</p>${d.exitCriteria.map((c,i)=>`<label class="check-field"><input type="checkbox" data-criterion="${i}" data-id="${d.id}" data-testid="record-criterion-${d.id}-${i}" ${c.met?'checked':''}>${esc(c.label)}</label>`).join('')||'<p class="view-note">This opportunity has a closed outcome.</p>'}${isOpen(d)?btn('move','Review stage change','move','btn',`data-id="${d.id}"`):''}</section>`;}
function recordActivity(d,full=false){return `<section class="record-card"><h3>Activity history ${btn('log','Log activity','plus','quiet small-btn',`data-id="${d.id}"`)}</h3><ol class="timeline">${[...d.activityLog].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,full?undefined:4).map(a=>`<li><strong>${esc(a.text)}</strong><time datetime="${a.at}">${fmtDate(a.at)}</time><span class="view-note">${esc(a.by)}</span></li>`).join('')}</ol>${!full?btn('record-tab','View all activities','','quiet small-btn','data-tab="activities"'):''}</section>`;}
function recordNext(d){return `<section class="record-card"><h3>Next activity ${btn('schedule',d.nextActivity?'Change':'Schedule','calendar','quiet small-btn',`data-id="${d.id}"`)}</h3>${nextAction(d)}${d.nextActivity?`<p class="panel-note" style="margin-top:10px">${fmtDate(d.nextActivity.dueAt)} · ${esc(d.nextActivity.owner.name)}</p>${btn('complete-activity','Complete activity','check','btn',`data-id="${d.id}"`)}`:''}</section>`;}
function recordContacts(d){return `<section class="record-card"><h3>People involved</h3>${d.contacts.map((c,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><p><strong>${esc(c.name)}</strong>${i===0?' <span class="tag">Primary contact</span>':''}</p><p class="view-note">${esc(c.role)}</p><p class="view-note">${esc(c.email||'Email not recorded')}</p></div>`).join('')||'<p class="view-note">No contacts recorded.</p>'}${btn('email','Email primary contact','email','btn',`data-id="${d.id}" style="margin-top:15px"`)}</section>`;}
function recordContent(d){if(recordTab==='tasks')return `<section class="record-card record-tasks">${tasksBody(d)}</section>`;if(recordTab==='documents')return `<section class="record-card record-documents">${documentsBody(d,pageDocumentState)}</section>`;if(recordTab==='conversation')return conversationBody(d);if(recordTab==='overview')return `<div class="process-strip" aria-label="Current stage">${STAGES.map(s=>`<span class="process-step ${s===d.stage?'current':''}">${s}</span>`).join('')}</div><div class="record-grid"><div><section class="record-card"><h3>Opportunity overview ${btn('edit','Edit fields','edit','quiet small-btn',`data-id="${d.id}"`)}</h3><p>${esc(d.qualificationNote||'Add a qualification note to record the customer need and agreed next step.')}</p><div class="detail-facts" style="margin-top:20px"><div><span class="fact-label">Organisation</span>${esc(d.organisation)}</div><div><span class="fact-label">Owner</span>${esc(d.owner.name)}</div><div><span class="fact-label">Created</span>${fmtDate(d.createdAt)}</div><div><span class="fact-label">Estimate reference</span>${d.linkedEstimateRef?btn('estimate-reference',esc(d.linkedEstimateRef),'external','quiet small-btn',`data-id="${d.id}"`):'Not linked'}</div></div><p style="margin-top:16px">${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</p></section>${recordExit(d)}${recordActivity(d)}</div><div>${recordNext(d)}<section class="record-card">${followThrough(d)}</section>${recordHealth(d)}<section class="record-card"><h3>Forecast judgement</h3><label class="fact-label" for="record-forecast">Owner forecast category</label><select id="record-forecast" class="table-control" data-field-edit="forecastCategory" data-id="${d.id}">${CATEGORIES.map(c=>`<option ${c===d.forecastCategory?'selected':''}>${c}</option>`).join('')}</select><p class="panel-note" style="margin-top:12px">${money(weighted(d))} weighted estimate, using ${Math.round((PROBABILITIES[d.stage]||0)*100)}% stage weighting.${d.forecastCategory==='Omitted'?' This opportunity is omitted from the forecast.':''} Category and stage are assessed separately.</p></section></div></div>`;
 if(recordTab==='scope')return `<div class="record-grid"><div><section class="record-card"><h3>Customer brief and qualification</h3><p>${esc(d.qualificationNote||'No qualification note recorded.')}</p>${btn('documents','Open supporting documents','paperclip','btn',`data-id="${d.id}" style="margin-top:16px"`)}</section><section class="record-card">${intakeSection(d)}${quoteSection(d)}</section></div><div><section class="record-card">${deliverySection(d)}</section>${recordExit(d)}</div></div>`;
 if(recordTab==='activities')return `<div class="record-grid"><div>${recordActivity(d,true)}</div><div>${recordNext(d)}<section class="record-card"><h3>Quick email</h3><p class="panel-note">Compose an email to the primary contact while keeping the opportunity in view.</p>${btn('email','Compose email','email','btn',`data-id="${d.id}"`)}</section></div></div>`;
 if(recordTab==='contacts')return `<div class="record-grid"><div>${recordContacts(d)}</div><div>${recordHealth(d)}<section class="record-card"><h3>Account context</h3><p>${esc(d.organisation)}</p><p class="panel-note" style="margin-top:12px">The organisation and contact records will connect to their dedicated pages in the full application.</p></section></div></div>`;
 return `<div class="record-grid"><div><section class="record-card"><h3>Stage history</h3><ol class="timeline">${[...d.stageHistory].reverse().map(h=>`<li><strong>${esc(h.stage)}</strong><time>${fmtDate(h.enteredAt)}</time><span class="view-note">${esc(h.movedBy)}${h.exitedAt?' · left '+shortDate(h.exitedAt):' · current stage'}</span></li>`).join('')}</ol></section></div><div><section class="record-card"><h3>Expected close changes <span class="view-note">${slipped(d)} pushes</span></h3><p>Current expected close: <strong>${fmtDate(d.expectedCloseDate)}</strong></p>${d.closeDateHistory.map(h=>`<div class="slip-row"><span>${shortDate(h.from)}</span>${icon('right')}<span>${shortDate(h.to)}</span><span class="view-note">${shortDate(h.at)} · ${esc(h.by)}${h.undo?' · Undo':''}</span></div>`).join('')||'<p class="panel-note" style="margin-top:12px">The close date has not been pushed.</p>'}</section><section class="record-card"><h3>Session changes</h3><p class="panel-note">Review and undo eligible changes made since this file was opened.</p>${btn('change-log','Open session history','history','btn')}</section></div></div>`;
}
function renderDealPage(){derive();const workspace=root.querySelector('.workspace'),d=byId(activeDealId),scroll=workspace.querySelector('.record-scroll')?.scrollTop||0;if(!d||d.deletedAt){workspace.innerHTML=emptyState('Opportunity unavailable','This record is not in the current sample session.','back-board','Back to deals');enhance(workspace);return;}const tabs=[['overview','Overview'],['scope','Scope & estimating'],['activities','Activities'],['tasks','Tasks'],['conversation','Conversation'],['documents','Documents'],['contacts','Contacts'],['history','History']];workspace.innerHTML=`<main class="record-page" data-testid="deal-page"><div class="record-breadcrumb">${btn('back-board','Deals','left','quiet','data-testid="back-to-deals"')}${icon('right')}<span>${d.id}</span><span class="spacer"></span>${btn('help','','help','small-btn','aria-label="Deal board guide"')}</div><header class="record-header"><div class="record-title"><h1 id="record-heading" tabindex="-1" data-testid="record-heading">${esc(d.title)}</h1><p>${esc(d.organisation)}</p></div><div class="record-actions">${btn('detail','Snapshot','eye','btn',`data-id="${d.id}"`)}${btn('email','Email','email','btn',`data-id="${d.id}"`)}${btn('edit','Edit','edit','btn',`data-id="${d.id}"`)}${btn('schedule','Next activity','calendar','primary',`data-id="${d.id}"`)}</div></header><div class="record-metrics"><div><span class="fact-label">Value · AUD excl. GST</span><strong>${money(d.value)}</strong></div><div><span class="fact-label">Stage</span>${btn('move',d.stage+icon('chevron'),'','table-control',`data-id="${d.id}" data-testid="record-stage"`)}</div><div><span class="fact-label">Expected close</span><strong>${shortDate(d.expectedCloseDate)}</strong></div><div><span class="fact-label">Owner</span><strong>${esc(d.owner.name)}</strong></div><div><span class="fact-label">Forecast category</span><strong>${d.forecastCategory}</strong></div></div><div class="record-tabs" role="tablist" aria-label="Opportunity sections">${tabs.map(([id,l])=>btn('record-tab',l,'','',`data-tab="${id}" role="tab" aria-selected="${id===recordTab}" aria-controls="record-content" id="record-tab-${id}" tabindex="${id===recordTab?'0':'-1'}"`)).join('')}</div><div class="record-scroll" id="record-content" role="tabpanel" aria-labelledby="record-tab-${recordTab}" data-testid="record-content">${recordContent(d)}</div></main>`;enhance(workspace);root.dataset.density=state.density;workspace.querySelector('.record-scroll').scrollTop=scroll;renderToasts();refreshTaskPanels();}

const HELP_TOPICS=[['start','Getting started','board'],['cards','Cards & quick actions','task'],['health','Health & triage','triage'],['movement','Moving opportunities','move'],['forecast','Forecast & insights','flag'],['list','List & bulk editing','list'],['process','Powerplants stages','changes'],['shortcuts','Keyboard shortcuts','help']];
const HELP_CONTENT={
 start:`<h3>Your deal board</h3><p>Use this workspace to review open opportunities, keep the next action clear and move agreed work through the Powerplants sales process.</p><ol><li><strong>Choose your view.</strong> Board shows all five stages. List gives you sortable columns and selection for bulk edits.</li><li><strong>Focus your scope.</strong> Use Filters or a saved view such as My deals. The active-filter button lets you review or clear individual filters.</li><li><strong>Review the pipeline.</strong> The slim status row shows value, weighted estimate and urgent deals. Open Insights for forecast categories, monthly coverage and movement totals.</li><li><strong>Act on a deal.</strong> Open its page, use a quick action, or start Triage.</li></ol><p class="notice">This is a standalone demonstration with fictional opportunities. Changes, drafts and saved views reset when the file reloads. The URL may retain your view configuration.</p>`,
 cards:`<h3>Cards and quick actions</h3><p>Click the card or its title to open the dedicated opportunity page. The page includes Overview, Scope & estimating, Activities, Tasks, Conversation, Documents, Contacts and History.</p><ul><li><strong>Eye:</strong> opens the snapshot at the right, so you can review the deal without leaving the board.</li><li><strong>Clipboard:</strong> opens internal Tasks and their open count.</li><li><strong>Envelope:</strong> opens a quick email to the primary contact. Compose, preview and simulate sending. This demonstration sends no messages.</li><li><strong>Calendar:</strong> sets or replaces the next activity, including its owner and due date.</li><li><strong>Health pill:</strong> opens the snapshot at the full health explanation. Hovering does not open a large pop-up.</li></ul><p>Owner initials identify the opportunity owner. The adjacent person icon identifies the next activity’s owner on hover. Use the card actions or full deal page for editing, activity logging and stage changes.</p><p>Return to Deals from the full page to restore your filters, view and scroll position.</p>`,
 health:`<h3>Health warnings and triage</h3><p>Health is calculated from explicit rules. The card shows the most urgent signal and a count of additional signals. Open the snapshot for the complete reasons.</p><ul><li><strong>Urgent:</strong> no next action, or an overdue activity.</li><li><strong>Attention:</strong> idle beyond the stage norm, an overdue close date, two or more close-date pushes, or a forecast category ahead of the current stage.</li><li><strong>Information:</strong> one engaged contact on a deal over $100,000, or a missing estimate value.</li></ul><p>Idle means the time since the last touch exceeds twice the stage norm and no future activity is booked. With five or more deals, the norm is the median age of the current stage entries across all open deals. Smaller groups use a labelled fallback. This is a current-cohort benchmark, not historical cycle-time prediction.</p><h4>Triage</h4><p>Triage reviews urgent deals in the current view, ordered by severity and value. Its window and action buttons stay in fixed positions. Read the signals, schedule or log an activity, change stage, mark lost, or skip. The completion screen counts reviewed, actioned and skipped deals separately.</p>`,
 movement:`<h3>Move with a clear view of the outcome</h3><ol><li>Drag an opportunity toward a stage. Valid destinations remain available; disallowed forward skips are dimmed.</li><li>The destination column and its title turn green. Existing cards stay in their current positions until you drop.</li><li>The status row previews the weighted estimate before and after the move. This does not change the saved forecast until the move is accepted.</li><li>Drop to request the change. If evidence is required, complete the prompt or cancel.</li></ol><p>Forward moves advance one stage at a time. Backward moves may return to any earlier stage. Won is available only from Closing; Lost is available from any open stage and requires a reason.</p><p>Without dragging, open the snapshot or deal page and click the Stage control. In List, click the stage cell. With a keyboard, focus a card and press Space, use arrow keys, then Space or Enter to drop.</p><p>If a save fails, the card returns to its prior state with recovery instructions. Use Session changes to undo an eligible earlier move.</p><h4>What changed</h4><p>Choose yesterday, Monday, seven days or thirty days. Ghosts show prior positions; badges identify new and moved deals. A backward event remains flagged even if the deal later progressed. Closed outcomes appear in a tray below the worklist.</p>`,
 forecast:`<h3>Forecast confidence and financial impact</h3><p><strong>Open value</strong> adds the known amounts in the current view. Missing values remain “Not estimated”. All amounts are AUD excluding GST.</p><p><strong>Weighted estimate</strong> uses illustrative stage weights: Discovery 10%, Scoping 25%, Quoting 50%, Negotiation 70%, Closing 90%. Omitted deals contribute nothing to this estimate.</p><p><strong>Commit and Best case</strong> are owner judgements independent of stage. Commit or Best case during Discovery or Scoping triggers a forecast-ahead warning.</p><p>Insights shows Commit, Commit plus Best case, missing values and three monthly coverage periods. Click a period to filter by expected close. Coverage is the weighted estimate divided by that month’s illustrative target.</p><p class="notice">Forecast probabilities and targets are sample assumptions. Movement totals use the whole pipeline; historic amounts and categories are assumed unchanged because this example records stage history only.</p>`,
 list:`<h3>Work through a list without losing your place</h3><ul><li><strong>Sort:</strong> click a heading; click again to reverse it. Shift-click another heading to add a secondary sort.</li><li><strong>Resize:</strong> drag the divider at the right edge of a heading. Text stays on one line and is clipped when the column becomes narrow. Keyboard users can focus a divider and use Left or Right.</li><li><strong>Group:</strong> use View options to group by stage, owner or forecast category. Grouping is optional.</li><li><strong>Select:</strong> use a row checkbox or the header checkbox. Shift-click a checkbox to select a range. Checkboxes remain centred in their rows.</li></ul><h4>Bulk actions at the right</h4><p>Selection opens a side panel without adding a row above the list. Continue selecting rows while it is open. Choose owner, forecast, close date, tag, next activity, stage or lost outcome. The panel always shows how many opportunities will be affected, including selected deals outside the current filters.</p><p>Each bulk stage move is validated separately. A result reports how many succeeded and why others could not move. Closing the panel keeps the selection; Clear selection removes it.</p><p>Click the opportunity title or row to open its full page. Use the eye beside the title for its snapshot and the clipboard for internal Tasks.</p>`,
 process:`<h3>The Powerplants sales process</h3>${STAGES.map(s=>`<h4>${s}</h4><p>${EXIT_CRITERIA[s].map(esc).join('; ')}.</p>`).join('')}<p>Quoting covers both estimating and quotation work. The CRM keeps a neutral reference to the linked estimate; quotation status belongs to Estimating.</p><p>Exit conditions are visible in the snapshot and deal page. They support a review conversation and are advisory here. The Projects handover after Won remains a separate business decision.</p>`,
 shortcuts:`<h3>Keyboard shortcuts</h3><table><tbody>${[['N','Create opportunity'],['T','Open triage'],['?','Open this guide'],['Enter on a card','Open the full deal page'],['Space on a card','Pick up for keyboard movement'],['Left / Right while moving','Choose a legal destination'],['Up / Down while moving','Choose the final insertion position'],['Space / Enter while moving','Drop and validate the move'],['Escape','Cancel movement or close the active window'],['S / L / M / X in triage','Schedule / log / move / mark lost'],['Left / Right in triage','Previous / next deal'],['Shift-click a checkbox','Select a range of rows'],['Shift-click a heading','Add a secondary sort'],['Left / Right on a column divider','Resize the column'],['Left / Right on a deal-page tab','Change the selected section']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table><p>Shortcuts pause while you are typing into a field. Every movement also has a click-only alternative through the Stage control.</p>`
};
function openGuide(){const dialog=openDialog('help','Deal board guide',`<nav class="help-nav" aria-label="Guide topics">${HELP_TOPICS.map(([id,l,ic])=>btn('help-topic',l,ic,'',`data-topic="${id}" aria-current="${id==='start'}"`)).join('')}</nav><section class="help-content" id="help-content" tabindex="0">${HELP_CONTENT.start}</section>`,'','help-dialog',{testid:'help-dialog',subtitle:'A practical guide to reviewing and progressing your opportunities'});enhance(dialog);}
function setHelpTopic(topic){const dlg=dialogStack.find(r=>r.type==='help')?.dialog;if(!dlg||!HELP_CONTENT[topic])return;dlg.querySelectorAll('[data-topic]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.topic===topic)));const panel=dlg.querySelector('.help-content');panel.innerHTML=HELP_CONTENT[topic];panel.scrollTop=0;enhance(panel);}

function setColumnWidth(field,width){const col=COLUMNS.find(c=>c[0]===field);if(!col)return;col[2]=Math.max(70,Math.min(520,Math.round(width)));const table=root.querySelector('[data-testid=deals-table]');if(!table)return;const index=COLUMNS.indexOf(col)+1;table.querySelectorAll('col')[index].style.width=col[2]+'px';const total=42+COLUMNS.reduce((sum,c)=>sum+c[2],0);table.style.width=total+'px';table.style.minWidth=total+'px';table.querySelector(`[data-resize="${field}"]`)?.setAttribute('aria-valuenow',col[2]);}

root.addEventListener('pointerdown',e=>{lastCardPointer={x:e.clientX,y:e.clientY};const handle=e.target.closest('[data-resize]');if(!handle)return;e.preventDefault();columnResize={field:handle.dataset.resize,start:e.clientX,width:COLUMNS.find(c=>c[0]===handle.dataset.resize)[2],handle};handle.dataset.resizing='true';handle.setPointerCapture?.(e.pointerId);hideTooltip();});
root.addEventListener('pointermove',e=>{if(columnResize)setColumnWidth(columnResize.field,columnResize.width+e.clientX-columnResize.start);});

root.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a?.dataset.action==='simulate-email')simulateEmail(a.dataset.id);});
root.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const all=[...root.querySelectorAll('.record-tabs [role=tab]')],index=all.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?all.length-1:(index+(e.key==='ArrowRight'?1:-1)+all.length)%all.length;recordTab=all[next].dataset.tab;renderDealPage();root.querySelector(`[data-tab="${recordTab}"]`)?.focus();}});
window.addEventListener('popstate',()=>{for(const r of [...dialogStack].reverse())closeDialog(r.dialog,true);activeDealId=null;initialRoute();render();if(!activeDealId)restoreBoardPosition();});

const conflictId='SYN-PPO-OP-000009';
const conflictRecord=serverRecords.get(conflictId);conflictRecord.version=2;conflictRecord.stageHistory[conflictRecord.stageHistory.length-1].exitedAt=at(-.05);conflictRecord.stageHistory.push({stage:'Negotiation',enteredAt:at(-.05),exitedAt:null,movedBy:'Alex Lee'});conflictRecord.stage='Negotiation';conflictRecord.exitCriteria=exitFor('Negotiation');
const receipts=new Map();let demoFailure=null;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function appendStage(d,to){const time=new Date().toISOString();if(d.stageHistory.length){d.stageHistory[d.stageHistory.length-1].exitedAt=time;d.stageHistory[d.stageHistory.length-1].order=d.order;}d.stageHistory.push({stage:to,enteredAt:time,exitedAt:null,movedBy:CURRENT_USER.name,order:d.order});d.stage=to;d.exitCriteria=exitFor(to);d.lastTouchedAt=time;}
function makeEnvelope(d,to,evidence={},extra={}){return {opportunityId:d.id,fromStage:d.stage,toStage:to,expectedVersion:d.version,idempotencyKey:uid(),reason:DEFAULT_MOVE_REASON,evidence,...extra};}
async function submitMove(command,options={}){
 if(receipts.has(command.idempotencyKey))return receipts.get(command.idempotencyKey);
 const d=byId(command.opportunityId);if(!d||pending.has(d.id))return{ok:false,message:'This opportunity is already saving.'};
 const check=options.compensating?{ok:true}:transition(d.stage,command.toStage);
 if(!check.ok){toast(check.message,{error:true});return{ok:false,message:check.message};}
 const before=clone(d);pending.add(d.id);failed.delete(d.id);appendStage(d,command.toStage);if(Number.isFinite(command.targetOrder)){d.order=command.targetOrder;d.stageHistory[d.stageHistory.length-1].order=d.order;}render();
 await delay(COMMAND_LATENCY);
 const server=serverRecords.get(d.id);let error=null;
 if(server&&server.version!==command.expectedVersion)error={type:'conflict',message:'Someone else moved this deal while you were working. Refresh to see the current stage.'};
 else if(command.toStage==='Discovery'&&!command.evidence.qualificationNote&&!before.qualificationNote)error={type:'evidence',message:'The move to Discovery was rejected because the qualification note is missing. Add the note and try again.'};
 else if(command.toStage==='Lost'&&!LOST_REASONS.includes(command.evidence.lostReason))error={type:'evidence',message:'Choose a lost reason before marking this opportunity as lost.'};
 else if(demoFailure==='save'){demoFailure=null;error={type:'save',message:'The change could not be saved. Your opportunity remains in its original stage. Try again.'};}
 pending.delete(d.id);
 if(error){Object.assign(d,before);failed.add(d.id);render();refreshDetails(d.id);toast(error.message,{error:true,action:error.type==='conflict'?'refresh-deal':'repair-evidence',actionLabel:error.type==='conflict'?'Refresh':'Add note',data:`data-id="${d.id}"`});const result={ok:false,...error};receipts.set(command.idempotencyKey,result);return result;}
 d.version=before.version+1;d.qualificationNote=command.evidence.qualificationNote||before.qualificationNote;
 if(command.toStage==='Lost'){d.lostReason=command.evidence.lostReason;d.lostNote=command.evidence.note||'';}
 d.activityLog.unshift({at:new Date().toISOString(),text:`${options.compensating?'Undo: restored':'Moved'} ${command.fromStage} to ${command.toStage}. ${command.reason}`,by:CURRENT_USER.name});serverRecords.set(d.id,clone(d));
 const entry=options.compensating?null:recordChange({kind:'move',id:d.id,label:`Moved ${d.title} to ${command.toStage}`,from:before.stage,to:d.stage,beforeExit:before.exitCriteria,beforeOrder:before.order,command,version:d.version});
 state.selection.delete(d.id);render();refreshDetails(d.id);markTriageAction(d.id);
 toast(options.compensating?`Restored to ${command.toStage}`:command.toStage==='Won'?'Marked as won':command.toStage==='Lost'?'Marked as lost':`Moved to ${command.toStage}`,entry?{undo:entry.key}:{});
 const result={ok:true,entry:entry?.key};receipts.set(command.idempotencyKey,result);return result;
}
function recordChange(x){const entry={key:uid(),at:new Date().toISOString(),undone:false,...x};changeLog.unshift(entry);return entry;}
async function requestMove(id,to,intent={}){const d=byId(id);if(!d)return;const rule=transition(d.stage,to);if(!rule.ok){toast(rule.message,{error:true});return;}
 if(to==='Lost'){openLost([id]);return;}if(to==='Won'){openWon(id);return;}
 if(ENTRY_REQUIREMENTS[to]?.some(k=>!d[k])){openEvidence(id,to,intent);return;}
 await submitMove(makeEnvelope(d,to,{qualificationNote:d.qualificationNote},intent));
}
async function patchDeals(ids,patch,label){const accepted=[],errors=[];for(const id of ids){const d=byId(id);if(!d||!isOpen(d)||pending.has(id)){errors.push(id);continue;}const server=serverRecords.get(id);if(server?.version!==d.version){errors.push(id);continue;}accepted.push({d,before:Object.fromEntries(Object.keys(patch).map(k=>[k,clone(d[k]??null)])),version:d.version});pending.add(id);}render();await delay(450);
 if(demoFailure==='save'){demoFailure=null;for(const {d}of accepted)pending.delete(d.id);render();toast('The change could not be saved. Your entries are retained; retry the edit.',{error:true});return{ok:false,count:0};}
 for(const {d,before}of accepted){if('expectedCloseDate'in patch&&dateOnly(patch.expectedCloseDate)!==dateOnly(d.expectedCloseDate))d.closeDateHistory.push({at:new Date().toISOString(),from:d.expectedCloseDate,to:patch.expectedCloseDate,by:CURRENT_USER.name});Object.assign(d,clone(patch));d.version++;d.lastTouchedAt=new Date().toISOString();d.activityLog.unshift({at:d.lastTouchedAt,text:label,by:CURRENT_USER.name});serverRecords.set(d.id,clone(d));pending.delete(d.id);markTriageAction(d.id);}
 const entry=accepted.length?recordChange({kind:'fields',label,changes:accepted.map(({d,before})=>({id:d.id,before,after:clone(patch)}))}):null;render();for(const {d}of accepted)refreshDetails(d.id);
 toast(errors.length?`${accepted.length} of ${ids.length} updated. ${errors.length} changed or unavailable; refresh those opportunities before retrying.`:`${label}${ids.length>1?' for '+accepted.length+' opportunities':''}`,{error:errors.length>0,...(entry?{undo:entry.key}:{})});return{ok:errors.length===0,count:accepted.length};
}
async function undoEntry(key){const e=changeLog.find(x=>x.key===key);if(!e||e.undone)return;const d=byId(e.id);
 if(e.kind==='task'){undoTaskChange(e);return;}
 if(e.kind==='move'){if(!d||d.stage!==e.to||pending.has(d.id)||d.stageHistory[d.stageHistory.length-1].enteredAt!==serverRecords.get(d.id)?.stageHistory.at(-1)?.enteredAt){toast('This deal moved again. Review its history before undoing this earlier move.',{error:true});return;}
 const later=changeLog.some(x=>x!==e&&!x.undone&&x.kind==='move'&&x.id===d.id&&new Date(x.at)>new Date(e.at));if(later){toast('Undo the later stage move first to preserve the movement history.',{error:true});return;}
 const cmd=makeEnvelope(d,e.from,{qualificationNote:d.qualificationNote},{reason:'Undo prior stage move',compensates:e.command.idempotencyKey});const result=await submitMove(cmd,{compensating:true});if(!result.ok)return;d.exitCriteria=clone(e.beforeExit);d.order=e.beforeOrder;serverRecords.set(d.id,clone(d));e.undone=true;
 }else if(e.kind==='create'){if(!d)return;if(d.version!==e.version||tasksFor(d).length){toast('This opportunity has changed since creation. Undo its later changes first.',{error:true});return;}deals=deals.filter(x=>x.id!==d.id);serverRecords.delete(d.id);e.undone=true;toast('Opportunity creation undone.');
 }else if(e.kind==='fields'){const can=e.changes.every(c=>{const record=byId(c.id);return record&&!pending.has(c.id)&&Object.entries(c.after).every(([k,v])=>JSON.stringify(record[k])===JSON.stringify(v));});if(!can){toast('One of these fields has changed again. Undo the later edit first.',{error:true});return;}
 for(const c of e.changes){const rec=byId(c.id);if('expectedCloseDate'in c.before)rec.closeDateHistory.push({at:new Date().toISOString(),from:rec.expectedCloseDate,to:c.before.expectedCloseDate,by:CURRENT_USER.name,undo:true});Object.assign(rec,clone(c.before));rec.version++;rec.lastTouchedAt=new Date().toISOString();rec.activityLog.unshift({at:rec.lastTouchedAt,text:'Undid '+e.label,by:CURRENT_USER.name});serverRecords.set(rec.id,clone(rec));}e.undone=true;toast('Change undone.');}
 toasts=toasts.filter(t=>t.undo!==key);render();refreshOpenDialogs();
}

function openDialog(type,title,body,footer='',className='',extra={}){const dialog=document.createElement('dialog');dialog.className='overlay '+className;dialog.dataset.type=type;dialog.dataset.testid=extra.testid||type;dialog.setAttribute('aria-labelledby',type+'-heading');dialog.innerHTML=`<div class="dialog-header"><div><h2 id="${type}-heading">${title}</h2>${extra.subtitle?`<p class="dialog-subtitle">${extra.subtitle}</p>`:''}</div>${btn('close-dialog','','close','icon-btn','aria-label="Close '+esc(title)+'"')}</div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;
 const record={dialog,type,returnTest:className.includes('menu')?lastPopupAnchor?.testid:document.activeElement?.getAttribute('data-testid'),...extra,...(className.includes('menu')?{menuAnchor:lastPopupAnchor}:{})};dialogStack.push(record);root.querySelector('.overlay-host').append(dialog);dialog.querySelectorAll('form').forEach(f=>f.noValidate=true);enhance(dialog);dialog.addEventListener('cancel',e=>{e.preventDefault();requestClose(dialog);});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)requestClose(dialog);}});
 if(extra.modeless){dialog.show();dialog.setAttribute('aria-modal','false');}else{dialog.showModal();dialog.setAttribute('aria-modal','true');}
 if(className.includes('menu')){positionMenu(dialog,lastPopupAnchor);if(lastPopupAnchor?.testid)root.querySelector(`[data-testid="${CSS.escape(lastPopupAnchor.testid)}"]`)?.setAttribute('aria-expanded','true');}
 syncToastHost();requestAnimationFrame(()=>{if(extra.focus!==false)(dialog.querySelector('[autofocus],input:not([type=hidden]),select,textarea,.menu-item')||dialog.querySelector('button'))?.focus();});return dialog;}
function positionMenu(dialog,anchor){const margin=12,gap=6,r=anchor||{left:Math.max(margin,innerWidth/2-160),right:Math.max(margin,innerWidth/2+160),top:72,bottom:90,align:'start'},bounds=dialog.getBoundingClientRect(),width=Math.min(bounds.width||320,innerWidth-margin*2),height=bounds.height||400;let alignment=r.align||'start',left=alignment==='end'?r.right-width:r.left;if(left<margin&&r.left+width<=innerWidth-margin){left=r.left;alignment='start';}else if(left+width>innerWidth-margin&&r.right-width>=margin){left=r.right-width;alignment='end';}left=Math.max(margin,Math.min(left,innerWidth-margin-width));const below=Math.max(0,innerHeight-margin-r.bottom-gap),above=Math.max(0,r.top-margin-gap),up=height>below&&above>below,available=up?above:below;dialog.style.maxHeight=Math.max(80,available)+'px';const shownHeight=Math.min(height,Math.max(80,available));let top=up?r.top-gap-shownHeight:r.bottom+gap;dialog.style.left=left+'px';dialog.style.top=Math.max(margin,Math.min(top,innerHeight-margin-shownHeight))+'px';dialog.dataset.align=alignment;dialog.dataset.placement=up?'above':'below';}

function openSidePanel(type,title,body,footer='',extra={}){for(const r of [...dialogStack])if(r.dialog.classList.contains('side-panel')){if(r.dirty){requestClose(r.dialog);return null;}closeDialog(r.dialog,true);}const hasModal=dialogStack.some(r=>r.dialog.getAttribute('aria-modal')==='true');return openDialog(type,title,body,footer,'side-panel '+(extra.className||''),{...extra,modeless:!hasModal});}
function replacePanel(dialog,title,body,footer=''){dialog.querySelector('h2').textContent=title;const content=dialog.querySelector('.dialog-body');if(content)content.innerHTML=body;dialog.querySelector('.dialog-footer')?.remove();if(footer)dialog.insertAdjacentHTML('beforeend',`<div class="dialog-footer">${footer}</div>`);dialog.querySelectorAll('form').forEach(f=>f.noValidate=true);enhance(dialog);}

function syncToastHost(){const destination=dialogStack.at(-1)?.dialog||root;for(const selector of ['.toast-stack','.tooltip']){const node=root.querySelector(selector);if(node)destination.append(node);}}
function closeDialog(dialog=dialogStack.at(-1)?.dialog,force=false){if(!dialog)return;const rec=dialogStack.find(x=>x.dialog===dialog);if(!force&&rec?.dirty){requestClose(dialog);return;}if(rec?.menuAnchor?.testid)root.querySelector(`[data-testid="${CSS.escape(rec.menuAnchor.testid)}"]`)?.setAttribute('aria-expanded','false');if(rec?.objectURL)URL.revokeObjectURL(rec.objectURL);dialog.close();dialogStack=dialogStack.filter(x=>x.dialog!==dialog);syncToastHost();dialog.remove();if(rec?.type==='detail')root.dataset.detail='closed';const ret=rec?.returnElement?.isConnected?rec.returnElement:rec?.returnTest&&root.querySelector(`[data-testid="${CSS.escape(rec.returnTest)}"]`);if(ret)ret.focus({preventScroll:true});else if(dialogStack.length)dialogStack.at(-1).dialog.querySelector('button,input')?.focus();else root.querySelector('[data-testid="new-opportunity-button"]')?.focus();}
function requestClose(dialog){if(dialog.getAttribute('aria-busy')==='true'){announce('Wait for the current change to finish saving.');return;}const r=dialogStack.find(x=>x.dialog===dialog);if(r?.type==='triage'){finishTriage();return;}if(r?.dirty){openDialog('discard','Discard changes?','<p>Your entered changes have not been applied.</p>',btn('close-dialog','Keep editing','','btn')+btn('discard-confirm','Discard changes','','danger-btn btn','data-target="'+r.type+'"'));return;}closeDialog(dialog,true);}

HELP_CONTENT.cards += '<h3>People and quick editing</h3><p>The primary contact appears below the organisation. Coloured initials identify Powerplants employees; the outlined person identifies an external contact. Use the pencil to edit the same fields shown when creating an opportunity. A caution triangle identifies a missing or overdue next activity, a delivery conflict, or a blocked or overdue internal task.</p><h3>MYOB email references</h3><p>Email subjects start with the linked MYOB opportunity number and deal title, followed by an editable email topic. OPXXXXXX is an explicitly labelled placeholder when a sample has no MYOB link; it is never a replacement for the internal PPO ID.</p>';
HELP_CONTENT.start += '<h3>Stage controls</h3><p>Use a stage’s three dots to focus the view, sort that stage or collapse it. A collapsed rail keeps the stage visible; use its arrow to expand it. At least one stage stays open. Header separators appear only after scrolling.</p>';
HELP_CONTENT.start += '<h3>Find your working view</h3><p>Board and List, Filters, Views and View options sit together at the left. What changed and Triage support review work. The Sales pipeline selector and Opportunity action sit at the right. Session changes is available in View options. The selector currently lists the one configured pipeline.</p>';
HELP_CONTENT.list += '<h3>Quick actions and choices</h3><p>Each opportunity row offers the same Snapshot, Tasks, Documents, Email, Next activity and Edit actions as a card. Stage and Forecast use consistent choice menus. The Next action control opens the activity panel; overdue activities have a red activity icon.</p>';
HELP_TOPICS.push(['documents','Documents & follow-through','paperclip']);
HELP_CONTENT.documents='<h3>Documents without leaving your deal</h3><p>Use the paperclip on a card or List row. The paperclip opens Documents directly. The eye opens the information-only snapshot. The clipboard opens internal Tasks. Both use a simple right panel with no action bar or section toggle. Select a filename to open the viewer, then close it to return to the same document list. Filter by type, search, or show previous revisions. The current issued quotation stays pinned even if a newer draft exists.</p><h3>Attach supporting files</h3><p>Add PDF, PNG, JPEG, WebP or plain-text files, up to 10 MB each and 50 MB per session. Files remain on this device for this demonstration and disappear on reload. Uploads do not create an issued quotation. Exact duplicate files are rejected; different contents with the same filename are kept separately.</p><h3>Follow through on commitments</h3><p>Waiting on records whose response is needed and uses the existing next activity, owner and date. Completing that activity clears the dependency. Handover readiness is a separate Draft, Submitted, Returned or Accepted for estimating workflow; it does not change the stage or approve a quotation.</p><h3>Delivery and conversation</h3><p>Delivery compares a required date with a sourced lead time plus transport and installation allowances. Incomplete or stale evidence asks for confirmation. The 30-day freshness limit is illustrative. Conversation combines sample emails with activity records; email previews are marked Not sent. Related opportunities use the same organisation identity and never assume a shared site.</p>';
HELP_CONTENT.cards+='<h3>Six quick actions</h3><p>Snapshot (eye), Tasks (clipboard), Documents (paperclip), Email, Next activity and Edit sit on every card and List row. Owner icons stay at the bottom left. The clipboard count shows open internal tasks; completed tasks do not contribute.</p>';
HELP_CONTENT.health+='<h3>Time-sensitive review</h3><p>Triage also includes issued quotations that expire within seven days or have expired, and confirmed delivery timing conflicts. The At risk total still counts urgent missing or overdue activities. Quotation expiry never changes the forecast value automatically.</p>';
HELP_CONTENT.movement+='<h3>Four drag actions</h3><p>The bottom targets run left to right: Delete, Lost, Won and Move. Delete opens a confirmation and supports session Undo. Lost keeps its reason dialog; Won remains available from Closing only. Move opens a destination-pipeline selector. This sample has one configured pipeline, so the selector explains that another pipeline is required. No move is recorded while it is unavailable.</p><p>Keyboard: focus a card and press Space, then use Left/Right to choose a stage or one of these targets. Space or Enter opens its action; Escape cancels.</p>';

root.addEventListener('change',event=>{const el=event.target,form=el.closest('form[data-form="internal-task"]');if(form){const rec=dialogStack.find(r=>r.dialog===form.closest('dialog'));if(rec)rec.dirty=true;const status=form.elements.taskStatus.value;form.querySelector('[data-task-blocked-fields]').hidden=status!=='Blocked';form.querySelector('[data-task-outcome-fields]').hidden=status!=='Complete';}if(el.matches('[data-task-inbox-owner],[data-task-inbox-scope]')){const rec=dialogStack.find(r=>r.dialog===el.closest('dialog'));if(!rec)return;if(el.matches('[data-task-inbox-owner]')&&taskEmployee(el.value))rec.taskOwnerId=el.value;if(el.matches('[data-task-inbox-scope]')&&['assigned','requested'].includes(el.value))rec.taskInboxScope=el.value;rec.completedOpen=false;refreshTaskPanels();}});

HELP_CONTENT.tasks='<h3>Tasks and Activities</h3><p>Activities cover calls, meetings, emails, notes and customer follow-up. Tasks assign internal work to one Powerplants employee. Changing or completing a task does not complete the next Activity, refresh the customer touch date, move the deal or change its forecast.</p><h3>Create and review a task</h3><p>Use the clipboard on a card or List row, or the Tasks tab on the deal page. Add a title, instructions, employee and due date. The deal and verified MYOB reference are linked automatically. A missing MYOB link stays Not linked. Choose an optional Required before milestone and any supporting documents already attached to the deal.</p><h3>Progress and results</h3><p>Open, In progress, Blocked and Complete are the task statuses. Blocked requires a reason; Complete requires a brief outcome and can link the exact resulting document. Select a task title to edit, complete or reopen it. Completed work is collapsed by default and retains its history. A task date is a calendar-day deadline: it becomes overdue on the following day in this preview’s local time.</p><h3>My Tasks</h3><p>Open Views, then My Tasks. The sample defaults to Dean Fiedler; choose another sample employee to inspect their assigned or requested work. This inbox reads the same tasks as the deal and is independent of Board filters. Reassignment moves the same task between employee views.</p><h3>Contextual warnings</h3><p>Blocked and overdue tasks add an explained caution and enter Triage. Required before identifies the affected milestone. Ordinary open tasks add only to the clipboard count. These are advisory signals, not automatic stage gates.</p><h3>Linked departmental requests</h3><p>An existing Sales-to-Estimating handover appears with its own current state and a link to the actual sample handover. It is not duplicated in the internal task count. Receiver acceptance is not estimate completion. Engineering task result documents can link to Engineering files; this standalone file does not connect to an Engineering request service.</p><h3>Session behaviour</h3><p>Tasks, changes and uploads remain in this sample session and reset on reload. Saves support session Undo and preserve task history when reverting an edit. The task inbox is a demonstration of the shared record design, not a staff notification or production integration.</p>';
