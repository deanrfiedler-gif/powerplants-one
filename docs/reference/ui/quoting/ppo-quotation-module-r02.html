<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPO Quotation Module — customer view</title>

<!--
  PPO QUOTATION MODULE — customer-facing document surface
  ======================================================
  This is the public surface behind the tokenised quotation link: the document a
  customer opens, selects within, and either accepts online or prints, signs by
  hand and returns. The internal issue console (draft, approve, issue, withdraw)
  is a separate module and is not included here.

  CONTAINER CONTRACT
    Mount #ppo-quotation-styles, #ppo-quotation-module and #ppo-quotation-script
    inside the host shell. Omit #ppo-quotation-preview-frame and the document
    wrapper. The root owns its gutter; set --ppo-quotation-height to the
    available host height. One fresh root per mount. Before removal, dispatch
    new Event('ppo-quotation-dispose') on the root — this detaches every
    listener, clears timers and closes any open dialog.

  ALIGNMENT WITH THE BLUEPRINT (v3)
    §3   Nothing recomputes. Every amount below is frozen in integer cents.
         Selection is summation over frozen amounts; no pricing engine exists
         on this path.
    §6.3 The DOCUMENT object below is the projection as an allowlist. It
         contains no cost, no margin, no rule id, no supplier reference, no
         labour hours. Those keys are absent, not hidden.
    §6.5 The reconciliation identity is a visible row sequence and is asserted
         at render.
    §7.2 Specification content is descriptive, configuration and design basis
         only. No performance statement appears without engineering approval,
         and none is present here.
    §7.4 Precedence order is stated because attachments exist.
    §9.2 Closed states render an explanation, never a 404.
    §15  Acceptance captures consent as a distinct act, hashes the wording, and
         records the document hash being accepted.

  THEME
    Tokens derived from docs/blueprints/quotation-builder.css — brand navy
    #242a37, brand green #62bb46, Roboto variable referenced relatively at
    ../../public/brand/Roboto-variable.woff, as the sibling mockups do.
    Minimum text size is 12 px per the r03 standard, which raises the 10–11 px
    used in the older builder stylesheet.

  PRINTED COPY
    The browser print path produces the customer's local copy and carries the
    document hash so it reconciles to the authoritative server-rendered PDF
    generated at issue (blueprint §14). It is not that PDF.

  All data below is fictional. No rule is approved. This is not engineering
  sizing and not a commercial approval.
-->

<style id="ppo-quotation-styles">
@font-face{
  font-family:Roboto;
  src:url('../../public/brand/Roboto-variable.woff') format('woff');
  font-weight:100 900;font-display:swap;
}

#ppo-quotation-module{
  /* ---- brand ---- */
  --ppq-navy:#242a37;
  --ppq-navy-soft:#3b4657;
  --ppq-green:#62bb46;
  --ppq-green-deep:#317327;
  --ppq-green-deeper:#2a6221;
  --ppq-green-hover:#55a63c;
  --ppq-paper:#ffffff;
  --ppq-ink:#000000;

  /* ---- surfaces ---- */
  --ppq-page:#f4f6f8;
  --ppq-surface:#ffffff;
  --ppq-surface-muted:#f5f7f9;
  --ppq-surface-sunken:#edf0f4;
  --ppq-surface-accent:#f4f7f2;
  --ppq-surface-selected:#f1f8ee;
  --ppq-surface-info:#edf2f6;
  --ppq-surface-warning:#fff4d8;
  --ppq-surface-danger:#fdf1ea;

  /* ---- lines ---- */
  --ppq-border:#dce1e7;
  --ppq-border-strong:#cdd4dd;
  --ppq-border-soft:#e4e8ed;
  --ppq-rule:#e1e6ec;
  --ppq-border-accent:#c3e0b6;
  --ppq-border-danger:#e8c6ae;

  /* ---- text ---- */
  --ppq-text:#242a37;
  --ppq-text-muted:#626e7c;
  --ppq-text-faint:#6b7683;
  --ppq-text-label:#5c6a7e;
  --ppq-text-info:#465162;
  --ppq-text-warning:#725009;
  --ppq-text-danger:#a54e00;
  --ppq-text-invert:#ffffff;
  --ppq-text-on-navy:#cfd2d8;

  /* ---- interaction ---- */
  --ppq-focus:#2765c5;
  --ppq-radius:6px;
  --ppq-radius-card:9px;
  --ppq-tap:24px;
  --ppq-target:44px;
  --ppq-control-h:44px;

  /* ---- type scale ---- */
  --ppq-fs-micro:13px;
  --ppq-fs-small:14px;
  --ppq-fs-body:16px;
  --ppq-fs-lead:17px;
  --ppq-fs-h3:18px;
  --ppq-fs-h2:22px;
  --ppq-fs-h1:28px;
  --ppq-fs-figure:26px;

  /* ---- layout ---- */
  --ppq-maxw:1000px;
  --ppq-gutter:30px;

  font-family:Roboto,Verdana,sans-serif;
  font-synthesis:none;
  color:var(--ppq-text);
  background:var(--ppq-page);
  block-size:var(--ppo-quotation-height,100%);
  overflow:auto;
  container-type:inline-size;
  color-scheme:light;
  -webkit-text-size-adjust:100%;
}

#ppo-quotation-module *{box-sizing:border-box}
#ppo-quotation-module p,
#ppo-quotation-module li,
#ppo-quotation-module td,
#ppo-quotation-module th,
#ppo-quotation-module dd,
#ppo-quotation-module dt{overflow-wrap:anywhere}
#ppo-quotation-module [hidden]{display:none!important}
#ppo-quotation-module button,
#ppo-quotation-module input,
#ppo-quotation-module select,
#ppo-quotation-module textarea{font:inherit;color:inherit}
#ppo-quotation-module :focus-visible{outline:3px solid var(--ppq-focus);outline-offset:3px}

/* ============ shell ============ */
.ppq-wrap{max-inline-size:var(--ppq-maxw);margin-inline:auto;padding:0 var(--ppq-gutter) 56px}

/* ============ preview controls (not part of the customer surface) ============ */
.ppq-devbar{
  background:var(--ppq-surface-warning);color:var(--ppq-text-warning);
  border-block-end:1px solid var(--ppq-border);
  padding:10px var(--ppq-gutter);
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  font-size:var(--ppq-fs-micro);
}
.ppq-devbar b{font-weight:700;letter-spacing:.4px}
.ppq-devbar label{display:flex;gap:7px;align-items:center;font-weight:550}
.ppq-devbar select{
  border:1px solid var(--ppq-border-strong);background:var(--ppq-surface);
  border-radius:var(--ppq-radius);padding:5px 8px;min-block-size:var(--ppq-tap);
  font-size:var(--ppq-fs-micro);
}

/* ============ masthead ============ */
.ppq-mast{background:var(--ppq-navy);color:var(--ppq-text-invert);padding:26px 0 0}
.ppq-mast-inner{
  max-inline-size:var(--ppq-maxw);margin-inline:auto;padding:0 var(--ppq-gutter) 24px;
  display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start;
}
.ppq-brand{display:flex;gap:14px;align-items:center}
.ppq-logo-plate{
  inline-size:88px;block-size:88px;background:var(--ppq-navy);
  display:grid;place-items:center;flex:0 0 auto;
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
}
.ppq-logo-plate img{inline-size:88px;block-size:88px;object-fit:contain;display:block}
.ppq-brand-name{font-size:var(--ppq-fs-h3);font-weight:650;letter-spacing:-.2px}
.ppq-brand-sub{font-size:var(--ppq-fs-micro);color:var(--ppq-text-on-navy);margin-block-start:3px}
.ppq-mast-meta{text-align:end;font-size:var(--ppq-fs-micro);line-height:1.7;color:var(--ppq-text-on-navy)}
.ppq-mast-meta b{display:block;font-size:var(--ppq-fs-body);color:var(--ppq-text-invert);letter-spacing:.2px}
.ppq-mast-rule{block-size:4px;background:var(--ppq-green)}

/* ============ document head ============ */
.ppq-head{padding-block:28px 4px}
.ppq-eyebrow{
  font-size:var(--ppq-fs-micro);font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ppq-text-label);
}
.ppq-head h1{font-size:var(--ppq-fs-h1);margin:9px 0 8px;letter-spacing:-.7px;line-height:1.2}
.ppq-head-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start}
.ppq-head p{margin:0;font-size:var(--ppq-fs-body);color:var(--ppq-text-muted);line-height:1.55;max-inline-size:52ch}
.ppq-actions{display:flex;flex-wrap:wrap;gap:8px}

/* ============ buttons ============ */
.ppq-btn{
  border:1px solid var(--ppq-border-strong);background:var(--ppq-surface);
  color:var(--ppq-text);border-radius:var(--ppq-radius);
  padding:10px 16px;font-weight:550;font-size:var(--ppq-fs-small);
  min-block-size:var(--ppq-control-h);cursor:pointer;white-space:nowrap;
}
.ppq-btn:hover{background:var(--ppq-surface-sunken)}
.ppq-btn-primary{background:var(--ppq-navy);color:var(--ppq-text-invert);border-color:var(--ppq-navy)}
.ppq-btn-primary:hover{background:var(--ppq-navy-soft)}
.ppq-btn-accept{background:var(--ppq-green);border-color:var(--ppq-green);color:var(--ppq-navy);font-weight:650}
.ppq-btn-accept:hover{background:var(--ppq-green-hover)}
.ppq-btn-quiet{border:0;background:transparent;text-decoration:underline;padding:10px 4px}
.ppq-btn-quiet:hover{background:transparent;color:var(--ppq-text-danger)}
.ppq-btn:disabled{cursor:not-allowed;opacity:.5}
.ppq-btn:disabled:hover{background:var(--ppq-surface)}

/* ============ status banner ============ */
.ppq-banner{
  border:1px solid var(--ppq-border);border-inline-start:4px solid var(--ppq-green);
  background:var(--ppq-surface-accent);border-radius:var(--ppq-radius-card);
  padding:15px 18px;margin-block:20px;font-size:var(--ppq-fs-small);line-height:1.6;
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between;
}
.ppq-banner strong{font-weight:650}
.ppq-banner-warn{background:var(--ppq-surface-warning);border-inline-start-color:var(--ppq-text-warning);color:var(--ppq-text-warning)}
.ppq-banner-closed{background:var(--ppq-surface-danger);border-inline-start-color:var(--ppq-text-danger);color:var(--ppq-text-danger);border-color:var(--ppq-border-danger)}
.ppq-banner-done{background:var(--ppq-surface-accent);border-inline-start-color:var(--ppq-green-deep)}

/* ============ badges ============ */
.ppq-badge{
  display:inline-block;border-radius:4px;padding:4px 9px;
  font-size:var(--ppq-fs-micro);font-weight:600;white-space:nowrap;
  background:var(--ppq-surface-info);color:var(--ppq-text-info);
}
.ppq-badge-live{background:var(--ppq-surface-accent);color:var(--ppq-green-deep)}
.ppq-badge-closed{background:var(--ppq-surface-danger);color:var(--ppq-text-danger)}
.ppq-badge-warn{background:var(--ppq-surface-warning);color:var(--ppq-text-warning)}

/* ============ cards ============ */
.ppq-card{
  background:var(--ppq-surface);border:1px solid var(--ppq-border);
  border-radius:var(--ppq-radius-card);padding:24px;margin-block:18px;
}
.ppq-card > h2{
  font-size:var(--ppq-fs-h2);margin:0 0 6px;letter-spacing:-.3px;
}
.ppq-card > .ppq-help{margin:0 0 18px}
.ppq-help{color:var(--ppq-text-muted);font-size:var(--ppq-fs-small);line-height:1.6}
.ppq-card h3{
  font-size:var(--ppq-fs-small);margin:26px 0 12px;text-transform:uppercase;
  letter-spacing:.9px;color:var(--ppq-text-label);font-weight:700;
}
.ppq-card h3:first-of-type{margin-block-start:4px}

/* ============ parties ============ */
.ppq-parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px}
.ppq-party dt{
  font-size:var(--ppq-fs-micro);font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--ppq-text-label);margin-block-end:8px;
}
.ppq-party dd{margin:0;font-size:var(--ppq-fs-small);line-height:1.65}
.ppq-party dd b{display:block;font-size:var(--ppq-fs-body);font-weight:650;margin-block-end:3px}
.ppq-party dd span{color:var(--ppq-text-muted)}

/* ============ scope tables ============ */
.ppq-tablewrap{overflow-x:auto;margin-block:8px}
.ppq-table{inline-size:100%;border-collapse:collapse;font-size:var(--ppq-fs-small);min-inline-size:440px}
.ppq-table caption{text-align:start;font-size:var(--ppq-fs-micro);color:var(--ppq-text-muted);padding-block-end:9px}
.ppq-table th{
  background:var(--ppq-surface-muted);font-weight:600;font-size:var(--ppq-fs-micro);
  color:var(--ppq-text-label);text-align:start;
}
.ppq-table th,.ppq-table td{padding:13px 10px;border-block-end:1px solid var(--ppq-border-soft);vertical-align:top}
.ppq-table th.ppq-num,.ppq-table td.ppq-num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.ppq-table td b{font-weight:600}
.ppq-table td small{display:block;color:var(--ppq-text-muted);font-size:var(--ppq-fs-micro);margin-block-start:5px;line-height:1.55}
.ppq-qty{color:var(--ppq-text-muted);white-space:nowrap}
.ppq-table .ppq-secrow th{
  background:var(--ppq-surface-muted);font-weight:700;font-size:var(--ppq-fs-micro);
  text-transform:uppercase;letter-spacing:.8px;color:var(--ppq-text-label);padding:11px 10px;
}

/* ============ selectable offers ============ */
.ppq-offer{
  border:1px solid var(--ppq-border);border-radius:var(--ppq-radius-card);
  padding:16px 18px;margin-block:12px;background:var(--ppq-surface-muted);
}
.ppq-offer-head{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:baseline}
.ppq-offer-head b{font-size:var(--ppq-fs-body);font-weight:650}
.ppq-offer-desc{font-size:var(--ppq-fs-micro);color:var(--ppq-text-muted);line-height:1.6;margin:7px 0 4px}
.ppq-choice{
  display:flex;gap:13px;align-items:flex-start;
  padding:12px 13px;margin-block-start:10px;
  border:1px solid var(--ppq-border);border-radius:var(--ppq-radius);
  background:var(--ppq-surface);cursor:pointer;min-block-size:var(--ppq-control-h);
}
.ppq-choice:hover{border-color:var(--ppq-border-strong)}
.ppq-choice input{
  inline-size:var(--ppq-tap);block-size:var(--ppq-tap);margin:0;flex:0 0 auto;
  accent-color:var(--ppq-navy);cursor:pointer;
}
.ppq-choice-body{flex:1 1 auto;min-inline-size:0}
.ppq-choice-title{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline}
.ppq-choice-title b{font-size:var(--ppq-fs-small);font-weight:600}
.ppq-choice-price{font-size:var(--ppq-fs-small);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.ppq-choice small{display:block;color:var(--ppq-text-muted);font-size:var(--ppq-fs-micro);line-height:1.6;margin-block-start:6px}
.ppq-choice:has(input:checked){background:var(--ppq-surface-selected);border-color:var(--ppq-border-accent)}
.ppq-choice:has(input:focus-visible){outline:3px solid var(--ppq-focus);outline-offset:2px}
.ppq-locked{
  font-size:var(--ppq-fs-micro);color:var(--ppq-text-muted);
  background:var(--ppq-surface-info);border-radius:4px;padding:3px 8px;
}

/* ============ totals ============ */
.ppq-totals{margin-block-start:22px;border-block-start:2px solid var(--ppq-navy);padding-block-start:4px}
.ppq-totals table{inline-size:100%;border-collapse:collapse;font-size:var(--ppq-fs-small)}
.ppq-totals th{text-align:start;font-weight:400;color:var(--ppq-text-muted);padding:9px 10px 9px 0}
.ppq-totals td{
  text-align:end;padding:9px 0;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:550;
}
.ppq-totals tr.ppq-discount th,.ppq-totals tr.ppq-discount td{color:var(--ppq-green-deep)}
.ppq-totals tr.ppq-sub th,.ppq-totals tr.ppq-sub td{
  border-block-start:1px solid var(--ppq-border);font-weight:650;color:var(--ppq-text);
}
.ppq-totals tr.ppq-grand th,.ppq-totals tr.ppq-grand td{
  border-block-start:2px solid var(--ppq-navy);font-size:var(--ppq-fs-figure);
  font-weight:650;letter-spacing:-.5px;color:var(--ppq-text);padding-block-start:14px;
}
.ppq-totals tr.ppq-grand th{font-size:var(--ppq-fs-body);font-weight:600;letter-spacing:0}
.ppq-totals-note{font-size:var(--ppq-fs-micro);color:var(--ppq-text-muted);margin-block-start:12px;line-height:1.6}

/* ============ specification ============ */
.ppq-specgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 26px}
.ppq-spec{border-block-start:1px solid var(--ppq-rule);padding-block:11px}
.ppq-spec dt{font-size:var(--ppq-fs-micro);color:var(--ppq-text-muted);margin-block-end:5px}
.ppq-spec dd{margin:0;font-size:var(--ppq-fs-small);font-weight:550;line-height:1.55}
.ppq-spec dd em{font-style:normal;font-weight:400;color:var(--ppq-text-muted);display:block;font-size:var(--ppq-fs-micro);margin-block-start:4px}

/* ============ terms ============ */
.ppq-terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 30px}
.ppq-term{border-block-start:1px solid var(--ppq-rule);padding-block:14px}
.ppq-term dt{
  font-size:var(--ppq-fs-micro);font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ppq-text-label);margin-block-end:7px;
}
.ppq-term dd{margin:0;font-size:var(--ppq-fs-small);line-height:1.65}
.ppq-list{margin:0;padding-inline-start:20px;font-size:var(--ppq-fs-small);line-height:1.7}
.ppq-list li{margin-block:7px}
.ppq-list li span{color:var(--ppq-text-muted)}
.ppq-pay{inline-size:100%;border-collapse:collapse;font-size:var(--ppq-fs-small);margin-block-start:4px}
.ppq-pay th,.ppq-pay td{padding:9px 10px 9px 0;border-block-end:1px solid var(--ppq-border-soft);text-align:start;vertical-align:top}
.ppq-pay th{font-weight:600;font-size:var(--ppq-fs-micro);color:var(--ppq-text-label)}
.ppq-pay td:last-child{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ============ precedence ============ */
.ppq-precedence{
  background:var(--ppq-surface-info);border-radius:var(--ppq-radius);
  padding:14px 16px;margin-block-start:16px;font-size:var(--ppq-fs-micro);
  line-height:1.7;color:var(--ppq-text-info);
}
.ppq-precedence ol{margin:8px 0 0;padding-inline-start:20px}

/* ============ acceptance ============ */
.ppq-accept{border-color:var(--ppq-navy);border-width:2px}
.ppq-accept > h2{color:var(--ppq-text)}
.ppq-accept-summary{
  background:var(--ppq-surface-accent);border:1px solid var(--ppq-border-accent);
  border-radius:var(--ppq-radius-card);padding:17px 19px;margin-block:16px 22px;
}
.ppq-accept-summary h3{margin:0 0 11px;font-size:var(--ppq-fs-micro)}
.ppq-accept-summary ul{margin:0;padding-inline-start:19px;font-size:var(--ppq-fs-small);line-height:1.7}
.ppq-accept-amount{
  display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;align-items:baseline;
  margin-block-start:14px;padding-block-start:13px;border-block-start:1px solid var(--ppq-border-accent);
}
.ppq-accept-amount span{font-size:var(--ppq-fs-small);color:var(--ppq-text-muted)}
.ppq-accept-amount b{font-size:var(--ppq-fs-h2);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.4px}

.ppq-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 20px}
.ppq-field{display:flex;flex-direction:column;gap:7px;margin-block:14px}
.ppq-field label{font-size:var(--ppq-fs-small);font-weight:600}
.ppq-field label .ppq-req{color:var(--ppq-text-danger);font-weight:400}
.ppq-field input{
  border:1px solid var(--ppq-border-strong);border-radius:var(--ppq-radius);
  padding:11px;font-size:var(--ppq-fs-small);background:var(--ppq-surface);
  min-block-size:var(--ppq-control-h);inline-size:100%;
}
.ppq-field input[aria-invalid="true"]{border-color:var(--ppq-text-danger);background:var(--ppq-surface-danger)}
.ppq-field small{font-size:var(--ppq-fs-micro);color:var(--ppq-text-muted);line-height:1.55}
.ppq-field .ppq-err{color:var(--ppq-text-danger);font-weight:550}
.ppq-sign input{
  font-size:var(--ppq-fs-h3);font-weight:600;letter-spacing:.3px;
  padding:13px 12px;background:var(--ppq-surface-muted);
}

.ppq-consent{
  display:flex;gap:13px;align-items:flex-start;margin-block:20px;
  padding:16px 17px;border:1px solid var(--ppq-border);border-radius:var(--ppq-radius-card);
  background:var(--ppq-surface-muted);cursor:pointer;
}
.ppq-consent:has(input:checked){background:var(--ppq-surface-selected);border-color:var(--ppq-border-accent)}
.ppq-consent:has(input:focus-visible){outline:3px solid var(--ppq-focus);outline-offset:2px}
.ppq-consent input{inline-size:var(--ppq-tap);block-size:var(--ppq-tap);margin:0;flex:0 0 auto;accent-color:var(--ppq-green-deep);cursor:pointer}
.ppq-consent span{font-size:var(--ppq-fs-small);line-height:1.65}

.ppq-accept-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-block-start:6px}
.ppq-accept-actions .ppq-btn-accept{padding:13px 26px;font-size:var(--ppq-fs-body)}

const isOpen = () => ["issued", "viewed", "expiring"].includes(state.lifecycle);

/* ================================================================
   ARITHMETIC — summation over frozen amounts only.
   No pricing engine exists on this path (blueprint §3, asserted below).
   ================================================================ */
function compute() {
  const baseCents = DOCUMENT.baseLines.reduce((t, l) => t + l.sellCents, 0);
  const selected = [];
  let deltaCents = 0;
  for (const o of DOCUMENT.offers) {
    const memberId = state.selection.get(o.id);
    if (!memberId) continue;
    const m = o.members.find(x => x.id === memberId);
    if (!m) continue;
    selected.push({ offer: o, member: m });
    deltaCents += m.deltaCents;
  }
  const subtotalCents = baseCents + deltaCents;
  const exGstCents = subtotalCents - DOCUMENT.discountCents;
  const gstCents = gstOn(exGstCents);
  return {
    baseCents, deltaCents, subtotalCents, exGstCents, gstCents,
    inclGstCents: exGstCents + gstCents, selected
  };
}

/* reconciliation identity — blueprint §6.5, asserted at every render */
function assertReconciles(c) {
  const ok = c.baseCents + c.deltaCents - DOCUMENT.discountCents === c.exGstCents
          && c.exGstCents + c.gstCents === c.inclGstCents;
  if (!ok) console.error("PPQ: reconciliation identity failed", c);
  return ok;
}

function scopeTable() {
  const bySection = new Map();
  for (const l of DOCUMENT.baseLines) {
    if (!bySection.has(l.section)) bySection.set(l.section, []);
    bySection.get(l.section).push(l);
  }
  let rows = "";
  for (const [section, lines] of bySection) {
    rows += `<tr class="ppq-secrow"><th scope="rowgroup" colspan="3">${esc(section)}</th></tr>`;
    for (const l of lines) {
      const qty = l.unit === "lot" ? "1 lot" : `${l.quantity} ${esc(l.unit)}${l.quantity === 1 ? "" : "s"}`;
      rows += `<tr>
        <td class="ppq-desc" data-label="Item"><b>${esc(l.description)}</b><small>${esc(l.detail)}</small></td>
        <td class="ppq-num ppq-qty" data-label="Quantity">${esc(qty)}</td>
        <td class="ppq-num" data-label="Amount ex GST">${esc(money(l.sellCents))}</td>
      </tr>`;
    }
  }
  return `
  <div class="ppq-tablewrap">
    <table class="ppq-table">
      <caption>Included scope. All amounts in Australian dollars, excluding GST.</caption>
      <thead><tr>
        <th scope="col">Item</th>
        <th scope="col" class="ppq-num">Quantity</th>
        <th scope="col" class="ppq-num">Amount ex GST</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function offerBlock(o) {
  const locked = !state.selectable || !o.customerSelectable || !isOpen();
  const chosen = state.selection.get(o.id);
  const isRadio = o.type === "alternative_group";

  const rows = o.members.map(m => {
    const checked = chosen === m.id;
    const price = m.deltaCents === 0 ? "Included" : `+ ${money(m.deltaCents)}`;
    const aria = `${o.label}: ${m.label}, ${price}`;
    const input = locked
      ? `<input type="${isRadio ? "radio" : "checkbox"}" ${checked ? "checked" : ""} disabled
                aria-label="${esc(aria)}">`
      : `<input type="${isRadio ? "radio" : "checkbox"}" ${checked ? "checked" : ""}
                name="${esc(o.id)}" value="${esc(m.id)}" data-offer="${esc(o.id)}" data-member="${esc(m.id)}"
                aria-label="${esc(aria)}">`;
    return `<label class="ppq-choice">
      ${input}
      <span class="ppq-choice-body">
        <span class="ppq-choice-title">
          <b>${esc(m.label)}</b>
          <span class="ppq-choice-price">${esc(price)}</span>
        </span>
        <small>${esc(m.note)}</small>
      </span>
    </label>`;
  }).join("");

  const lockNote = locked && isOpen()
    ? `<span class="ppq-locked">As quoted</span>` : "";

  return `<div class="ppq-offer">
    <div class="ppq-offer-head">
      <b>${esc(o.label)}</b>
      ${lockNote}
    </div>
    <p class="ppq-offer-desc">${esc(o.description)}</p>
    ${isRadio ? `<div role="radiogroup" aria-label="${esc(o.label)}">${rows}</div>` : rows}
  </div>`;
}

        All amounts in Australian dollars. GST shown separately.
      </div>
      <div>
        Quotation ${esc(DOCUMENT.quotationNumber)} R${String(DOCUMENT.revision).padStart(2, "0")}<br>
        Issued ${esc(auDate(DOCUMENT.issuedAt))}<br>
        Document reference<br><span class="ppq-hash">${esc(DOCUMENT.documentHash)}</span>
      </div>
    </div>
    <div class="ppq-synthetic">
      Fictional data — design preview. No rule is approved. This is not engineering sizing
      and not a commercial approval.
    </div>
  </footer>`;
}

/* ================================================================
   RENDER
   ================================================================ */
function render(preserveScroll = true) {
  const main = $("ppq-main");
  const top = preserveScroll ? root.scrollTop : 0;
  const c = compute();
  assertReconciles(c);

  $("ppq-mast-meta").innerHTML = mastMeta();

  main.innerHTML =
    head() +
    (state.lifecycle === "accepted" ? confirmation() : "") +
    parties() +
    pricing(c) +
    specSection() +
    termsSection() +
    acceptSection(c) +
    signBlock(c) +
    footer();

  root.scrollTop = top;
  const sel = $("ppq-state-select");
  if (sel && sel.value !== state.lifecycle) sel.value = state.lifecycle;
  bind();
}

/* ================================================================
   BINDING
   ================================================================ */
function bind() {
  const main = $("ppq-main");

  main.querySelectorAll("[data-offer]").forEach(input => {
    on(input, "change", () => {
      const offerId = input.dataset.offer;
      const memberId = input.dataset.member;
      const offer = DOCUMENT.offers.find(o => o.id === offerId);
      if (!offer) return;
      if (offer.type === "alternative_group") {
        state.selection.set(offerId, memberId);
      } else {
        state.selection.set(offerId, input.checked ? memberId : null);
      }
      const c = compute();
      announce(`Selection updated. Total including GST ${money(c.inclGstCents)}.`);
      render();
    });
  });

  main.querySelectorAll("[data-field]").forEach(input => {
    on(input, "input", () => { state.form[input.dataset.field] = input.value; });
  });

  const consent = $("ppq-consent");
  on(consent, "change", () => { state.form.consent = consent.checked; });

  on($("ppq-print"), "click", () => window.print());
  on($("ppq-print-2"), "click", () => window.print());
  on($("ppq-jump"), "click", () => {
    const el = $("ppq-accept");
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    const first = $("ppq-name");
    if (first) first.focus({ preventScroll: true });
  });
  on($("ppq-do-accept"), "click", accept);
  on($("ppq-do-decline"), "click", openDecline);
}

/* ================================================================
   ACCEPTANCE
   ================================================================ */
function validateForm() {
  const f = state.form;
  const e = {};
  if (!f.name.trim()) e.name = "Enter your full name.";
  if (!f.position.trim()) e.position = "Enter your position.";
  if (!f.email.trim()) e.email = "Enter your email address.";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) e.email = "Enter a valid email address.";
  if (!f.actingFor.trim()) e.actingFor = "Enter the entity you are accepting on behalf of.";
  if (!f.consent) e.consent = "Please confirm you agree to accept by electronic signature.";
  if (!f.signature.trim()) e.signature = "Type your full name to sign.";
  else if (f.signature.trim().toLowerCase() !== f.name.trim().toLowerCase())
    e.signature = "Your typed signature must match the name entered above.";
  return e;
}

function accept() {
  const errors = validateForm();
  state.errors = errors;
  const keys = Object.keys(errors);
  if (keys.length) {
    render();
    const first = $("ppq-" + keys[0]) || $("ppq-consent");
    if (first) first.focus();
    toast(`${keys.length} ${keys.length === 1 ? "field needs" : "fields need"} attention before you can accept.`);
    return;
  }
  const c = compute();
  state.acceptance = {
    name: state.form.name.trim(),
    position: state.form.position.trim(),
    email: state.form.email.trim(),
    actingFor: state.form.actingFor.trim(),
    at: new Date().toISOString(),
    inclGstCents: c.inclGstCents,
    exGstCents: c.exGstCents,
    selection: [...state.selection.entries()]
  };
  state.lifecycle = "accepted";
  state.errors = {};
  render(false);
  ($("ppq-conf-h") || $("ppq-main")).focus();
  toast("Accepted in this preview. Nothing was sent or saved.");
  announce("Quotation accepted in this preview. Nothing was sent or saved.");
}

/* ================================================================
   DECLINE DIALOG
   ================================================================ */
let declineOpener = null;
function openDecline(ev) {
  declineOpener = ev.currentTarget;
  const dlg = $("ppq-dialog");
  $("ppq-dlg-reason").value = state.declineReason;   // retained across close/reopen
  dlg.showModal();
  $("ppq-dlg-title").focus();
}
function closeDecline(confirmed) {
  const dlg = $("ppq-dialog");
  state.declineReason = $("ppq-dlg-reason").value;
  if (dlg.open) dlg.close();
  if (confirmed) {
    state.lifecycle = "declined";
    render(false);
    toast("Declined in this preview. Nothing was sent or saved.");
  }
  if (declineOpener && document.contains(declineOpener)) declineOpener.focus();
  declineOpener = null;
}

/* ================================================================
   TOAST / ANNOUNCE
   ================================================================ */
let toastTimer = null;
function toast(msg) {
  const t = $("ppq-toast");
  t.hidden = false;              // reveal first, then write (blueprint U9)
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; t.textContent = ""; }, 5000);
}
function announce(msg) { $("ppq-announce").textContent = msg; }

/* ================================================================
   PREVIEW CONTROLS
   ================================================================ */
on($("ppq-state-select"), "change", e => {
  state.lifecycle = e.target.value;
  if (state.lifecycle !== "accepted") state.acceptance = null;
  else if (!state.acceptance) {
    const c = compute();
    state.acceptance = {
      name: DOCUMENT.customer.contact, position: DOCUMENT.customer.position,
      email: DOCUMENT.customer.email, actingFor: DOCUMENT.customer.name,
      at: new Date().toISOString(), inclGstCents: c.inclGstCents, exGstCents: c.exGstCents,
      selection: [...state.selection.entries()]
    };
  }
  state.errors = {};
  render(false);
});
on($("ppq-lock-select"), "change", e => {
  state.selectable = e.target.value === "open";
  if (!state.selectable) state.selection = defaultSelection();
  render(false);
});

on($("ppq-dlg-cancel"), "click", () => closeDecline(false));
on($("ppq-dlg-confirm"), "click", () => closeDecline(true));
on($("ppq-dialog"), "cancel", e => { e.preventDefault(); closeDecline(false); });

/* ================================================================
   TEARDOWN — blueprint container contract
   ================================================================ */
on(root, "ppo-quotation-dispose", () => {
  clearTimeout(toastTimer);
  const dlg = $("ppq-dialog");
  if (dlg && dlg.open) dlg.close();
  ac.abort();
});

/* ================================================================
   SELF-CHECKS — the invariants this module must not lose
   ================================================================ */
(function selfCheck() {
  const FORBIDDEN = [
    "cost", "costCents", "unitCost", "margin", "marginPct", "profit", "grossProfit",
    "contingencyPct", "contingencyBasis", "discountReason", "overrideReason",
    "ruleId", "ruleVersion", "ruleDriver", "costType", "priceListId",
    "supplierSource", "supplierRef", "priceStatus", "priceDate",
    "internalNote", "labourHours", "labourRate", "rateId", "inputHash"
  ];
  const found = new Set();
  (function walk(v) {
    if (!v || typeof v !== "object") return;
    for (const k of Object.keys(v)) {
      if (FORBIDDEN.includes(k)) found.add(k);
      walk(v[k]);
    }
  })(DOCUMENT);
  if (found.size) console.error("PPQ: forbidden key in projection:", [...found]);

  const c = compute();
  if (!assertReconciles(c)) console.error("PPQ: default selection does not reconcile");
})();

render(false);

})();
</script>
</body>
