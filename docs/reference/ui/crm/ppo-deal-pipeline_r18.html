User review takes precedence over conflicting requirements in the original v2 brief.

fixed triage; modeless right panels; full deal route; session-only email drafts.
Email preview never sends a message. Production mail integration remains separate.

GOVERNING SOURCES read from deanrfiedler-gif/powerplants-one default branch:
docs/standards/ui-style-specification.md r06
  (blob c61ac647375441c99d94fc1f36a3e044752de756; accepted r08 supersession)
docs/decisions/shared-ui-r08-implementation.md
docs/decisions/crm-pipeline-stage-model.md (12 September amendment)
docs/standards/naming-conventions.md PPO-STD-001 r03
docs/decisions/desktop-shell-integration.md

SUBSTITUTIONS / CONFLICTS:
1. Accepted r08's navy actions, fitting desktop columns and ONE shared vertical
   board scroll override brief §§7.1/18's independent columns and 280px minimum.
   All five stages fit at every supported Board width (1024px and above).
   Below 1024px, List is used. Side panels overlay without changing column widths.
2. The requested #deal-board root wraps #ppo-deals, the portable PPO scope.
   Tokens and local reset are scoped on #ppo-deals; only the document adapter
   sets the body margin/overflow. No application shell is drawn.
3. Expected close remains visible on cards per accepted UI card definition.
   Value sits on the close-date row so titles remain readable in fitting columns.
4. Governed exit statements are used verbatim, split only at explicit conjunctions.
5. Stage-rule table is applied conservatively. A paragraph in the stage decision
   also mentions direct Quoting-to-Closing acceptance; this conflicts with its
   one-stage-forward table. No silent skip exception is introduced here.
6. Page search is withdrawn by supplied brief §12.2 but the shell record and CI
   still expect it. data-page-search="off" is the reinstatement toggle. No route,
   global search or production contract is changed by this prototype.
7. Bulk movement is now requested in this design brief; it remains prototype
   behaviour, not acceptance of a production command or permission contract.

TOKEN PLAN: navy #242a37 (actions and text); green #62bb46 (progress/focus cues);
white #ffffff (records); workspace #f5f6f8 (canvas); divider #dce0e5; muted #606977.
Roboto when locally installed, Verdana/system fallback; no font requests.
Type: 11–12 metadata, 13 body, 14 toolbar, 14–16 stage, 20 detail. Four-pixel spacing base.
Radii: 6 controls / 7 cards / 10 panels. Semantic error/attention roles reuse PPO.
Principles: next action before secondary detail; changes visible in context;
consequences and recovery visible at the moment of a movement.

OPEN POINTS — deliberately not settled by this HTML:
1. Whether every move needs an explicit recorded reason or a generic one suffices.
2. Stage probabilities: 10/25/50/70/90% are assumed illustrative estimates.
3. What Won triggers for Projects: create, link or record a handover due.
4. Whether page-level search returns.
5. Stage entry reset / ordinal semantics on re-entry. Demo uses latest entry only.
6. Whether exit criteria ever gate moves. They are advisory in this prototype.
7. Forecast-category ownership and manager override permissions.

ASSUMPTIONS: histories track stages, not prior values/categories. Movement-value
deltas assume those fields unchanged in historical snapshots and state this on hover.
Forecast estimates exclude Omitted, show owner judgement separately, and use the
current filtered scope. Coverage targets are illustrative, configurable constants.
The 18 current opportunities reconcile to $1,189,150.50; two additional outcome-only
historical snapshots power the retrospective tray and never count as open records.
Two missing-action and two overdue examples give four high signals across 18 records.
Coloured initials denote internal staff; outlined people denote external contacts.
Primary contact names appear below the organisation on cards and in List.
Exit checkbox substructure, failure simulations and in-memory Undo are presentation
proposals. No fixture is evidence of business or production acceptance.

EXCLUSIONS: no WIP cap, opaque score, quotation status badge, second pipeline,
scatter/bubble view, gamification, card-size weighting or next-action quality score.
These add scope or contradict the deterministic, scannable working surface.

RESEARCH: W3C WCAG 2.2 SC 2.5.7 requires pointer alternatives in addition to keyboard:
https://www.w3.org/WAI/WCAG22/Understanding/dragging-movements.html
Pipedrive product reference: https://www.pipedrive.com/ (activity-centred pipeline).
Do not infer a claim that competitors lack comparable capabilities.

VERIFICATION STATUS: source/model/DOM interaction checks are recorded in the sibling
change record. Cloud Browser refused file preview under its URL security policy.
No rendered-browser, pixel, real-device or whole-product accessibility sign-off.

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const btn=(action,label,ic='',className='btn',extra='')=>`<button type="button" class="${className}" data-action="${action}" ${extra}>${ic?icon(ic):''}${label}</button>`;
const byId=id=>deals.find(d=>d.id===id);
const severityName=s=>s===3?'high':s===2?'medium':'low';
let activeDealId=null,recordTab='overview',lastPopupAnchor=null,lastCardPointer=null,lastBoardScroll={x:0,y:0},lastDealTrigger=null;
const emailDrafts=new Map();
let pending=new Set(),failed=new Set(),highlighted=new Set(),drag=null,dialogStack=[],changeLog=[],toasts=[],triage=null,collapsedGroups=new Set();
function tipAttr(text){return `data-tip="${esc(text)}"`;}
function healthChip(d){const all=derived.health[d.id]||[],h=all[0];return h?`<button type="button" class="health-chip ${severityName(h.severity)}" data-action="health-detail" data-id="${d.id}" data-testid="deal-card-health-${d.id}" aria-label="Review health: ${esc(h.label)}${all.length>1?`, plus ${all.length-1} other signals`:''}">${icon(h.icon)}<span class="health-label">${esc(h.text)}</span>${all.length>1?`<span class="health-extra">+${all.length-1}</span>`:''}</button>`:'';}

function nextAction(d){const a=d.nextActivity;return `<div class="next-action ${!a?'none':new Date(a.dueAt)<REFERENCE_NOW?'overdue':''}">${icon(!a?'calendar':({Call:'call',Email:'email',Meeting:'users',Task:'task'}[a.type]||'task'))}<div class="action-copy"><span class="action-title" ${tipAttr(a?.title||'Nothing scheduled')}>${esc(a?.title||'Nothing scheduled')}</span><span>${a?dueText(a.dueAt):'Schedule a follow-up'}</span></div></div>`;}
function card(d){const h=derived.health[d.id]||[],urgent=h.find(s=>['no-action','overdue'].includes(s.id)),m=state.movement==='off'?null:movementFor(d,windowStart(state.movement));return `<article class="card ${urgent?'has-caution':''} ${pending.has(d.id)?'pending':''} ${failed.has(d.id)?'failed':''} ${highlighted.has(d.id)?'highlight':''} ${state.selection.has(d.id)?'selected':''}" data-testid="deal-card-${d.id}" data-deal="${d.id}" tabindex="0" draggable="${!pending.has(d.id)}" aria-label="${esc(`${d.title}, ${d.organisation}, ${money(d.value)}, ${d.stage}. Enter opens the deal; Space starts a move.`)}" aria-busy="${pending.has(d.id)}">${m?.new?'<span class="movement-badge">New</span>':m?.changed?`<span class="movement-badge ${m.back?'back':''}">${m.back?'Moved back':'Moved forward'}</span>`:''}${urgent?btn('health-detail','','alert','card-caution',`data-id="${d.id}" aria-label="${esc(urgent.label)}: review health" ${tipAttr(urgent.text)}`):''}<button type="button" class="card-title" data-action="deal-page" data-id="${d.id}" data-testid="deal-title-${d.id}" title="${esc(d.title)}">${esc(d.title)}</button><p class="card-org" title="${esc(d.organisation)}">${esc(d.organisation)}</p><p class="card-contact" title="Primary contact: ${esc(d.contacts[0]?.name||'Not recorded')}">${esc(d.contacts[0]?.name||'No primary contact')}</p><div class="card-value"><span class="close" title="Expected close ${fmtDate(d.expectedCloseDate)}">${icon('finish')}${shortDate(d.expectedCloseDate)}</span><strong class="${d.value===null?'unknown':''}">${money(d.value)}</strong></div>${nextAction(d)}<div class="health-line">${h.length?healthChip(d):`<span class="ready-label">${icon('check')}${d.exitCriteria.length&&d.exitCriteria.every(c=>c.met)?'Ready to advance':'Next action planned'}</span>`}</div><div class="card-footer"><div class="card-owners">${personAvatar(d.owner,'Opportunity owner')}${d.nextActivity?personAvatar(d.nextActivity.owner,'Activity owner'):''}</div><div class="card-actions" role="group" aria-label="Quick actions for ${esc(d.title)}">${quickAction('detail','Snapshot','task',d.id)}${quickAction('email','Email contact','email',d.id)}${quickAction('schedule','Set next activity','calendar',d.id)}${quickAction('edit','Edit opportunity','edit',d.id)}</div></div></article>`;}

function quickAction(action,label,ic,id){return btn(action,'',ic,'card-action',`data-id="${id}" data-testid="deal-${action}-${id}" aria-label="${label}: ${esc(byId(id)?.title||'opportunity')}" ${tipAttr(label)}`);}

function filterLabels(){const f=state.filters,r=[];if(f.stages.length)r.push(['stages','Stage: '+f.stages.join(', ')]);if(state.q&&host.dataset.pageSearch==='on')r.push(['q','Search: '+state.q]);if(f.owners.length)r.push(['owners','Owner: '+f.owners.map(id=>USERS.find(u=>u.id===id)?.name||id).join(', ')]);if(f.signals.length)r.push(['signals',f.signals.length===2&&f.signals.includes('no-action')&&f.signals.includes('overdue')?'At risk':f.signals.map(id=>SIGNALS.find(s=>s.id===id)?.label||id).join(', ')]);if(f.categories.length)r.push(['categories','Forecast: '+f.categories.join(', ')]);if(f.tags.length)r.push(['tags','Tags: '+f.tags.join(', ')]);if(f.value)r.push(['value',{under50:'Value under $50,000','50to100':'Value $50,000–$100,000',over100:'Value over $100,000'}[f.value]]);if(f.period)r.push(['period','Close: '+({this:'this month',next:'next month',after:'month after next',quarter:'this quarter',overdue:'overdue',custom:`${f.from||'any date'} to ${f.to||'any date'}`}[f.period])]);if(f.days)r.push(['days',`In stage > ${f.days} days`]);if(f.slipped)r.push(['slipped','Slipped 2+ times']);if(f.unknown)r.push(['unknown','Not estimated']);return r;}
function isModified(){return JSON.stringify(state.filters)!==JSON.stringify(SAVED_VIEWS[state.saved]||EMPTY_FILTERS);}
function toolbar(){const narrow=innerWidth<1024;return `<div class="toolbar" data-testid="toolbar"><div class="pipeline-label">${icon('pipeline')}<span>Sales pipeline</span></div><div class="segment" role="group" aria-label="View mode" data-testid="view-toggle">${btn('view-board','Board','board','',`aria-pressed="${state.view==='board'&&!narrow}" data-testid="view-toggle-board" ${narrow?'disabled title="Board view requires a width of at least 1024 pixels"':''}`)}${btn('view-list','List','list','',`aria-pressed="${state.view==='list'||narrow}" data-testid="view-toggle-list"`)}</div>
 ${host.dataset.pageSearch==='on'?'<input type="search" class="page-search" id="page-search" data-testid="page-search" aria-label="Search opportunities" placeholder="Search opportunities" value="'+esc(state.q)+'">':''}${btn('filters','Filters'+(filterLabels().length?' '+filterLabels().length:''),'filter','btn '+(filterLabels().length?'active-control':''),'data-testid="filters-button" aria-haspopup="dialog"')}
 ${btn('saved-views',esc(state.saved)+(isModified()?' *':'')+icon('chevron'),'','quiet saved-button','data-testid="saved-views" aria-haspopup="dialog"')}
 <span class="divider"></span>${btn('movement',`<span class="movement-text">What changed</span>${state.movement!=='off'?'<span class="dot"></span>':''}`,'changes','quiet '+(state.movement!=='off'?'active-control':''),'data-testid="movement-toggle" aria-haspopup="dialog" aria-pressed="'+(state.movement!=='off')+'"')}
 ${btn('triage','Triage'+(derived.risk.length?` <span class="triage-count">${derived.risk.length}</span>`:''),'triage','quiet triage-button','data-testid="triage-button"')}<span class="spacer"></span>
 ${btn('more','','more','icon-btn','aria-label="View options" data-testid="more-options" '+tipAttr('View options'))}${btn('change-log','','history','icon-btn','aria-label="Session changes" data-testid="change-log-button" '+tipAttr('Session changes'))}${btn('help','','help','icon-btn','aria-label="Deal board guide" data-testid="help-button" '+tipAttr('Deal board guide'))}
 ${btn('new','<span>Opportunity</span>','plus','primary new-button','data-testid="new-opportunity-button"')}</div>`;}

function summary(){const labels=filterLabels();return `<section class="compact-strip" data-testid="summary-strip" aria-label="Pipeline status"><button class="strip-metric" data-action="insights" aria-label="Open pipeline insights"><span class="muted">Open</span><strong data-testid="summary-open">${money(derived.value)}</strong></button><span class="strip-divider"></span><button class="strip-metric" data-action="insights" aria-label="Weighted forecast insights"><span class="muted">Weighted</span><strong data-testid="summary-weighted">${money(derived.weighted)}</strong><span class="muted">est.</span></button><span class="strip-divider"></span>${btn('risk-filter',`${derived.risk.length} at risk`,'alert','strip-metric strip-risk','data-testid="summary-at-risk"')}<div class="strip-scope">${labels.length?btn('active-filters',labels.length+' active','','filter-count','data-testid="active-filters" aria-label="Review active filters"'):''}${state.selection.size?btn('selection-panel',state.selection.size+' selected','','filter-count','data-testid="selection-count"'):''}<span class="scope-count" data-testid="result-count">${derived.visible.length} deals</span><span class="strip-unit">AUD excl. GST</span>${btn('insights','Insights','flag','strip-action','data-testid="insights-button"')}</div><div id="forecast-preview" class="drag-preview" data-testid="forecast-preview" hidden></div></section>`;}
function openInsights(){openDialog('insights','Pipeline insights',insightBody()+attentionInsights(),'','insight-dialog',{subtitle:'Current view · Illustrative forecast assumptions'});}
function openActiveFilters(){menu('Active filters',filterLabels().map(([f,l])=>menuItem('clear-filter',esc(l)+icon('close'),'',`data-field="${f}" data-testid="filter-chip-${f}" aria-label="Remove ${esc(l)}"`)).join('')+'<div class="menu-divider"></div>'+menuItem('clear-all','Clear all filters','close')+(isModified()?menuItem('revert','Revert to saved view','back'):''));}
function insightBody(){const metrics=[['open','Open pipeline',money(derived.value)],['weighted','Weighted (est.)',money(derived.weighted)],['commit','Commit',money(derived.commit)],['best','Commit + best case',money(derived.best)],['at-risk','At risk',derived.risk.length],['not-estimated','Not estimated',derived.unknown]];
 const m=derived.movement;return `<section class="insight-summary" data-testid="insight-summary" aria-label="Pipeline summary"><div class="metrics">${metrics.map(([id,label,n])=>`<div class="metric"><div class="label">${label}${id==='weighted'?`<span tabindex="0" ${tipAttr('Estimate only: stage probability × known value. Discovery 10%, Scoping 25%, Quoting 50%, Negotiation 70%, Closing 90%. Omitted deals excluded. Owner categories are shown separately.')}>${icon('info')}</span>`:''}</div>${id==='at-risk'||id==='not-estimated'?btn(id==='at-risk'?'risk-filter':'unknown-filter',n,'','number '+(id==='at-risk'?'risk-number':''),`data-testid="insight-${id}"`):`<div class="number" data-testid="insight-${id}">${n}</div>`}</div>`).join('')}</div>
 <div class="coverage-row"><span class="coverage-label">Close coverage <span ${tipAttr('Weighted estimate divided by the sample monthly target. Respects current filters.')} tabindex="0">${icon('info')}</span></span>${[0,1,2].map((i)=>{const dt=new Date(REFERENCE_NOW.getFullYear(),REFERENCE_NOW.getMonth()+i,1),arr=derived.visible.filter(d=>periodMatch(d.expectedCloseDate,['this','next','after'][i])),val=sumWeighted(arr),target=MONTH_TARGETS[i],cov=target?val/target:null;return btn('coverage',`<span>${dt.toLocaleDateString('en-AU',{month:'short'})}</span><span>${compactMoney(val)} est.</span><strong>${cov===null?'No target':cov.toFixed(1)+'×'}</strong>`,'','coverage '+(cov!==null&&cov<1?'low ':'')+(state.filters.period===['this','next','after'][i]?'active-control':''),`data-index="${i}" data-testid="coverage-cell-${i}" ${tipAttr(`${money(val)} weighted estimate / ${money(target)} sample target. Click to filter this close period.`)}`)}).join('')}<span class="sample">AUD excl. GST${SHOW_SAMPLE_DATA?' &nbsp; | &nbsp; Sample data':''}</span></div>
 ${state.movement!=='off'?`<div class="change-summary" data-testid="movement-summary">${icon('changes')}<strong>Since ${shortDate(m.start)}</strong><span>Open ${signedMoney(m.openDelta)}</span><span>Weighted ${signedMoney(m.weightedDelta)} (est.)</span><span>${m.forward} forward</span><span>${m.back} back</span><span>${m.fresh} new</span><span>${m.closed.length} closed</span><span ${tipAttr('Movement totals use the whole pipeline. Current filters still control visible cards. Historical value and forecast category are assumed unchanged because the supplied stage history has no field-value snapshots.')} tabindex="0">${icon('info')}</span></div>`:''}
 </section>`;}

function renderColumnItems(ds,stage){
 const entries=ds.map(d=>({...d,_ghost:false}));
 if(state.movement!=='off')for(const d of derived.visible){const m=movementFor(d,windowStart(state.movement));if(m.changed&&m.previous===stage)entries.push({...d,order:m.previousOrder,_ghost:true});}
 return sortDeals(entries,state.columnSort[stage]||state.sort).map(d=>d._ghost?`<div class="ghost" data-ghost="${d.id}" data-testid="ghost-${d.id}"><strong>${esc(d.title)}</strong>${icon('right')} Now in ${d.stage}</div>`:card(d)).join('');
}
function board(){const arr=derived.visible,tracks=state.collapsed.length?` style="grid-template-columns:${STAGES.map(s=>state.collapsed.includes(s)?'52px':'minmax(0,1fr)').join(' ')}"`:'';return `<div class="board-scroll" data-testid="board-scroll" data-scrolled="false"><div class="board-grid" role="list" aria-label="Sales pipeline"${tracks}>${STAGES.map((s,i)=>{const ds=arr.filter(d=>d.stage===s),collapsed=state.collapsed.includes(s);return `<section class="stage-column ${collapsed?'is-collapsed':''}" role="listitem" aria-label="${s}" data-stage="${s}" data-testid="stage-column-${s}"><header class="stage-header" data-testid="stage-column-header-${s}">${collapsed?`${btn('collapse-stage','','right','stage-expand',`data-stage="${s}" aria-label="Expand ${s}" aria-expanded="false"`)}<span class="collapsed-name">${s}</span><span class="collapsed-count">${ds.length}</span>`:`<div class="stage-heading"><h2>${s}</h2>${btn('stage-menu','','more','stage-menu-button',`data-stage="${s}" aria-label="${s} stage options" aria-haspopup="dialog"`)}</div><div class="stage-summary"><span class="stage-amount" data-testid="stage-value-${s}">${money(total(ds))}</span><span class="stage-count" data-testid="stage-count-${s}">${ds.length} <span>deals</span></span></div>`}</header>${!collapsed?`<div class="cards" data-testid="stage-cards-${s}">${renderColumnItems(ds,s)}${!ds.length?`<div class="empty-stage">${derived.open.some(d=>d.stage===s)?'No matches in '+s:'No opportunities in '+s}${btn('new-stage','Opportunity','plus','quiet small-btn',`data-stage="${s}"`)}</div>`:''}</div>`:''}</section>`}).join('')}<svg class="movement-lines" aria-hidden="true"></svg></div></div>`;}

const COLUMNS=[['title','Opportunity',235],['organisation','Organisation',185],['contact','Primary contact',160],['stage','Stage',140],['value','Value',130],['weighted','Weighted (est.)',140],['forecastCategory','Forecast',145],['owner','Owner',155],['nextActivity','Next action',215],['activityOwner','Activity owner',175],['due','Due',150],['days','Days in stage',115],['slipped','Slipped',90],['expectedCloseDate','Expected close',165],['health','Health',175]];
function row(d){return `<tr data-testid="deal-row-${d.id}" data-id="${d.id}" class="${state.selection.has(d.id)?'is-selected':''} ${pending.has(d.id)?'pending':''} ${failed.has(d.id)?'failed':''}"><td class="pin-check"><input type="checkbox" data-select="${d.id}" data-testid="select-${d.id}" aria-label="Select ${esc(d.title)}" ${state.selection.has(d.id)?'checked':''}></td><td class="pin-title"><div class="list-title-wrap">${btn('deal-page',esc(d.title),'','table-title',`data-id="${d.id}" data-testid="list-title-${d.id}"`)}${quickAction('detail','Snapshot','task',d.id)}${quickAction('edit','Edit opportunity','edit',d.id)}</div></td><td title="${esc(d.organisation)}">${esc(d.organisation)}</td><td>${esc(d.contacts[0]?.name||'—')}</td><td>${btn('move',d.stage+icon('chevron'),'','table-control',`data-id="${d.id}" aria-label="Move ${esc(d.title)}"`)}</td><td class="number-cell">${money(d.value)}</td><td class="number-cell">${d.value===null?'—':money(weighted(d))}</td><td><select class="table-control" data-field-edit="forecastCategory" data-id="${d.id}" aria-label="Forecast for ${esc(d.title)}">${CATEGORIES.map(c=>`<option ${c===d.forecastCategory?'selected':''}>${c}</option>`).join('')}</select></td><td><div class="table-owner">${personAvatar(d.owner,'Opportunity owner')}<span>${esc(d.owner.name)}</span></div></td><td>${d.nextActivity?btn('schedule',esc(d.nextActivity.title),'','table-control',`data-id="${d.id}" title="${esc(d.nextActivity.title)}"`):btn('schedule','Set next activity','calendar','table-control',`data-id="${d.id}"`)}</td><td>${d.nextActivity?`<div class="table-owner">${personAvatar(d.nextActivity.owner)}<span>${esc(d.nextActivity.owner.name)}</span></div>`:'—'}</td><td>${d.nextActivity?dueText(d.nextActivity.dueAt):'—'}</td><td class="number-cell">${stageDays(d)}</td><td class="number-cell">${slipped(d)||'—'}</td><td><span class="list-close">${icon('finish')}${shortDate(d.expectedCloseDate)}</span></td><td>${healthChip(d)||'<span class="view-note">No signals</span>'}</td></tr>`;}

function list(){let rows='';if(state.group==='none')rows=derived.visible.map(row).join('');else{const groups=new Map();for(const d of derived.visible){const key=state.group==='owner'?d.owner.name:d[state.group];if(!groups.has(key))groups.set(key,[]);groups.get(key).push(d);}for(const [key,ds]of groups){rows+=`<tr class="group-row"><td colspan="${COLUMNS.length+1}">${btn('toggle-group',`${esc(key)} &nbsp; ${ds.length} opportunities &nbsp; ${money(total(ds))}`,collapsedGroups.has(key)?'right':'chevron','quiet',`data-group="${esc(key)}" aria-expanded="${!collapsedGroups.has(key)}"`)}</td></tr>`;if(!collapsedGroups.has(key))rows+=ds.map(row).join('');}}
 return ` <div class="list-scroll" data-testid="list-scroll"><table data-testid="deals-table" aria-label="Open opportunities" style="width:${42+COLUMNS.reduce((s,c)=>s+c[2],0)}px;min-width:${42+COLUMNS.reduce((s,c)=>s+c[2],0)}px"><colgroup><col style="width:42px">${COLUMNS.map(c=>`<col style="width:${c[2]}px">`).join('')}</colgroup><thead><tr><th scope="col" class="pin-check"><input type="checkbox" id="select-all" data-testid="select-all" aria-label="Select all visible opportunities"></th>${COLUMNS.map(([field,label])=>{const index=state.sort.findIndex(x=>x.field===field),sort=state.sort[index];return `<th scope="col" class="${field==='title'?'pin-title':''}" ${sort?`aria-sort="${index===0?(sort.dir==='asc'?'ascending':'descending'):'other'}"`:''}>${btn('sort',`${label}${sort?` ${sort.dir==='asc'?'↑':'↓'}${state.sort.length>1?' '+(index+1):''}`:''}`,'','',`data-field="${field}" data-testid="sort-${field}"`)}<span class="column-resizer" role="separator" tabindex="0" aria-label="Resize ${label}" aria-orientation="vertical" aria-valuemin="70" aria-valuemax="520" aria-valuenow="${COLUMNS.find(c=>c[0]===field)[2]}" data-resize="${field}" data-testid="resize-${field}"></span></th>`}).join('')}</tr></thead><tbody>${rows}</tbody></table></div>

 if(recordTab==='scope')return `<div class="record-grid"><div><section class="record-card"><h3>Customer brief and qualification</h3><p>${esc(d.qualificationNote||'No qualification note has been recorded.')}</p>${btn('edit','Edit opportunity fields','edit','btn',`data-id="${d.id}" style="margin-top:18px"`)}</section><section class="record-card"><h3>Sales-to-estimating handover</h3><p>Use Scoping to agree technical feasibility and the proposed solution with the customer. Quoting includes the estimating work and the formal quotation.</p><div class="notice" style="margin-top:16px">The dedicated intake form and estimating workflow will connect here. This deal-board revision demonstrates the page location and the existing estimate reference.</div><div class="detail-facts"><div><span class="fact-label">Current stage</span>${d.stage}</div><div><span class="fact-label">Linked estimate</span>${d.linkedEstimateRef?btn('estimate-reference',esc(d.linkedEstimateRef),'external','quiet small-btn',`data-id="${d.id}"`):'No estimate linked'}</div></div></section></div><div>${recordExit(d)}<section class="record-card"><h3>What the stages mean</h3>${STAGES.map(s=>`<p style="margin-bottom:12px"><strong>${s}</strong><br><span class="view-note">${EXIT_CRITERIA[s].map(esc).join('; ')}.</span></p>`).join('')}</section></div></div>`;
 if(recordTab==='activities')return `<div class="record-grid"><div>${recordActivity(d,true)}</div><div>${recordNext(d)}<section class="record-card"><h3>Quick email</h3><p class="panel-note">Compose an email to the primary contact while keeping the opportunity in view.</p>${btn('email','Compose email','email','btn',`data-id="${d.id}"`)}</section></div></div>`;
 if(recordTab==='contacts')return `<div class="record-grid"><div>${recordContacts(d)}</div><div>${recordHealth(d)}<section class="record-card"><h3>Account context</h3><p>${esc(d.organisation)}</p><p class="panel-note" style="margin-top:12px">The organisation and contact records will connect to their dedicated pages in the full application.</p></section></div></div>`;
 return `<div class="record-grid"><div><section class="record-card"><h3>Stage history</h3><ol class="timeline">${[...d.stageHistory].reverse().map(h=>`<li><strong>${esc(h.stage)}</strong><time>${fmtDate(h.enteredAt)}</time><span class="view-note">${esc(h.movedBy)}${h.exitedAt?' · left '+shortDate(h.exitedAt):' · current stage'}</span></li>`).join('')}</ol></section></div><div><section class="record-card"><h3>Expected close changes <span class="view-note">${slipped(d)} pushes</span></h3><p>Current expected close: <strong>${fmtDate(d.expectedCloseDate)}</strong></p>${d.closeDateHistory.map(h=>`<div class="slip-row"><span>${shortDate(h.from)}</span>${icon('right')}<span>${shortDate(h.to)}</span><span class="view-note">${shortDate(h.at)} · ${esc(h.by)}${h.undo?' · Undo':''}</span></div>`).join('')||'<p class="panel-note" style="margin-top:12px">The close date has not been pushed.</p>'}</section><section class="record-card"><h3>Session changes</h3><p class="panel-note">Review and undo eligible changes made since this file was opened.</p>${btn('change-log','Open session history','history','btn')}</section></div></div>`;

function renderDealPage(){derive();const workspace=root.querySelector('.workspace'),d=byId(activeDealId),scroll=workspace.querySelector('.record-scroll')?.scrollTop||0;if(!d){workspace.innerHTML=emptyState('Opportunity unavailable','This record is not in the current sample session.','back-board','Back to deals');enhance(workspace);return;}const tabs=[['overview','Overview'],['scope','Scope & estimating'],['activities','Activities'],['contacts','Contacts'],['history','History']];workspace.innerHTML=`<main class="record-page" data-testid="deal-page"><div class="record-breadcrumb">${btn('back-board','Deals','left','quiet','data-testid="back-to-deals"')}${icon('right')}<span>${d.id}</span><span class="spacer"></span>${btn('help','','help','small-btn','aria-label="Deal board guide"')}</div><header class="record-header"><div class="record-title"><h1 id="record-heading" tabindex="-1" data-testid="record-heading">${esc(d.title)}</h1><p>${esc(d.organisation)}</p></div><div class="record-actions">${btn('detail','Snapshot','task','btn',`data-id="${d.id}"`)}${btn('email','Email','email','btn',`data-id="${d.id}"`)}${btn('edit','Edit','edit','btn',`data-id="${d.id}"`)}${btn('schedule','Next activity','calendar','primary',`data-id="${d.id}"`)}</div></header><div class="record-metrics"><div><span class="fact-label">Value · AUD excl. GST</span><strong>${money(d.value)}</strong></div><div><span class="fact-label">Stage</span>${btn('move',d.stage+icon('chevron'),'','table-control',`data-id="${d.id}" data-testid="record-stage"`)}</div><div><span class="fact-label">Expected close</span><strong>${shortDate(d.expectedCloseDate)}</strong></div><div><span class="fact-label">Owner</span><strong>${esc(d.owner.name)}</strong></div><div><span class="fact-label">Forecast category</span><strong>${d.forecastCategory}</strong></div></div><div class="record-tabs" role="tablist" aria-label="Opportunity sections">${tabs.map(([id,l])=>btn('record-tab',l,'','',`data-tab="${id}" role="tab" aria-selected= const HELP_TOPICS=[['start','Getting started','board'],['cards','Cards & quick actions','task'],['health','Health & triage','triage'],['movement','Moving opportunities','move'],['forecast','Forecast & insights','flag'],['list','List & bulk editing','list'],['process','Powerplants stages','changes'],['shortcuts','Keyboard shortcuts','help']];
const HELP_CONTENT={
 start:`<h3>Your deal board</h3><p>Use this workspace to review open opportunities, keep the next action clear and move agreed work through the Powerplants sales process.</p><ol><li><strong>Choose your view.</strong> Board shows all five stages. List gives you sortable columns and selection for bulk edits.</li><li><strong>Focus your scope.</strong> Use Filters or a saved view such as My deals. The active-filter button lets you review or clear individual filters.</li><li><strong>Review the pipeline.</strong> The slim status row shows value, weighted estimate and urgent deals. Open Insights for forecast categories, monthly coverage and movement totals.</li><li><strong>Act on a deal.</strong> Open its page, use a quick action, or start Triage.</li></ol><p class="notice">This is a standalone demonstration with fictional opportunities. Changes, drafts and saved views reset when the file reloads. The URL may retain your view configuration.</p>`,
 cards:`<h3>Cards and quick actions</h3><p>Click the card or its title to open the dedicated opportunity page. The page includes Overview, Scope & estimating, Activities, Contacts and History.</p><ul><li><strong>Clipboard:</strong> opens the snapshot at the right, so you can review the deal without leaving the board.</li><li><strong>Envelope:</strong> opens a quick email to the primary contact. Compose, preview and simulate sending. This demonstration sends no messages.</li><li><strong>Calendar:</strong> sets or replaces the next activity, including its owner and due date.</li><li><strong>Health pill:</strong> opens the snapshot at the full health explanation. Hovering does not open a large pop-up.</li></ul><p>Owner initials identify the opportunity owner. The adjacent person icon identifies the next activity’s owner on hover. Detailed editing, activity logging and stage changes are available from the snapshot or the full page.</p><p>Return to Deals from the full page to restore your filters, view and scroll position.</p>`,
 health:`<h3>Health warnings and triage</h3><p>Health is calculated from explicit rules. The card shows the most urgent signal and a count of additional signals. Open the snapshot for the complete reasons.</p><ul><li><strong>Urgent:</strong> no next action, or an overdue activity.</li><li><strong>Attention:</strong> idle beyond the stage norm, an overdue close date, two or more close-date pushes, or a forecast category ahead of the current stage.</li><li><strong>Information:</strong> one engaged contact on a deal over $100,000, or a missing estimate value.</li></ul><p>Idle means the time since the last touch exceeds twice the stage norm and no future activity is booked. With five or more deals, the norm is the median age of the current stage entries across all open deals. Smaller groups use a labelled fallback. This is a current-cohort benchmark, not historical cycle-time prediction.</p><h4>Triage</h4><p>Triage reviews urgent deals in the current view, ordered by severity and value. Its window and action buttons stay in fixed positions. Read the signals, schedule or log an activity, change stage, mark lost, or skip. The completion screen counts reviewed, actioned and skipped deals separately.</p>`,
 movement:`<h3>Move with a clear view of the outcome</h3><ol><li>Drag an opportunity toward a stage. Valid destinations remain available; disallowed forward skips are dimmed.</li><li>The destination column and its title turn green. Existing cards stay in their current positions until you drop.</li><li>The status row previews the weighted estimate before and after the move. This does not change the saved forecast until the move is accepted.</li><li>Drop to request the change. If evidence is required, complete the prompt or cancel.</li></ol><p>Forward moves advance one stage at a time. Backward moves may return to any earlier stage. Won is available only from Closing; Lost is available from any open stage and requires a reason.</p><p>Without dragging, open the snapshot or deal page and click the Stage control. In List, click the stage cell. With a keyboard, focus a card and press Space, use arrow keys, then Space or Enter to drop.</p><p>If a save fails, the card returns to its prior state with recovery instructions. Use Session changes to undo an eligible earlier move.</p><h4>What changed</h4><p>Choose yesterday, Monday, seven days or thirty days. Ghosts show prior positions; badges identify new and moved deals. A backward event remains flagged even if the deal later progressed. Closed outcomes appear in a tray below the worklist.</p>`,
 forecast:`<h3>Forecast confidence and financial impact</h3><p><strong>Open value</strong> adds the known amounts in the current view. Missing values remain “Not estimated”. All amounts are AUD excluding GST.</p><p><strong>Weighted estimate</strong> uses illustrative stage weights: Discovery 10%, Scoping 25%, Quoting 50%, Negotiation 70%, Closing 90%. Omitted deals contribute nothing to this estimate.</p><p><strong>Commit and Best case</strong> are owner judgements independent of stage. Commit or Best case during Discovery or Scoping triggers a forecast-ahead warning.</p><p>Insights shows Commit, Commit plus Best case, missing values and three monthly coverage periods. Click a period to filter by expected close. Coverage is the weighted estimate divided by that month’s illustrative target.</p><p class="notice">Forecast probabilities and targets are sample assumptions. Movement totals use the whole pipeline; historic amounts and categories are assumed unchanged because this example records stage history only.</p>`,
 list:`<h3>Work through a list without losing your place</h3><ul><li><strong>Sort:</strong> click a heading; click again to reverse it. Shift-click another heading to add a secondary sort.</li><li><strong>Resize:</strong> drag the divider at the right edge of a heading. Text stays on one line and is clipped when the column becomes narrow. Keyboard users can focus a divider and use Left or Right.</li><li><strong>Group:</strong> use View options to group by stage, owner or forecast category. Grouping is optional.</li><li><strong>Select:</strong> use a row checkbox or the header checkbox. Shift-click a checkbox to select a range. Checkboxes remain centred in their rows.</li></ul><h4>Bulk actions at the right</h4><p>Selection opens a side panel without adding a row above the list. Continue selecting rows while it is open. Choose owner, forecast, close date, tag, next activity, stage or lost outcome. The panel always shows how many opportunities will be affected, including selected deals outside the current filters.</p><p>Each bulk stage move is validated separately. A result reports how many succeeded and why others could not move. Closing the panel keeps the selection; Clear selection removes it.</p><p>Click the opportunity title or row to open its full page. Use the clipboard beside the title for its snapshot.</p>`,
 process:`<h3>The Powerplants sales process</h3>${STAGES.map(s=>`<h4>${s}</h4><p>${EXIT_CRITERIA[s].map(esc).join('; ')}.</p>`).join('')}<p>Quoting covers both estimating and quotation work. The CRM keeps a neutral reference to the linked estimate; quotation status belongs to Estimating.</p><p>Exit conditions are visible in the snapshot and deal page. They support a review conversation and are advisory here. The Projects handover after Won remains a separate business decision.</p>`,
 shortcuts:`<h3>Keyboard shortcuts</h3><table><tbody>${[['N','Create opportunity'],['T','Open triage'],['?','Open this guide'],['Enter on a card','Open the full deal page'],['Space on a card','Pick up for keyboard movement'],['Left / Right while moving','Choose a legal destination'],['Up / Down while moving','Choose the final insertion position'],['Space / Enter while moving','Drop and validate the move'],['Escape','Cancel movement or close the active window'],['S / L / M / X in triage','Schedule / log / move / mark lost'],['Left / Right in triage','Previous / next deal'],['Shift-click a checkbox','Select a range of rows'],['Shift-click a heading','Add a secondary sort'],['Left / Right on a column divider','Resize the column'],['Left / Right on a deal-page tab','Change the selected section']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table><p>Shortcuts pause while you are typing into a field. Every movement also has a click-only alternative through the Stage control.</p>`
};

function setColumnWidth(field,width){const col=COLUMNS.find(c=>c[0]===field);if(!col)return;col[2]=Math.max(70,Math.min(520,Math.round(width)));const table=root.querySelector('[data-testid=deals-table]');if(!table)return;const index=COLUMNS.indexOf(col)+1;table.querySelectorAll('col')[index].style.width=col[2]+'px';const total=42+COLUMNS.reduce((sum,c)=>sum+c[2],0);table.style.width=total+'px';table.style.minWidth=total+'px';table.querySelector(`[data-resize="${field}"]`)?.setAttribute('aria-valuenow',col[2]);}

root.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a?.dataset.action==='simulate-email')simulateEmail(a.dataset.id);});
root.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const all=[...root.querySelectorAll('.record-tabs [role=tab]')],index=all.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?all.length-1:(index+(e.key==='ArrowRight'?1:-1)+all.length)%all.length;recordTab=all[next].dataset.tab;renderDealPage();root.querySelector(`[data-tab="${recordTab}"]`)?.focus();}});
window.addEventListener('popstate',()=>{for(const r of [...dialogStack].reverse())closeDialog(r.dialog,true);activeDealId=null;HELP_CONTENT.cards += '<h3>People and quick editing</h3><p>The primary contact appears below the organisation. Coloured initials identify Powerplants employees; the outlined person identifies an external contact. Use the pencil to edit the same fields shown when creating an opportunity. A caution triangle appears only when a next activity is missing or overdue.</p><h3>MYOB email references</h3><p>Email subjects start with the linked MYOB opportunity number and deal title, followed by an editable email topic. OPXXXXXX is an explicitly labelled placeholder when a sample has no MYOB link; it is never a replacement for the internal PPO ID.</p>';
HELP_CONTENT.start += '<h3>Stage controls</h3><p>Use a stage’s three dots to focus the view, sort that stage or collapse it. A collapsed rail keeps the stage visible; use its arrow to expand it. At least one stage stays open. Header separators appear only after scrolling.</p>';

/* COMMANDS. In-memory simulation only. Every move uses one envelope and validator. */
const serverRecords=new Map(deals.map(d=>[d.id,clone(d)]));
const conflictId='SYN-PPO-OP-000009';
const conflictRecord=serverRecords.get(conflictId);conflictRecord.version=2;conflictRecord.stageHistory[conflictRecord.stageHistory.length-1].exitedAt=at(-.05);conflictRecord.stageHistory.push({stage:'Negotiation',enteredAt:at(-.05),exitedAt:null,movedBy:'Alex Lee'});conflictRecord.stage='Negotiation';conflictRecord.exitCriteria=exitFor('Negotiation');
const receipts=new Map();let demoFailure=null;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function appendStage(d,to){const time=new Date().toISOString();if(d.stageHistory.length){d.stageHistory[d.stageHistory.length-1].exitedAt=time;d.stageHistory[d.stageHistory.length-1].order=d.order;}d.stageHistory.push({stage:to,enteredAt:time,exitedAt:null,movedBy:CURRENT_USER.name,order:d.order});d.stage=to;d.exitCriteria=exitFor(to);d.lastTouchedAt=time;}
function makeEnvelope(d,to,evidence={},extra={}){return {opportunityId:d.id,fromStage:d.stage,toStage:to,expectedVersion:d.version,idempotencyKey:uid(),reason:DEFAULT_MOVE_REASON,evidence,...extra};}
async function submitMove(command,options={}){
 if(receipts.has(command.idempotencyKey))return receipts.get(command.idempotencyKey);
 const d=byId(command.opportunityId);if(!d||pending.has(d.id))return{ok:false,message:'This opportunity is already saving.'};
 const check=options.compensating?{ok:true}:transition(d.stage,command.toStage);
 if(!check.ok){toast(check.message,{error:true});return{ok:false,message:check.message};}
 const before=clone(d);pending.add(d.id);failed.delete(d.id);appendStage(d,command.toStage);if(Number.isFinite(command.targetOrder)){d.order=command.targetOrder;d.stageHistory[d.stageHistory.length-1].order=d.order;}render();
 await delay(COMMAND_LATENCY);
 const server=serverRecords.get(d.id);let error=null;
 if(server&&server.version!==command.expectedVersion)error={type:'conflict',message:'Someone else moved this deal while you were working. Refresh to see the current stage.'};
 else if(command.toStage==='Discovery'&&!command.evidence.qualificationNote&&!before.qualificationNote)error={type:'evidence',message:'The move to Discovery was rejected because the qualification note is missing. Add the note and try again.'};
 else if(command.toStage==='Lost'&&!LOST_REASONS.includes(command.evidence.lostReason))error={type:'evidence',message:'Choose a lost reason before marking this opportunity as lost.'};
 else if(demoFailure==='save'){demoFailure=null;error={type:'save',message:'The change could not be saved. Your opportunity remains in its original stage. Try again.'};}
 pending.delete(d.id);
 if(error){Object.assign(d,before);failed.add(d.id);render();refreshDetails(d.id);toast(error.message,{error:true,action:error.type==='conflict'?'refresh-deal':'repair-evidence',actionLabel:error.type==='conflict'?'Refresh':'Add note',data:`data-id="${d.id}"`});const result={ok:false,...error};receipts.set(command.idempotencyKey,result);return result;}
 d.version=before.version+1;d.qualificationNote=command.evidence.qualificationNote||before.qualificationNote;
 if(command.toStage==='Lost'){d.lostReason=command.evidence.lostReason;d.lostNote=command.evidence.note||'';}
 d.activityLog.unshift({at:new Date().toISOString(),text:`${options.compensating?'Undo: restored':'Moved'} ${command.fromStage} to ${command.toStage}. ${command.reason}`,by:CURRENT_USER.name});serverRecords.set(d.id,clone(d));
 const entry=options.compensating?null:recordChange({kind:'move',id:d.id,label:`Moved ${d.title} to ${command.toStage}`,from:before.stage,to:d.stage,beforeExit:before.exitCriteria,beforeOrder:before.order,command,version:d.version});
 state.selection.delete(d.id);render();refreshDetails(d.id);markTriageAction(d.id);
 toast(options.compensating?`Restored to ${command.toStage}`:command.toStage==='Won'?'Marked as won':command.toStage==='Lost'?'Marked as lost':`Moved to ${command.toStage}`,entry?{undo:entry.key}:{});
 const result={ok:true,entry:entry?.key};receipts.set(command.idempotencyKey,result);return result;
}
function recordChange(x){const entry={key:uid(),at:new Date().toISOString(),undone:false,...x};changeLog.unshift(entry);return entry;}
async function requestMove(id,to,intent={}){const d=byId(id);if(!d)return;const rule=transition(d.stage,to);if(!rule.ok){toast(rule.message,{error:true});return;}
 if(to==='Lost'){openLost([id]);return;}if(to==='Won'){openWon(id);return;}
 if(ENTRY_REQUIREMENTS[to]?.some(k=>!d[k])){openEvidence(id,to,intent);return;}
 await submitMove(makeEnvelope(d,to,{qualificationNote:d.qualificationNote},intent));
}
async function patchDeals(ids,patch,label){const accepted=[],errors=[];for(const id of ids){const d=byId(id);if(!d||!isOpen(d)||pending.has(id)){errors.push(id);continue;}const server=serverRecords.get(id);if(server?.version!==d.version){errors.push(id);continue;}accepted.push({d,before:Object.fromEntries(Object.keys(patch).map(k=>[k,clone(d[k]??null)])),version:d.version});pending.add(id);}render();await delay(450);
 if(demoFailure==='save'){demoFailure=null;for(const {d}of accepted)pending.delete(d.id);render();toast('The change could not be saved. Your entries are retained; retry the edit.',{error:true});return{ok:false,count:0};}
 for(const {d,before}of accepted){if('expectedCloseDate'in patch&&dateOnly(patch.expectedCloseDate)!==dateOnly(d.expectedCloseDate))d.closeDateHistory.push({at:new Date().toISOString(),from:d.expectedCloseDate,to:patch.expectedCloseDate,by:CURRENT_USER.name});Object.assign(d,clone(patch));d.version++;d.lastTouchedAt=new Date().toISOString();d.activityLog.unshift({at:d.lastTouchedAt,text:label,by:CURRENT_USER.name});serverRecords.set(d.id,clone(d));pending.delete(d.id);markTriageAction(d.id);}
 const entry=accepted.length?recordChange({kind:'fields',label,changes:accepted.map(({d,before})=>({id:d.id,before,after:clone(patch)}))}):null;render();for(const {d}of accepted)refreshDetails(d.id);
 toast(errors.length?`${accepted.length} of ${ids.length} updated. ${errors.length} changed or unavailable; refresh those opportunities before retrying.`:`${label}${ids.length>1?' for '+accepted.length+' opportunities':''}`,{error:errors.length>0,...(entry?{undo:entry.key}:{})});return{ok:errors.length===0,count:accepted.length};
}
async function undoEntry(key){const e=changeLog.find(x=>x.key===key);if(!e||e.undone)return;const d=byId(e.id);
 if(e.kind==='move'){if(!d||d.stage!==e.to||pending.has(d.id)||d.stageHistory[d.stageHistory.length-1].enteredAt!==serverRecords.get(d.id)?.stageHistory.at(-1)?.enteredAt){toast('This deal moved again. Review its history before undoing this earlier move.',{error:true});return;}
 const later=changeLog.some(x=>x!==e&&!x.undone&&x.kind==='move'&&x.id===d.id&&new Date(x.at)>new Date(e.at));if(later){toast('Undo the later stage move first to preserve the movement history.',{error:true});return;}
 const cmd=makeEnvelope(d,e.from,{qualificationNote:d.qualificationNote},{reason:'Undo prior stage move',compensates:e.command.idempotencyKey});const result=await submitMove(cmd,{compensating:true});if(!result.ok)return;d.exitCriteria=clone(e.beforeExit);d.order=e.beforeOrder;serverRecords.set(d.id,clone(d));e.undone=true;
 }else if(e.kind==='create'){if(!d)return;if(d.version!==e.version){toast('This opportunity has changed since creation. Undo its later changes first.',{error:true});return;}deals=deals.filter(x=>x.id!==d.id);serverRecords.delete(d.id);e.undone=true;toast('Opportunity creation undone.');
 }else if(e.kind==='fields'){const can=e.changes.every(c=>{const record=byId(c.id);return record&&!pending.has(c.id)&&Object.entries(c.after).every(([k,v])=>JSON.stringify(record[k])===JSON.stringify(v));});if(!can){toast('One of these fields has changed again. Undo the later edit first.',{error:true});return;}
 for(const c of e.changes){const rec=byId(c.id);if('expectedCloseDate'in c.before)rec.closeDateHistory.push({at:new Date().toISOString(),from:rec.expectedCloseDate,to:c.before.expectedCloseDate,by:CURRENT_USER.name,undo:true});Object.assign(rec,clone(c.before));rec.version++;rec.lastTouchedAt=new Date().toISOString();rec.activityLog.unshift({at:rec.lastTouchedAt,text:'Undid '+e.label,by:CURRENT_USER.name});serverRecords.set(rec.id,clone(rec));}e.undone=true;toast('Change undone.');}
 toasts=toasts.filter(t=>t.undo!==key);render();refreshOpenDialogs();
}
