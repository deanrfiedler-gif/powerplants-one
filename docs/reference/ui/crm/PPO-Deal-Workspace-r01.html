  function healthHelp(){openPanel('Probability & deal health','<h3>Stage probability</h3><p>Weighted value = known deal value × stage probability. A $100,000 deal at 40% contributes $40,000. Omitted and closed deals contribute no open weighted value; unknown amounts stay unpriced.</p><h3 class="form-section">Rotting days</h3><p>An open deal is flagged when days since its last deal update or completed activity reach the current stage’s configured threshold.</p><p>Planning a future activity, completing internal tasks or changing pipeline settings does not reset the timer. Turning rotting off hides this reminder while retaining overdue and missing-activity warnings.</p><h3 class="form-section">Independent signals</h3><p>Time in stage, expected-close lateness, no next action and overdue activity are separate facts. These reminders never mark a deal Lost.</p>'+hint('All dates are evaluated against 17 September 2026 in this reproducible synthetic review.'),btn('pipeline','Review pipeline settings','settings',attrsDisabled(can(deal()))) );}

  async function loadFile(form){const file=form.elements.file.files[0];if(!file||!file.size||file.size>10485760)throw new Error('Choose a non-empty file no larger than 10 MB.');const bytes=new Uint8Array(await file.arrayBuffer()),ext=file.name.toLowerCase().split('.').pop(),starts=a=>a.every((v,i)=>bytes[i]===v);let mime='';if(ext==='pdf'&&starts([37,80,68,70,45]))mime='application/pdf';if(ext==='png'&&starts([137,80,78,71,13,10,26,10]))mime='image/png';if(['jpg','jpeg'].includes(ext)&&starts([255,216,255]))mime='image/jpeg';if(ext==='webp'&&String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')mime='image/webp';if(ext==='txt'&&!bytes.includes(0)){try{new TextDecoder('utf-8',{fatal:true}).decode(bytes);mime='text/plain';}catch{throw new Error('The text file must use UTF-8 encoding.');}}if(!mime)throw new Error('File contents do not match a supported PDF, image or text type.');let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.slice(i,i+8192));return {name:file.name,title:form.elements.documentTitle.value.trim()||file.name,category:form.elements.category.value,mime,bytes:btoa(binary),size:file.size,id:'pending'};}

    else if(action==='export-handover'){const d=deal();downloadJson('PPO-'+d.ref+'-Prepared-Handover.json',{schema:1,synthetic:true,status:'Prepared only; not sent or accepted',dealId:d.id,ref:d.ref,handover:d.handover});notify('Prepared evidence downloaded. No receiving transaction was sent.');}
    else if(action==='reset-confirm')openPanel('Reset synthetic session?','<p>All edits, drafts and local attachments in this preview will be removed. The supplied examples will be restored.</p>',btn('close','Keep session')+btn('reset','Reset session','','','danger-button'),{decision:true});
    else if(action==='reset'){state=M.initial();server=M.clone(state);Object.assign(ui,{actor:'kate',read:'ready',fault:'none',q:'',owner:'',outcome:'Open',stage:'',docQ:'',docType:'',docHistory:false,historyQ:'',historyKind:'',taskFilter:'Open work',activityFilter:'All activities'});closePanel(true);navigate('deal/berry/overview');notify('Synthetic session reset.');}
  });
  $('#panel').addEventListener('cancel',e=>{e.preventDefault();closePanel();});
  document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=tabs.findIndex(x=>x[0]===ui.tab),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(n+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;setTab(tabs[next][0]);}});
  window.addEventListener('popstate',()=>{if($('#panel').open&&(panelContext?.dirty||panelContext?.uncertain)){history.pushState(null,'',ui.route);notify('Finish or discard the active edit before navigating back.');return;}closePanel(true);parseRoute();window.scrollTo(0,ui.board?ui.boardY:0);if(ui.board&&$('.board-scroll'))$('.board-scroll').scrollLeft=ui.boardX;});
  window.addEventListener('beforeunload',e=>{if(panelContext?.dirty||panelContext?.uncertain){e.preventDefault();e.returnValue='';}});
  history.scrollRestoration='manual';
  globalThis.PPODealPreview={read:()=>M.clone(state),server:()=>M.clone(server),ui:()=>M.clone(ui)};
  parseRoute();
})();
</script></body></html>
