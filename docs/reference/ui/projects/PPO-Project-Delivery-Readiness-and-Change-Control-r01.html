  function objectRows(obj){return `<dl class="kv">${Object.entries(obj||{}).map(([key,val])=>`<dt>${esc(key)}</dt><dd>${esc(val===null?'Not recorded':typeof val==='object'?JSON.stringify(val):val)}</dd>`).join('')}</dl>`;}
  function sourceSnapshot(id,revision){const src=s.sources[id],x=revision?src?.revisions.find(x=>x.revision===revision):src&&M.current(s,id);if(!src||!x)return {title:'Source unavailable',body:notice('risk','Exact revision is unavailable','Keep the record reference and request clarification.')};const restricted=id==='cost'&&!M.canCost(s),old=x.revision!==M.current(s,id).revision;let body=`<div class="stack">${src.unavailable?notice('risk','Current source could not be loaded','The last captured revision is retained below. A new comparison cannot use this source until it is available.',btn('Retry source','retry-source','refresh','link',`data-id="${id}"`)):''}${old?notice('info','Superseded source — exact revision retained','Viewing a successor does not rewrite this earlier source or its reviewed comparison.'):''}<div class="row wrap">${chip('r'+String(x.revision).padStart(2,'0'),old?'neutral':'info')}${chip(src.kind,'neutral')}</div><p class="small muted">${esc(x.at)} · ${esc(src.owner)}</p>${restricted?notice('info','Commercial detail restricted','This source is available to Coordinator and Commercial demo roles.'): `<div class="document-sheet"><div class="eyebrow">Synthetic source extract</div><p>${esc(x.text)}</p></div>`}`;

  function actionSnapshot(a){if(!a)return {title:'Action unavailable',body:''};const request=/request/.test(a.kind),pending=['Pending response','Resubmitted'].includes(a.status),canAct=!isLocked();return {title:a.title,sub:a.id+' · '+a.kind,body:`<div class="stack"><div>${statePill(a.status)}</div><dl class="kv"><dt>Responsible person</dt><dd>${esc(a.owner)}</dd><dt>Due</dt><dd>${dt(a.due)}</dd><dt>Originating record</dt><dd>${esc(a.changeId||a.origin)}</dd><dt>Request revision</dt><dd>${a.version}</dd><dt>Captured comparison</dt><dd>${a.previewId?btn(esc(a.previewId),'open-preview','','link',`data-id="${a.previewId}"`):'Not an execution request'}</dd><dt>Outcome</dt><dd>${esc(a.outcome||'Not yet recorded')}</dd></dl>${a.proposal?notice('info','Exact requested effect',`Installation ${dt(a.proposal.installStart)} – ${dt(a.proposal.installEnd)}; requested visit ${dt(a.proposal.visitDate)}. This is a coordination request, not a completed operational change.`):''}${a.kind==='Scheduling request'?notice('risk','Service scheduler response','Accepting requires current customer access, crew and preparation evidence against this exact request. Return or refuse it with a reason if these are missing.'):''}<div class="row wrap">${a.changeId?btn('Open originating change','select-change','changes','',`data-id="${a.changeId}"`):btn('Inspect originating evidence','origin','evidence','',`data-origin="${a.origin}"`)}</div><h3>Action history</h3>${a.history.length?a.history.slice().reverse().map(h=>`<article class="history-item"><h3>${esc(h.kind)}</h3><p>${esc(h.text)}</p><p>${esc(h.outcome||'')}</p><div class="small">${esc(h.actor)} · ${esc(h.at)}</div></article>`).join(''):'<p class="small muted">No response or reassignment recorded.</p>'}</div>`,foot:pending?btn('Record response','respond','actions','primary',`data-id="${a.id}" ${canAct?'':'disabled'}`)+btn('Reassign','reassign','person','',`data-id="${a.id}" ${canAct?'':'disabled'}`):a.status==='Returned'?btn('Resubmit reviewed request','resubmit','refresh','primary',`data-id="${a.id}" ${canAct?'':'disabled'}`)+btn('Reassign','reassign','person','',`data-id="${a.id}" ${canAct?'':'disabled'}`):!request&&a.status!=='Completed'?btn('Complete action','complete','check','primary',`data-id="${a.id}" ${canAct?'':'disabled'}`)+btn('Reassign','reassign','person','',`data-id="${a.id}" ${canAct?'':'disabled'}`):btn('Close','close-panel')};}
  function contextSource(){const x=s.ui.selected;if(x?.kind==='source')return x.id;if(x?.kind==='readiness')return M.projectRows(s).find(r=>r.id===x.id)?.sourceId||'pump';if(x?.kind==='task')return M.programme(s,M.activeChange(s)).find(t=>t.id===x.id)?.source||'pump';if(x?.kind==='action')return s.actions.find(a=>a.id===x.id)?.target==='visit'?'visit':'scope';return s.project==='controls'?'survey':'pump';}
  function assistant(){const id=contextSource(),src=s.sources[id],context=s.ui.assistantContext,stale=context&&context.revision!==M.current(s,context.id).revision;return {title:'Project coordination',sub:'Scripted assistance · review every suggestion',body:`<div class="stack"><div class="small muted">Context: ${esc(src.title)} · r${String(M.current(s,id).revision).padStart(2,'0')}</div><div class="segmented assistant-tabs" role="group" aria-label="Assistant sections">${['conversation','drafts','activity'].map(x=>btn(x[0].toUpperCase()+x.slice(1),'assistant-tab','',s.ui.assistantTab===x?'selected':'',`data-id="${x}"`)).join('')}</div>${stale?notice('risk','Source context changed','Refresh the response before using this suggestion. Its earlier source reference is retained.'):''}${s.ui.assistantTab==='conversation'?`<div class="prompt-list">${['Explain this blocker','What would this delay affect?','What evidence is missing?','Draft an internal coordination note'].map(x=>btn(esc(x),'assistant-prompt','arrow','',`data-prompt="${esc(x)}"`)).join('')}</div>${s.ui.assistantStatus==='loading'?`<div class="notice info"><span class="pulse"></span><div class="grow">Preparing a scripted response…</div>${btn('Stop','assistant-stop')}</div>`:s.ui.assistantStatus==='failed'?notice('risk','Response unavailable','No suggestion or action was applied. Retry when ready.',btn('Retry','assistant-retry','refresh','link')):s.ui.assistantStatus==='stopped'?notice('info','Response stopped','No action was created.',btn('Retry','assistant-retry','refresh','link')):s.ui.assistantText?`<div class="assistant-message">${esc(s.ui.assistantText)}</div><div class="row wrap">${sourceChip(context?.id||id,context?.revision)}${btn('Prepare editable note','assistant-draft','edit','',stale?'disabled':'')}</div>`:notice('info','Ask about the selected record','Responses use the synthetic source shown above. They cannot establish an unknown quantity, approve a substitution or move a booking.')}`:s.ui.assistant   function guide(){return {title:'Using this workspace',sub:'Projects · Delivery Readiness & Change Control',body:`<div class="stack">${notice('info','Three questions','What is stopping delivery? What would a proposed change affect? Who needs to decide or act next?')}<ol class="guide-list"><li>Open a blocker in <strong>Readiness</strong> and inspect its exact source.</li><li>Open <strong>Changes</strong>. Edit the dates or select a response, then <strong>Capture comparison</strong>.</li><li>In <strong>Demo controls</strong>, choose the specialist role. Record each response against that proposal. A return requires a revision and a refreshed comparison.</li><li>As Coordinator, review the request set, owners and due dates; confirm creation in this session.</li><li>In <strong>Actions</strong>, the scheduler can return a request when access, crew or preparation is missing.</li><li>Use <strong>Add compatible October evidence</strong> in Demo controls, refresh the comparison and renew only affected reviews. Resubmit the same returned request, then record the scheduler response.</li><li>Inspect earlier sources, request outcomes and captured comparisons in <strong>Evidence & history</strong>.</li></ol><h3>Context stays connected</h3><p>Work-package and area selections carry between views. Shared-pump prerequisites apply to all served growing areas. Search filters never change the underlying assessment.</p><h3>Authority stays with its owner</h3><p>Project forecast, Service booking, Engineering assessment, document preparation and commercial authority are separate. A coordination request does not itself release equipment, issue a pack or approve spend.</p><h3>Local demonstration</h3><p><strong>Reload resets this demonstration.</strong> Edits and receipts exist only in page-session memory. Use review download or print to retain a visible review record. DEMO-CHG and DEMO-ACT labels are local review references, not allocated platform record types. Demo roles illustrate presentation; all fixtures are embedded and this file is not a security boundary.</p><h3>Keyboard and layout</h3><p>Use arrow keys, Home and End across tabs. Escape closes a panel or decision. Table column separators support left/right arrow keys. At phone width, registers become cards and Programme starts in List. Side panels become modal when less than 440 px would remain for the workspace.</p><h3>Source and revision</h3><p class="small muted">Review r01 · BP-06 / Projects J1 / F05 change impact.<br>Repository basis: bc1dcf2.<br>Theme: PPO r20, SHA-256 c68a499e…f19b617.<br>Existing customer/site/pump identities are reused. The project-specific shutdown agreement and all delivery, quantity, review and cost records are new synthetic fixtures.</p>${btn('Restore preview context header','show-header','overview')}${btn('Open demonstration controls','demo','settings')}</div>`};}
  function demo(){return {title:'Demonstration controls',sub:'Separate from the operational workspace',body:`<div class="stack">${notice('info','Session-only synthetic preview','Reload resets this demonstration. No live requests, messages, bookings or financial transactions are sent.')}<div class="demo-group">${selectField('Project scenario','demo-project',s.projects.map(p=>[p.id,p.name]),s.project,'data-demo="project"')}${selectField('Viewing / acting role','demo-role',M.roles,s.role,'data-demo="role"')}<p class="small muted">Each specialist records their own response. Coordinator confirms the request set. Delivery viewer has no editing or commercial detail.</p></div><div class="demo-group"><h3>Source and recovery scenarios</h3>${btn('Advance pump source revision','advance-source','refresh','',isLocked()?'disabled':'')}<p class="small muted">Adds a revised supplier note with the same 5 Oct promise. Captured comparisons become outdated; only affected specialist reviews lapse.</p>${btn('Add compatible October evidence','success-evidence','evidence','',isLocked()?'disabled':'')}<p class="small muted">Adds customer access for 6–9 Oct, crew evidence and preparation-owner successor r03. Refresh and review before resubmitting.</p>${btn('Make pump source unavailable','source-fail','warning','',s.project==='controls'?'disabled':'')}${btn('Simulate source loading','source-loading','refresh','',s.project==='controls'?'disabled':'')}</div><div class="demo-group">${selectField('Next request confirmation','demo-fault',[['none','Normal response'],['before','Fail before acceptance'],['after','Lose response after acceptance']],s.fault,'data-demo="fault"')}<p class="small muted">A lost response requires recovery of the original receipt. Retrying never creates a second request set.</p>${s.pendingOperation?btn('Recover original receipt','recover','refresh','primary'):''}${selectField('Next Assistant response','assistant-fault',[['none','Normal scripted response'],['fail','Response unavailable']],s.assistantFault,'data-demo="assistantFault"')}</div><div class="demo-group"><h3>Review aids</h3>${btn('Load long-text example','long-text','edit','',isLocked()?'disabled':'')}${btn('Reset complete demonstration','reset','refresh','danger')}<p class="small muted">Reset clears all local drafts, receipts, source revisions, actions and role changes after confirmation.</p></div></div>`};}
  function openDecision(config){opener=document.activeElement;decision=config;$('decision-title').textContent=config.title;$('decision-subtitle').textContent=config.sub||'';$('decision-body').innerHTML=config.body;$('decision-foot').innerHTML=`<span class="small muted">${esc(config.effect||'Local synthetic demonstration only')}</span>${btn(config.cancel||'Cancel','close-decision')}<button type="submit" class="primary">${esc(config.submit||'Save in this session')}</button>`;if(!$('decision').open)$('decision').showModal();setTimeout(()=>{const input=$('decision-body').querySelector('input:not([type=checkbox]),textarea,select');(input||$('decision-title')).focus();},0);}

  function saveProposal(){const c=M.activeChange(s),patch=proposalFromForm()||draftBuffers[c.id];if(!patch)return c;if(JSON.stringify(patch)===JSON.stringify(Object.fromEntries(Object.keys(patch).map(k=>[k,c[k]])))){delete draftBuffers[c.id];return c;}try{M.updateChange(s,c,patch);delete draftBuffers[c.id];s.ui.save='Saved in this session';render();toast('Proposal saved. Capture a new comparison before requesting execution.');return c;}catch(err){const form=$('proposal-form');form?.querySelector('.error-summary')?.remove();if(form){const div=document.createElement('div');div.className='error-summary';div.tabIndex=-1;div.setAttribute('role','alert');div.innerHTML='<strong>Check the proposal</strong><ul>'+Object.entries(err.fields||{reason:err.message}).map(([k,v])=>`<li><a href="#${k==='scope'?'scopeEdit':k}">${esc(v)}</a></li>`).join('')+'</ul>';form.prepend(div);for(const k of Object.keys(err.fields||{}))$(k==='scope'?'scopeEdit':k)?.setAttribute('aria-invalid','true');div.focus();}throw err;}}
  function confirmRequests(){const c=M.activeChange(s);if(!c)throw Error('Select a change review first.');if(s.pendingOperation){M.recover(s);render();toast('Original receipt recovered. No duplicate actions created.');return;}M.executionGuard(s,c);const p=M.latestPreview(c),items=M.requests(s,c),existing=s.receipts[p.id+'-requests'];if(existing){toast('This comparison already has '+existing.ids.length+' requests. Opening the original action.');setPanel('snapshot',{kind:'action',id:existing.ids[0]});return;}openDecision({title:'Confirm coordination requests',sub:c.id+' · '+p.id.split('-').pop()+' · proposal r'+c.revision,effect:'Creates '+items.length+' owned requests. Does not move a booking.',submit:'Create '+items.length+' requests',body:`<div class="stack">${notice('info','Review the exact follow-up set','These requests go to the synthetic receiving owners shown below. Their responses remain separate from this change review.')}<div>${items.map((x,i)=>`<div class="request-form-row"><div><strong>${esc(x.title)}</strong><p class="small muted">${esc(x.kind)} · target ${esc(x.target)}</p></div>${selectField('Owner','request-owner-'+i,M.owners,x.owner)}${field('Due date','request-due-'+i,x.due,'date','required')}</div>`).join('')}</div><label class="check"><input type="checkbox" name="confirmEffect" required>I have reviewed the scope, owners and requested effects.</label></div>`,onSubmit:data=>{const updated=items.map((x,i)=>({...x,owner:String(data.get('request-owner-'+i)),due:String(data.get('request-due-'+i))}));const result=M.confirmRequests(s,c,updated);closeDecision();render();if(result.uncertain)openDecision({title:'Save not confirmed',sub:result.key,effect:'Recover the accepted operation before trying a new effect.',submit:'Recover original receipt',body:notice('risk','Response lost after acceptance','The demonstration accepted the request set, but its response was lost. Recover the original receipt to see the created requests; do not start a second set.'),onSu     case 'print':exportReview(el?.dataset.preview,true);break;
  }}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;event.preventDefault();try{const result=handle(el.dataset.action,el);if(result?.catch)result.catch(err=>error(err.message));}catch(err){error(err.message);}});
  $('decision-form').addEventListener('submit',event=>{event.preventDefault();try{decision?.onSubmit(new FormData(event.target));}catch(err){decisionError(err);}});
  $('decision').addEventListener('cancel',event=>{event.preventDefault();closeDecision();});
  document.addEventListener('submit',event=>{if(event.target.id==='proposal-form'){event.preventDefault();try{saveProposal();}catch(err){announce(err.message);}}});
  document.addEventListener('toggle',event=>{if(event.target.id==='proposal-editor'){const c=M.activeChange(s);if(c)editorOpen[c.id]=event.target.open;}},true);
  function changed(event){const el=event.target;if(el.id==='assistant-note'){s.ui.assistantDraft=el.value;return;}if(el.closest('#proposal-form')){const c=M.activeChange(s);if(c){draftBuffers[c.id]=proposalFromForm();s.ui.save='Editing';$('session-line').querySelector('.session-status').innerHTML=icon('edit')+'Editing · proposal draft retained';}return;}
    if(el.dataset.filter){if(el.tagName==='INPUT'&&['search','text'].includes(el.type)&&event.type==='change')return;if(el.tagName!=='INPUT'&&event.type==='input')return;const key=el.dataset.filter;s.ui[key]=el.type==='checkbox'?el.checked:el.value;if(['scope','area'].includes(key)){s.ui.selected=null;const c=M.activeChange(s);if(c&&!M.changeInScope(s,c))s.ui.selectedChange=s.changes.find(x=>M.changeInScope(s,x))?.id||null;announce('Scope changed. Hidden record selection cleared; shared pump prerequisites remain included.');}if(key==='changeSearch'&&M.activeChange(s)&&!M.activeChange(s).title.toLowerCase().includes(s.ui.changeSearch.toLowerCase())){s.ui.selectedChange=null;s.ui.queueOnly=true;}if(key==='state')s.ui.evidenceOnly=false;if(s.ui.tab==='readiness'&&s.ui.selected?.kind==='readiness'&&!M.visibleRows(s).some(r=>r.id===s.ui.selected.id)){s.ui.selected=null;announce('Selected prerequisite is hidden by the filter. Selection cleared.');}render();return;}
    if(el.dataset.demo&&event.type==='change'){const key=el.dataset.demo;if(key==='project')changeProject(el.value);else if(key==='role'){s.role=el.value;s.ui.assistantText='';s.ui.assistantDraft='';s.ui.assistantContext=null;s.ui.assistantStatus='idle';clearTimeout(assistantTimer);assistantRun++;$('print-review').innerHTML='';render();toast('Demo role: '+s.role);}else s[key]=el.value;return;}
    if(el.name==='response'&&event.type==='change'){try{const c=M.activeChange(s);M.updateChange(s,c,{response:el.value,sourceIds:el.value==='alternative'?[...new Set([...c.sourceIds,'alternate'])]:c.sourceIds});render();toast('Response option revised. Capture the updated comparison.');}catch(err){error(err.message);}}
  }
  document.addEventListener('input',changed);document.addEventListener('change',changed);
  document.addEventListener('keydown',event=>{const el=event.target;if(el.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=[...$('tabs').querySelectorAll('[role=tab]')],i=tabs.indexOf(el),next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tab(tabs[next].dataset.tab);$('tab-'+s.ui.tab).focus();}
    if(el.matches('.column-resize')&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const index=Number(el.dataset.col),th=el.closest('th'),width=Math.max(96,th.getBoundingClientRect().width+(event.key==='ArrowRight'?16:-16));columnWidths[index]=width+'px';const col=$('content').querySelectorAll('col')[index];col.style.width=width+'px';announce('Column width '+Math.round(width)+' pixels.');}
    if(event.key==='Escape'&&s.ui.panel&&!$('decision').open){event.preventDefault();closePanel();}
    if(event.key==='Tab'&&s.ui.panel&&$('dock').getAttribute('aria-modal')==='true'&&!$('decision').open){const list=[...$('dock').querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);if(!list.length)return;const first=list[0],last=list.at(-1);if(event.shiftKey&&(document.activeElement===first||!list.includes(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  document.addEventListener('pointerdown',event=>{const el=event.target.closest('.column-resize');if(!el)return;const index=Number(el.dataset.col),th=el.closest('th'),start=event.clientX,width=th.getBoundingClientRect().width;el.setPointerCapture(event.pointerId);const move=e=>{const w=Math.max(96,width+e.clientX-start);columnWidths[index]=w+'px';$('content').querySelectorAll('col')[index].style.width=w+'px';};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);});
  window.addEventListener('resize',layoutPanel);
  window.addEventListener('beforeunload',event=>{if(s.dirty||s.pendingOperation||Object.keys(draftBuffers).length){event.preventDefault();event.returnValue='';}});
  window.addEventListener('beforeprint',()=>{if(!$('print-review').innerHTML){try{const {data}=exportData();$('print-review').innerHTML=reviewMarkup(data);}catch{$('print-review').innerHTML='<h1>PPO · Synthetic review r01</h1><p>No captured comparison selected. Capture a comparison in Changes before exporting an internal review.</p>';}}});
  if(window.innerWidth<700)s.ui.programmeMode='list';
  render();
})();
</script></body></html>
