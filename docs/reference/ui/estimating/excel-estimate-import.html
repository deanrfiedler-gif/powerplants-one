  }).join(''):'<tr><td colspan="5" class="empty">No matching lines. Clear the search or change the issue filter.</td></tr>'}</tbody></table></div><p class="small muted" style="margin-top:10px">Showing ${shown.length} of ${state.data.lines.length} lines. Select a description to inspect its workbook source.</p>`;
}
function review(){const v=validation();return `<div class="panel"><div class="actions" style="justify-content:space-between"><div><h2>Review imported estimate</h2><p class="small muted">${esc(state.name)} · ${esc(state.data.metadata.workbook_revision)}</p></div><span class="tag ${v.issues.length?'warn':'good'}">${v.issues.length?'Review required':'Amounts reconcile'}</span></div>${state.mode==='partial'?'<div class="notice error">Only part of the workbook was read. The complete file is required before import.</div>':''}${v.issues.length?`<div class="notice error">Resolve ${v.issues.length} issue(s) before creating a draft. No lines will be silently omitted.</div><details open><summary>Issues to resolve</summary>${v.issues.slice(0,12).map(i=>`<div class="issue"><span>${esc(i.message)}</span>${i.rowIndex!==null?`<button data-line="${i.rowIndex}">Inspect row</button>`:''}</div>`).join('')}${v.issues.length>12?`<p class="small">${v.issues.length-12} more issues are included in the issue report.</p>`:''}</details>`:''}${state.adjustments.length?`<div class="notice info">${state.adjustments.length} reviewed adjustment(s). Original workbook values remain available.</div>`:''}<div id="line-area">${lineTable()}</div>${state.versions.length?diffMarkup():''}<label class="check"><input type="checkbox" id="review-confirm" ${state.reviewed?'checked':''}>I have reviewed the source calculations, scope, inclusions and any adjustments.</label><div class="footer-actions">${button('back','Choose another workbook')}<div class="actions">${button('issues','Download issue report')}${button('commit',state.versions.length?'Create next draft version':'Create draft estimate','primary',v.issues.length>0||!state.reviewed||state.mode==='partial')}</div></div></div>`;}
function diffMarkup(){
  const prev=state.versions.at(-1),diff=P.difference(prev.data.lines,state.data.lines);
  const counts=Object.fromEntries(['Added','Removed','Changed','Unchanged'].map(k=>[k,diff.filter(d=>d.kind===k).length]));
  const show=(line,field)=>line?(['unit_cost','unit_sell','workbook_cost','workbook_sell'].includes(field)?money(line[field]):['allowance','include','print'].includes(field)?(P.yes(line[field])?'Yes':'No'):esc(line[field])):'—';
  return `<details class="panel" style="margin-top:20px" open><summary>Compare with saved version ${prev.version}</summary><p class="small muted" style="margin-top:12px">${counts.Added} added · ${counts.Removed} removed · ${counts.Changed} changed · ${counts.Unchanged} unchanged</p>${diff.filter(d=>d.kind!=='Unchanged').map(d=>`<div class="change"><b>${esc(d.ref)} · ${d.kind}</b>${d.kind==='Changed'?d.fields.map(field=>`<div class="issue"><span>${esc(field.replaceAll('_',' '))}</span><span>${show(d.before,field)} → ${show(d.after,field)}</span></div>`).join(''):`<p>${esc((d.after||d.before).description)}</p>`}</div>`).join('')||'<p>No line changes.</p>'}</details>`;
}
function saved(){const v=state.versions.at(-1);return `<div class="panel"><span class="tag good">Draft created in preview</span><h2 style="margin-top:16px">Your estimate is ready for the next review</h2><p>${esc(v.data.metadata.title)}</p><div class="receipt"><b>SYN-PPO-EST-EXCEL-001 · Version ${v.version}</b><p class="small muted">Source ${esc(v.data.metadata.workbook_ref)} ${esc(v.data.metadata.workbook_revision)}<br>${v.data.lines.length} lines · ${money(P.totals(v.data.lines).included)} included sell</p></div><p class="muted">The source, reviewed adjustments and exact draft version are linked. Quotation preparation follows separately.</p><div class="actions">${button('draft','Inspect customer draft')}${button('revision','Load example revision r02')}${button('retry','Retry original save')}${button('history','View version history')}</div><div class="notice info">This is an in-memory demonstration. It has not created an estimate or quotation in the PPO application.</div><div class="footer-actions">${button('back','Choose another workbook')}${button('receipt','Download demo receipt')}</div></div>`;}
function special(){if(state.mode==='loading')return `<div class="panel"><h2>Reading workbook</h2><div class="progress-track"><span></span></div><p class="muted">Checking named tables, source rows and saved calculation results.</p>${button('normal','Return to preview')}</div>`;if(state.mode==='failed')return `<div class="panel"><h2>Workbook could not be read</h2><p class="muted">The source has not changed and no draft has been created. Recalculate and save the workbook, then choose it again.</p>${button('normal','Try again','primary')}</div>`;if(state.mode==='denied')return `<div class="panel"><h2>Estimating access unavailable</h2><p class="muted">Current permission is required to read this workbook and create an estimate. Cost details are hidden in this demonstration state.</p>${button('normal','Restore demo access')}</div>`;if(state.mode==='conflict')return `<div class="panel"><h2>The estimate changed during review</h2><p class="muted">Your proposed import is preserved. Refresh the comparison with the current version and review it again.</p>${button('refresh','Refresh and compare','primary')}</div>`;if(state.mode==='saving')return `<div class="panel"><h2>Creating draft version</h2><p class="muted">The reviewed import is being saved.</p><div class="progress-track"><span></span></div>${button('normal','Return to review')}</div>`;if(state.mode==='uncertain')return `<div class="panel"><h2>Save result is not yet confirmed</h2><p class="muted">Check the original operation before trying to create another version.</p>${button('recover','Check original save','primary')}</div>`;return null;}
function render(){const specialView=special();root.innerHTML=`<div class="wrap"><header class="header"><div><div class="eyebrow">Estimating / Excel import</div><h1>Import an Excel estimate</h1><p class="muted">Bring your workbook into a controlled PPO estimate.</p></div><div class="actions"><span class="tag">Synthetic design · r01</span>${button('guide','Page guide')}${button('reset','Reset preview')}</div></header><div class="context"><span><b>Organisation</b>Meadowglass Horticulture</span><span><b>Site</b>East propagation facility</span><span><b>Estimating option</b>Option A · Systems upgrade</span><span><b>Estimation basis</b>Complete scope · r01 (demo)</span></div><ol class="steps">${['Choose workbook','Review import','Draft estimate'].map((s,i)=>`<li class="${state.stage===i?'active':''}" ${state.stage===i?'aria-current="step"':''}><i>${i+1}</i>${s}</li>`).join('')}</ol><div class="workspace"><div>${specialView||(state.stage===0?upload():state.stage===1?review():saved())}</div><aside class="aside">${state.mode==='denied'?'<div class="panel"><p class="muted">Estimate details are unavailable.</p></div>':summary()}</aside></div><div class="preview-control"><label for="demo-state">Preview state</label><select id="demo-state">${[['normal','Normal'],['loading','Reading workbook'],['failed','Read failed'],['partial','Partial read'],['denied','Access changed'],['conflict','Version conflict'],['saving','Saving'],['uncertain','Unknown save result']].map(([a,b])=>`<option value="${a}" ${state.mode===a?'selected':''}>${b}</option>`).join('')}</select><span>Demonstrates workflow states. Resets when this page reloads.</span></div><div class="status-live" id="live" role="status" aria-live="polite"></div></div><dialog id="detail" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button data-action="close" aria-label="Close dialog">Close</button></div><div class="dialog-body" id="dialog-body"></div></dialog>`;}
function announce(s){const n=document.getElementById('live');if(n)n.textContent=s;}
function modal(title,body){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;document.getElementById('detail').showModal();}
function load(d,name){state.readGeneration++;state.data=P.clone(d);state.original=P.clone(d);state.name=name;state.stage=1;state.reviewed=false;state.search='';state.onlyIssues=false;state.adjustments=[];state.mode='normal';state.pending=null;state.expected=state.versions.length;render();const heading=root.querySelector('.workspace h2');heading?.setAttribute('tabindex','-1');heading?.focus();}
function scenario(kind){const d=P.controls(P.fromFixture(F));if(kind==='issues'){d.lines[3].unit_cost=null;d.lines[5].workbook_sell='14000.00';}if(kind==='wrong')d.metadata.option_ref='SYN-PPO-OPT-EXCEL-B';if(kind==='large'){d.lines=Array.from({length:120},(_,i)=>({...d.lines[i%12],line_ref:`L-${String(i+1).padStart(3,'0')}`}));P.controls(d);}load(d,`SYN-PPO-WBK-000001-${kind}.xlsx`);}
function inspectLine(index){
  const l=state.data.lines[index],original=state.original.lines[index];if(!l)return;
  const issues=validation().issues.filter(i=>i.rowIndex===index),location=l.import_locator;
  const source=state.data.sources.find(s=>s.source_ref===l.source_ref);
  modal(`${l.line_ref||'Reference missing'} · Workbook source`,`<h3>${esc(l.description)}</h3><dl><dt>Read from</dt><dd>${location?`${esc(location.sheet)} · ${esc(location.range)} · ${esc(location.table)}`:'Built-in example · no file uploaded'}</dd><dt>Declared origin</dt><dd>${esc(l.source_sheet)} · Row ${esc(l.source_row)}</dd><dt>Cost source</dt><dd>${esc(l.source_ref)} · ${esc(l.source_date)}</dd><dt>Source validity</dt><dd>${esc(source?.valid_until||'Unknown; review required')}</dd><dt>Original unit cost</dt><dd>${money(original?.unit_cost)}</dd><dt>Proposed unit cost</dt><dd>${money(l.unit_cost)}</dd><dt>Original sell total</dt><dd>${money(original?.workbook_sell)}</dd><dt>Proposed sell total</dt><dd>${money(l.workbook_sell)}</dd></dl>${issues.map(i=>`<div class="notice error">${esc(i.message)}</div>`).join('')}<div class="field"><label for="edit-cost">Reviewed unit cost (AUD)</label><input id="edit-cost" type="text" inputmode="decimal" value="${esc(l.unit_cost)}"></div><div class="field"><label for="edit-reason">Reason and supporting source</label><input id="edit-reason" type="text" maxlength="500" placeholder="Explain this adjustment"></div><label class="check"><input id="edit-reconcile" type="checkbox">Use PPO line calculations after reviewing the workbook difference.</label><button class="primary" data-adjust="${index}">Apply reviewed adjustment</button><p class="small muted" style="margin-top:12px">This preview can adjust unit cost and reconcile line totals. Correct references, quantities and other fields in Excel, then upload the file again. Original values remain in the demo receipt.</p><div id="edit-error" role="alert"></div>`);
}
function commit(){const v=validation();if(!v||v.issues.length||!state.reviewed||state.mode==='partial')return;if(state.expected!==state.versions.length){state.mode='conflict';render();return;}const operation=`SYN-PPO-IMP-${state.receipts.length+1}`;const version=state.versions.length+1;const snapshot={version,data:P.clone(state.data),original:P.clone(state.original),adjustments:P.clone(state.adjustments),operation};state.versions.push(snapshot);state.receipts.push({operation,version,source:state.name,workbook_ref:state.data.metadata.workbook_ref,workbook_revision:state.data.metadata.workbook_revision,adjustments:P.clone(state.adjustments),demo:true});state.stage=2;state.mode='normal';state.reviewed=false;render();announce('Demo draft saved. No application write occurred.');}
function download(name,value){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scenario){scenario(b.dataset.scenario);return;}if(b.hasAttribute('data-line')){inspectLine(Number(b.dataset.line));return;}if(b.hasAttribute('data-adjust')){
  const index=Number(b.dataset.adjust),l=state.data.lines[index];
  try{
    const adjustment=P.adjustLine(l,document.getElementById('edit-cost').value,document.getElementById('edit-reason').value,document.getElementById('edit-reconcile').checked);
    state.data.lines[index]=adjustment.after;state.adjustments.push({...adjustment,rowIndex:index});
    P.controls(state.data);state.reviewed=false;document.getElementById('detail').close();render();
    root.querySelector(`[data-line="${index}"]`)?.focus();announce('Adjustment recorded; review the revised import.');
  }catch(err){document.getElementById('edit-error').textContent=err.message;}
  return;
}
const action=b.dataset.action;if(action==='close')document.getElementById('detail').close();
if(action==='guide')modal('Excel import guide','<p>Use the workbook supplied with this package, or explore a synthetic example.</p><ol><li>Check the selected opportunity, site and option.</li><li>Review workbook rows and resolve every issue.</li><li>Confirm your review and create a demo draft version.</li><li>Load revision r02 to compare changes.</li></ol><p>Reloading clears all demo versions. No files are sent or stored permanently by this page. Workbook formulas are never executed here; saved results are compared with PPO calculations.</p><p>Current prototype: AUD excluding tax, five cost categories and at most 100 lines. Advanced pricing and operational policies remain separate implementation work.</p>');
if(action==='reset'){state.readGeneration++;Object.assign(state,{data:null,original:null,stage:0,versions:[],receipts:[],mode:'normal',reviewed:false,expected:0,pending:null,adjustments:[]});render();}
if(action==='back'){state.readGeneration++;state.stage=0;state.data=null;state.mode='normal';render();}
if(action==='normal'){state.readGeneration++;state.mode='normal';state.reviewed=false;render();}
if(action==='commit')commit();
if(action==='issues')download('ppo-import-issues.json',validation().issues);
if(action==='receipt')download('ppo-import-demo-receipt.json',state.receipts.at(-1));
if(action==='revision'){const d=P.controls(P.fromFixture(F));d.metadata.workbook_revision='r02';d.lines[7].quantity=96;d.lines[7].workbook_cost=P.amount(P.extend(96,d.lines[7].unit_cost));d.lines[7].workbook_sell=P.amount(P.extend(96,d.lines[7].unit_sell));P.controls(d);load(d,'SYN-PPO-WBK-000001-r02.xlsx');}
if(action==='retry'){announce(`Original receipt recovered: version ${state.receipts.at(-1).version}. No additional version created.`);}
if(action==='history')modal('Estimate version history',state.versions.map(v=>`<div class="receipt"><b>Version ${v.version} · ${esc(v.data.metadata.workbook_revision)}</b><p>${money(P.totals(v.data.lines).included)} included sell · ${v.adjustments.length} adjustments</p><p class="small muted">${esc(v.operation)}</p></div>`).join(''));
if(action==='draft'){const v=state.versions.at(-1),included=v.data.lines.filter(l=>P.yes(l.include)),printed=included.filter(l=>P.yes(l.print)),hidden=included.filter(l=>!P.yes(l.print));modal('Customer draft · Demonstration',`<span class="tag">Draft · Not issued</span><h2 style="margin-top:16px">${esc(v.data.metadata.title)}</h2><p>Meadowglass Horticulture · East propagation facility</p><div class="table-scroll"><table><thead><tr><th>Description</th><th class="num">Amount</th></tr></thead><tbody>${printed.map(l=>`<tr><td>${esc(l.description)}</td><td class="num">${money(P.amount(P.extend(l.quantity,l.unit_sell)))}</td></tr>`).join('')}${hidden.length?`<tr><td>Included scope allowance</td><td class="num">${money(P.totals(hidden).sell)}</td></tr>`:''}</tbody></table></div><p style="margin-top:16px"><b>Total ${money(P.totals(included).sell)} AUD excluding tax</b></p>${v.data.scope.map(s=>`<p><b>${esc(s.kind)}:</b> ${esc(s.text)}</p>`).join('')}<p class="small muted">A visual check of customer-safe fields. Formal quotation issue remains a separate PPO workflow.</p>`);}
if(action==='refresh'){state.expected=state.versions.length;state.mode='normal';state.stage=state.data?1:0;state.reviewed=false;render();announce('Comparison refreshed. Review confirmation is required again.');}
if(action==='recover'){state.mode='normal';if(state.pending){state.stage=2;render();announce('Original demo receipt found. No duplicate version created.');}else{state.stage=state.data?1:0;render();announce('No committed demo receipt exists. Review the import before saving.');}}
});
root.addEventListener('input',e=>{if(e.target.id==='line-search'){state.search=e.target.value;document.getElementById('line-area').innerHTML=lineTable();const search=document.getElementById('line-search');search.focus();search.setSelectionRange(state.search.length,state.search.length);}});
root.addEventListener('change',async e=>{if(e.target.id==='review-confirm'){state.reviewed=e.target.checked;const btn=root.querySelector('[data-action=commit]');btn.disabled=!state.reviewed||validation().issues.length>0||state.mode==='partial';}if(e.target.id==='issues-only'){state.onlyIssues=e.target.checked;document.getElementById('line-area').innerHTML=lineTable();document.getElementById('issues-only').focus();}if(e.target.id==='demo-state'){if(!state.data&&['partial','conflict','saving','uncertain'].includes(e.target.value))scenario('ready');state.readGeneration++;state.reviewed=false;state.mode=e.target.value;if(state.mode==='uncertain')state.pending=state.stage===2?state.receipts.at(-1):null;render();}if(e.target.id==='workbook-file'){const file=e.target.files[0];if(!file)return;const generation=++state.readGeneration;state.mode='loading';render();try{const d=await globalThis.PPOReadWorkbook(file);if(generation!==state.readGeneration)return;load(d,file.name);announce(`Workbook read. ${d.formulaCount} saved formula results inspected; formulas were not executed.`);}catch(err){if(generation!==state.readGeneration)return;state.mode='normal';state.stage=0;state.data=null;render();modal('Workbook could not be read',`<div class="notice error">${esc(err.message)}</div><p>Keep the source workbook, correct the identified issue and choose it again.</p>`);}}});
globalThis.PPOPreview={state,scenario,validation,render};render();
})();
</script></body></html>
