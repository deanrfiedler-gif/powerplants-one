/* Direct r18 choice-card geometry; positioning is resolved against the viewport. */
.choice-wrap{position:relative;display:inline-flex;min-width:0;max-width:100%;vertical-align:middle}
.field>.choice-wrap{display:flex;width:100%}
.choice-trigger{width:100%;max-width:100%;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;text-align:left;background:#fff;border:1px solid var(--control-border);border-radius:6px;font-weight:400;font-size:13px;line-height:20px;box-shadow:none}
.choice-trigger .choice-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.choice-trigger .icon{width:14px;height:14px;flex:none;color:#606977}
.choice-trigger:hover,.choice-trigger[aria-expanded=true]{background:#f5f6f8;border-color:#9aa7b9}
.choice-trigger:disabled{cursor:not-allowed}
.filter-grid .choice-trigger,.review-editor .choice-trigger{min-height:44px}
.filter-bottom .field>.choice-wrap{width:200px}
.results-bar .choice-wrap{width:145px}
.scenario-select .choice-wrap{width:300px}
.rounded-picker{position:fixed;z-index:100;min-width:0;width:300px;max-width:calc(100vw - 24px);max-height:360px;overflow:auto;padding:7px;background:#fff;color:#242a37;border:1px solid #dce0e5;border-radius:14px;box-shadow:0 8px 32px #242a3726,0 2px 5px #242a370d;overscroll-behavior:contain;box-sizing:border-box;scroll-padding:7px}
.picker-option{display:flex;width:100%;min-height:38px;align-items:center;gap:12px;padding:9px 11px;background:#fff;border:0;border-radius:7px;text-align:left;justify-content:space-between;font-size:13px;font-weight:400;line-height:20px;white-space:normal;box-sizing:border-box}
.picker-option .option-label{overflow-wrap:anywhere;min-width:0}
.picker-option:hover,.picker-option:focus-visible{background:#f0f2f5;color:#242a37;outline-offset:-2px}
.picker-option[aria-selected=true]{font-weight:700}
.picker-option .icon{color:#315e43;width:16px;height:16px;flex:none}
.picker-option .check-space{width:16px;height:16px;flex:none}
.picker-option[aria-disabled=true]{color:#8a919b;cursor:not-allowed}
.picker-group{font-size:10px;color:#606977;padding:9px 11px 4px;text-transform:uppercase;letter-spacing:.05em}
.picker-divider{border-top:1px solid #dce0e5;margin:7px -7px}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

function workView(){const c=active();return pageHeading('Related work & visits','Prepare the work context and a proposed technician visit. Case ownership remains unchanged.',action('link-work','Link existing work','link',canManage(c)&&c.site&&['Triaged','Active'].includes(c.status)?'':'disabled')+action('new-work','Prepare work order','plus',canManage(c)&&c.site&&['Triaged','Active'].includes(c.status)?'':'disabled','primary'))+`<div class="callout space-bottom">Draft work and proposed visits in this preview are local preparation records. Authorisation, confirmed bookings, crew availability, dispatch and job packs continue through the Service work-order and planner workflows.</div>${M.worksFor(c,data).length?M.worksFor(c,data).map(w=>`<section class="card space-bottom related-work"><div class="card-head"><div><h2>${esc(w.title)}</h2><span class="record-ref">${esc(w.ref)} · ${esc(w.source)}</span></div>${pill(w.status,w.status==='Draft'?'warning':'info')}</div><div class="pad"><h3>Proposed / recorded scope</h3><p style="margin:10px 0 16px">${esc(w.scope)}</p><div class="grid-two"><div><span class="mini-label">Parts / supply requirements</span><p>${esc(w.parts||'Not recorded')}</p></div><div><span class="mini-label">Related report / outcome</span><p>${esc(w.report||'No report recorded')}</p></div></div><div class="form-section"><h3>Technician visits</h3>${w.visits.length?w.visits.map(v=>`<div class="scope-item"><div class="body"><strong>${esc(who(v.technician))}</strong><p>${esc(v.ref)} · ${esc(dateLabel(v.when))}</p><p>${esc(v.note)}</p></div>${pill(v.status,v.status==='Completed'?'success':'warning')}</div>`).join(''):'<p class="small">No visit proposed. Selecting a technician here does not reserve their time.</p>'}</div><div class="actions">${action('propose-visit','Propose technician visit','calendar',`data-id="${w.id}" ${canManage(c)&&canEdit(c)&&c.works.some(x=>x.id===w.id)?'':'disabled'}`)}${action('work-source','Inspect work / planner brief','file',`data-id="$ function evidenceView(){const c=active(),notes=M.currentNotes(c);return pageHeading('Evidence & customer updates','Keep reported symptoms, suspected causes, attempted fixes and verified findings distinguishable.',action('contact','Record update','mail',role==='observer'||c.status==='Closed'?'disabled':'')+action('new-note','Add observation / photo','plus',canEdit(c)?'':'disabled','primary'))+`<div class="two-col"><div class="stack"><section class="card"><div class="card-head"><h2>Observations and findings</h2><span class="small">${notes.length} current · ${c.notes.length-notes.length} earlier revisions</span></div>${notes.length?notes.map(n=>{const f=data.files.find(f=>f.id===n.file);return `<article class="action-row"><div class="row between">${pill(n.basis,n.basis==='Verified finding'?'success':n.basis==='Suspected cause'?'warning':'info')}<span class="small">${esc(M.label(n.target))}</span></div><p class="note-body" style="margin-top:12px">${esc(n.body)}</p>${f?`<button class="photo-open" style="height:auto;margin-top:12px" data-action="photo" data-id="${n.id}" aria-label="Open original image ${esc(f.name)}"><img class="case-photo" src="${f.data}" alt="${esc(n.body.slice(0,200))}"></button>`:''}<p class="small" style="margin-top:12px">${esc(who(n.author))} · ${esc(dateLabel(n.at))}${n.supersedes?' · Corrected record':''}</p><div class="actions">${action('note-source','Inspect source','file',`data-id="${n.id}"`,'link-button')}${action('correct-note','Correct observation','edit',`data-id="${n.id}" ${canEdit(c)?'':'disabled'}`,'quiet')}</div></article>`;}).join(''):'<div class="empty"><h3>No observations recorded</h3><p>Add the customer’s report or a sourced technical finding. Original photos can be attached to an exact area or asset.</p></div>'}</section></div><aside class="stack"><section class="card pad"><h3 class="space-bottom">Customer contact history</h3>${c.communications.length?c.communications.slice().reverse().map(n=>`<div class="snapshot-row"><div class="row between"><strong>${esc(n.channel)}</strong>${pill(n.outcome,n.outcome==='Contacted'?'success':'warning')}</div><p>${esc(n.contact)} · ${esc(dateLabel(n.at))}</p><p>${esc(n.summary)}</p>${action('contact-source','Inspect contact source','file',`data-id="${n.id}"`,'link-button')}</div>`).join(''):'<p class="small">No subsequent customer contact recorded. Logging the original request does not record a follow-up call.</p>'}</section><section class="card pad"><h3 class="space-bottom">Original evidence</h3><p class="small">Photo attachments retain their original bytes. Corrections append a new observation and keep the earlier version in history.</p><p class="small">${data.files.filter(f=>c.notes.some(n=>n.file===f.id)).length} original image(s) linked to this case.</p>${action('history','View retained history','clock','','link-button')}</section></aside></div>`;}
function reviewView(){const c=active(),blockers=M.resolutionBlockers(c,data);return pageHeading('Resolution & review','A completed action or visit does not automatically close the customer’s case.',action('history','Case history','clock')+action('ai-brief','Draft case brief','sparkles'))+`<div class="two-col"><div class="stack"><section class="card pad"><div class="row between"><h3>Case resolution</h3>${statusPill(c)}</div>${c.review?`<div class="review-note" style="margin-top:18px"><p>${esc(c.review.summary)}</p><p class="small">Proposed by ${esc(who(c.review.author))} · ${esc(dateLabel(c.review.at))}</p></div><div class="source-list">${c.review.evidence.map(id=>action('note-source','Evidence: '+c.notes.find(n=>n.id===id).basis,'file',`data-id="${id}"`,'link-button')).join('')}</div><div class="actions">${action('return-review','Return for correction','undo',canManage(c)?'':'disabled')}${action('resolve','Accept resolution','check',canManage(c)?'':'disabled','primary')}</div>`:`<p class="section-intro" style="margin-top:14px">${['Resolved','Closed'].includes(c.status)?'The reviewed outcome is retained below.':'Propose a sourced resolution after the outstanding actions and work have been reconciled.'}</p><div class="actions">${action('propose-resolution','Propose resolution','check',M.isOpen(c)&&['manager','technician'].includes(role)&&['Triaged','Active'].includes(c.status)&&!blockers.length?'':'disabled','primary')}${action('close-case','Close case','check',canManage(c)&&c.status==='Resolved'?'':'disabled')}${action('reopen','Reopen case','refresh',canManage(c)&&['Resolved','Closed'].includes(c.status)?'':'disabled')}</div>`}</section><section class="card pad"><h3 class="space-bottom">Reviewed outcomes</h3>${c.resolutions.length?c.resolutions.slice().reverse().map(r=>`<div class="snapshot-row"><div class="row between"><strong>${esc(r.disposition)}</strong>${pill(r.closedAt?'Closed at the time':'Resolved','success')}</div><p>${esc(r.summary)}</p><p>${esc(who(r.author))} · ${esc(dateLabel(r.at))}</p>${r.closedAt?`<p>Closure: ${esc(dateLabel(r.closedAt))} · ${esc(r.closureReason)}</p>`:''}${action('resolution-source','Inspect retained resolution','file',`data-id="${r.id}"`,'link-button')}</div>`).join(''):'<p class="small">No resolution has been accepted for this case.</p>'}</section></div><aside class="stack"><section class="card pad"><h3 class="space-bottom">Before resolution</h3>${blockers.length?blockers.map(t=>`<div class="review-check blocked">${ico('flag')}<span>${esc(t)}</span></div>`).join(''):`<div class="review-check">${ico('check')}<span>No outstanding action or work blockers in the current case snapshot.</span></div>`}<p class="small" style="margin-top:14px">Closure also requires recorded successful customer contact after the resolution review. Reopening preserves earlier outcomes.</p></section>${ownerCard(c)}</aside></div>`;}

const plusHours=n=>M.local(new Date(Date.now()+n*3600000).toISOString()),reasonField=v=>field('f-reason','Reason / decision note',v.reason||'','Retained in the case history.',{required:true,type:'textarea',max:4000});

function openEditor(type,id=''){

 let values={reason:''};
 if(type==='create'||type==='intake')values={org:C.organisation.id,site:'',asset:'',areas:[],title:'',caller:'',channel:'Phone',received:nowLocal(),symptom:'',impact:'Not confirmed',backup:'Not confirmed',category:'General support',priority:'Normal',owner:'alex',nextUpdate:plusHours(2),reason:'Customer support request received.'};

 if(type==='action'){const a=c.actions.find(a=>a.id===id);if(!a)return;if(role!=='manager'&&a.owner!==actor())return toast('Only the action owner or manager can record its outcome.');values={status:'Completed',outcome:'',transferRef:'',transferOwner:'',reason:''};}
 if(type==='wait')values={waitingReason:c.waiting?.reason||'Customer information',assignee:c.waiting?.owner||c.owner,due:c.waiting?M.local(c.waiting.reviewAt):plusHours(4),detail:c.waiting?.detail||'',reason:''};
 if(type==='note'){const n=c.notes.find(n=>n.id===id);values={basis:n?.basis||'Reported symptom',body:n?.body||'',source:n?.source||'',method:n?.method||'',target:n?.target||c.asset||c.site||c.org,at:n?M.local(n.at):nowLocal(),reason:''};}

 if(type==='review')values={summary:'',evidence:[],reason:''};
 editor={type,id,caseId:c?.id||'',version:c?.version,values,dirty:false,file:null,filePending:false};renderEditor();
}

ner',ownerOptions,v.owner)}${tim('nextUpdate','Next customer update due',v.nextUpdate)}</div></div></details><p class="small">Logged by ${esc(who(e.type==='intake'?c.loggedBy:actor()))}. A technician is assigned after triage.</p>`;

  title='Close the customer case';save='Close case';body=`<p class="section-intro">Confirm the customer has received the reviewed outcome and the outstanding work has been reconciled. Earlier resolutions and evidence remain available.</p>`;
 }
 show('editor',title,formStart()+body+reasonField(v)+'</form>',`<span class="small">${e.type==='create'?'New case':esc(c.ref)} · Local example</span><div class="actions">${action('cancel-editor','Cancel')}${action('save-editor',save,'save','','primary')}</div>`,e.type==='create'?'Employee intake → Service Manager review':M.org(c.org).name+' · Case owner: '+who(c.owner));if(e.type==='intake'){$('#f-org').disabled=true;window.PPOChoices.sync();}
}
async function capturePhoto(input){const e=editor,seq=++uploadSequence,file=input.files[0];if(!file)return;e.file=null;e.filePending=true;$('#photo-status').textContent='Checking original photo…';try{if(file.size>1048576||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choose a JPG, PNG or WebP photo up to 1 MB.');const dataURL=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('The file could not be read.'));r.readAsDataURL(file);});const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error('This file could not be decoded as an image.'));im.src=dataURL;});const saved={id:M.uid(),name:file.name,data:dataURL,width:img.naturalWidth,height:img.naturalHeight,at:new Date().toISOString()};if(!M.imageValid(saved))throw Error('The image contents do not match an accepted photo type or size.');if(editor!==e||seq!==uploadSequence)return;e.file=saved;$('#photo-status').textContent=file.name+' ready · original retained.';}catch(err){if(editor===e&&seq===uploadSequence)$('#photo-status').textContent=err.message;}finally{if(editor===e&&seq===uploadSequence)e.filePending=false;}}
function saveEditor(){if(!editor)return;const e=editor,v=readInputs();e.values=v;clearErrors();if(e.filePending)return errors({},'Wait for the photo check to finish.');let p={...v,reason:v.reason};for(const k of ['due','nextUpdate','received','at','when'])if(k in p)p[k]=M.toInstant(p[k]);
 if(e.type==='create'||e.type==='intake')p={title:v.title,reason:v.reason,fields:{org:v.org,site:v.site,asset:v.asset,areas:v.areas,caller:v.caller,channel:v.channel,received:p.received,title:v.title,symptom:v.symptom,impact:v.impact,backup:v.backup,category:v.category,priority:v.priority,priorityReason:v.priority==='Normal'?'Priority to be confirmed by Service Manager':'Caller-reported priority; Service Manager review required',owner:v.owner,nextUpdate:p.nextUpdate}};
 if(e.type==='note')Object.assign(p,{supersedes:e.id,file:e.file});if(e.type==='action')p.id=e.id;if(e.type==='visit')p.work=e.id;if(e.type==='link')p.id=v.related;
 const mandatory={intake:['title','caller','symptom','reason'],create:['title','caller','symptom','reason'],triage:['priorityReason','impact','backup','triageNote','action','reason'],clarify:['action','reason'],return:['action','reason'],reopen:['action','reason'],action:['outcome','reason'],wait:['detail','reason'],resume:['reason'],note:['body','method','source','reason'],contact:['contact','summary','source','reason'],work:['title','scope','reason'],visit:['note','reason'],'link-work':['work','reason'],link:['related','reason'],review:['summary','reason'],resolve:['reason'],close:['reason']}[e.type]||['reason'];const invalid={};for(const k of mandatory)if(!String(v[k]||'').trim())invalid['f-'+k]='This field is required.';for(const k of ['due','nextUpdate','received','at','when'])if(k in v&&!M.toInstant(v[k]))invalid['f-'+k]='Choose a valid local date and time.';if(Object.keys(invalid).length)return errors(invalid);
 const result=commit(e.type,p);if(notifySave(result,e.type==='create'?'Case logged for Service Manager review.':'Case updated.')){close('editor');view=e.type==='create'?'overview':view;render();}
}

function source(title,value,subtitle='Exact local source snapshot'){show('source-view',title,`<pre>${esc(JSON.stringify(value,null,2))}</pre>`,action('close','Close'),subtitle);}
function showHistory(){const c=active();show('inspect','Case history',historyHTML(c)+`<div class="content-block"><h3>Original / superseded observations</h3>${c.notes.map(n=>`<details class="history-item"><summary>${esc(n.basis)} · ${esc(dateLabel(n.at))}${n.supersedes?' · correction':''}</summary><pre>${esc(JSON.stringify(n,null,2))}</pre></details>`).join('')}</div>`,action('close','Close'),c.ref,true);}
function showAssistant(mode='summary'){
 const c=active();if(!c)return;if(stale)return toast('Reload saved case data before preparing assistance.');const sources=[{label:'Case context and current actions',value:M.clone(M.content(c))},...M.currentNotes(c).map(n=>({label:n.basis+' · '+M.label(n.target),value:M.clone(n)}))];let out='';
 if(mode==='gaps'){
  const gaps=[];if(!c.site&&c.category!=='Account & invoice')gaps.push('Confirm the site if the response needs physical attendance.');if(!c.asset&&c.category!=='Account & invoice')gaps.push('Confirm the affected equipment identity before equipment-specific work.');if(/not confirmed|needs confirmation|not recorded|unconfirmed/i.test(c.impact+' '+c.backup))gaps.push('Clarify the reported impact and temporary arrangements.');if(!c.route)gaps.push('Service Manager to select a response route.');if(!M.openActions(c).length&&M.isOpen(c))gaps.push('Confirm the next owned action or prepare resolution review.');if(!c.communications.length)gaps.push('Record a follow-up customer contact and its outcome.');if(c.asset&&visibleCases().some(x=>x.id!==c.id&&x.asset===c.asset))gaps.push('Review the previous same-equipment case and unsuccessful fixes.');out=`Information review · ${c.ref}\n\n`+(gaps.length?gaps.map(x=>'• '+x).join('\n'):'No missing-information prompts were found by these limited rules; a human review is still required.')+'\n\nThese are questions for review, not a technical diagnosis.';
 }else if(mode==='customer')out=`Customer update draft · ${c.ref}\n\nHello ${c.caller.split(' · ')[0]},\n\nWe have logged your report: ${c.title}.\n\n${c.route?'Our current response route is '+c.route.toLowerCase()+'.':'Our Service Manager is reviewing the appropriate response.'} ${c.waiting?'We are currently awaiting '+c.waiting.reason.toLowerCase()+'.':''}\n\n${M.openActions(c).length?'The next recorded action is: '+M.openActions(c)[0].title+'.':'The current case status is '+c.status+'.'}\n\n${c.nextUpdate?'Your next recorded update is due '+dateLabel(c.nextUpdate)+' (Australia/Melbourne).':''}\n\nRegards,\n${who(c.owner)}\n\nDRAFT — review the wording and current commitments before using it. No message has been sent.`;
 else out=`${mode==='brief'?'Technician / case brief':'Case summary'} · ${c.ref}\n${M.org(c.org).name} · ${M.site(c.site)?.name||'Site not identified / not applicable'}\n\nIssue reported\n${c.symptom}\n\nReported impact\n${c.impact}\nBackup arrangements: ${c.backup}\n\nCase owner: ${who(c.owner)}\nPriority: ${c.priority} — ${c.priorityReason}\nResponse: ${c.route||'Not yet reviewed'}\n\nCurrent observations\n${M.currentNotes(c).map(n=>`${n.basis}: ${n.body}\nSource: ${n.source}`).join('\n\n')||'No additional observations recorded.'}\n\nOwned open actions\n${M.openActions(c).map(a=>`${a.title} — ${who(a.owner)}; due ${dateLabel(a.due)}`).join('\n')||'No open actions.'}\n\n${c.waiting?'Waiting: '+c.waiting.reason+' — '+c.waiting.detail+'\n':''}Review current scope, access and appointment requirements before attending. This draft does not authorise work or confirm a booking.`;
 assistant={caseId:c.id,generation:data.generation,version:c.version,mode,sources,text:out};show('assistant','PPO Assistant',`<div class="ai-intro">Scripted assistance using this case’s current records. Review every draft; no message, diagnosis or work authorisation is generated.</div><div id="assistant-stale" class="callout warning" hidden>Source records changed. Refresh this draft before copying or downloading it.</div><div class="mode-group">${[['summary','Summary'],['gaps','Missing information'],['brief','Technician brief'],['customer','Customer update']].map(([k,t])=>action('ai-mode',t,'',`data-id="${k}" aria-pressed="${mode===k}"`)).join('')}</div><label class="sr-only" for="ai-text">Draft assistance</label><textarea id="ai-text" class="brief-text" style="min-height:340px" readonly>${esc(out)}</textarea><div class="form-section"><h3>Inspect the sources</h3><div class="source-list">${sources.map((s,i)=>action('ai-source',`${i+1}. ${s.label}`,'file',`data-id="${i}"`,'link-button')).join('')}</div></div>`,action('copy-ai','Copy draft','copy')+action('download-ai','Download draft','download'),c.ref+' · revision '+c.version,true);
}
function showAbout(){show('source-view','Workspace information',`<p class="section-intro">A standalone r20 design for internal customer support. The examples are fictional; changes remain in this browser. The role selector demonstrates proposed workflow responsibilities.</p>${choice('preview-role','Preview role',[['manager','Service Manager · Alex Morgan'],['employee','Employee · Riley Chen'],['technician','Assigned technician · Taylor Nguyen'],['observer','Read-only observer']],role)}<div class="form-section"><h3>Local backup and recovery</h3><p class="small">Backups include every case and original attachment. Manager preview is required for full export, restore and reset. Restore accepts this module’s schema only.</p><div class="actions" style="margin:14px 0">${action('export','Export complete backup','download',role==='manager'?'':'disabled')}${action('reset','Reset local example','refresh',role==='manager'?'':'disabled')}</div><label for="backup-file">Restore a saved JSON backup</label><input id="backup-file" type="file" accept="application/json,.json" ${role==='manager'?'':'disabled'} style="display:block;max-width:100%;margin:12px 0"><div id="restore-preview" class="small" role="status">No backup selected.</div>${action('restore-confirm','Review replacement','upload','disabled')}</div><div class="form-section"><h3>Preview boundaries</h3><p class="small">Case is the interface label for the existing Ticket concept; TKT references remain. Proposed expanded review/closure behaviour is not a new application API. MYOB mapping is not configured. Work drafts and visit proposals are not authorised orders or confirmed bookings.</p><p class="small">Native browser, camera and device acceptance remains pending. Photo uploads support JPG/PNG/WebP up to 1 MB, twelve original files per workspace, with a total 6,000,000-character backup limit. Browser quotas may be lower.</p></div>`,action('close','Close'),'Module only · no application rail');}
function exportData(){if(role!=='manager')return toast('Full backup export is available in the manager preview.');download('PPO-Service-Cases-and-Triage-r01-backup.json',JSON.stringify(data,null,2),'application/json');}
function reloadData(){guard(()=>{try{const raw=localStorage.getItem(KEY);const next=raw?JSON.parse(raw):M.seed();if(!M.validate(next))throw Error('Saved data could not be validated.');closeAll();data=next;storageRaw=raw;storageProblem='';stale=false;render();toast('Saved case data reloaded.');}catch(err){toast(err.message);}});}
async function readBackup(file){if(!file||role!=='manager')return;restorePreview=null;$('#restore-preview').textContent='Checking backup…';$('[data-action="restore-confirm"]').disabled=true;try{if(file.size>6000000)throw Error('Backup exceeds this preview’s size limit.');const raw=await file.text(),parsed=JSON.parse(raw);if(!M.validate(parsed))throw Error('The backup does not match the validated case schema.');restorePreview={raw,data:parsed,basis:storageRaw};$('#restore-preview').textContent=`${parsed.cases.length} cases and ${parsed.files.length} original images. Replacement preserves this backup’s evidence and history.`;$('[data-action="restore-confirm"]').disabled=false;}catch(err){$('#restore-preview').textContent='Backup refused: '+err.message;}}
function restoreBackup(){if(role!=='manager'||!restorePreview)return;const proposal=restorePreview;confirm('Replace this local case workspace?',`<p>Load ${proposal.data.cases.length} cases and ${proposal.data.files.length} original images from the selected backup? Export current work first if you need to retain it.</p>`,()=>{try{if(localStorage.getItem(KEY)!==proposal.basis)throw Error('Saved data changed while the replacement was being reviewed. Reload first.');if(!M.validate(proposal.data))throw Error('The backup no longer validates.');localStorage.setItem(KEY,proposal.raw);data=M.clone(proposal.data);storageRaw=proposal.raw;storageProblem='';stale=false;selected=data.cases[0].id;view='register';closeAll();render();toast('Backup restored.');}catch(e){toast(e.message);}},'Replace local workspace');}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='tab')go(b.dataset.view);else if(a==='open-case')go('overview',id);else if(a==='open-selected'&&active())go('overview');
 else if(a==='queue'){queue=id;render();}else if(a==='clear-filters'){search='';queue='all';filters={org:'',site:'',owner:'',priority:'',category:''};render();}
 else if(a==='new-case')guard(()=>openEditor('create'));else if(a==='edit-case')openEditor('intake');else if(a==='edit-triage')openEditor('triage');else if(a==='clarify')openEditor('clarify');else if(a==='edit-action')openEditor('action',id);else if(a==='wait')openEditor('wait');else if(a==='resume')openEditor('resume');else if(a==='new-note')openEditor('note');else if(a==='correct-note')openEditor('note',id);else if(a==='contact')openEditor('contact');else if(a==='link-work')openEditor('link-work');else if(a==='new-work')openEditor('work');else if(a==='propose-visit')openEditor('visit',id);else if(a==='link-case')openEditor('link');else if(a==='propose-resolution')openEditor('review');else if(a==='return-review')openEditor('return');else if(a==='resolve')openEditor('resolve');else if(a==='close-case')openEditor('close');else if(a==='reopen')openEditor('reopen');
 else if(a==='save-editor')saveEditor();else if(a==='cancel-editor')guard(()=>close('editor'));else if(a==='close'){const d=b.closest('dialog');if(d.id==='editor')guard(()=>close(d));else close(d);}
 else if(a==='confirm-decision'){const fn=decision;decision=null;close('decision');fn?.();}else if(a==='cancel-decision'){decision=null;close('decision');}
 else if(a==='focus-error'){e.preventDefault();const field=document.getElementById(id+'-trigger')||document.getElementById(id);field?.focus();}
 else if(a==='history')showHistory();else if(a==='about')showAbout();else if(a==='export')exportData();else if(a==='reload')reloadData();else if(a==='restore-confirm')restoreBackup();
 else if(a==='reset'&&role==='manager'){confirm('Reset this local example?','<p>This replaces this module’s local cases and photos with the fictional starter. Export a backup first to retain your changes.</p>',()=>{try{if(localStorage.getItem(KEY)!==storageRaw)throw Error('Saved data changed. Reload before resetting.');localStorage.removeItem(KEY);data=M.seed();storageRaw=null;storageProblem='';stale=false;selected=M.fixed(201);view='register';closeAll();render();toast('Local example reset.');}catch(err){toast(err.message);}},'Reset local example');}
 else if(a==='ai')showAssistant();else if(a==='ai-gaps')showAssistant('gaps');else if(a==='ai-brief')showAssistant('brief');else if(a==='ai-mode')showAssistant(id);
 else if(a==='ai-source'&&assistant)source('Assistant source '+(Number(id)+1),assistant.sources[Number(id)].value,'Retained for case revision '+assistant.version);
 else if(a==='copy-ai'||a==='download-ai'){if(!assistant||stale||assistant.generation!==data.generation)return toast('Refresh the source context before using this draft.');if(a==='copy-ai')textCopy(assistant.text,$('#ai-text'));else download(active().ref+'-'+assistant.mode+'-draft.txt',assistant.text);}
 else if(a==='context-source'){const c=active();source('Customer / location source',{organisation:M.org(c.org),site:M.site(c.site)||null,areas:c.areas.map(M.area),equipment:M.asset(c.asset)||null,sources:C.sources.filter(s=>s.site===c.site)});}
 else if(a==='note-source')source('Observation source',active().notes.find(n=>n.id===id));else if(a==='contact-source')source('Contact source',active().communications.find(n=>n.id===id));else if(a==='resolution-source')source('Retained resolution',active().resolutions.find(n=>n.id===id));
 else if(a==='work-source'){const c=active(),w=M.worksFor(c,data).find(w=>w.id===id);source('Work / planner preparation brief',{case:c.ref,caseOwner:who(c.owner),customer:M.org(c.org).name,site:M.site(c.site),work:w,scopeState:w.status,receivingChecks:['Review scope and work authority','Check skills, calendars, travel and customer window','Confirm access, job pack and dispatch readiness'],effect:'Local source brief; no confirmed booking or external handover.'});}
 else if(a==='photo'){const n=active().notes.find(n=>n.id===id),f=data.files.find(f=>f.id===n.file);show('source-view',f.name,`<img class="photo-original" src="${f.data}" alt="${esc(n.body)}"><p style="margin-top:14px">${esc(n.body)}</p><p class="small">Original ${f.width} × ${f.height} · ${esc(n.source)}</p>`,action('close','Close'),M.label(n.target));}
});
document.addEventListener('input',e=>{if(e.target.id==='case-search'){const pos=e.target.selectionStart;search=e.target.value;render();$('#case-search').focus();$('#case-search').setSelectionRange(pos,pos);}if(editor&&e.target.closest('#editor'))editor.dirty=true;});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='case-selector'){const id=el.value;el.value=selected;window.PPOChoices.sync();go('overview',id);}else if(el.id.startsWith('filter-')){filters[el.id.slice(7)]=el.value;render();}
 else if(el.id==='preview-role'){role=el.value;closeAll();selected='';view='register';render();toast('Preview role changed.');}
 else if(el.id==='photo-file')capturePhoto(el);else if(el.id==='backup-file')readBackup(el.files[0]);
 if(editor&&el.closest('#editor')){editor.dirty=true;const v=readInputs();if(['create','intake'].includes(editor.type)&&['f-org','f-site'].includes(el.id)){if(el.id==='f-org')v.site='';v.asset='';v.areas=[];editor.contextNotice='Site-dependent equipment and area selections were cleared. Review the new context.';editor.values=v;renderEditor();}else if(['create','intake'].includes(editor.type)&&el.id==='f-asset'){const a=M.asset(v.asset);if(a&&!v.areas.includes(a.installed))v.areas.push(a.installed);editor.values=v;renderEditor();}else if(editor.type==='triage'&&el.id==='f-route'){const map={'Engineering referral':'engineering','Sales referral':'sales','Finance referral':'finance'};if(map[v.route])v.assignee=map[v.route];editor.values=v;renderEditor();}}
});
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();saveEditor();}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=$$('[data-tab]:not(:disabled)'),i=tabs.indexOf(e.target),j=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[j].focus();}if(e.key==='Escape'&&$('#assistant').open&&!$$('dialog[open][aria-modal="true"]').length){e.preventDefault();close('assistant');}});
for(const d of $$('dialog'))d.addEventListener('cancel',e=>{e.preventDefault();if(d.id==='editor')guard(()=>close(d));else{if(d.id==='decision')decision=null;close(d);}});
window.addEventListener('storage',e=>{if(e.key===KEY){stale=true;notice();if(assistant){$('#assistant-stale').hidden=false;for(const b of $$('#assistant [data-action="copy-ai"],#assistant [data-action="download-ai"]'))b.disabled=true;}}});
const params=new URLSearchParams(location.hash.slice(1));if(params.get('case')&&visibleCases().some(c=>c.id===params.get('case')))selected=params.get('case');if(['register','overview','triage','work','evidence','review'].includes(params.get('view')))view=params.get('view');
window.PPOCases={getState:()=>M.clone(data),getContext:()=>({selected,view,role,stale}),storageKey:KEY};render();
})();
</script></body></html>
