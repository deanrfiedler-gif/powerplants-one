/* PPO shared shell · r11 user refinements. Scoped, with no module content styles. */
.ppo-shell{--sh-rail:76px;--sh-header:64px;--sh-navy:#242a37;--sh-green:#62bb46;--sh-hover:#343c4c;--sh-line:#e2e6ec;position:relative;isolation:isolate;width:100%;height:690px;min-height:360px;overflow:hidden;background:#f5f6f8;color:#242a37;font:14px/1.45 Roboto,Verdana,sans-serif}
.ppo-shell *{box-sizing:border-box}.ppo-shell [hidden]{display:none!important}.ppo-shell button,.ppo-shell input{font:inherit;line-height:1.4}.ppo-shell button{cursor:pointer;letter-spacing:normal;text-transform:none}.ppo-shell button:disabled{cursor:default}.ppo-shell :is(button,input,a):focus-visible{outline:3px solid #397eb6;outline-offset:3px;box-shadow:none}
.ppo-shell .sh-icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block}.ppo-shell .sh-sr{position:absolute;width:1px;height:1px;margin:-1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
.ppo-shell .sh-rail{position:absolute;inset:0 auto 0 0;width:var(--sh-rail);display:flex;flex-direction:column;align-items:center;background:var(--sh-navy);color:#fff;z-index:30}
.ppo-shell .sh-brand{display:flex;align-items:center;justify-content:center;width:76px;height:92px;min-height:92px;padding:0;border:0;border-radius:0;background:none;color:#fff;flex-shrink:0}.ppo-shell .sh-brand img{display:block;width:72px;height:72px;object-fit:contain;max-width:none}
.ppo-shell .sh-rail-body{width:100%;min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#657086 transparent;padding:0 0 8px}
.ppo-shell .sh-departments{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.ppo-shell .sh-rail-button{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:48px;min-height:48px;border:0;border-radius:8px;padding:0;background:transparent;color:#fff;flex-shrink:0}
.ppo-shell .sh-rail-button .sh-icon{width:28px;height:28px}.ppo-shell .sh-rail-button:is(:hover,[aria-current=page],[aria-expanded=true],[data-active=true]){background:var(--sh-hover);color:#fff}
.ppo-shell .sh-rail-button[aria-current=page]::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;background:var(--sh-green);border-radius:0 3px 3px 0}
.ppo-shell .sh-rail :is(button,a):focus-visible{outline-color:#a8d8ff;outline-offset:3px}.ppo-shell .sh-rail-bottom{width:100%;display:flex;justify-content:center;flex-shrink:0;padding:12px 0 16px}
.ppo-shell .sh-tooltip{position:absolute;z-index:60;left:86px;border-radius:8px;padding:8px 12px;background:#242a37;color:#fff;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:0 4px 14px #18202c20;pointer-events:none}
.ppo-shell .sh-app{height:100%;margin-left:var(--sh-rail);display:grid;grid-template-rows:var(--sh-header) minmax(0,1fr);min-width:0}
.ppo-shell .sh-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px 0 24px;min-width:0;background:#fff;border-bottom:1px solid var(--sh-line)}
.ppo-shell .sh-heading{display:flex;flex-direction:column;justify-content:center;min-width:0;max-width:calc(50% - 80px - clamp(116px,15%,210px));gap:2px;line-height:1.3}
.ppo-shell .sh-parent{font-size:11px;color:#667181;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ppo-shell .sh-current{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#242a37}
.ppo-shell .sh-search-wrap{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:clamp(232px,30%,420px);z-index:10}
.ppo-shell .sh-search{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border:1px solid #d3dae3;border-radius:22px;background:#fafbfc;color:#667181}
.ppo-shell .sh-search:hover{border-color:#a4afbd;background:#fff}.ppo-shell .sh-search:focus-within{outline:3px solid #397eb6;outline-offset:2px;background:#fff}.ppo-shell .sh-search .sh-icon{width:19px;height:19px}
.ppo-shell .sh-search input{display:block;width:100%;min-width:0;height:36px;min-height:36px;padding:0;margin:0;background:none;border:0;border-radius:0;font-size:13px;color:#242a37;outline:none!important;box-shadow:none!important}.ppo-shell input::placeholder{color:#667181;opacity:1}
.ppo-shell .sh-key{font:10px/1.4 Roboto,Verdana,sans-serif;color:#667181;white-space:nowrap;border:1px solid #e2e6ec;border-radius:4px;background:#fff;padding:2px 4px;flex-shrink:0}
.ppo-shell .sh-utilities{display:grid;grid-template-columns:40px 44px 40px 44px;align-items:center;gap:8px;width:192px;flex:0 0 192px;margin-left:auto}
.ppo-shell .sh-action{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;min-height:40px;padding:0;border:0;border-radius:50%;background:none;color:#667181;flex-shrink:0}
.ppo-shell .sh-action:is(:hover,[aria-expanded=true]){background:#eef1f5;color:#242a37}.ppo-shell .sh-quick{background:#242a37;color:#fff}.ppo-shell .sh-quick:is(:hover,[aria-expanded=true]){background:#343c4c;color:#fff}
.ppo-shell .sh-help{width:44px;height:44px;min-height:44px}.ppo-shell .sh-help .sh-icon{width:28px;height:28px}
.ppo-shell .sh-account{width:44px;height:44px;min-height:44px}.ppo-shell .sh-avatar{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#e9edf2;color:#4d5868;font-size:11px;font-weight:500}
.ppo-shell .sh-workspace{min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;padding:0;background:#f5f6f8;outline-offset:-3px!important}
.ppo-shell .sh-mobile-brand,.ppo-shell .sh-mobile-nav,.ppo-shell .sh-mobile-search{display:none}
.ppo-shell .sh-more{position:absolute;z-index:40;left:86px;bottom:12px;width:344px;height:min(744px,calc(100% - 24px));max-width:calc(100% - 100px);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid #dce1e7;border-radius:16px;box-shadow:0 12px 38px #1c2c4726;overflow:hidden;animation:sh-appear .14s ease}
.ppo-shell .sh-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:12px 16px 10px;flex-shrink:0}
.ppo-shell .sh-panel-heading h2{font-size:16px;line-height:1.4;letter-spacing:0;margin:0;font-weight:500}.ppo-shell .sh-panel-heading p{font-size:11px;color:#667181;margin:2px 0 0;line-height:1.4}
.ppo-shell .sh-close{display:flex;align-items:center;justify-content:center;width:36px;height:36px;min-height:36px;border:0;border-radius:8px;padding:0;background:none;color:#667181;flex-shrink:0}.ppo-shell .sh-close:hover{background:#eef1f5;color:#242a37}.ppo-shell .sh-close .sh-icon{width:20px;height:20px}
.ppo-shell .sh-menu-search{margin:0 16px 10px;width:calc(100% - 32px);border-radius:8px;height:38px;flex-shrink:0;background:#f8f9fb}.ppo-shell .sh-menu-search input{font-size:12px;min-height:34px;height:34px}
.ppo-shell .sh-more-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 8px 8px;scrollbar-width:thin;scrollbar-color:#b3bdc9 transparent}
.ppo-shell .sh-menu-group{margin:0;padding:9px 0 8px}.ppo-shell .sh-menu-group+.sh-menu-group{border-top:1px solid #edf0f4}
.ppo-shell .sh-menu-group h3{font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:500;color:#667181;margin:0 12px 5px;line-height:1.5}
.ppo-shell .sh-menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:38px;padding:8px 12px;border:0;border-radius:8px;background:none;color:#344052;text-align:left;white-space:normal;font-size:13px}
.ppo-shell .sh-menu-item .sh-icon{width:20px;height:20px;color:#667181}.ppo-shell .sh-menu-text{flex:1;min-width:0;line-height:1.4}.ppo-shell .sh-menu-item:is(:hover,[aria-current=page]){background:#f0f3f7;color:#242a37}.ppo-shell .sh-menu-item[aria-current=page]{font-weight:500}.ppo-shell .sh-menu-item .sh-tick{color:#39752b;width:16px;height:16px}
.ppo-shell .sh-menu-item small{display:block;font-size:11px;color:#667181;font-weight:400;margin-top:2px}
.ppo-shell .sh-menu-footer{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-top:1px solid var(--sh-line);color:#667181;background:#fafbfc;font-size:10px;flex-shrink:0}
.ppo-shell .sh-utility{position:absolute;top:72px;right:16px;z-index:40;width:350px;max-width:calc(100% - 104px);max-height:calc(100% - 88px);background:#fff;border:1px solid #dce1e7;border-radius:14px;box-shadow:0 12px 38px #1c2c4726;display:flex;flex-direction:column;overflow:hidden;animation:sh-appear .14s ease}
.ppo-shell .sh-utility[data-kind=search]{left:50%;right:auto;transform:translateX(-50%);width:420px;max-width:calc(100% - 104px)}
.ppo-shell .sh-utility .sh-panel-heading{border-bottom:1px solid var(--sh-line)}.ppo-shell .sh-utility-body{min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px 16px;font-size:13px;line-height:1.6;color:#526176}.ppo-shell .sh-utility-body p{margin:0 0 12px}.ppo-shell .sh-utility-body p:last-child{margin-bottom:0}.ppo-shell .sh-utility-body strong{font-weight:500;color:#242a37}
.ppo-shell .sh-results{padding:0;margin:0}.ppo-shell .sh-no-results{padding:18px 12px;text-align:center;font-size:12px;color:#667181;line-height:1.6}.ppo-shell .sh-no-results strong{display:block;color:#242a37;font-weight:500}
.ppo-shell .sh-reset-search{font-size:12px;color:#245c8d;background:none;border:0;border-radius:5px;text-decoration:underline;min-height:36px;padding:4px 8px;margin-top:6px}
.ppo-shell .sh-mobile-tools{display:none}.ppo-shell .sh-mobile-input{margin:0 0 12px;width:100%}
.ppo-shell[data-narrow=true] .sh-key{display:none}.ppo-shell[data-narrow=true] .sh-header{padding-right:16px;padding-left:20px}.ppo-shell[data-narrow=true] .sh-utilities{gap:6px;width:186px;flex-basis:186px}
.ppo-shell[data-mode=mobile]{--sh-rail:0px;--sh-header:68px;height:720px}.ppo-shell[data-mode=mobile] .sh-rail{display:none}.ppo-shell[data-mode=mobile] .sh-app{margin-left:0;grid-template-rows:68px minmax(0,1fr) auto}
.ppo-shell[data-mode=mobile] .sh-header{padding:0 12px;gap:10px}.ppo-shell[data-mode=mobile] .sh-heading{max-width:none;flex:1;min-width:0}.ppo-shell[data-mode=mobile] .sh-parent{font-size:10px}.ppo-shell[data-mode=mobile] .sh-current{font-size:15px}
.ppo-shell[data-mode=mobile] .sh-mobile-brand{display:flex;align-items:center;justify-content:center;width:44px;height:44px;min-height:44px;flex-shrink:0;padding:0;border:0;border-radius:7px;background:#242a37}.ppo-shell .sh-mobile-brand img{width:36px;height:36px;object-fit:contain;max-width:none}
.ppo-shell[data-mode=mobile] .sh-search-wrap,.ppo-shell[data-mode=mobile] .sh-utilities>.sh-action:not(.sh-account):not(.sh-mobile-search){display:none}.ppo-shell[data-mode=mobile] .sh-utilities{grid-template-columns:40px 44px;gap:2px;width:86px;flex-basis:86px}.ppo-shell[data-mode=mobile] .sh-mobile-search{display:flex;width:40px;height:44px;min-height:44px}
.ppo-shell[data-mode=mobile] .sh-mobile-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-height:64px;padding:0 4px env(safe-area-inset-bottom,0px);background:#242a37}

 const canFocus=el=>!!(el?.isConnected&&!el.closest('[hidden],[inert]')&&!(state.mode==='mobile'&&el.closest('.sh-rail,.sh-search-wrap'))&&!(state.mode==='desktop'&&el.closest('.sh-mobile-nav,.sh-mobile-brand,.sh-mobile-search,.sh-mobile-tools')));
 function hideTip(){q('#sh-tooltip').hidden=true;qa('[aria-describedby="sh-tooltip"]').forEach(b=>b.removeAttribute('aria-describedby'));}
 function covered(){const block=state.mode==='mobile'&&!!state.panel;q('.sh-app').toggleAttribute('inert',block);}
 function close(restore=true){const trigger=state.trigger;q('#sh-more').hidden=true;q('#sh-utility').hidden=true;qa('[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'));state.panel=null;state.trigger=null;covered();hideTip();if(restore){state.restoring=true;(canFocus(trigger)?trigger:q('#sh-workspace')).focus({preventScroll:true});state.restoring=false;}}
 function markCurrent(){
  qa('[data-sh-route]').forEach(b=>{const active=b.dataset.shRoute===state.route;if(!b.classList.contains('sh-brand')&&!b.classList.contains('sh-mobile-brand')){if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}});
  q('#sh-more-trigger').dataset.active=String(!d.departments.includes(state.route));
  if(!['work','sales','contacts'].includes(state.route))q('#sh-mobile-more').setAttribute('aria-current','page');else q('#sh-mobile-more').removeAttribute('aria-current');
 }
 function selectRoute(id,focus=true){const r=routeById(id);if(!r)return;close(false);state.route=id;q('#sh-parent').textContent=r.parent;q('#sh-current').textContent=r.label;q('#sh-parent').title=r.parent;q('#sh-current').title=r.label;q('#sh-workspace').setAttribute('aria-label',r.label+' — blank module workspace');markCurrent();announce(r.parent+', '+r.label+'. Workspace remains blank for shell review.');if(focus)q('#sh-current').focus({preventScroll:true});}
 function item(r,scope='menu'){return `<button type="button" class="sh-menu-item" data-sh-route="${esc(r.id)}" data-sh-result="${scope}"${state.route===r.id?' aria-current="page"':''}>${icon(r.icon)}<span class="sh-menu-text">${esc(r.label)}${scope==='search'?`<small>${esc(r.parent)}</small>`:''}</span>${state.route===r.id?'<svg class="sh-icon sh-tick" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></svg>':''}</button>`;}
 function menu(){const filter=q('#sh-menu-filter').value.trim().toLowerCase().slice(0,100),groups=state.mode==='mobile'?[['Departments',d.departments],...d.groups]:d.groups;let count=0;
  q('#sh-more-body').innerHTML=groups.map(([label,ids])=>{const rows=ids.map(routeById).filter(Boolean).filter(r=>!filter||[r.label,r.parent].join(' ').toLowerCase().includes(filter));count+=rows.length;return rows.length?`<div class="sh-menu-group"><h3>${esc(label)}</h3>${rows.map(r=>item(r)).join('')}</div>`:'';}).join('')||'<div class="sh-no-results"><strong>No menu items match</strong>Try another name or clear the filter.<br><button type="button" class="sh-reset-search" data-sh-action="clear-menu">Clear filter</button></div>';
  q('#sh-menu-count').textContent=count+' '+(count===1?'destination':'destinations');
 }
 function openMore(trigger){if(state.panel==='more'){close();return;}close(false);state.panel='more';state.trigger=trigger;q('#sh-menu-filter').value='';menu();q('#sh-more-body').scrollTop=0;q('#sh-more').hidden=false;trigger.setAttribute('aria-expanded','true');covered();q('#sh-menu-filter').focus({preventScroll:true});announce('More navigation opened.');}
 function utility(kind,trigger,body,title,focus=true){close(false);state.panel=kind;state.trigger=trigger;q('#sh-utility').dataset.kind=kind;q('#sh-utility-title').textContent=title;q('#sh-utility-body').innerHTML=body;q('#sh-utility-body').scrollTop=0;q('#sh-utility').hidden=false;if(trigger?.getAttribute('aria-controls')==='sh-utility')trigger.setAttribute('aria-expanded','true');covered();if(focus)q('#sh-utility .sh-close').focus({preventScroll:true});}
 function showUtility(kind,trigger){if(state.panel===kind){close();return;}if(kind==='search'){utility('search',trigger,`<label class="sh-search sh-mobile-input">${icon('search')}<input id="sh-phone-query" type="search" aria-label="Find a page" placeholder="Find a page" autocomplete="off" maxlength="200" aria-controls="sh-search-results"></label><div id="sh-search-results">${results('')}</div>`,'Search Powerplants One',false);q('#sh-phone-query').addEventListener('input',e=>q('#sh-search-results').innerHTML=results(e.target.value));q('#sh-phone-query').focus({preventScroll:true});return;}
  const copy={quick:['Quick add','<p><strong>Quick add belongs to the shared header.</strong></p><p>Creation actions will appear here when the relevant modules are connected. This shell preview does not create records.</p>'],help:['Quick Help','<p><strong>Review the shared shell</strong></p><p>Choose a department or a destination in More to change the top breadcrumb. The grey workspace stays blank.</p><p>Search finds navigation destinations in this preview. Press Escape to close an open menu or panel.</p>'],notifications:['Notifications','<p><strong>No notification feed is connected.</strong></p><p>There are no sample unread counts in this shell preview.</p>'],account:['Account','<p><strong>Alex Lee</strong><br>Powerplants One · sample identity</p><p>This preview does not change sign-in or permissions.</p>']};const c=copy[kind]||copy.help;utility(kind,trigger,c[1],c[0]);}
 function results(value){const query=value.trim().toLowerCase().slice(0,200);if(!query)return '<p>Find a page by name, such as <strong>Products</strong>, <strong>Projects</strong> or <strong>Contacts</strong>.</p><p>Navigation preview · record search is not connected.</p>';const matches=d.routes.filter(r=>[r.label,r.parent].join(' ').toLowerCase().includes(query));return matches.length?`<div class="sh-results">${matches.map(r=>item(r,'search')).join('')}</div>`:'<div class="sh-no-results"><strong>No destinations match</strong>Try another page name.</div>';}
 function search(){const input=q('#sh-global-search');if(state.panel==='search'){q('#sh-utility-body').innerHTML=results(input.value);return;}utility('search',input,results(input.value),'Search Powerplants One',false);}
 function showTip(b){if(state.panel||state.restoring||state.tipMuted||state.mode==='mobile'||!b)return;const box=b.getBoundingClientRect(),frame=host.getBoundingClientRect();q('#sh-tooltip').textContent=b.dataset.shTip;q('#sh-tooltip').style.top=Math.max(8,Math.min(frame.height-38,box.top-frame.top+(box.height-34)/2))+'px';q('#sh-tooltip').hidden=false;b.setAttribute('aria-describedby','sh-tooltip');}
 function layout(){const width=Math.round(host.getBoundingClientRect().width||1180),mode=width<=780?'mobile':'desktop';if(mode!==state.mode&&state.panel)close(false);state.mode=mode;host.dataset.mode=mode;host.dataset.narrow=String(width<=1100);covered();hideTip();const caption=document.getElementById('r11-viewport-caption');if(caption)caption.textContent=width+' CSS px · '+(mode==='mobile'?'mobile navigation':'desktop shell');}
 function setSize(size){if(!['fit','1180','900','390'].includes(size))return;close(false);state.size=size;host.style.width=size==='fit'?'100%':size+'px';host.style.maxWidth=size==='390'?'100%':'none';host.dataset.size=size;document.querySelectorAll('[data-sh-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shSize===size)));layout();const wrap=host.closest('.r11-preview-scroll');if(wrap)wrap.scrollLeft=0;}
 q('#sh-current').tabIndex=-1;
 qa('[data-sh-icon]').forEach(el=>el.innerHTML=icon(el.dataset.shIcon));qa('[data-sh-logo]').forEach(img=>img.src=img.dataset.shLogo==='desktop'?d.desktopLogo:d.logo);
 q('#sh-departments').innerHTML=d.departments.map(id=>{const r=routeById(id);return `<button type="button" class="sh-rail-button" data-sh-route="${esc(id)}" aria-label="${esc(r.department||r.label)}" data-sh-tip="${esc(r.department||r.label)}">${icon(r.icon)}</button>`;}).join('');
 host.addEventListener('click',e=>{const route=e.target.closest('[data-sh-route]');if(route){selectRoute(route.dataset.shRoute);return;}const tool=e.target.closest('[data-sh-utility]');if(tool){showUtility(tool.dataset.shUtility,tool.closest('.sh-more')?q('#sh-mobile-more'):tool);return;}const a=e.target.closest('[data-sh-action]');if(!a)return;if(a.dataset.shAction==='more')openMore(a);if(a.dataset.shAction==='close')close();if(a.dataset.shAction==='clear-menu'){q('#sh-menu-filter').value='';menu();q('#sh-menu-filter').focus();announce('More menu filter cleared.');}});
 q('#sh-global-search').addEventListener('input',search);q('#sh-global-search').addEventListener('focus',()=>{if(!state.restoring)search();});q('#sh-menu-filter').addEventListener('input',()=>{menu();announce(q('#sh-menu-count').textContent+' match the menu filter.');});
 host.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();state.tipMuted=true;if(state.panel){e.preventDefault();e.stopPropagation();close();}return;}if(!state.panel)return;const layer=state.panel==='more'?q('#sh-more'):q('#sh-utility');const choices=Array.from(layer.querySelectorAll('[data-sh-result]')),at=choices.indexOf(document.activeElement);if(!choices.length)return;if(['ArrowDown','ArrowUp'].includes(e.key)||(['Home','End'].includes(e.key)&&at>=0)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?choices.length-1:e.key==='ArrowDown'?(at+1)%choices.length:at<=0?choices.length-1:at-1;choices[next].focus({preventScroll:true});choices[next].scrollIntoView({block:'nearest'});}if(e.key==='Enter'&&at>=0){e.preventDefault();choices[at].click();}});
 host.addEventListener('pointerover',e=>{state.tipMuted=false;showTip(e.target.closest('[data-sh-tip]'));});host.addEventListener('pointerout',e=>{if(e.target.closest('[data-sh-tip]'))hideTip();});host.addEventListener('focusin',e=>{if(!state.restoring)state.tipMuted=false;showTip(e.target.closest('[data-sh-tip]'));});host.addEventListener('focusout',hideTip);q('.sh-rail-body').addEventListener('scroll',hideTip);
 document.addEventListener('pointerdown',e=>{if(!state.panel)return;const layer=state.panel==='more'?q('#sh-more'):q('#sh-utility');if(!layer.contains(e.target)&&!state.trigger?.contains(e.target))close(false);});
 document.addEventListener('focusin',e=>{if(!state.panel||state.restoring)return;const layer=state.panel==='more'?q('#sh-more'):q('#sh-utility');if(!layer.contains(e.target)&&!state.trigger?.contains(e.target))close(false);});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&(host.contains(document.activeElement)||document.body.hasAttribute('data-shell-standalone'))){e.preventDefault();if(state.mode==='mobile')showUtility('search',q('.sh-mobile-search'));else{q('#sh-global-search').focus({preventScroll:true});if(state.panel!=='search')search();}}});
 document.querySelectorAll('[data-sh-size]').forEach(b=>b.addEventListener('click',()=>setSize(b.dataset.shSize)));
 const bounds=document.getElementById('r11-boundaries');if(bounds)bounds.addEventListener('change',()=>{host.dataset.boundaries=String(bounds.checked);announce(bounds.checked?'Layout boundaries shown.':'Layout boundaries hidden.');});
 const reset=document.getElementById('r11-reset');if(reset)reset.addEventListener('click',()=>{close(false);q('#sh-global-search').value='';if(bounds)bounds.checked=false;host.dataset.boundaries='false';selectRoute('sales',false);setSize('fit');reset.focus();announce('Shell review reset.');});
 const original=document.getElementById('r10-source-download');if(original)original.href=d.originalURI;
 const originalHash=document.getElementById('r10-source-hash');if(originalHash)originalHash.textContent=d.originalDescription;
 document.querySelectorAll('[data-sh-copy-css]').forEach(b=>b.addEventListener('click',async()=>{try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(d.geometryCSS);else{const t=document.createElement('textarea');t.value=d.geometryCSS;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();b.focus();if(!ok)throw Error('Clipboard unavailable');}announce('Current shell geometry copied.');const s=document.getElementById('r11-copy-status');if(s)s.textContent='Current shell geometry copied.';}catch{const s=document.getElementById('r11-copy-status');if(s)s.textContent='Clipboard unavailable. Use the geometry download.';announce('Clipboard unavailable. Use the geometry download.');}}));
 window.addEventListener('resize',layout);if(window.ResizeObserver)new window.ResizeObserver(layout).observe(host);
 selectRoute('sales',false);layout();window.PPO_SHELL_R11={getState:()=>({route:state.route,panel:state.panel,mode:state.mode,size:state.size}),getRoutes:()=>d.routes.map(r=>({...r}))};
})();
</script></body></html>
