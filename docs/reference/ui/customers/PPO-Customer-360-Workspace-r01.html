:root{--navy:#242a37;--green:#62bb46;--ink:var(--navy);--paper:#f5f6f8;--surface-white:#fff;--surface:#f6f7f9;--surface-2:#f7f8fa;--surface-3:#fcfcfd;--surface-hover:#f0f2f5;--muted:#667181;--text-secondary:#596779;--link:#355b80;--line:#e1e5eb;--line-strong:#dce2e9;--line-soft:#e9ecf1;--hairline:#cbd2dc;--control-border:#828e9f;--focus:#365d8b;--success:#416d33;--success-surface:#edf5e9;--success-border:#d4e3cb;--success-tint:#f3f7f1;--warning:#80530e;--warning-surface:#fff2d9;--warning-border:#efdbb6;--danger:#993b2a;--danger-surface:#fff1ed;--danger-border:#edc6bd;--info:#346580;--info-surface:#e9f2f8;--info-border:#cfe0ec;--neutral:#526078;--neutral-surface:#edf0f5;--font:PPOBoardRoboto,Roboto,Verdana,sans-serif;--radius-control:6px;--radius-card:7px;--radius-dialog:10px;--shadow:0 16px 52px rgba(36,42,55,.17),0 2px 8px rgba(36,42,55,.06);--shadow-card:0 3px 10px rgba(36,42,55,.10),0 1px 2px rgba(36,42,55,.04);--success-icon:#527347;--warning-accent:#c69539;--warning-icon:#9b6d27;--warning-tint:#fff8ec;--danger-accent:#ad4635;--info-accent:#5d8db0;--avatar-surface:#eaf1e5;--avatar-text:#45623b;}

/* Shared r18/r20 choice-card geometry, carried unchanged from the Customers, Sites & Growing Areas r03 workspace. */
.choice-wrap{position:relative;display:inline-flex;min-width:0;max-width:100%;vertical-align:middle}
.field>.choice-wrap{display:flex;width:100%}
.choice-trigger{width:100%;max-width:100%;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;text-align:left;background:#fff;border:1px solid var(--control-border);border-radius:6px;font-weight:400;font-size:13px;line-height:20px;box-shadow:none}
.choice-trigger .choice-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.choice-trigger .icon{width:14px;height:14px;flex:none;color:#606977}
.choice-trigger:hover,.choice-trigger[aria-expanded=true]{background:#f5f6f8;border-color:#9aa7b9}
.choice-trigger:disabled{cursor:not-allowed}
.filter-grid .choice-trigger{min-height:44px}
.rounded-picker{position:fixed;z-index:100;min-width:0;width:300px;max-width:calc(100vw - 24px);max-height:360px;overflow:auto;padding:7px;background:#fff;color:#242a37;border:1px solid #dce0e5;border-radius:14px;box-shadow:0 8px 32px #242a3726,0 2px 5px #242a370d;overscroll-behavior:contain;box-sizing:border-box;scroll-padding:7px}
.picker-option{display:flex;width:100%;min-height:38px;align-items:center;gap:12px;padding:9px 11px;background:#fff;border:0;border-radius:7px;text-align:left;justify-content:space-between;font-size:13px;font-weight:400;line-height:20px;white-space:normal;box-sizing:border-box}
.picker-option .option-label{overflow-wrap:anywhere;min-width:0}
.picker-option:hover,.picker-option:focus-visible{background:#f0f2f5;color:#242a37;outline-offset:-2px}
.picker-option[aria-selected=true]{font-weight:700}
.picker-option .icon{color:#315e43;width:16px;height:16px;flex:none}
.picker-option .check-space{width:16px;height:16px;flex:none}
.picker-option[aria-disabled=true]{color:#8a919b;cursor:not-allowed}
.picker-group{font-size:10px;color:#606977;padding:9px 11px 4px;text-transform:uppercase;letter-spacing:.05em}
.picker-divider{border-top:1px solid #dce0e5;margin:7px -7px}

/* Base elements */
*{box-sizing:border-box}html{color-scheme:light;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--navy);font:14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}
button{cursor:pointer;border:1px solid var(--hairline);border-radius:6px;background:#fff;min-height:40px;padding:9px 13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:20px}
button:hover{background:var(--surface-hover)}button:disabled{opacity:.55;cursor:not-allowed}
a{color:var(--link);text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.primary:hover{background:#343d4d}
.secondary{background:var(--navy);color:#fff;border-color:var(--navy)}.secondary:hover{background:#343d4d}
.quiet{background:transparent;border-color:transparent}
.link-button{border:0;background:transparent;color:var(--link);padding:2px;min-height:32px;justify-content:flex-start;text-align:left}
.link-button:hover{background:transparent;text-decoration:underline}
.icon-button{width:40px;padding:8px;flex:none}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1,h2,h3,h4,p{margin-top:0}
h1{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.3px;margin-bottom:7px}
h2{font-size:18px;line-height:1.4;font-weight:500;margin-bottom:8px}
h3{font-size:14px;line-height:1.5;margin-bottom:6px}
h4{font-size:13px;line-height:1.5;margin-bottom:6px;font-weight:500}
p{margin-bottom:12px}p:last-child{margin-bottom:0}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:-100px;left:20px;z-index:200;background:#fff;padding:12px}.skip:focus{top:10px}
input:not([type=checkbox]),textarea,select{width:100%;padding:10px 11px;background:#fff;border:1px solid var(--control-border);border-radius:6px;min-height:44px}
input[readonly]{background:var(--surface);color:var(--muted)}
textarea{resize:vertical;min-height:86px}
input[type=checkbox]{accent-color:var(--navy);width:18px;height:18px;flex:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;margin-bottom:16px;scroll-margin:24px}
.field label{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--muted)}
.field-error{color:var(--danger);font-size:12px}
.field [aria-invalid=true]{border-color:var(--danger)}

/* Workspace shell — one heading, context row and local tabs. No application rail or masthead. */
.module-workspace{width:100%;max-width:1664px;margin:0 auto}
.module-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 32px 22px}
.module-heading h1{font-size:24px;line-height:1.3;margin:5px 0 7px}
.module-heading p{font-size:13px;color:var(--text-secondary);margin:0;max-width:720px}
.module-meta{display:flex;align-items:center;gap:12px;flex:none}
.workspace-tools{position:sticky;top:0;z-index:10;background:var(--surface-white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.context-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px 32px}
.organisation-context,.site-context{display:flex;align-items:center;gap:10px;min-width:0}
.organisation-context strong{font-size:14px;font-weight:500}
.organisation-context>.icon{color:var(--text-secondary)}
.context-note,.scope-indicator{font-size:11px;color:var(--muted)}
.context-note{border-left:1px solid var(--line);padding-left:10px}
.site-context label{font-size:12px;color:var(--muted)}
.site-context>.choice-wrap{width:260px}
.workspace-tabs{display:flex;align-items:stretch;gap:20px;padding:0 32px;overflow-x:auto;scroll-padding:12px}
.workspace-tabs button{position:relative;white-space:nowrap;border:0;border-bottom:3px solid transparent;border-radius:0;min-height:48px;padding:12px 2px 10px;background:transparent;font-weight:400;font-size:13px;color:var(--text-secondary)}
.workspace-tabs button:hover{color:var(--navy);background:var(--surface-3)}
.workspace-tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--green);font-weight:700}
.workspace-tabs button .count{font-size:11px;color:var(--muted);font-weight:400}
.workspace-tabs button[aria-selected=true] .count{color:var(--text-secondary)}
.workspace-tabs .icon{width:17px;height:17px}
.workspace-tabs button:focus-visible{outline-offset:-4px}
.content{padding:26px 32px 36px;min-width:0}
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}
.page-heading h2{font-size:20px;font-weight:500;margin-bottom:5px}
.page-heading p{font-size:13px;color:var(--muted);margin:0;max-width:760px}
.page-heading .actions{justify-content:flex-end;flex:none}
.status-message{margin:16px 32px 0;padding:12px 16px;border:1px solid var(--warning-border);background:var(--warning-surface);color:var(--warning);font-size:13px}
.status-message .actions{margin-top:8px}
.footer-note{font-size:11px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Cards, pills, callouts */
.card{background:#fff;border:1px solid var(--line);border-radius:7px;min-width:0}
.pad{padding:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.card-head h2,.card-head h3{margin:0}
.card-foot{padding:13px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--surface-3);border-radius:0 0 7px 7px}
.space-bottom{margin-bottom:20px}
.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:20px;align-items:start}
.side-stack{display:flex;flex-direction:column;gap:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;min-height:25px;padding:3px 9px;font-size:11px;font-weight:500;line-height:16px;white-space:normal;width:fit-content}
.pill .icon{width:13px;height:13px}
.pill.success{background:var(--success-surface);color:var(--success);border-color:var(--success-border)}
.pill.warning{background:var(--warning-surface);color:var(--warning);border-color:var(--warning-border)}
.pill.danger{background:var(--danger-surface);color:var(--danger);border-color:var(--danger-border)}
.pill.neutral{background:var(--neutral-surface);color:var(--neutral);border-color:var(--line)}
.pill.info{background:var(--info-surface);color:var(--info);border-color:var(--info-border)}
.callout{padding:14px 16px;background:var(--info-surface);border:1px solid var(--info-border);border-radius:6px;color:var(--info);font-size:13px}
.callout.warning{background:var(--warning-surface);border-color:var(--warning-border);color:var(--warning)}
.callout.danger{background:var(--danger-surface);border-color:var(--danger-border);color:var(--danger)}
.callout.neutral{background:var(--surface);border-color:var(--line);color:var(--text-secondary)}
.callout p{margin-bottom:5px}
.callout .actions{margin-top:10px}
.empty{padding:38px 24px;text-align:center;color:var(--muted)}
.empty .icon{width:28px;height:28px;margin-bottom:10px}
.empty h3{color:var(--navy);font-size:16px}
.empty p{max-width:520px;margin:0 auto 12px}
.detail-list{margin:0;display:grid;grid-template-columns:168px minmax(0,1fr);gap:10px 14px;font-size:13px}
.detail-list dt{color:var(--muted)}
.detail-list dd{margin:0;overflow-wrap:anywhere}
.detail-list.compact{grid-template-columns:120px minmax(0,1fr)}
.avatar{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:50%;background:var(--avatar-surface);color:var(--avatar-text);font-weight:500;font-size:12px}

/* Summary tiles — every tile drills into the register behind it. */
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.summary-tile{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:16px 18px;min-height:132px;text-align:left;font-weight:400;border:1px solid var(--line);border-radius:7px;background:#fff;box-shadow:none}
.summary-tile:hover{border-color:var(--control-border);background:#fff}
.summary-tile .tile-label{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.summary-tile .tile-value{font-size:26px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.summary-tile .tile-value.unknown{font-size:15px;font-weight:400;color:var(--muted);line-height:1.35}
.summary-tile .tile-scope{font-size:11px;color:var(--muted);line-height:1.45;margin-top:auto;overflow-wrap:anywhere}
.summary-tile .tile-arrow{position:absolute;top:16px;right:16px;color:var(--link);width:15px;height:15px}
.summary-tile[data-restricted=true]{background:var(--surface-3)}

/* Attention register — the outstanding-commitment list on Overview. */
.attention-list{list-style:none;margin:0;padding:0}
.attention-item{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:12px 18px;padding:16px 20px;border-bottom:1px solid var(--line-soft);align-items:start}
.attention-item:last-child{border-bottom:0}
.attention-item .origin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.attention-item .origin .ref{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.attention-item h3{margin:0 0 4px;font-size:14px;font-weight:500}
.attention-item .reason{font-size:12px;color:var(--text-secondary);margin:0 0 8px;overflow-wrap:anywhere}
.attention-item .next-action{font-size:12px;color:var(--navy);display:flex;gap:6px;align-items:flex-start}
.attention-item .next-action .icon{width:14px;height:14px;margin-top:3px;color:var(--success-icon)}
.attention-meta{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-secondary);align-items:flex-start}
.attention-meta .due{font-variant-numeric:tabular-nums}
.attention-item .actions{margin-top:10px}

/* Registers — desktop table and phone cards show the same matching records. */
.register-wrap{overflow-x:auto;overscroll-behavior-x:contain}
.register{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.register caption{text-align:left;padding:0 20px 12px;font-size:12px;color:var(--muted)}
.register th,.register td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.register thead th{background:var(--surface);font-weight:500;font-size:12px;color:var(--text-secondary);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
.register tbody tr:last-child td{border-bottom:0}
.register tbody tr:hover{background:var(--surface-3)}
.register tbody tr.is-selected{background:var(--success-tint);box-shadow:inset 3px 0 0 var(--green)}
.register td.numeric,.register th.numeric{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.register .record-link{font-weight:500;color:var(--link);background:transparent;border:0;padding:0;min-height:28px;text-align:left;justify-content:flex-start}
.register .record-link:hover{background:transparent;text-decoration:underline}
.register .sub{display:block;font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.register .unknown{color:var(--muted);font-style:normal}
.register-cards{list-style:none;margin:0;padding:0;display:none}
.register-card{border-bottom:1px solid var(--line-soft);padding:16px 20px}
.register-card:last-child{border-bottom:0}
.register-card h3{margin:0 0 6px;font-size:14px}
.register-card .detail-list{grid-template-columns:118px minmax(0,1fr);font-size:12px;margin-top:10px}
.register-card.is-selected{background:var(--success-tint);box-shadow:inset 3px 0 0 var(--green)}
.group-heading{padding:14px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-3);border-bottom:1px solid var(--line-soft)}

/* Filters, search and active-filter chips */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:190px}
.search .icon{position:absolute;left:11px;top:12px;width:16px;color:var(--muted)}
.search input{padding-left:35px;min-height:40px}
.toolbar .choice-wrap{width:186px}
.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-3)}
.filter-grid .field{margin-bottom:0}
.date-range{display:flex;align-items:center;gap:8px;min-width:0}
/* Date inputs keep an intrinsic minimum width, so they must be told to shrink. */
.date-range input{min-height:44px;flex:1 1 0;min-width:0;width:auto}
.chip-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:20px;background:var(--surface);font-size:12px}
.chip .chip-remove{border:0;background:transparent;width:22px;min-height:22px;padding:0;border-radius:50%;color:var(--muted)}
.chip .chip-remove:hover{background:var(--surface-hover);color:var(--navy)}
.chip .icon{width:12px;height:12px}
.results-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-secondary)}
.results-bar strong{font-weight:500;color:var(--navy)}

/* Source authority, freshness and completeness strip */
.source-strip{display:flex;flex-wrap:wrap;gap:10px 22px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-3);font-size:12px;color:var(--text-secondary);border-radius:0 0 7px 7px}
.source-strip div{min-width:0}
.source-strip dt{font-size:11px;color:var(--muted)}
.source-strip dd{margin:0;overflow-wrap:anywhere}
.source-banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--warning-border);background:var(--warning-surface);color:var(--warning);border-radius:6px;font-size:13px;margin-bottom:18px}
.source-banner.danger{border-color:var(--danger-border);background:var(--danger-surface);color:var(--danger)}
.source-banner.neutral{border-color:var(--line);background:var(--surface);color:var(--text-secondary)}
.source-banner .icon{margin-top:2px}
.source-banner p{margin:0 0 6px}
.source-banner .actions{margin-top:8px}

/* Order snapshot — lines and separated quantities */
.lines-table{width:100%;border-collapse:collapse;font-size:12px}
.lines-table th,.lines-table td{padding:9px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-soft)}
.lines-table thead th{background:var(--surface);font-weight:500;color:var(--text-secondary);white-space:nowrap}
.lines-table td.numeric,.lines-table th.numeric{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lines-table tbody tr:last-child td{border-bottom:0}
.quantity-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:14px 0}
.quantity-cell{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-3);min-width:0}
.quantity-cell dt{font-size:11px;color:var(--muted);margin-bottom:4px}
.quantity-cell dd{margin:0;font-size:16px;font-variant-numeric:tabular-nums}
.quantity-cell dd.unknown{font-size:12px;color:var(--muted)}
.money-block{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.money-cell{border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff}
.money-cell dt{font-size:11px;color:var(--muted);margin-bottom:4px}
.money-cell dd{margin:0;font-size:15px;font-variant-numeric:tabular-nums}
.no-total-note{font-size:12px;color:var(--muted);margin-top:8px}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0}
.timeline-item{position:relative;border-left:2px solid var(--line);padding:0 0 20px 16px;margin-left:8px;font-size:13px}
.timeline-item:before{content:'';position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--control-border)}
.timeline-item:last-child{padding-bottom:4px}
.timeline-item h3{margin:0 0 3px;font-size:13px;font-weight:500}
.timeline-item .when{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.timeline-item p{margin:6px 0 0;font-size:12px;color:var(--text-secondary)}
.timeline-item .actions{margin-top:8px}

/* Relationship and linked-record chips */
.link-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.link-chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;font-weight:400;color:var(--navy)}
.link-chip:hover{background:var(--surface-hover);border-color:var(--control-border)}
.link-chip .icon{width:14px;height:14px;color:var(--text-secondary)}
.related-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-3);border-radius:0 0 7px 7px}
.related-row .label{font-size:12px;color:var(--muted)}

/* Dialogs: docked snapshots, focused forms and explicit decisions */
dialog{color:var(--navy);background:#fff;border:1px solid var(--line);padding:0;box-shadow:var(--shadow);max-height:100dvh}

.dialog-shell{height:100%;display:flex;flex-direction:column}
.dialog-header{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex:none}
.dialog-header h2{font-size:20px;margin:0 0 5px;overflow-wrap:anywhere}
.dialog-title{outline:none}
.dialog-subtitle{line-height:1.6;overflow-wrap:anywhere}
.dialog-body{padding:20px;overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}

.dialog-body h3:first-child{margin-top:0}
.dialog-footer{padding:15px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;background:#fff;min-height:74px}

.dialog-footer .small{line-height:1.4}
.decision .dialog-body{max-height:65dvh}
.source-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:15px}
.boundary-note{border:1px solid var(--info-border);background:var(--info-surface);color:var(--info);border-radius:6px;padding:12px 14px;font-size:12px;margin-top:14px}

.restricted .icon{color:var(--muted);margin-top:2px}
.demo-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:7px}

function ordersForOrg(orgId){

 return orders.filter(o=>o.org===orgId&&codes.includes(o.account));

/* Outstanding supply is expressed per line and only where both measures are known.
   An unknown shipped quantity leaves the outstanding quantity unknown. */
function lineOutstanding(line){
 if(line.ordered===null||line.shipped===null) return null;
 const cancelled=line.cancelled===null?0:line.cancelled;
 return Math.max(0,line.ordered-line.shipped-cancelled);
}
function orderFulfilment(order){
 let known=0,unknown=0,outstandingLines=0;
 for(const line of order.lines){
  const out=lineOutstanding(line);
  if(out===null){unknown++;continue;}
  known++;
  if(out>0) outstandingLines++;
 }
 return {lines:order.lines.length,known,unknown,outstandingLines,
  complete:unknown===0&&outstandingLines===0,
  determinable:unknown===0};
}

/* Amounts are only ever summed inside one currency, and only across records that
   share a defined measure. Mixed currencies return a not-comparable result. */
function totalByCurrency(records,field){
 const map=new Map();
 let unknown=0;
 for(const r of records){
  const value=r[field];
  if(value===null||value===undefined){unknown++;continue;}
  map.set(r.currency,(map.get(r.currency)||0)+value);
 }
 return {byCurrency:[...map.entries()].map(([currency,amount])=>({currency,amount})),unknown};
}

/* A count is only meaningful with its scope. Every summary states what it counted. */
function describeScope(parts){return parts.filter(Boolean).join(' · ');}

function observationFor(id){return byId(observations,id);}
function observationState(obs,nowIso){
 if(!obs) return {tone:'neutral',label:'Source not recorded',stale:false};

 if(obs.outcome==='Incomplete') return {tone:'warning',label:'Extraction incomplete',stale:false};
 if(obs.outcome==='NoRecords') return {tone:'neutral',label:'No records returned',stale:false};
 const age=hoursSince(obs.observedAt,nowIso||(TODAY+'T06:30'));
 if(age!==null&&age>24) return {tone:'warning',label:'Observation older than 24 hours',stale:true};
 return {tone:'success',label:'Observed',stale:false};
}

/* An account balance is shown only when the extraction was complete and the source
   supplied one. It is never derived by adding the rows that happen to be visible. */
function accountBalance(accountId){
 const account=byId(erpAccounts,accountId);
 const obs=observations.find(o=>o.feed==='Customer account'&&o.account===accountId);
 if(!obs) return {state:'Unavailable',reason:'No account observation is recorded for this account.',amount:null,currency:account?account.currency:null};
 if(obs.outcome==='Failed') return {state:'Unavailable',reason:'The last refresh failed. Last-good rows are retained with their own as-at time.',amount:null,currency:account.currency};
 if(obs.outcome==='Incomplete') return {state:'Unavailable',reason:obs.error,amount:null,currency:account.currency};
 if(obs.outcome==='NoRecords') return {state:'NoRecords',reason:'The source returned no open transactions for this account. That is a result, not a failure.',amount:null,currency:account.currency};
 return {state:'Unavailable',reason:'No source-supplied account balance is present in this synthetic feed, and no balance is derived from visible rows.',amount:null,currency:account.currency};
}

function searchText(record){
 return Object.values(record).filter(v=>typeof v==='string').join(' ').toLowerCase();
}

});

</script><script id="workspace-code">/* CS-01 Customer 360 — standalone interactive design.
   Coordinated view over related records. Every originating module keeps its own

(() => {
'use strict';

const M=window.Customer360Model;
const ICONS=JSON.parse(document.getElementById('workspace-icons').textContent);
const STORAGE_KEY='ppo-customer-360-r01';
const STORAGE_VERSION=1;

/* ------------------------------------------------------------- utilities */

const esc=value=>String(value===null||value===undefined?'':value)
 .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name]||ICONS.info}</svg>`;
const q=selector=>document.querySelector(selector);
const unknown=label=>`<span class="unknown">${esc(label||'Not supplied')}</span>`;
const date=iso=>M.formatDate(iso)||'Not supplied';
const dateTime=iso=>M.formatDateTime(iso)||'Not supplied';
const money=(amount,currency)=>M.money(amount,currency)||'Not supplied';

/* ------------------------------------------------------------- app state */

const VIEWS=[
 {id:'overview',label:'Overview',icon:'overview'},
 {id:'deals',label:'Deals & quotations',icon:'estimate',commercial:true},
 {id:'orders',label:'Sales orders',icon:'sales',commercial:true},
 {id:'cases',label:'Cases & service',icon:'service'},
 {id:'projects',label:'Projects',icon:'projects',commercial:true},
 {id:'sites',label:'Sites & equipment',icon:'sites'},
 {id:'accounts',label:'Accounts',icon:'finance',commercial:true,finance:true},
 {id:'activity',label:'Activity & documents',icon:'documents'}
];

const EMPTY_FILTERS={site:'',area:'',equipment:'',status:'',from:'',to:'',owner:'',company:'',account:''};

const state={
 org:M.ORG.willowbank,
 role:'coordinator',
 view:'overview',
 filters:{...EMPTY_FILTERS},
 search:'',
 selected:null,
 returnStack:[],
 notes:{},
 storage:'unknown',
 refreshAttempts:0
};

const role=()=>M.byId(M.roles,state.role);
const org=()=>M.byId(M.organisations,state.org);
const canFinance=()=>role().finance===true;
const canPrivate=()=>role().privateNotes===true;
const operationalOnly=()=>role().operationalOnly===true;
const availableViews=()=>VIEWS.filter(v=>{
 if(operationalOnly()&&v.commercial) return false;
 if(v.finance&&!canFinance()) return v.id==='accounts'&&!operationalOnly();
 return true;
});

/* ------------------------------------------------------- local persistence */

/* Only two things are ever saved: an internal follow-up note and nothing else.
   Browser storage belongs to one browser on one device. It is not a server record,
   it is not shared, and it can be absent or refused entirely. */
function readStorage(){
 let raw=null;
 try{raw=window.localStorage.getItem(STORAGE_KEY);}
 catch{state.storage='session-only';return;}
 if(raw===null){state.storage='ok';return;}
 let parsed=null;
 try{parsed=JSON.parse(raw);}catch{state.storage='invalid';return;}
 if(!parsed||typeof parsed!=='object'||parsed.version!==STORAGE_VERSION||typeof parsed.notes!=='object'||parsed.notes===null){
  state.storage='invalid';return;
 }
 const notes={};
 for(const [key,list] of Object.entries(parsed.notes)){
  if(!Array.isArray(list)) {state.storage='invalid';return;}
  notes[key]=list.filter(n=>n&&typeof n.text==='string'&&typeof n.at==='string').map(n=>({id:String(n.id||''),text:String(n.text),author:String(n.author||''),at:String(n.at)}));
 }
 state.notes=notes;
 state.storage='ok';
}
function writeStorage(){
 if(state.storage==='invalid') return {saved:false,reason:'retained'};
 try{
  window.localStorage.setItem(STORAGE_KEY,JSON.stringify({version:STORAGE_VERSION,notes:state.notes}));
  state.storage='ok';
  return {saved:true};
 }catch{
  state.storage='session-only';
  return {saved:false,reason:'storage'};
 }
}

function storageNotice(){
 const element=q('#storage-notice');
 if(state.storage==='invalid'){
  element.hidden=false;
  element.innerHTML=`<strong>Retained notes could not be validated.</strong> The existing stored bytes have been left untouched and are not being overwritten. Notes added now stay in this tab only.`;
  return;
 }
 if(state.storage==='session-only'){
  element.hidden=false;
  element.innerHTML=`<strong>Browser storage is unavailable in this session.</strong> Notes you add are kept in this tab and may not survive a reload. Nothing is sent anywhere.`;
  return;
 }
 element.hidden=true;
 element.innerHTML='';
}

/* --------------------------------------------------------- record scoping */

function siteOf(kind,id){
 switch(kind){
  case 'order':{const o=M.byId(M.orders,id);return o?o.deliverySite:null;}
  case 'quotation':{const quote=M.byId(M.quotations,id);const opp=quote&&quote.opportunity?M.byId(M.opportunities,quote.opportunity):null;return opp?opp.site:null;}
  case 'opportunity':{const opp=M.byId(M.opportunities,id);return opp?opp.site:null;}
  case 'case':{const c=M.byId(M.cases,id);return c?c.site:null;}
  case 'project':{const p=M.byId(M.projects,id);return p?p.site:null;}
  case 'agreement':{const a=M.byId(M.agreements,id);return a?a.site:null;}
  case 'warranty':{const w=M.byId(M.warrantyCases,id);return w?w.site:null;}
  case 'finance':return null;
  case 'mapping':return null;
  default:return null;
 }
}
function areasOf(kind,id){
 switch(kind){
  case 'order':{const o=M.byId(M.orders,id);return o?o.deliveryAreas:[];}
  case 'quotation':{const quote=M.byId(M.quotations,id);const opp=quote&&quote.opportunity?M.byId(M.opportunities,quote.opportunity):null;return opp?opp.areas:[];}
  case 'opportunity':{const opp=M.byId(M.opportunities,id);return opp?opp.areas:[];}
  case 'case':{const c=M.byId(M.cases,id);return c?c.areas:[];}
  case 'project':{const p=M.byId(M.projects,id);return p?p.areas:[];}
  default:return [];
 }
}
function equipmentOf(kind,id){
 if(kind==='case'){const c=M.byId(M.cases,id);return c&&c.asset?[c.asset]:[];}
 if(kind==='warranty'){const w=M.byId(M.warrantyCases,id);return w&&w.asset?[w.asset]:[];}
 return [];
}

const orgSites=()=>M.sites.filter(s=>s.org===state.org);
const orgAreas=()=>M.areas.filter(a=>orgSites().some(s=>s.id===a.site));
const orgAssets=()=>M.assets.filter(a=>a.org===state.org);
const orgAccounts=()=>M.accountsForOrg(state.org);
const orgCompanies=()=>M.erpCompanies.filter(c=>orgAccounts().some(a=>a.company===c.id));

/* A filter only applies where an explicit relationship exists. A record with no
   relationship of that kind is reported as unassigned rather than silently dropped. */
function matchesLocation(kind,id){
 const {site,area,equipment}=state.filters;
 if(site){
  const recordSite=siteOf(kind,id);
  if(recordSite!==site) return false;
 }
 if(area){
  const list=areasOf(kind,id);
  if(!list||!list.includes(area)) return false;
 }
 if(equipment){
  const list=equipmentOf(kind,id);
  if(!list||!list.includes(equipment)) return false;
 }
 return true;
}
function unassignedFor(kind,id){
 if(!state.filters.site) return false;
 return siteOf(kind,id)===null;
}
/* A site filter can only apply where a site relationship exists. Records that hold no
   such relationship are excluded by it, and that exclusion is stated rather than silent. */
function unassignedNote(kind,records){
 if(!state.filters.site) return '';
 const count=records.filter(record=>unassignedFor(kind,record.id)).length;
 if(!count) return '';
 return `${count} record(s) hold no site relationship and are excluded by the site filter rather than assumed into it.`;
}
function matchesDate(iso){
 const {from,to}=state.filters;
 if(!iso) return !from&&!to;
 const day=iso.slice(0,10);
 if(from&&day<from) return false;
 if(to&&day>to) return false;
 return true;
}
function matchesSearch(haystack){
 if(!state.search.trim()) return true;
 return haystack.toLowerCase().includes(state.search.trim().toLowerCase());
}

/* -------------------------------------------------------- record selectors */

function visibleFollowUps(){
 return M.followUps.filter(f=>f.org===state.org)
  .filter(f=>!(f.finance&&!canFinance()))
  .filter(f=>!(operationalOnly()&&['quotation','order','finance','mapping','project'].includes(f.recordKind)))
  .filter(f=>matchesLocation(f.recordKind,f.record))
  .sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
}
function visibleQuotations(){
 return M.quotations.filter(quote=>quote.org===state.org)
  .filter(quote=>matchesLocation('quotation',quote.id))
  .filter(quote=>!state.filters.status||quote.state===state.filters.status)
  .filter(quote=>!state.filters.owner||quote.owner===state.filters.owner)
  .filter(quote=>matchesDate(quote.issued))
  .filter(quote=>matchesSearch([quote.displayRef||quote.id,quote.revision,quote.state,quote.owner,quote.customerResponse].join(' ')));
}
function visibleOpportunities(){
 return M.opportunities.filter(opp=>opp.org===state.org)
  .filter(opp=>matchesLocation('opportunity',opp.id))
  .filter(opp=>!state.filters.owner||opp.owner===state.filters.owner)
  .filter(opp=>matchesDate(opp.opened))
  .filter(opp=>matchesSearch([opp.id,opp.title,opp.stage,opp.owner].join(' ')));
}
function visibleOrders(){
 const accounts=orgAccounts().map(a=>a.id);
 return M.orders.filter(order=>order.org===state.org&&accounts.includes(order.account))
  .filter(order=>matchesLocation('order',order.id))
  .filter(order=>!state.filters.status||order.sourceStatus===state.filters.status)
  .filter(order=>!state.filters.company||order.company===state.filters.company)
  .filter(order=>!state.filters.account||order.account===state.filters.account)
  .filter(order=>matchesDate(order.orderDate))
  .filter(order=>matchesSearch([order.id,order.customerPo,order.sourceStatus,order.orderType,
   ...order.lines.map(line=>`${line.description} ${line.product||''}`)].join(' ')));
}
function visibleUnresolvedOrders(){
 return M.unresolvedOrders()
  .filter(order=>!state.filters.company||order.company===state.filters.company)
  .filter(order=>matchesDate(order.orderDate))
  .filter(order=>matchesSearch([order.id,order.customerPo,order.sourceStatus].join(' ')));
}
function visibleCases(){
 return M.cases.filter(item=>item.org===state.org)
  .filter(item=>matchesLocation('case',item.id))
  .filter(item=>!state.filters.status||item.state===state.filters.status)
  .filter(item=>!state.filters.owner||item.owner===state.filters.owner)
  .filter(item=>matchesDate(item.raised))
  .filter(item=>matchesSearch([item.id,item.title,item.state,item.owner,item.reportedSymptom,item.verifiedFinding||''].join(' ')));
}
function visibleProjects(){
 return M.projects.filter(project=>project.org===state.org)
  .filter(project=>matchesLocation('project',project.id))
  .filter(project=>!state.filters.status||project.state===state.filters.status)
  .filter(project=>!state.filters.owner||project.owner===state.filters.owner)
  .filter(project=>matchesDate(project.started))
  .filter(project=>matchesSearch([project.id,project.title,project.state,project.owner,project.nextMilestone].join(' ')));
}
function visibleFinance(){
 if(!canFinance()) return [];
 const accounts=orgAccounts().map(a=>a.id);
 return M.financeRecords.filter(record=>record.org===state.org&&accounts.includes(record.account))
  .filter(record=>!state.filters.company||record.company===state.filters.company)
  .filter(record=>!state.filters.account||record.account===state.filters.account)
  .filter(record=>!state.filters.status||record.sourceStatus===state.filters.status)
  .filter(record=>matchesDate(record.date))
  .filter(record=>matchesSearch([record.id,record.type,record.sourceStatus,record.order||''].join(' ')));
}
function visibleActivities(){
 return M.activities.filter(entry=>entry.org===state.org)
  .filter(entry=>canPrivate()||!entry.private)
  .filter(entry=>!(operationalOnly()&&['Quotation','Opportunity'].some(word=>(entry.recordLabel||'').includes(word))))
  .filter(entry=>!state.filters.site||entry.site===state.filters.site)
  .filter(entry=>!state.filters.status||entry.kind===state.filters.status)
  .filter(entry=>!state.filters.owner||entry.author===state.filters.owner)
  .filter(entry=>matchesDate(entry.when))
  .filter(entry=>matchesSearch([entry.subject,entry.kind,entry.author,entry.summary,entry.recordLabel||''].join(' ')))
  .sort((a,b)=>a.when<b.when?1:-1);
}

function pill(tone,label,iconName){
 return `<span class="pill ${tone}">${iconName?icon(iconName):''}${esc(label)}</span>`;
}
function statePill(value){
 const map={
  'Open':'info','Completed':'success','Cancelled':'neutral','Accepted':'success','Sent':'info','Issued':'info',
  'Declined':'neutral','Superseded':'neutral','Draft':'neutral','Reviewed':'info','Won':'success','Quoted':'info',
  'Qualified':'neutral','New':'warning','In progress':'info','Resolved':'success','Active':'success',
  'In delivery':'info','Scheduled':'info','Unapplied':'warning','Held':'warning','Disputed':'danger','Closed':'neutral'
 };
 return pill(map[value]||'neutral',value);
}

function sourceStrip(observation){
 if(!observation) return '';
 const tone=M.observationState(observation);
 const completeness=observation.outcome==='Complete'
  ? `Complete — ${observation.pagesReturned} of ${observation.pagesDeclared} declared page(s), ${observation.rows} row(s)`
  : observation.outcome==='Incomplete'
   ? `Incomplete — ${observation.pagesReturned} of ${observation.pagesDeclared} declared page(s) returned`
   : observation.outcome==='NoRecords'
    ? 'Complete — the source returned no records for this scope'
    : 'Failed — no rows were returned by the last attempt';
 return `<dl class="source-strip">
  <div><dt>Source authority</dt><dd>${esc(M.erpConnection.provider)} · ${esc(M.erpConnection.mode)}</dd></div>
  <div><dt>Company / entity</dt><dd>${esc((M.byId(M.erpCompanies,observation.company)||{}).name||'Not supplied')}</dd></div>
  <div><dt>Scope</dt><dd>${esc(observation.scope)}</dd></div>
  <div><dt>Source as at</dt><dd>${esc(dateTime(observation.sourceAsAt))}</dd></div>
  <div><dt>Last successful observation</dt><dd>${esc(dateTime(observation.observedAt))}</dd></div>
  <div><dt>Completeness</dt><dd>${esc(completeness)} ${pill(tone.tone,tone.label)}</dd></div>
 </dl>`;
}

function filterBar(view){

 };
 const dates=applicable.includes('dates')?`<div class="field">

    <span class="small muted">to</span>
    <input type="date" id="filter-to" data-filter-key="to" value="${esc(state.filters.to)}" aria-label="Date range to">
   </div>
   <span class="hint">${esc(dateFieldFor(view))}</span>
  </div>`:'';

 return `<div class="filter-grid">
  ${field('site','Site',[{value:'',label:'All sites'},...orgSites().map(s=>({value:s.id,label:s.name}))],'Applies only where an explicit site relationship exists.')}

  ${field('equipment','Equipment',[{value:'',label:'All equipment'},...orgAssets().map(a=>({value:a.id,label:`${a.ref} · ${a.name}`}))])}
  ${field('status',statusLabelFor(view),[{value:'',label:'All'},...statusOptionsFor(view).map(s=>({value:s,label:s}))],'Source-reported values are shown as the source reports them.')}
  ${field('owner','Owner',[{value:'',label:'All owners'},...ownerOptionsFor(view).map(o=>({value:o,label:o}))])}
  ${field('company','ERP company / entity',[{value:'',label:'All companies'},...orgCompanies().map(c=>({value:c.id,label:c.name}))])}
  ${field('account','ERP account',[{value:'',label:'All mapped accounts'},...orgAccounts().map(a=>({value:a.id,label:`${a.code} · ${(M.byId(M.erpCompanies,a.company)||{}).currency}`}))])}
  ${dates}
 </div>`;
}
function filtersFor(view){
 switch(view){
  case 'deals':return ['site','area','status','owner','dates'];
  case 'orders':return ['site','area','status','company','account','dates'];
  case 'cases':return ['site','area','equipment','status','owner','dates'];
  case 'projects':return ['site','area','status','owner','dates'];
  case 'sites':return ['site','area','equipment'];
  case 'accounts':return ['status','company','account','dates'];
  case 'activity':return ['site','status','owner','dates'];
  default:return ['site'];
 }
}
function dateFieldFor(view){
 return {deals:'Filters on the quotation issue date.',orders:'Filters on the source order date.',
  cases:'Filters on the date the case was raised.',projects:'Filters on the project start date.',
  accounts:'Filters on the source transaction date.',activity:'Filters on the event date.'}[view]||'';
}
function statusLabelFor(view){
 return {orders:'Source-reported order status',deals:'Quotation state',cases:'Case state',
  projects:'Project state',accounts:'Source transaction status',activity:'Entry type'}[view]||'Status';
}
function statusOptionsFor(view){
 const unique=list=>[...new Set(list)].sort();
 switch(view){
  case 'deals':return unique(M.quotations.filter(x=>x.org===state.org).map(x=>x.state));
  case 'orders':return unique(M.orders.filter(x=>x.org===state.org).map(x=>x.sourceStatus));
  case 'cases':return unique(M.cases.filter(x=>x.org===state.org).map(x=>x.state));
  case 'projects':return unique(M.projects.filter(x=>x.org===state.org).map(x=>x.state));
  case 'accounts':return unique(M.financeRecords.filter(x=>x.org===state.org).map(x=>x.sourceStatus));
  case 'activity':return unique(M.activities.filter(x=>x.org===state.org).map(x=>x.kind));
  default:return [];
 }
}
function ownerOptionsFor(view){
 const unique=list=>[...new Set(list)].sort();
 switch(view){
  case 'deals':return unique(M.quotations.filter(x=>x.org===state.org).map(x=>x.owner));
  case 'cases':return unique(M.cases.filter(x=>x.org===state.org).map(x=>x.owner));
  case 'projects':return unique(M.projects.filter(x=>x.org===state.org).map(x=>x.owner));
  case 'activity':return unique(M.activities.filter(x=>x.org===state.org).map(x=>x.author));
  default:return [];
 }
}

  <div class="card-head"><div><h2>Accepted quotations that are not orders</h2>
   <p class="small muted" style="margin:4px 0 0">An accepted quotation awaiting conversion is not an existing ERP order. An unknown conversion outcome stays unresolved until it is reconciled.</p></div></div>
  <div class="pad">

function openSnapshot(kind,id){
 const dialog=q('#detail');
 const built=buildSnapshot(kind,id);
 if(!built) return;
 state.selected={kind,id};
 q('#detail-title').textContent=built.title;
 q('#detail-subtitle').textContent=built.subtitle;
 dialog.querySelector('.dialog-body').innerHTML=built.body;
 dialog.querySelector('.dialog-footer').innerHTML=`
  <span class="small muted">Snapshot of one record. Its owning module keeps the workflow and decisions.</span>
  <div class="actions">
   <button type="button" data-action="open-full" data-kind="${esc(kind)}" data-id="${esc(id)}">Open full record</button>
   <button type="button" class="primary" data-action="close-dialog">Close</button>
  </div>`;
 if(!dialog.open) dialog.show();
 dialog.setAttribute('aria-modal','false');
 if(window.PPOChoices) window.PPOChoices.sync();
 q('#detail-title').focus({preventScroll:true});
 render(false);
}

function buildSnapshot(kind,id){
 switch(kind){
  case 'order':return orderSnapshot(id);
  case 'quotation':return quotationSnapshot(id);
  case 'opportunity':return opportunitySnapshot(id);
  case 'case':return caseSnapshot(id);
  case 'project':return projectSnapshot(id);
  case 'finance':return financeSnapshot(id);
  case 'activity':return activitySnapshot(id);
  case 'mapping':return mappingSnapshot(id);
  case 'warranty':return warrantySnapshot(id);
  case 'agreement':return agreementSnapshot(id);
  default:return null;
 }
}

function orderSnapshot(id){
 const order=M.byId(M.orders,id);
 if(!order) return null;
 const observation=M.observationFor(order.observation);
 const tone=M.observationState(observation);
 const account=M.byId(M.erpAccounts,order.account);
 const fulfilment=M.orderFulfilment(order);
 const totals=order.lines.reduce((acc,line)=>{
  for(const key of ['ordered','allocated','shipped','delivered','cancelled','returned','invoiced']){
   if(line[key]===null) acc.unknown[key]=true; else acc.sum[key]=(acc.sum[key]||0)+line[key];
  }
  return acc;
 },{sum:{},unknown:{}});
 const quantityCell=(label,key)=>`<div class="quantity-cell"><dt>${esc(label)}</dt>
  <dd class="${totals.unknown[key]?'unknown':''}">${totals.unknown[key]?'Not supplied':esc(String(totals.sum[key]||0))}</dd></div>`;

 return {
  title:order.id,
  subtitle:`${order.orderType} · ${account?account.code:'Unmapped account'} · ${(M.byId(M.erpCompanies,order.company)||{}).name||''}`,
  body:`
  ${order.stale?`<div class="source-banner danger">${icon('alert')}<div>
    <p><strong>This order detail is stale.</strong> The last successful observation was ${esc(dateTime(observation.observedAt))}. The refresh on ${esc(dateTime(observation.requestedAt))} failed.</p>
    <p>${esc(observation.error)}</p>

    <p>It is not attributed to a customer and is excluded from every count and total.</p></div></div>`:''}
  ${order.hold?`<div class="source-banner">${icon('alert')}<div><p><strong>Source-reported hold.</strong> ${esc(order.hold)}</p>

function saveNote(recordId){
 const textField=q('#note-text'),authorField=q('#note-author'),errors=q('#form-errors');
 const text=(textField.value||'').trim();
 if(!text){
  errors.hidden=false;
  errors.textContent='Enter the note text before saving. Nothing has been changed.';
  textField.setAttribute('aria-invalid','true');
  textField.focus();
  return;
 }
 textField.setAttribute('aria-invalid','false');
 const list=state.notes[recordId]||[];
 list.unshift({id:'N'+Date.now(),text,author:(authorField.value||'').trim()||'Not recorded',at:M.TODAY+'T00:00'});
 state.notes[recordId]=list;
 const result=writeStorage();
 q('#editor').close();
 storageNotice();
 toast(result.saved
  ?'Note saved in this browser.'
  :result.reason==='retained'
   ?'Saved in this tab only. The existing stored bytes could not be validated and have been left untouched.'
   :'Saved in this tab only. Browser storage refused the write, so this note may not survive a reload.');
 if(state.selected) openSnapshot(state.selected.kind,state.selected.id); else render();
}

function toast(message){
 const element=q('#toast');
 element.textContent=message;
 element.hidden=false;
 window.clearTimeout(toast.timer);
 toast.timer=window.setTimeout(()=>{element.hidden=true;},6000);
}

function render(focusHeading){
 const views=availableViews();
 if(!views.some(view=>view.id===state.view)) state.view='overview';

 const tabs=q('#workspace-tabs');
 tabs.innerHTML=views.map(view=>{
  const selected=view.id===state.view;
  return `<button type="button" role="tab" id="tab-${view.id}" aria-controls="content" aria-selected="${selected}" tabindex="${selected?0:-1}" data-action="navigate" data-view="${view.id}">
   ${icon(view.icon)}<span>${esc(view.label)}</span></button>`;
 }).join('');
 q('#content').setAttribute('aria-labelledby','tab-'+state.view);

 const selector=q('#customer-selector');
 selector.innerHTML=M.organisations.map(o=>`<option value="${esc(o.id)}"${state.org===o.id?' selected':''}>${esc(o.name)}</option>`).join('');
 q('#organisation-name').textContent=org().name;
 q('#role-indicator').textContent=role().name+' · '+(canFinance()?'Finance visible':'Finance withheld');

 const body={overview:renderOverview,deals:renderDeals,orders:renderOrders,cases:renderCases,
  projects:renderProjects,sites:renderSites,accounts:renderAccounts,activity:renderActivity}[state.view];
 q('#content').innerHTML=body()+footerNote();

 if(window.PPOChoices) window.PPOChoices.sync();
 storageNotice();
 if(focusHeading!==false&&render.shouldFocus){
  const heading=q('#main-heading');
  if(heading) heading.focus({preventScroll:true});
  render.shouldFocus=false;
 }
}
render.shouldFocus=false;

}

document.addEventListener('click',event=>{
 const trigger=event.target.closest('[data-action]');
 if(!trigger) return;
 const action=trigger.dataset.action;

 if(action==='navigate'){
  state.view=trigger.dataset.view;
  state.returnStack=[];
  render.shouldFocus=true;
  render();
  return;
 }
 if(action==='drill'){
  state.returnStack.push({view:state.view,filters:{...state.filters},search:state.search,
   label:(VIEWS.find(v=>v.id===state.view)||{}).label||'overview'});
  let filter={};
  try{filter=JSON.parse(trigger.dataset.filter||'{}');}catch{filter={};}
  state.filters={...EMPTY_FILTERS,...filter};
  state.search='';
  state.view=trigger.dataset.view;
  render.shouldFocus=true;
  render();
  return;
 }
 if(action==='return'){
  const previous=state.returnStack.pop();
  if(previous){
   state.view=previous.view;
   state.filters={...previous.filters};
   state.search=previous.search;
  }
  render.shouldFocus=true;
  render();
  return;
 }
 if(action==='open'){openSnapshot(trigger.dataset.kind,trigger.dataset.id);return;}
 if(action==='open-full'){openBoundary(trigger.dataset.kind);return;}
 if(action==='boundary'){openBoundary(trigger.dataset.target);return;}
 if(action==='about'){openAbout();return;}
 if(action==='add-note'){openNoteEditor(trigger.dataset.id,trigger.dataset.label||'');return;}
 if(action==='save-note'){saveNote(trigger.dataset.id);return;}
 if(action==='close-dialog'){const dialog=trigger.closest('dialog');if(dialog)dialog.close();return;}
 if(action==='clear-filters'){state.filters={...EMPTY_FILTERS};state.search='';render();return;}
 if(action==='clear-search'){state.search='';render();return;}
 if(action==='remove-filter'){
  const key=trigger.dataset.key;
  state.filters={...state.filters,[key]:''};
  render();
  return;
 }
 if(action==='refresh-source'){
  state.refreshAttempts+=1;
  toast('Refresh requested. The simulated adapter returned the same failure, so the last successful observation is still what is shown. Nothing was written to the source.');
  return;
 }
});

document.addEventListener('change',event=>{
 const target=event.target;
 if(target.id==='customer-selector'){
  state.org=target.value;
  resetContext();
  render.shouldFocus=true;
  render();
  return;
 }
 if(target.id==='demo-role'){
  state.role=target.value;
  resetContext();
  render();
  openAbout();
  return;
 }
 if(target.id==='demo-customer'){
  state.org=target.value;
  resetContext();
  render();
  openAbout();
  return;
 }
 if(target.dataset&&target.dataset.filterKey){
  state.filters={...state.filters,[target.dataset.filterKey]:target.value};
  render();
 }
});

document.addEventListener('input',event=>{
 if(event.target.id==='record-search'){
  state.search=event.target.value;
  const position=event.target.selectionStart;
  render();
  const field=q('#record-search');
  if(field){field.focus({preventScroll:true});try{field.setSelectionRange(position,position);}catch{/* this input type does not support selection */}}
 }
});

/* Tabs use roving tabindex with arrow, Home and End keys. */
document.addEventListener('keydown',event=>{
 const tab=event.target.closest('[role=tab]');
 if(!tab) return;
 const tabs=[...document.querySelectorAll('[role=tab]')];
 const index=tabs.indexOf(tab);
 let next=null;
 if(event.key==='ArrowRight') next=(index+1)%tabs.length;
 if(event.key==='ArrowLeft') next=(index-1+tabs.length)%tabs.length;
 if(event.key==='Home') next=0;
 if(event.key==='End') next=tabs.length-1;
 if(next===null) return;
 event.preventDefault();
 // Activating a tab re-renders the strip, so focus is restored to the new element
 // rather than being dropped onto the document body.
 const view=tabs[next].dataset.view;
 state.view=view;
 state.returnStack=[];
 render(false);
 const restored=document.getElementById('tab-'+view);
 if(restored) restored.focus();
});

/* --------------------------------------------------------------- start-up */

readStorage();
render();

window.PPOCustomer360=Object.freeze({
 storageKey:STORAGE_KEY,
 getState:()=>state,
 setState:patch=>{Object.assign(state,patch);render();},
 resetContext,
 render
});
})();
</script></body></html>
