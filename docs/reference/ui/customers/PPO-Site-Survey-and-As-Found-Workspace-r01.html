/* Direct r18 choice-card geometry; positioning is resolved against the viewport. */
.choice-wrap{position:relative;display:inline-flex;min-width:0;max-width:100%;vertical-align:middle}
.field>.choice-wrap{display:flex;width:100%}
.choice-trigger{width:100%;max-width:100%;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;text-align:left;background:#fff;border:1px solid var(--control-border);border-radius:6px;font-weight:400;font-size:13px;line-height:20px;box-shadow:none}
.choice-trigger .choice-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.choice-trigger .icon{width:14px;height:14px;flex:none;color:#606977}
.choice-trigger:hover,.choice-trigger[aria-expanded=true]{background:#f5f6f8;border-color:#9aa7b9}
.choice-trigger:disabled{cursor:not-allowed}
.filter-grid .choice-trigger,.review-editor .choice-trigger{min-height:44px}
.filter-bottom .field>.choice-wrap{width:200px}
.results-bar .choice-wrap{width:145px}
.scenario-select .choice-wrap{width:300px}
.rounded-picker{position:fixed;z-index:100;min-width:0;width:300px;max-width:calc(100vw - 24px);max-height:360px;overflow:auto;padding:7px;background:#fff;color:#242a37;border:1px solid #dce0e5;border-radius:14px;box-shadow:0 8px 32px #242a3726,0 2px 5px #242a370d;overscroll-behavior:contain;box-sizing:border-box;scroll-padding:7px}
.picker-option{display:flex;width:100%;min-height:38px;align-items:center;gap:12px;padding:9px 11px;background:#fff;border:0;border-radius:7px;text-align:left;justify-content:space-between;font-size:13px;font-weight:400;line-height:20px;white-space:normal;box-sizing:border-box}
.picker-option .option-label{overflow-wrap:anywhere;min-width:0}
.picker-option:hover,.picker-option:focus-visible{background:#f0f2f5;color:#242a37;outline-offset:-2px}
.picker-option[aria-selected=true]{font-weight:700}
.picker-option .icon{color:#315e43;width:16px;height:16px;flex:none}
.picker-option .check-space{width:16px;height:16px;flex:none}
.picker-option[aria-disabled=true]{color:#8a919b;cursor:not-allowed}
.picker-group{font-size:10px;color:#606977;padding:9px 11px 4px;text-transform:uppercase;letter-spacing:.05em}
.picker-divider{border-top:1px solid #dce0e5;margin:7px -7px}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

const field=(id,label,value='',hint='',opts={})=>`<div class="field"><label for="${id}">${esc(label)}${opts.required?' <span aria-hidden="true">*</span>':''}</label>${opts.type==='textarea'?`<textarea id="${id}" maxlength="${opts.max||2000}" ${hint?`aria-describedby="${id}-hint"`:''}>${esc(value)}</textarea>`:`<input id="${id}" type="${opts.type||'text'}" value="${esc(value)}" maxlength="${opts.max||200}" ${hint?`aria-describedby="${id}-hint"`:''} ${opts.readonly?'readonly':''}>`}${hint?`<span class="hint" id="${id}-hint">${esc(hint)}</span>`:''}<span class="field-error" id="${id}-error"></span></div>`;
const choice=(id,label,options,value='',hint='')=>`<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" ${hint?`aria-describedby="${id}-hint"`:''}>${options.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${value===v?' selected':''}>${esc(t)}</option>`;}).join('')}</select>${hint?`<span class="hint" id="${id}-hint">${esc(hint)}</span>`:''}<span class="field-error" id="${id}-error"></span></div>`;
const formStart=()=>'<form id="record-form" novalidate><div id="form-errors" class="callout danger space-bottom" role="alert" hidden></div><p class="small space-bottom">Fields marked * are required. Record unknowns explicitly; do not infer measurements.</p>';
const editorFooter=()=>`<span class="small">Local example</span><div class="actions">${action('cancel-editor','Cancel')}${action('save-editor','Save changes','save','','primary')}</div>`;
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5000);}
function show(id,title,body,footer='',subtitle='',modeless=false){
 const el=$('#'+id),focus=document.activeElement;if(modeless)for(const other of ['inspect','assistant'])if(other!==id&&$('#'+other).open)close(other);if(id==='editor')for(const other of ['inspect','assistant'])if($('#'+other).open)close(other);
 el.querySelector('h2').textContent=title;el.querySelector('.dialog-subtitle').textContent=subtitle;el.querySelector('.dialog-body').innerHTML=body;el.querySelector('.dialog-footer').innerHTML=footer||action('close','Close');el.setAttribute('aria-modal',String(!modeless));
 if(!el.open){el._focus=focus;el._key=focus?.dataset?{action:focus.dataset.action,id:focus.dataset.id,view:focus.dataset.view}:null;modeless?el.show():el.showModal();}window.PPOChoices.sync();el.querySelector('h2').focus({preventScroll:true});
}
function close(id){const el=typeof id==='string'?$('#'+id):id;window.PPOChoices.close(false);el.close();if(el.id==='editor'){editor=null;uploadSequence++;}if(el.id==='assistant')assistant=null;const valid=x=>x?.isConnected&&!x.closest('dialog:not([open])')&&!x.closest('[hidden]'),k=el._key,fallback=k?$$('[data-action]').find(x=>valid(x)&&x.dataset.action===k.action&&x.dataset.id===k.id&&x.dataset.view===k.view):null;(valid(el._focus)?el._focus:fallback||$('[data-tab="'+view+'"]'))?.focus({preventScroll:true});}
function closeAll(){for(const el of $$('dialog[open]').reverse())close(el);}
function confirm(title,body,fn,label='Continue'){decision=fn;show('decision',title,body,action('cancel-decision','Cancel')+action('confirm-decision',label,'','','primary'));}
function guard(fn){if(editor?.dirty)confirm('Discard unsaved changes?','<p>The saved survey stays unchanged. Discard this proposal to continue?</p>',()=>{closeAll();fn();},'Discard proposal');else fn();}
function errors(values,message='Review the highlighted fields.'){
 const box=$('#form-errors');box.hidden=false;box.innerHTML=`<strong>${esc(message)}</strong><ul>${Object.entries(values).map(([id,msg])=>`<li><a href="#${esc(id)}" data-action="focus-error" data-id="${esc(id)}">${esc(document.querySelector(`label[for="${id}"]`)?.textContent||document.querySelector(`label[for="${id}-trigger"]`)?.textContent||id)}: ${esc(msg)}</a></li>`).join('')}</ul>`;
 for(const [id,msg]of Object.entries(values)){const el=document.getElementById(id);if(el){el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby',(document.getElementById(id+'-hint')?id+'-hint ':'')+id+'-error');}if(document.getElementById(id+'-error'))document.getElementById(id+'-error').textContent=msg;}window.PPOChoices.sync();box.tabIndex=-1;box.focus();
}
function clearErrors(){for(const el of $$('#record-form [aria-invalid]'))el.removeAttribute('aria-invalid');for(const el of $$('#record-form .field-error'))el.textContent='';if($('#form-errors'))$('#form-errors').hidden=true;}
function notice(){const el=$('#storage-notice');el.hidden=!stale&&!storageProblem;if(!el.hidden)el.innerHTML=`${esc(stale?'Saved data changed in another tab. Reload before editing or preparing another brief.':storageProblem)}<div class="actions">${action('export','Export current example','download')}${action('reload','Reload saved data','refresh')}${action('about','Recovery options','info')}</div>`;}
function persist(next){
 if(stale)return {error:'Reload the saved data before applying this proposal.'};if(storageProblem.startsWith('Retained data'))return {error:'Resolve the retained invalid data before saving.'};if(!M.validate(next))return {error:'The proposed data failed validation. Nothing has been saved.'};
 try{if(localStorage.getItem(KEY)!==storageRaw){stale=true;notice();return {error:'Saved data changed in another tab. Your proposal has not been applied.'};}}catch{}
 data=next;try{const raw=JSON.stringify(data);localStorage.setItem(KEY,raw);storageRaw=raw;storageProblem='';}catch{storageProblem='Browser storage is unavailable or full. Changes remain in this tab; export a backup before closing.';}render();return {ok:true,sessionOnly:!!storageProblem};
}
function commit(s,actionName,reason,fn){const result=M.change(data,s.id,s.version,actor(),actionName,reason,fn);return result.error?result:persist(result.data);}
function notifySave(result,message){if(result.error){if($('#editor').open)errors({},result.error);else toast(result.error);return false;}toast(result.sessionOnly?'Saved in this tab only. Export to retain it.':message);return true;}
function go(next,id=selected){guard(()=>{closeAll();selected=data.surveys.some(s=>s.id===id)?id:'';view=next==='register'||selected?next:'register';selectedFact='';render();history.replaceState(null,'','#'+new URLSearchParams({view,survey:selected}));$('#page-title')?.focus({preventScroll:true});});}
function pageHeading(title,description,buttons=''){return `<div class="page-heading"><div><h2 id="page-title" tabindex="-1">${esc(title)}</h2><p>${esc(description)}</p></div><div class="actions">${buttons}</div></div>`;}
function targets(s){return M.allowedTargets(s).map(id=>[id,M.label(s,id)]);}
function metric(label,value,icon){return `<div class="card metric"><div><span class="small">${esc(label)}</span><div><strong>${value}</strong></div></div><span class="glyph">${ico(icon)}</span></div>`;}
function download(name,value,type='text/plain'){const url=URL.createObjectURL(new Blob([value],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function textCopy(text,textarea){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Text copied.')).catch(()=>{textarea?.focus();textarea?.select();toast('Select and copy the highlighted text.');});else{textarea?.focus();textarea?.select();toast('Select and copy the highlighted text.');}}
function historyHTML(s){return s.history.length?s.history.slice(0,20).map(h=>`<div class="history-item"><h3>${esc(h.action)}</h3><p class="muted">${esc(h.actor)} · ${esc(new Date(h.at).toLocaleString('en-AU',{timeZone:M.site(s.site).timezone}))}</p><p>${esc(h.reason)}</p><details><summary>Exact before / after survey content</summary><pre>${esc(JSON.stringify({before:h.before,after:h.after},null,2))}</pre></details></div>`).join(''):'<p class="small">No local changes recorded.</p>';}

function renderContext(){
 const s=active();$('#survey-selector').innerHTML='<option value="">Choose a survey</option>'+data.surveys.map(x=>`<option value="${x.id}"${s?.id===x.id?' selected':''}>${esc(x.title)}</option>`).join('');
 $('#context-detail').textContent=s?`${C.organisation.name} · ${M.site(s.site).name} · ${s.ref}`:'Choose a survey from the register to open its scope and evidence.';
 $('#context-state').innerHTML=s?`${statusPill(s)}<span class="small">Revision ${String(s.edition).padStart(2,'0')} · ${esc(s.owner)} · ${role==='viewer'?'Read-only':role==='reviewer'?'Review view':'Capture view'}</span>`:'';
 const counts=s?{scope:s.facilities.length+s.assets.length,facts:s.facts.length,photos:s.photos.length,gaps:s.gaps.filter(g=>g.status==='Open').length,review:s.snapshots.filter(x=>x.kind==='Reviewed').length}:{};
 for(const b of $$('[data-tab]')){const on=b.dataset.tab===view;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;b.disabled=!s&&b.dataset.tab!=='register';const count=b.querySelector('.tab-count');if(count)count.textContent=counts[b.dataset.tab]||0;}
 window.PPOChoices.sync();
}
function render(){renderContext();const s=active();$('#content').setAttribute('aria-labelledby','tab-'+view);$('#content').innerHTML=view==='register'?registerView():s?({scope:scopeView,facts:factsView,photos:photosView,gaps:gapsView,review:reviewView}[view]||scopeView)(s):registerView();$('#content').insertAdjacentHTML('beforeend',`<div class="footer-note"><span>Synthetic workspace · ${esc(s?.ref||'Survey register')} · ${esc(dateLabel(C.asAt))}</span>${action('about','Workspace information','info','','link-button')}</div>`);window.PPOChoices.sync();notice();if(assistant&&$('#assistant-stale'))$('#assistant-stale').hidden=assistant.generation===data.generation&&!stale;}
function surveyRows(){return data.surveys.filter(s=>(!statusFilter||s.status===statusFilter)&&(!siteFilter||s.site===siteFilter)&&(!search||[s.title,s.ref,M.site(s.site).name,C.organisation.name,s.owner].join(' ').toLowerCase().includes(search.toLowerCase())));}
function registerTable(){const rows=surveyRows();return rows.length?`<div class="table-wrap"><table><thead><tr><th scope="col">Survey / customer</th><th scope="col">Site</th><th scope="col">Owner / visit</th><th scope="col">Status</th><th scope="col">Open items</th><th scope="col"><span class="sr-only">Open</span></th></tr></thead><tbody>${rows.map(s=>`<tr class="${s.id===selected?'is-selected':''}"><td class="table-title">${action('open-survey',s.title,'',`data-id="${s.id}"`,'link-button record-name')}<span class="record-ref">${esc(s.ref)} · ${esc(C.organisation.name)}</span></td><td>${esc(M.site(s.site).name)}<span class="record-ref">${s.facilities.length} facilities · ${s.assets.length} equipment</span></td><td>${esc(s.owner)}<span class="record-ref">${esc(dateLabel(s.visitDate))}</span></td><td>${statusPill(s)}<span class="record-ref">Revision ${String(s.edition).padStart(2,'0')}</span></td><td>${s.gaps.filter(g=>g.status==='Open').length}</td><td>${action('open-survey','Open','arrow',`data-id="${s.id}"`,'quiet')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${ico('search')}<h3>No matching surveys</h3><p>Try another site, status or search term.</p>${action('clear-register','Clear filters')}</div>`;}
function registerView(){return pageHeading('Survey register','Capture existing conditions, retain the source and prepare a clear design handover.',action('new-survey','New survey','plus',role==='coordinator'?'':'disabled','primary'))+`<div class="grid-three space-bottom">${metric('Surveys',data.surveys.length,'file')}${metric('Open follow-up',data.surveys.reduce((n,s)=>n+s.gaps.filter(g=>g.status==='Open').length,0),'flag')}${metric('Reviewed revisions',data.surveys.reduce((n,s)=>n+s.snapshots.filter(x=>x.kind==='Reviewed').length,0),'check')}</div><section class="card"><div class="toolbar"><label class="search">${ico('search')}<input id="survey-search" type="search" aria-label="Search surveys" placeholder="Search survey, site or owner" value="${esc(search)}"></label><select id="register-site" aria-label="Filter surveys by site"><option value="">All sites</option>${C.sites.map(s=>`<option value="${s.id}"${siteFilter===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select><select id="register-status" aria-label="Filter surveys by status"><option value="">All statuses</option>${['Draft','In review','Reviewed','Returned'].map(x=>`<option${statusFilter===x?' selected':''}>${x}</option>`).join('')}</select>${action('clear-register','Clear','close',!search&&!statusFilter&&!siteFilter?'hidden':'')}</div><div id="survey-results">${registerTable()}</div><div class="card-foot" id="register-count">${surveyRows().length} of ${data.surveys.length} surveys · each record retains its own site and revision history.</div></section>`;}
function mapLink(s){const url=new URL('https://www.google.com/maps/search/');url.searchParams.set('api','1');url.searchParams.set('query',M.site(s.site).address);return `<a class="map-link" href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">${ico('sites')}Open site address in Google Maps <span aria-hidden="true">↗</span></a>`;}
function scopeItem(s,id){const r=M.target(s,id);return `<div class="scope-item"><span class="fact-icon">${ico(M.asset(id)?'equipment':'layers')}</span><div class="body"><h3>${esc(r.name)}</h3><p>${esc(r.ref)}${r.type?' · '+esc(r.type):''}</p></div>${action('context','Inspect','info',`data-id="${id}"`,'quiet')}</div>`;}
function contextSketch(s){const pump=s.assets.map(M.asset).find(Boolean);if(!pump)return '<p class="small">No equipment is selected for this survey. Facilities remain independent location records.</p>';const served=pump.served.map(M.area);return `<svg class="relation-sketch" viewBox="0 0 620 210" role="img" aria-label="One pump installed in Irrigation Shed 01 serves Greenhouse 01, Tunnel 01 and Propagation House 01. Diagram only; not a site plan."><rect x="20" y="45" width="210" height="120" rx="7" fill="#f6f7f9" stroke="#e1e5eb"/><text x="38" y="71" font-size="11">INSTALLED IN ${esc(M.area(pump.installed).name.toUpperCase())}</text><rect x="38" y="86" width="174" height="57" rx="6" fill="white" stroke="#828e9f"/><text x="52" y="108" font-size="14">${esc(pump.name)}</text><text x="52" y="128" font-size="10">${esc(pump.ref)}</text><path d="M230 105H275M275 41V171M275 41H305M275 105H305M275 171H305" fill="none" stroke="#828e9f" stroke-width="1.5"/>${served.map((a,i)=>`<rect x="305" y="${20+i*65}" width="293" height="43" rx="6" fill="#f3f7f1" stroke="#d4e3cb"/><text x="319" y="${46+i*65}" font-size="13">${esc(a.name)}</text>`).join('')}</svg><p class="small" style="margin-top:9px">Relationship sketch · one equipment identity · no hydraulic capacity or surveyed position is inferred.</p>`;}
function scopeView(s){const site=M.site(s.site),person=C.contacts.find(c=>c.id===s.contact);return pageHeading('Survey scope','Establish the exact site, affected growing areas and purpose of this survey.',action('ai','Ask PPO','screen')+action('edit-scope','Edit scope','edit',canEdit(s)?'':'disabled','primary'))+`<div class="two-col"><div class="stack"><section class="card pad"><span class="eyebrow">Survey purpose</span><h2>${esc(s.title)}</h2><p style="margin-top:12px">${esc(s.objective)}</p><dl class="detail-list"><dt>Organisation</dt><dd>${esc(C.organisation.name)}</dd><dt>Physical site</dt><dd>${esc(site.name)}<br><span class="small">${esc(site.address)}</span></dd><dt>Visit date</dt><dd>${esc(dateLabel(s.visitDate))} · ${esc(site.timezone)}</dd><dt>Survey owner</dt><dd>${esc(s.owner)}</dd></dl></section><section class="card"><div class="card-head"><h2>Included facilities & equipment</h2><span class="small">${s.facilities.length+s.assets.length} records</span></div><div class="pad scope-list">${[...s.facilities,...s.assets].map(id=>scopeItem(s,id)).join('')||'<p class="small">No facilities selected yet.</p>'}</div></section><section class="card pad"><h2 style="margin-bottom:16px">Installation and served areas</h2>${contextSketch(s)}</section></div><aside class="support-stack"><section class="card pad space-bottom"><span class="eyebrow">Before arriving</span><h3>${esc(person.name)}</h3><p class="small" style="margin:5px 0 13px">${esc(person.role)}</p><p style="font-size:13px">${esc(s.arrival)}</p><p class="small" style="margin:12px 0">${esc(s.access)}</p>${mapLink(s)}<p class="small" style="margin-top:8px">Fictional address; map destination is not verified.</p></section><section class="card pad space-bottom"><h3>Capture status</h3><ul class="note-list"><li>${s.facts.length} observations<p>${s.facts.filter(f=>f.basis==='Measured').length} measured · ${s.facts.filter(f=>['Unknown','Assumption'].includes(f.basis)).length} unknown / assumed</p></li><li>${s.photos.length} photos<p>Original uploads retain their target and source.</p></li><li>${s.gaps.filter(g=>g.status==='Open').length} open follow-up items<p>Each has an owner and next action.</p></li></ul></section><section class="callout">Survey facts support a design brief. They do not update shared facility dimensions, certify capacity or authorise access.</section></aside></div>`;}
function factsFiltered(s){return s.facts.filter(f=>(!basisFilter||f.basis===basisFilter)&&(!factSearch||[f.title,f.detail,M.label(s,f.target)].join(' ').toLowerCase().includes(factSearch.toLowerCase())));}
function factRows(s){const rows=factsFiltered(s);return rows.length?`<ul class="fact-list">${rows.map(f=>`<li class="fact-row" data-fact-row="${f.id}"><span class="fact-icon">${ico(f.basis==='Measured'?'grid':f.basis==='Unknown'?'flag':'file')}</span><div class="fact-copy"><h3>${action('fact',f.title,'',`data-id="${f.id}"`,'link-button')}</h3><p>${esc(M.target(s,f.target).name)} · ${esc(f.category)}</p><p>${esc(f.detail)}</p><div class="fact-kind">${pill(f.basis,f.basis==='Unknown'||f.basis==='Assumption'?'warning':f.basis==='Measured'?'success':'neutral')}<span class="small"> ${esc(f.author)} · ${esc(dateLabel(f.observedAt))}</span></div></div><div class="fact-value">${f.basis==='Measured'?`<strong>${esc(f.value)} <span class="small">${esc(f.unit)}</span></strong>`:f.basis==='Unknown'?'<span class="small">Not recorded</span>':''}${action('fact','Inspect','chevron',`data-id="${f.id}"`,'quiet')}</div></li>`).join('')}</ul>`:`<div class="empty">${ico('search')}<h3>No observations in this view</h3><p>Clear the filters or capture another observation.</p>${action('clear-facts','Clear filters')}</div>`;}
function factsView(s){return pageHeading('Measurements & observations','Keep measured values, direct observations, customer statements and assumptions distinct.',action('ai','Ask PPO','screen')+action('new-fact','Add observation','plus',canEdit(s)?'':'disabled','primary'))+`<div class="two-col"><section class="card"><div class="toolbar"><label class="search">${ico('search')}<input id="fact-search" type="search" aria-label="Search observations" placeholder="Search observation or location" value="${esc(factSearch)}"></label><select id="fact-basis" aria-label="Filter observation basis"><option value="">All source bases</option>${M.bases.map(x=>`<option${basisFilter===x?' selected':''}>${x}</option>`).join('')}</select>${action('clear-facts','Clear','close',!factSearch&&!basisFilter?'hidden':'')}</div><div id="fact-results">${factRows(s)}</div><div class="card-foot" id="fact-count">${factsFiltered(s).length} of ${s.facts.length} observations · values and units are retained as recorded.</div></section><aside class="support-stack"><section class="card pad space-bottom"><h3>Capture the basis</h3><ul class="note-list"><li>Measured<p>Value, unit, method and dated source.</p></li><li>Observed / customer statement<p>Describe what was seen or who provided the information.</p></li><li>Assumption / unknown<p>Keep uncertainty visible and assign follow-up before review.</p></li></ul></section><section class="callout">Later corrections retain earlier survey content. Shared site and equipment records are unchanged.</section></aside></div>`;}
function photosView(s){return pageHeading('Photos & evidence','Link the original image to the exact facility or asset, with a caption and capture source.',action('new-photo','Add photo','plus',canEdit(s)?'':'disabled','primary'))+`<div class="two-col"><div>${s.photos.length?`<div class="photo-grid">${s.photos.map(p=>`<article class="photo-card"><button class="photo-open" data-action="photo" data-id="${p.id}" aria-label="Inspect ${esc(p.caption)}"><img src="${p.data}" alt="${esc(p.caption)}"></button><div class="photo-caption"><h3>${esc(p.caption)}</h3><p>${esc(M.target(s,p.target).name)}</p><p>${esc(dateLabel(p.capturedAt))} · ${esc(p.author)}</p><span class="record-ref">${esc(p.filename)}</span></div></article>`).join('')}</div>`:`<section class="card empty">${ico('file')}<h3>No survey photos captured yet</h3><p>Add a photo of the pump nameplate, accessible pipe markings or the affected growing area. The demonstration does not invent photographic evidence.</p>${action('new-photo','Add first photo','plus',canEdit(s)?'':'disabled','primary')}</section>`}</div><aside class="support-stack"><section class="card pad space-bottom"><h3>Suggested capture</h3><ul class="note-list"><li>Pump identification<p>Asset reference and visible nameplate.</p></li><li>Irrigation connections<p>Accessible markings, routing and connection context.</p></li><li>Access and growing areas<p>Relevant entrance, structure and work location.</p></li></ul></section><section class="callout">Capture from permitted locations. A photo records visible context; it does not establish concealed conditions or equipment performance.</section></aside></div>`;}
function gapsView(s){const gaps=s.gaps.filter(g=>!gapFilter||g.status===gapFilter),missing=M.reviewChecks(s).filter(x=>x.fact);return pageHeading('Missing information & follow-up','Give every unanswered question a responsible person and a concrete next action.',action('ai','Find gaps','screen','data-mode="gaps"')+action('new-gap','Add follow-up','plus',canEdit(s)?'':'disabled','primary'))+`${missing.length?`<div class="callout warning space-bottom"><strong>${missing.length} observation${missing.length===1?' needs':'s need'} follow-up before review.</strong><div class="actions">${missing.map(x=>action('new-gap',x.title,'plus',`data-fact="${x.fact}" ${canEdit(s)?'':'disabled'}`)).join('')}</div></div>`:''}<div class="toolbar card space-bottom"><select id="gap-filter" aria-label="Follow-up status"><option value="Open"${gapFilter==='Open'?' selected':''}>Open follow-up</option><option value="Closed"${gapFilter==='Closed'?' selected':''}>Closed follow-up</option><option value=""${gapFilter===''?' selected':''}>All follow-up</option></select><span class="small">${gaps.length} shown · ${s.gaps.filter(g=>g.status==='Open').length} open</span></div>${gaps.length?`<div class="grid-two">${gaps.map(g=>`<article class="followup-card"><div class="row between">${pill(g.priority+' priority',g.priority==='High'?'warning':'neutral')}${pill(g.status,g.status==='Closed'?'success':'neutral')}</div><h3>${esc(g.title)}</h3><p class="small">${esc(M.target(s,g.target).name)}</p><p style="margin-top:12px">${esc(g.action)}</p>${g.status==='Closed'?'<p class="review-note" style="margin-top:12px">'+esc(g.resolution)+'</p>':''}<div class="foot"><span class="small">${esc(g.owner)}<br>Due ${esc(dateLabel(g.due))}${g.status==='Open'&&g.due<C.asAt?' · Overdue':''}</span>${action('edit-gap',canEdit(s)?'Review item':'Inspect','arrow',`data-id="${g.id}"`)}</div></article>`).join('')}</div>`:`<section class="card empty">${ico('check')}<h3>No ${gapFilter.toLowerCase()||'matching'} follow-up items</h3><p>   if(file.size>1048576||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Choose a JPG, PNG or WebP photo up to 1 MB.');
  const value=await readFile(file,true),binary=atob(value.split(',')[1]),sig=[...binary.slice(0,12)].map(c=>c.charCodeAt(0));
  const type=sig[0]===137&&sig[1]===80&&sig[2]===78&&sig[3]===71?'image/png':sig[0]===255&&sig[1]===216&&sig[2]===255?'image/jpeg':binary.slice(0,4)==='RIFF'&&binary.slice(8,12)==='WEBP'?'image/webp':'';if(type!==file.type)throw Error('The photo content does not match its file type.');

}

function saveEditor(){
 if(!editor||stale)return errors({},'Reload saved data before saving. Your proposal is retained.');clearErrors();const e=editor,s=data.surveys.find(x=>x.id===e.survey),val=id=>$('#'+id)?.value.trim()||'';let result;
 if(e.kind==='scope'||e.kind==='new-survey'){
  if(role!=='coordinator'||(e.kind==='scope'&&!canEdit(s)))return;const p=readScope(),bad={};for(const k of ['title','objective','access','arrival'])if(!M.text(p[k],k==='title'?200:2000))bad[k]='Record this information.';if(!M.date(p.visitDate))bad.visitDate='Choose a valid visit date.';

 }else if(e.kind==='fact'){

  result=commit({...s,version:e.version},e.original?'Observation corrected':'Observation captured',val('reason')||'New source-backed observation',x=>{const index=x.facts.findIndex(a=>a.id===f.id);f.version=(e.original?.version||0)+1;if(index>=0)x.facts[index]=f;else x.facts.push(f);});
 }else if(e.kind==='gap'){

 }else if(e.kind==='photo'){
  if(!canEdit(s))return;const p=M.clone(e.draft),bad={};for(const k of ['target','caption','capturedAt','author','source'])p[k]=val(k);for(const k of ['caption','source','reason'])if(!val(k))bad[k]='Record this information.';if(!M.date(p.capturedAt))bad.capturedAt='Record a valid capture date.';if(!e.fileReady)bad.caption='Select a valid image and wait for its preview.';if(!e.id&&s.photos.length>=8)bad.caption='This preview supports up to eight original photos per survey.';if(!e.id&&s.photos.some(x=>x.data===p.data))bad.caption='This original image is already recorded. Correct its metadata from the evidence view.';if(Object.keys(bad).length)return errors(bad);

function briefText(s,c,edition,h=null){return `POWERPLANTS ONE — SITE SURVEY / AS-FOUND\n${h?'PREPARED HANDOVER — LOCAL EXAMPLE':'DRAFT FOR HUMAN REVIEW'}\n${s.ref} · revision ${edition}\n${c.title}\nOrganisation: ${C.organisation.name}\nSite: ${M.site(c.site).name}\nAddress: ${M.site(c.site).address}\nVisit: ${c.visitDate}; owner: ${c.owner}\n${h?'Receiving team: '+h.target+'; owner: '+h.owner+'\nRequested work: '+h.purpose+'\nReviewed snapshot: '+h.snapshot+'\n':''}\nPURPOSE\n${c.objective}\n\nSCOPE\n${[...c.facilities,...c.assets].map(id=>M.label(c,id)).join('\n')}\n\nARRIVAL & ACCESS\n${c.arrival}\n${c.access}\n\nOBSERVATIONS — EXACT RECORDED BASIS\n${c.facts.map(f=>`${f.id} · ${f.title} · v${f.version}\n${M.label(c,f.target)}\nBasis: ${f.basis}${f.basis==='Measured'?' · '+f.value+' '+f.unit:''}\n${f.detail}\nMethod/provider: ${f.method}\nAuthor: ${f.author}; observed ${f.observedAt}\nSource: ${f.source}`).join('\n\n')}\n\nPHOTO REFERENCES\n${c.photos.map(p=>`${p.id} · ${p.filename}\n${p.caption}\n${M.label(c,p.target)} · ${p.capturedAt} · ${p.author}\nSource: ${p.source}\nOriginal image retained in the exact survey snapshot.`).join('\n\n')||'No survey photographs recorded.'}\n\nFOLLOW-UP\n${c.gaps.map(g=>`${g.id} · ${g.title} · ${g.status}\n${M.label(c,g.target)}\nOwner: ${g.owner}; due ${g.due}; priority ${g.priority}\nAction: ${g.action}\n${g.resolution?'Outcome: '+g.resolution:''}`).join('\n\n')||'No follow-up recorded.'}\n\nLIMITS\nSynthetic design example. Reviewed facts may retain stated unknowns. No capacity, engineering suitability, site access, estimate issue or receiving-team acceptance is certified. Shared records and earlier handovers remain unchanged.\n`;}

document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();saveEditor();}});
document.addEventListener('keydown',e=>{const tab=e.target.closest('[data-tab]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=$$('[data-tab]:not(:disabled)'),i=tabs.indexOf(tab),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowLeft'?-1:1)+tabs.length)%tabs.length;tabs.forEach((b,j)=>b.tabIndex=j===n?0:-1);tabs[n].focus();}if(e.key==='Escape'&&!e.defaultPrevented&&!$('dialog[open][aria-modal=true]')){const panel=$('#assistant').open?'assistant':$('#inspect').open?'inspect':'';if(panel){e.preventDefault();close(panel);}}});
for(const d of $$('dialog'))d.addEventListener('cancel',e=>{e.preventDefault();if(d.id==='editor')guard(()=>close(d));else if(d.id==='decision'){decision=null;close(d);}else close(d);});

window.PPOSurvey=Object.freeze({getState:()=>M.clone(data),getContext:()=>({selected,view,role}),storageKey:KEY});render();
