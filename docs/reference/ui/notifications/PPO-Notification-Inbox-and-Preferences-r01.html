    if(!e){target.innerHTML=empty('Choose an update','Select a notice to see its source, owner and next step.');return;}
    const s=M.sources[e.source],read=unread(e),outside=view!=='escalations'&&!filtered().some(x=>x.id===e.id);
    target.innerHTML=`<div class="panel-head"><span class="eyebrow" style="margin:0">Notice details</span>${tag(read?'Unread':'Read',read?'info':'')}</div><div class="panel-body">${outside?'<p class="notice warning">The selected notice is outside your current filters.</p>':''}<span class="small muted">${E(s.module)} · ${time(e)} AEST</span><h2>${E(e.title)}</h2><p class="context">${E(s.customer||'Unavailable source')}${s.site?'<br>'+E(s.site):''}</p><dl class="facts"><dt>Source</dt><dd>${E(s.ref)}</dd><dt>Owner</dt><dd>${E(s.owner||'Not available')}</dd><dt>Due</dt><dd>${date(s.due)}</dd><dt>Action status</dt><dd>${tag(s.status,s.required?'warning':'')}</dd></dl><div class="next"><strong>Why you received this</strong><p>${E(s.reason)}</p></div>${s.next?`<div class="next"><strong>Next step</strong><p>${E(s.next)}</p></div>`:''}${btn('Open source preview '+icon('arrow'),'source',`data-id="${e.id}"`,'primary full')}<div class="snapshot-actions">${btn(read?'Mark as read':'Mark as unread',read?'read':'unread',`data-id="${e.id}"`)}${btn(archived(e)?'Restore':'Archive',archived(e)?'restore':'archive',`data-id="${e.id}" ${M.activeRequired(e)?'disabled title="Active required notices stay in the inbox"':''}`)}</div>${M.activeRequired(e)?'<p class="tiny muted space-top">Required notice · remains in your inbox while the action is active.</p>':''}</div><div class="panel-foot">${E(e.id.toUpperCase())} · Source snapshot r${s.noticeVersion}<br>Read state is personal. Business status comes from the source.</div>`;
  }
  function renderPrefs(){
    if(!draft)draft=structuredClone(person().prefs);
    const labels={'Owned work':'Assignments, reviews and escalations','Changes':'Updates to records you follow','Mentions':'Direct mentions in permitted records','Documents':'New issued revisions and document notices'};
    $('#main').innerHTML=`<div class="pref-grid"><div class="stack"><div class="notice">These preferences control delivery. Required owned work stays visible in PPO and My Work. Email settings are a demonstration; no messages or schedules are created.</div><section class="panel"><div class="panel-head"><h2>Notification channels</h2>${tag('Personal preferences')}</div><div class="pref-row head"><span>Category</span><span>In PPO</span><span>Email</span></div>${Object.entries(labels).map(([k,label])=>`<div class="pref-row"><div><h3>${E(k)}</h3><small>${label}</small></div><div class="inapp always">${icon('check')} Always visible</div><label><span class="sr-only">${E(k)} email</span><select data-pref-channel="${E(k)}" aria-label="${E(k)} email">${options(['Immediate','Digest','Off'],draft.channels[k])}</select></label></div>`).join('')}<div class="panel-foot">Browser push and SMS are not connected. Delivery choices do not change source permissions.</div></section><section class="panel"><div class="panel-head"><h2>Digest & quiet hours</h2>${icon('clock')}</div><div class="panel-body"><div class="form-grid"><label><span>Digest frequency</span><select id="cadence" data-pref="cadence">${options(['Daily','Weekly'],draft.cadence)}</select></label><label><span>Digest time</span><input type="time" id="digest-time" data-pref="time" value="${draft.time}" required></label><label id="weekday-label" ${draft.cadence==='Daily'?'hidden':''}><span>Digest day</span><select data-pref="day">${options(['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],draft.day)}</select></label><label><span>Time zone</span><select id="zone" data-pref="zone">${options(['Australia/Brisbane','Australia/Perth'],draft.zone)}</select></label><label class="checkbox wide"><input type="checkbox" data-pref="quiet" ${draft.quiet?'checked':''}><span>Use quiet hours for email delivery</span></label><label><span>Quiet hours start</span><input type="time" data-pref="start" value="${draft.start}"></label><label><span>Quiet hours end</span><input type="time" data-pref="end" value="${draft.end}"></label><label class="checkbox wide"><input type="checkbox" data-pref="group" ${draft.group?'checked':''}><span>Group digest entries by source record</span></label></div><p class="small muted space-top">A quiet window can cross midnight. Email waits until the window ends; in-app notices and due dates stay unchanged. Required email is also deferred in this proposed policy.</p><p id="pref-error" class="notice error space-top" hidden role="alert"></p></div><div class="savebar"><span id="draft-status" class="small muted"></span><div class="row">${btn('Discard changes','discard')}${btn(icon('save')+'Save preferences','save-prefs','','primary')}</div></div></section></div><aside class="side"><section class="panel"><div class="panel-head"><h2>Digest preview</h2>${tag('Not sent','info')}</div><div class="panel-body" id="digest"></div></section><section class="panel"><div class="panel-head"><h2>Delivery preview</h2>${icon('mail')}</div><div class="panel-body"><label><span>Preview local time</span><input id="preview-clock" type="time" value="${clock}"></label><div id="delivery" class="space-top"></div></div></section></aside></div>`;updatePrefs();
  }
  function isDirty(){return draft&&JSON.stringify(draft)!==JSON.stringify(person().prefs);}
  function updatePrefs(){
    const test=structuredClone(state);test.people[role].prefs=draft;
    const rows=M.delivery(test,role,clock,scenario),dig=rows.filter(x=>x.result==='Next digest'),groups=draft.group?M.groups(dig.map(x=>x.event)):dig.map(x=>({source:x.source,events:[x.event]}));
    $('#weekday-label').hidden=draft.cadence==='Daily';$('#draft-status').textContent=isDirty()?'Unsaved changes · preview uses your draft':'Saved preferences · local demonstration';
    let valid=true;try{M.validatePrefs(draft);$('#pref-error').hidden=true;}catch(e){valid=false;$('#pref-error').textContent=e.message;$('#pref-error').hidden=false;}
    $('[data-action="save-prefs"]').disabled=!isDirty()||!valid||!!blocked;
    const effective=M.quietAt(draft,draft.time)?draft.end:draft.time;
    $('#digest').innerHTML=`<span class="eyebrow">${E(draft.cadence)}${draft.cadence==='Weekly'?' · '+E(draft.day):''}</span><h3>${E(effective)} · ${E(draft.zone.replace('Australia/',''))}</h3>${effective!==draft.time?`<p class="tiny muted space-top">Scheduled at ${E(draft.time)}; deferred to ${E(effective)} when quiet hours end.</p>`:''}<div class="progress-rule"></div><div class="digest-count">${scenario==='failed'?'—':dig.length}</div><p class="small muted">${scenario==='failed'?'Source unavailable':dig.length===1?'eligible unread update':'eligible unread updates'}${scenario==='partial'?' · partial sources':''}</p>${groups.map(g=>`<div class="digest-item"><h3>${E(g.source.ref)}</h3><p>${E(g.source.customer)} · ${g.events.length} update${g.events.length===1?'':'s'}</p>${g.events.map(e=>`<p>${E(e.title)}</p>`).join('')}</div>`).join('')}${!dig.length?'<p class="small muted space-top">No available unread updates match the Digest categories.</p>':''}<p class="tiny muted space-top">Read, archived and unavailable-source notices are excluded. Final recipients and current permissions must be checked at send time.</p>`;
    $('#delivery').innerHTML=`<p class="small muted">${E(clock)} · ${E(draft.zone.replace('Australia/',''))}<br>${M.quietAt(draft,clock)?'Within quiet hours':'Outside quiet hours'}</p>${rows.map(x=>`<div class="delivery-row"><span>${E(x.event.title)}</span>${tag(x.result)}</div>`).join('')||'<p class="small muted">No eligible updates.</p>'}<p class="tiny muted space-top">Preview only · no queued, sent or delivered receipt is claimed.</p>`;
  }
  function modal(title,html){trigger=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();}
  function close(){if($('#modal').open)$('#modal').close();}
  $('#modal').addEventListener('close',()=>{if(location.hash)history.replaceState(null,'',location.pathname+location.search);if(trigger?.isConnected)trigger.focus({preventScroll:true});else $('#main').focus({preventScroll:true});});
  function source(id,refreshed=false,push=true){
    const e=available().find(e=>e.id===id);
    if(!e||sourceMode==='revoked'){modal('Source not available','<div class="notice warning">Your current access does not allow this source to be shown. No details or actions are available. Return to the inbox or ask the record owner through your normal process.</div>'+btn('Return to inbox','close'));return;}
    const s=M.sources[e.source];
    if(s.unavailable){modal('Source no longer available','<p>The original target cannot be resolved. This notice is retained as history; it will not open a different record.</p>'+btn('Return to inbox','close','','space-top'));return;}
    if(s.version!==s.noticeVersion&&!refreshed){modal('A newer revision is available',`<p>This notice points to ${E(s.ref)} r${s.noticeVersion}. The current reference is r${s.version}.</p><div class="notice warning space-top">Review the current source before making any decision. The original notice remains unchanged.</div>${btn('Refresh to r'+s.version,'fresh-source',`data-id="${e.id}"`,'primary')}`);return;}
    const link='#notice='+e.id+'&source='+s.id;if(push&&location.hash!==link)history.pushState(null,'',link);
    modal('Source preview',`<div class="notice">This is a local source snapshot. Open the receiving module in the application to perform its controlled action.</div><span class="eyebrow">${E(s.module)} · ${E(s.ref)}</span><h2>${E(s.title)}</h2><p class="space-top">${E(s.customer)} · ${E(s.site)}</p><dl class="facts"><dt>Business state</dt><dd>${tag(s.status,'warning')}</dd><dt>Owner</dt><dd>${E(s.owner)}</dd><dt>Due</dt><dd>${date(s.due)}</dd><dt>Version</dt><dd>Current reference r${s.version}</dd><dt>Target</dt><dd>${E(s.route)}</dd></dl><div class="next"><strong>Required next step</strong><p>${E(s.next)}</p></div><p>${E(s.detail)}</p><p class="small muted space-top">Opening this preview does not mark the notice read, acknowledge a pack, approve a report or complete an action.</p><div class="row">${btn('Copy local deep link','copy-link')}<a href="https://github.com/deanrfiedler-gif/powerplants-one/blob/07eb34d5df5ea430c365da78e160cb6aa0b76f20/docs/reference/ui/${E(s.design)}" target="_blank" rel="noopener">Module design reference ↗</a></div><label class="space-top"><span>Local preview link</span><input id="deep-link" readonly value="${E(location.href)}" style="width:100%"></label>`);
  }
  function navigate(next){if(isDirty()){modal('Keep your preference changes?',`<p>Your delivery preferences have unsaved changes. Save them in Preferences, or discard the draft before leaving.</p><div class="row">${btn('Keep editing','close','','primary')}${btn('Discard and continue','leave',`data-next="${next}"`)}</div>`);return;}view=next;checked.clear();render();}
  function previewOptions(){modal('Preview options',`<div class="notice">All people and records are fictional. Preview identities illustrate scope; the complete fixture is embedded in this file.</div><div class="form-grid"><label><span>Preview person</span><select id="preview-role"><option value="coordinator" ${role==='coordinator'?'selected':''}>Alex Morgan · Coordinator</option><option value="technician" ${role==='technician'?'selected':''}>Riley Chen · Technician</option></select></label><label><span>Source loading</span><select id="preview-scenario">${['live','partial','failed','empty'].map(v=>`<option value="${v}" ${scenario===v?'selected':''}>${{live:'Available',partial:'Partial · Service missing',failed:'Failed',empty:'Successful · no records'}[v]}</option>`).join('')}</select></label><label class="wide"><span>Access when opening a source</span><select id="preview-source">${['current','revoked'].map(v=>`<option value="${v}" ${sourceMode===v?'selected':''}>${v==='current'?'Current preview access':'Access revoked before opening'}</option>`).join('')}</select></label></div><div class="row">${btn('Apply preview options','apply-options','','primary')}${btn('Add a new project update','new-event')}${btn('Export preview state','export')}${btn('Reset preview…','reset')}</div><p class="small muted space-top">Reset affects only this standalone preview. No PPO application data or external preferences are changed.</p>`);}
  function download(content,name){const url=URL.createObjectURL(new Blob([content],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  document.addEventListener('click',async event=>{
    const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
    if(a==='view'){navigate(el.dataset.view);return;}
    if(a==='close'){close();return;}
    if(a==='leave'){draft=null;view=el.dataset.next;close();render();return;}
    if(a==='guide'){modal('Notification inbox & preferences',`<p><strong>What changed, what needs my attention, and where do I act?</strong></p><ul><li>Inbox tracks personal read and archive state.</li><li>Grouped changes retains individual event history and before/after details.</li><li>Owned escalations lists distinct active source obligations, including read notices.</li><li>Preferences previews email, digests and quiet hours.</li></ul><div class="notice">There is no business-completion control here. Pack acknowledgement, service review and supplier follow-up stay in their source workflows.</div><p>Select Preview options to try missing sources, a different person or lost access. Local saves remain separate from the application.</p>`);return;}
    if(a==='options'){if(isDirty()){say('Save or discard your preference changes before changing preview options.');return;}previewOptions();return;}
    if(a==='apply-options'){role=$('#preview-role').value;scenario=$('#preview-scenario').value;sourceMode=$('#preview-source').value;draft=null;selected=null;checked.clear();filters={search:'',module:'All modules',read:'All updates',archive:'Inbox'};close();render();return;}
    if(a==='select'){selected=id;renderResults();renderSnapshot();if(innerWidth<=850){$('#snapshot').scrollIntoView({block:'start',behavior:'auto'});$('#snapshot').focus({preventScroll:true});}else $(`[data-action="select"][data-id="${id}"]`)?.focus({preventScroll:true});return;}
    if(['read','unread','archive','restore'].includes(a)){if(save({type:a,ids:[id]},true)){render();say(a==='read'?'Notice marked read. The business action is unchanged.':a==='unread'?'Notice marked unread.':a==='archive'?'Routine notice archived. Its source is unchanged.':'Notice restored to your inbox.',true);}return;}
    if(a.startsWith('bulk-')){const type=a==='bulk-archive'?(filters.archive==='Archived'?'restore':'archive'):a==='bulk-read'?'read':'unread';if(save({type,ids:[...checked]},true)){checked.clear();render();say('Selected notices updated. Source actions are unchanged.',true);}return;}
    if(a==='group-read'){const ids=filtered().filter(e=>e.source===el.dataset.source).map(e=>e.id);if(save({type:'read',ids},true)){render();say('Displayed group changes marked read. Future updates will still be unread.',true);}return;}
    if(a==='undo'){
      if(!undo||undo.role!==role||undo.revision!==state.revision){say('This change can no longer be undone here.');return;}
      try{if(localStorage.getItem(key)!==raw)throw Error('Saved copy changed.');const next=structuredClone(state);next.people[role]=undo.before;next.revision++;next.history.push({type:'undo',actor:M.roles[role].name,revision:next.revision});localStorage.setItem(key,JSON.stringify(next));state=next;raw=JSON.stringify(next);undo=null;render();say('Notification change undone.');}catch{blocked='Another tab or storage failure prevented undo. Reload the latest copy before retrying.';render();}return;
    }
    if(a==='clear'){filters={search:'',module:'All modules',read:'All updates',archive:'Inbox'};checked.clear();render();return;}
    if(a==='summary'){if(isDirty())return;const t=el.dataset.target;filters={search:'',module:'All modules',read:t==='unread'?'Unread':'All updates',archive:'Inbox',escalation:['overdue','undated'].includes(t)?t:null};view=t==='unread'?'inbox':'escalations';checked.clear();render();return;}
    if(a==='all-escalations'){filters.escalation=null;render();return;}
    if(a==='refresh'){scenario='live';render();say('Reference sources refreshed. No duplicate notices created.');return;}
    if(a==='source'||a==='fresh-source'){source(id,a==='fresh-source');return;}
    if(a==='copy-link'){try{await navigator.clipboard.writeText(location.href);say('Local preview link copied.');}catch{$('#deep-link').focus();$('#deep-link').select();say('Select and copy the preview link shown.');}return;}
    if(a==='new-event'){if(save({type:'new-event'})){close();render();say('Latest project update loaded once. It remains unread.');}return;}
    if(a==='save-prefs'){if(save({type:'prefs',prefs:draft})){draft=null;render();say('Preferences saved locally. No delivery service was changed.');}return;}
    if(a==='discard'){draft=structuredClone(person().prefs);render();say('Unsaved preference changes discarded.');return;}
    if(a==='export'){download(JSON.stringify({kind:'PPO SH-03 synthetic preview',state,preferenceDraft:draft},null,2),'PPO-Notifications-Demo-State.json');return;}
    if(a==='original'){let bytes=raw;try{bytes=localStorage.getItem(key);}catch{/* Retain the original bytes already held. */}download(bytes||'null','PPO-Notifications-Original-Save.json');return;}
    if(a==='reload'){location.reload();return;}
    if(a==='retry-storage'){try{const latest=localStorage.getItem(key);if(latest!==raw)throw Error('Reload to use the saved copy changed elsewhere.');if(latest)M.validateState(JSON.parse(latest));localStorage.setItem(key,raw||JSON.stringify(state));raw=localStorage.getItem(key);blocked='';render();say('Storage is available. Retry your change.');}catch(e){say(e.message||'Storage is still unavailable.');}return;}
    if(a==='reset'){modal('Reset this standalone preview?',`<p>This clears this preview’s read states, archive and saved preferences. Export any demonstration work you want to retain first.</p><div class="row">${btn('Export current copy','export')}${btn('Keep preview','close')}${btn('Reset preview','confirm-reset','','primary')}</div>`);return;}
    if(a==='confirm-reset'){try{localStorage.removeItem(key);raw=null;state=M.initial();blocked='';draft=null;undo=null;role='coordinator';scenario='live';sourceMode='current';view='inbox';selected='n01';filters={search:'',module:'All modules',read:'All updates',archive:'Inbox'};checked.clear();history.replaceState(null,'',location.pathname+location.search);close();render();say('Standalone preview reset.');}catch{say('Storage could not be cleared.');}return;}
  });
  document.addEventListener('input',event=>{const el=event.target;if(el.id==='search'){filters.search=el.value;checked.clear();renderResults();renderSnapshot();}});
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.dataset.pref||el.dataset.prefChannel){if(el.dataset.prefChannel)draft.channels[el.dataset.prefChannel]=el.value;else draft[el.dataset.pref]=el.type==='checkbox'?el.checked:el.value;updatePrefs();return;}
    if(el.id==='preview-clock'){clock=el.value||'19:30';updatePrefs();return;}
    if(el.dataset.select){el.checked?checked.add(el.dataset.select):checked.delete(el.dataset.select);renderResults();$(`[data-select="${el.dataset.select}"]`)?.focus({preventScroll:true});return;}
    if(el.id==='select-all'){checked=new Set(el.checked?filtered().map(e=>e.id):[]);renderResults();$('#select-all')?.focus({preventScroll:true});return;}
    const map={'module-filter':'module','read-filter':'read','archive-filter':'archive'};if(map[el.id]){filters[map[el.id]]=el.value;checked.clear();renderResults();renderSnapshot();}
  });
  $('#views').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;const buttons=[...$('#views').querySelectorAll('button')],i=buttons.indexOf(e.target);e.preventDefault();buttons[e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus();});
  window.addEventListener('storage',e=>{if(e.key===key&&e.newValue!==raw){blocked='Another tab changed the saved preview. Reload latest before making changes. Your current copy remains exportable.';close();render();}});
  window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue='';}});
  function openHash(){const p=new URLSearchParams(location.hash.slice(1)),id=p.get('notice');if(!id)return;const e=available().find(e=>e.id===id);selected=e?id:null;render();if(p.has('source')&&e&&e.source!==p.get('source')){modal('Link context does not match','<p>The notice and source references do not match. No record has been opened.</p>');return;}source(id,false,false);}
  window.addEventListener('popstate',()=>{close();openHash();});
  render();if(location.hash)openHash();
})();
</script></body></html>
