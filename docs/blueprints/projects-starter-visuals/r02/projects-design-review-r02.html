function register(){const rows=match(),blocked=rows.reduce((n,p)=>n+p.milestones.filter(m=>m.state==='Blocked').length,0),late=rows.filter(p=>overdue(p.action)).length,unknown=rows.filter(p=>!p.finish).length;return `<div class="page"><div class="headline"><div><h1>Projects</h1><p class="muted">Progress, milestones and the next step for every project.</p></div><button class="primary" data-do="new">+ New project</button></div><div class="stats"><div class="stat"><span>Matching projects</span><b>${rows.length}</b></div><div class="stat"><span>Blocked milestones</span><b>${blocked}</b></div><div class="stat"><span>Overdue actions</span><b>${late}</b></div><div class="stat"><span>Without finish date</span><b>${unknown}</b></div></div><div class="filters"><div class="search">${icon('search')}<input id="search" aria-label="Search projects" placeholder="Search projects or customer" value="${esc(filters.q)}"></div><button class="filtertoggle" data-do="filters" aria-expanded="${filterOpen}">Filters</button><div class="desktopfilters ${filterOpen?'open':''}"><select id="ownerfilter" aria-label="Coordinator"><option value="All">All coordinators</option>${options(names,filters.owner)}</select><select id="healthfilter" aria-label="Health"><option value="All">All health</option>${options(['Not assessed','On track','Attention','Blocked'],filters.health)}</select><select id="stagefilter" aria-label="Stage"><option value="All">All stages</option>${options(['Intake','Planning','Delivery','Handover'],filters.stage)}</select><select id="sortfilter" aria-label="Sort projects"><option value="finish" ${filters.sort==='finish'?'selected':''}>Forecast finish ↑</option><option value="title" ${filters.sort==='title'?'selected':''}>Project name A–Z</option></select><button class="quiet" data-do="clear">Clear</button></div></div>${!rows.length?'<div class="empty"><h2>No matching projects</h2><p>Try a different search or clear your filters.</p><button data-do="clear">Clear filters</button></div>':`<div class="tablewrap"><table><colgroup><col style="width:30%"><col style="width:13%"><col style="width:13%"><col style="width:18%"><col style="width:26%"></colgroup><thead><tr><th scope="col">Project / customer</th><th scope="col">Stage / health</th><th scope="col">Forecast finish</th><th scope="col">Next milestone</th><th scope="col">Next action</th></tr></thead><tbody>${rows.map(p=>{const m=nextMilestone(p);return `<tr><td><button class="projectlink" data-do="open" data-id="${p.id}">${esc(p.title)}</button><div class="subline">${esc(p.customer)} · ${esc(p.site)}</div><div class="subline">${esc(p.coordinator)} · ${ref(p)}</div></td><td><div class="stage">${esc(p.stage)}</div>${badge(p.health)}</td><td>${fmt(p.finish)}${p.target&&p.finish&&p.finish>p.target?'<div class="subline duemuted">Later than target</div>':''}</td><td>${m?`${esc(m.title)}<div class="subline">${fmt(m.forecast)}${m.state==='Blocked'?' · Blocked':''}</div>`:'<span class="muted">No milestone planned</span>'}</td><td>${actionSummary(p)}</td></tr>`}).join('')}</tbody></table></div><div class="mobilecards">${rows.map(p=>`<article class="projectcard"><div class="cardtop"><button class="projectlink" data-do="open" data-id="${p.id}">${esc(p.title)}</button>${badge(p.health)}</div><div class="subline">${esc(p.customer)} · ${esc(p.site)}</div><div class="cardline"><span>${esc(p.stage)} · ${esc(p.coordinator)}</span><span>${fmt(p.finish)}</span></div><div class="cardaction">${actionSummary(p)}</div></article>`).join('')}</div>`}<div class="listfoot"><span>${rows.length} of ${projects.length} synthetic projects · Counts follow these filters</span><span>As at 9 Sep 2026, 10:00 am AEST</span></div></div>`}
function detail(p){const blocked=p.milestones.filter(m=>m.state==='Blocked');let tabs=mode==='j3'&&p.id===101?['Overview','Milestones & actions','Scope & deliverables','Documents','Handover','History']:['Overview','Milestones & actions','History'];if(!tabs.includes(tab))tab='Overview';return `<div class="page"><div class="breadcrumb"><button data-do="back">${icon('arrow')} Projects</button></div><div class="detailtitle"><div class="headline"><div><h1>${esc(p.title)}</h1><div class="identityline"><span>${esc(p.customer)}</span><span> / </span><span>${esc(p.site)}</span></div><div class="identityline">${av(p.coordinator)}<span>Coordinator: ${esc(p.coordinator)}</span><span>· ${ref(p)}</span></div></div><div class="headbuttons"><button data-do="action">${openAction(p)?'Open activity':'Plan next action'}</button><button class="primary" data-do="update">Record update</button></div></div></div><div class="statebar">${badge('Active')}${badge(p.stage)}${badge(p.health)}<span class="small muted">Updated ${esc(p.history[0]?.time||'9 Sep 2026, 10:00 am AEST')}</span></div>${blocked.length?`<div class="banner"><div><strong>${esc(blocked[0].title)} is blocked</strong><p>${openAction(p)?`${esc(p.action.owner)} owns the next step · ${due(p.action.due)}`:'Follow-up needed. The previous outcome is retained in history.'}</p></div><button data-do="milestone" data-id="${blocked[0].id}">Review blocker</button></div>`:''}<div class="tabs" role="tablist" aria-label="Project sections">${tabs.map(t=>`<button role="tab" aria-selected="${t===tab}" class="${t===tab?'selected':''}" data-do="tab" data-tab="${esc(t)}">${t} ${['Scope & deliverables','Documents','Handover'].includes(t)?'<span class="previewlabel">Future</span>':''}</button>`).join('')}</div>${tab==='Overview'?overview(p):tab==='Milestones & actions'?milestones(p):tab==='History'?history(p):tab==='Scope & deliverables'?scope(p):tab==='Documents'?documents(p):handover(p)}</div>`}
function outlook(p){const days=p.finish&&p.target?Math.round((Date.parse(p.finish)-Date.parse(p.target))/86400000):null;return `<section class="panel outlookpanel"><div class="panelhead"><h2>Delivery outlook</h2></div><div class="outlook"><div><span>Target finish</span><b>${fmt(p.target)}</b></div><div><span>Forecast finish</span><b>${fmt(p.finish)}</b></div><div><span>Change from target</span><b>${days===null?'—':`${days>0?'+':''}${days} days`}</b><small>Calendar days</small></div></div><p class="note" style="margin-top:17px">${esc(p.comment||'Assessment needed.')}</p></section>`}
function activity(p){return `<section class="panel nextactionpanel"><div class="panelhead"><h2>Next action</h2>${openAction(p)&&overdue(p.action)?badge('Overdue'):''}</div>${openAction(p)?`<div class="activitytitle">${esc(p.action.text)}</div><div class="personline">${av(p.action.owner)}<span>${esc(p.action.owner)}<div class="small ${overdue(p.action)?'duedanger':'muted'}">${due(p.action.due)}</div></span></div><div class="buttonrow"><button data-do="action">Record outcome</button></div>`:`<p class="activitytitle">Next action needed</p><p class="note">${p.action?'The previous outcome is retained. Plan the next step when you are ready.':'Give the project an owned next step.'}</p><div class="buttonrow"><button data-do="action">Plan next action</button></div>`}</section>`}
function milestoneRows(p,all=false){let rows=all?p.milestones:p.milestones.filter(m=>!['Completed','Cancelled'].includes(m.state)).slice(0,3);return rows.length?rows.map(m=>`<div class="milestone">${icon(m.state==='Completed'?'check':'flag')}<div><strong>${esc(m.title)}</strong><div class="subline">${esc(m.owner)} · ${fmt(m.forecast)}</div></div><div class="state">${badge(m.state)}<button data-do="milestone" data-id="${m.id}">${['Completed','Cancelled'].includes(m.state)?'View':'Update'}</button></div></div>`).join(''):'<p class="note">No milestones planned. Add the first coordination milestone.</p>'}
function overview(p){return `<div class="detailgrid"><div class="stack">${outlook(p)}<section class="panel milestonespanel"><div class="panelhead"><h2>Upcoming milestones</h2><button data-do="tab" data-tab="Milestones & actions">View all ${p.milestones.length}</button></div>${milestoneRows(p)}</section><section class="panel scopecontextpanel"><div class="panelhead"><h2>Scope context</h2>${badge('Internal note')}</div><p style="white-space:pre-wrap">${esc(p.scope)}</p><p class="note" style="margin-top:12px">Coordination context. Formal accepted scope is a later handover capability.</p></section></div><div class="stack">${activity(p)}<section class="panel recentpanel"><div class="panelhead"><h2>Latest update</h2></div>${p.history[0]?`<strong>${esc(p.history[0].title)}</strong><p class="note" style="margin-top:9px">${esc(p.history[0].text)}</p><div class="meta">${esc(p.history[0].actor)} · ${esc(p.history[0].time)}</div>`:'<p class="note">No update recorded yet.</p>'}<div class="buttonrow"><button data-do="tab" data-tab="History">View history</button></div></section></div></div>`}
function milestones(p){return `<div class="detailgrid"><section class="panel"><div class="panelhead"><div><h2>Milestones</h2><p class="note">Manual dates · completion does not confirm approval or attendance</p></div><button data-do="addmilestone">+ Add milestone</button></div>${milestoneRows(p,true)}</section><div class="stack">${activity(p)}<div class="callout">A completed Activity retains its outcome. Resolve the milestone explicitly after reviewing the result.</div></div></div>`}
function history(p){return `<section class="panel"><div class="panelhead"><h2>Project history</h2><span class="small muted">Original updates and recorded outcomes</span></div>${p.history.length?p.history.map(e=>`<div class="event"><strong>${esc(e.title)}</strong><p>${esc(e.text)}</p><small>${esc(e.actor)} · ${esc(e.time)}</small></div>`).join(''):'<p class="note">Your first update will appear here.</p>'}</section>`}
function futureNote(){return '<div class="previewnote"><strong>Future handover design.</strong> These screens use a separate synthetic accepted-quotation fixture. They are outside J1 and do not imply current E1 quotation acceptance.</div>'}
function scope(p){return futureNote()+`<div class="panelhead"><div><h2>Accepted scope · quotation r03</h2><p class="note">Future fixture for the irrigation-controls example · exact source retained</p></div><button data-do="sourcechange">Compare proposed r04</button></div><div class="scopegrid"><section class="panel"><h2>Included work</h2><ul class="scope-list"><li>Replace the irrigation controller.</li><li>Map and test six existing irrigation zones.</li><li>Verify control operation.</li><li>Provide operator familiarisation.</li></ul></section><section class="panel"><h2>Exclusions</h2><ul class="scope-list"><li>Civil works and excavation.</li><li>Main power supply upgrades.</li><li>Replacement of existing field valves.</li></ul></section><section class="panel"><h2>Assumptions & open decisions</h2><ul class="scope-list"><li>Existing valves can be reused. <strong>Taylor</strong> to confirm compatibility.</li><li>Shutdown window remains unconfirmed. <strong>Sam</strong> owns follow-up.</li></ul><div class="callout">Reviewed as non-blocking for project setup; must be resolved before installation planning.</div></section><section class="panel"><h2>Deliverables</h2><div class="milestone"><span>01</span><div><strong>Zone mapping schedule</strong><div class="subline">Taylor · Technical review required</div></div></div><div class="milestone"><span>02</span><div><strong>Control verification record</strong><div class="subline">Taylor · Evidence required</div></div></div><div class="milestone"><span>03</span><div><strong>Operator familiarisation record</strong><div class="subline">Sam · Not yet submitted</div></div></div></section></div>`}
const docData=[['Accepted quotation','SYN-PPO-QUO-000101 · r03','Accepted fixture','Six-zone controller replacement, operator familiarisation and stated exclusions. Exact synthetic acceptance relates only to r03.'],['Site layout','Revision 02 · Site information','For information','Layout context only. This is not a released construction drawing.'],['Controller layout','Revision 01 · Taylor','Draft','Technical review has not occurred. This document cannot satisfy a technical-release gate.'],['Customer response','Quotation r03 · Response evidence','Recorded fixture','Synthetic acceptance evidence bound to quotation r03. Receiving review remains a separate action.']];
function documents(){return futureNote()+`<section class="panel"><div class="panelhead"><h2>Handover documents</h2><span class="small muted">Exact revisions · no live repository connection</span></div>${docData.map((d,i)=>`<div class="document">${icon('file')}<div class="grow"><strong>${d[0]}</strong><div class="subline">${d[1]}</div></div>${badge(d[2])}<button data-do="document" data-id="${i}">View details</button></div>`).join('')}<p class="note" style="margin-top:19px">The future application must check exact source versions and current access. The preview contains descriptions only; no customer files are attached.</p></section>`}
function handover(p){return futureNote()+`<div class="handovergrid"><section class="panel"><div class="panelhead"><h2>Source and delivery basis</h2>${badge(received?'Received':handoverState)}</div><h3>Irrigation controls upgrade</h3><p class="note" style="margin-top:5px">Demo Grower A · North propagation site</p><div class="document">${icon('file')}<div><strong>SYN-PPO-QUO-000101 · r03</strong><div class="subline">Exact accepted synthetic quotation</div></div></div><ul class="scope-list"><li>Includes six zones and operator familiarisation.</li><li>Excludes civil works and power upgrades.</li><li>Shutdown window: Sam to confirm before installation planning.</li><li>Valve compatibility: Taylor to confirm.</li></ul><div class="buttonrow"><button data-do="document" data-id="0">Review source evidence</button><button data-do="tab" data-tab="Scope & deliverables">View scope</button></div></section><section class="panel"><h2>Receiving review</h2>${handoverFollowup?`<div class="callout"><strong>Clarification follow-up</strong><p>${esc(handoverFollowup.text)} · ${esc(handoverFollowup.owner)} · Date needed</p></div>`:''}${received?`<div class="callout"><strong>Received in this preview</strong><p style="margin-top:8px">Linked to ${ref(projects.find(x=>x.id===received))}. Repeated receipt returns the same destination.</p></div><div class="buttonrow"><button data-do="open" data-id="${received}">Open project</button><button data-do="receiveagain">Check existing receipt</button></div>`:`<p class="note" style="margin:7px 0 16px">Coordinator Alex reviews scope, ownership and outstanding items before receiving.</p><label class="field">Destination<select id="destination"><option value="101">Link existing · Irrigation controls upgrade</option><option value="new">Create a new project</option></select></label><div class="checks"><label><input type="checkbox" id="checksource"><span>I reviewed quotation r03 and its exact acceptance evidence.</span></label><label><input type="checkbox" id="checkscope"><span>I reviewed inclusions and exclusions.</span></label><label><input type="checkbox" id="checkunknown"><span>The open items do not block project setup.<small>Sam owns shutdown confirmation; Taylor owns valve compatibility before installation planning.</small></span></label></div><div id="handovererror" role="alert"></div><div class="buttonrow"><button data-do="returnhandover">Return for clarification</button><button class="primary" data-do="receive">Receive handover</button></div>`}</section></div>`}
function field(name,label,type='text',value='',required=false,full=false,items=null){return `<label class="field ${full?'full':''}">${label}${type==='select'?`<select name="${name}" ${required?'required':''}>${options(items||[],value)}</select>`:type==='textarea'?`<textarea name="${name}" ${required?'required':''} maxlength="4000">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="${name==='title'?200:160}">`}</label>`}
function dialog(title,body,kind,submit='Save preview change'){returnFocus=document.activeElement;context={...context,kind,version:selected()?.version};dirty=false;$('#modal').innerHTML=`<form id="editform"><header class="modalhead"><h2 id="modalTitle">${title}</h2><button type="button" class="quiet" data-do="close" aria-label="Close dialog">✕</button></header><div class="modalbody"><div class="formintro">Design preview · changes stay in this open page only.</div>${body}<div id="formerror" role="alert"></div></div><footer class="modalfoot"><button type="button" data-do="close">Cancel</button>${submit?`<button type="submit" class="primary" id="submitform">${submit}</button>`:''}</footer></form>`;$('#modal').showModal();$('#modal input,#modal select,#modal textarea')?.focus()}
function close(force=false){if(!force&&dirty&&!confirm('Discard your unsaved preview changes?'))return;dirty=false;savePending=false;$('#modal').close();if(returnFocus?.isConnected)returnFocus.focus();else $('#app').focus()}
function error(s){$('#formerror').className='alert';$('#formerror').textContent=s}
function commit(fn){if(savePending)return;const p=selected();if(scenario==='conflict'&&context.kind!=='new'){scenario='normal';$('#scenario').value='normal';event(p,'Another update arrived','Simulated change from another coordinator. Your proposal has not been applied.');error('This project changed while you were editing. Latest version has an additional update; your entered values are retained. Review the new history before applying.');$('#formerror').insertAdjacentHTML('beforeend',`<p style="margin-top:9px">Latest: ${esc(p.history[0].text)}</p><button type="button" data-do="acceptlatest">Use latest version and keep my proposal</button>`);$('#submitform').disabled=true;return}if(p&&context.version!==p.version&&context.kind!=='new'){error('The project has changed. Close this proposal and review the latest values.');return}fn();dirty=false;if(scenario==='uncertain'){scenario='normal';$('#scenario').value='normal';savePending=true;$('#formerror').className='alert';$('#formerror').innerHTML='Save not confirmed in this simulated response-loss case. Check the original result before retrying.<div class="buttonrow"><button type="button" data-do="checksave">Check save status</button></div>';$('#submitform').disabled=true;return}close(true);render();notice('Updated in this preview · resets on reload')}
function forms(kind,id){const p=selected();context={id:Number(id)};if(kind==='new'){dialog('Create project',`<div class="formgrid">${field('title','Project title','text','',true,true)}${field('customer','Customer','select','Demo Grower A',true,false,Object.keys(customers))}${field('site','Site','select','',true,false,['',...customers['Demo Grower A']])}${field('coordinator','Coordinator','select','Alex',true,false,names)}<div class="help">Starts at Intake · Active · Not assessed</div>${field('target','Target finish','date')}${field('forecast','Forecast finish','date')}${field('action','Initial action','text','',true,true)}${field('owner','Activity owner','select','Alex',true,false,names)}${field('due','Due date and time · AEST','datetime-local')}<label class="fieldcheck"><input type="checkbox" name="date_needed">Due date needed</label></div>`,kind,'Create project');return}if(kind==='update'){dialog('Record project update',`<div class="formgrid">${field('note','What changed?','textarea','',true,true)}${field('stage','Delivery stage','select',p.stage,true,false,['Intake','Planning','Delivery','Handover'])}${field('health','Project health','select',p.health,true,false,['Not assessed','On track','Attention','Blocked'])}${field('forecast','Forecast finish','date',p.finish)}${field('target','Target finish','date',p.target)}${field('reason','Reason for stage or date change','text','',false,true)}${field('scope','Internal scope context','textarea',p.scope,false,true)}</div><p class="help" style="margin-top:13px">Attention or Blocked requires an open owned action. Completing an action will not automatically change health.</p>`,kind,'Record update');return}if(kind==='action'){if(openAction(p)){dialog('Record Activity outcome',`<p class="activitytitle">${esc(p.action.text)}</p><p class="note">Activity owner: ${esc(p.action.owner)} · ${due(p.action.due)}</p><div class="formgrid" style="margin-top:18px">${field('outcome','Outcome','textarea','',true,true)}</div><p class="help" style="margin-top:12px">The outcome is recorded for the Activity owner in this simulation. The milestone and project health remain unchanged.</p>`,'completeaction','Complete Activity')}else dialog('Plan next action',`<div class="formgrid">${field('action','Action','text','',true,true)}${field('owner','Activity owner','select',p.coordinator,true,false,names)}${field('due','Due date and time · AEST','datetime-local')}<label class="fieldcheck"><input type="checkbox" name="date_needed">Due date needed</label></div>`,'planaction','Plan action');return}if(kind==='addmilestone'){dialog('Add milestone',`<div class="formgrid">${field('title','Milestone title','text','',true,true)}${field('owner','Owner','select',p.coordinator,true,false,names)}${field('date','Forecast date','date')}<label class="fieldcheck"><input name="date_needed" type="checkbox">Forecast date needed</label><p class="help">Dates are manual.</p></div>`,kind,'Add milestone');return}if(kind==='milestone'){let m=p.milestones.find(x=>x.id===Number(id));context.milestone=m;if(['Completed','Cancelled'].includes(m.state)){dialog('Milestone evidence',`<h3>${esc(m.title)}</h3><p style="margin:12px 0">${badge(m.state)}</p><p class="note">${esc(m.note||'Original completion retained in the synthetic fixture.')}<br>Owner: ${esc(m.owner)} · Forecast: ${fmt(m.forecast)}</p><div class="callout">Terminal evidence is immutable. A correction creates a linked successor.</div><div class="buttonrow"><button type="button" data-do="successor" data-id="${m.id}">Create correction</button></div>`,kind,null);return}const transitions=m.state==='Planned'?['Planned','In progress','Blocked','Completed','Cancelled']:m.state==='In progress'?['In progress','Blocked','Completed','Cancelled']:['Blocked','Planned','In progress','Completed','Cancelled'];dialog('Update milestone',`<h3 style="margin-bottom:18px">${esc(m.title)}</h3><div class="formgrid">${field('state','Progress','select',m.state,true,false,transitions)}${field('date','Forecast date','date',m.forecast)}${field('note','Progress note / reason','textarea','',true,true)}${field('remaining','Remaining blocker work, if completing','text','',false,true)}</div><p class="help" style="margin-top:12px">Blocked needs an open linked Activity. Completing a blocked milestone must resolve or explicitly retain its remaining work.</p>`,kind,'Update milestone');return}}
document.addEventListener('input',e=>{if(e.target.closest('#modal'))dirty=true;if(e.target.id==='search'){const pos=e.target.selectionStart;filters.q=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const t=e.target;if(['checksource','checkscope','checkunknown','destination'].includes(t.id)&&handoverState!=='Returned for clarification'){$('#handovererror').textContent='';$('#handovererror').className=''}if(t.name==='customer'){const s=$('[name=site]');s.innerHTML=options(['',...customers[t.value]],'')}if(t.id==='mode'){mode=t.value;if(mode==='j3'){current=101;tab='Scope & deliverables'}else tab='Overview';render(true)}if(t.id==='scenario'){scenario=t.value;render(true)}const f={ownerfilter:'owner',healthfilter:'health',stagefilter:'stage',sortfilter:'sort'};if(f[t.id]){filters[f[t.id]]=t.value;render();$('#'+t.id)?.focus()}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();close()});
document.addEventListener('submit',e=>{if(e.target.id!=='editform')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const p=selected();const k=context.kind;for(const key of ['title','action','note','outcome'])if(key in d&&!d[key].trim()){error('Please enter meaningful text in the required field.');return}if(['new','planaction'].includes(k)&&((!d.due&&!d.date_needed)||(d.due&&d.date_needed))){error('Choose a due date and time, or select Due date needed.');return}if(k==='new'){commit(()=>{const id=Math.max(...projects.map(p=>p.id))+1;const n=project(id,d.title,d.customer,d.site,d.coordinator,'Intake','Not assessed',d.forecast,d.action,d.owner,d.due);n.target=d.target;n.comment='Assessment needed.';event(n,'Project created',`Initial action: ${d.action}; owner ${d.owner}.`);projects.push(n);current=id;tab='Overview'});return}if(k==='update'){if((d.stage!==p.stage||d.forecast!==p.finish||d.target!==p.target)&&!d.reason.trim()){error('Add a reason for the stage or date change.');return}if(['Attention','Blocked'].includes(d.health)&&!openAction(p)){error('Plan an open owned action before setting Attention or Blocked.');return}commit(()=>{const before=`${p.stage}; target ${fmt(p.target)}; forecast ${fmt(p.finish)}`;p.stage=d.stage;p.health=d.health;p.finish=d.forecast;p.target=d.target;p.scope=d.scope;p.comment=d.note;event(p,'Project update',`${d.note}\n${before} → ${p.stage}; target ${fmt(p.target)}; forecast ${fmt(p.finish)}.${d.reason?' Reason: '+d.reason:''}`)});return}if(k==='completeaction'){commit(()=>{p.action.state='Completed';p.action.outcome=d.outcome;event(p,'Activity completed',`${p.action.text}: ${d.outcome}. Project and milestone states unchanged.`,p.action.owner)});return}if(k==='planaction'){commit(()=>{p.action={text:d.action,owner:d.owner,due:d.due,state:'Open'};event(p,'Next action planned',`${d.action}; ${d.owner}; ${due(d.due)}.`)});return}if(['addmilestone','successor'].includes(k)&&((!d.date&&!d.date_needed)||(d.date&&d.date_needed))){error('Choose a forecast date or select Forecast date needed.');return}if(k==='addmilestone'||k==='successor'){commit(()=>{const mid=Math.max(0,...p.milestones.map(m=>m.id))+1;p.milestones.push({id:mid,title:d.title,owner:d.owner,forecast:d.date,state:'Planned',supersedes:k==='successor'?context.id:null});event(p,k==='successor'?'Milestone correction created':'Milestone added',`${d.title}; ${d.owner}; ${fmt(d.date)}.${d.reason?' Reason: '+d.reason:''}`)});return}if(k==='milestone'){const m=context.milestone;if(d.state==='Blocked'&&!openAction(p)){error('Plan an open owned Activity before marking this milestone Blocked.');return}if(m.state==='Blocked'&&d.state==='Completed'&&openAction(p)&&!d.remaining.trim()){error('Resolve the blocker Activity or explain the remaining work that will stay open.');return}commit(()=>{const old=m.state;m.state=d.state;m.forecast=d.date;m.note=d.note;event(p,'Milestone updated',`${m.title}: ${old} → ${m.state}. ${d.note}${d.remaining?' Remaining work: '+d.remaining:''}`)});return}if(k==='returnhandover'){commit(()=>{handoverState='Returned for clarification';event(p,'Handover returned for clarification',d.note+' Follow-up: '+d.action+'; '+d.owner);handoverFollowup={text:d.action,owner:d.owner,due:'',state:'Open'}});return}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b)return;const a=b.dataset.do,id=Number(b.dataset.id);if(a==='reviewtools'){const r=$('.review');r.classList.toggle('reviewopen');b.setAttribute('aria-expanded',r.classList.contains('reviewopen'))}if(a==='open'){current=id;tab='Overview';render(true);window.scrollTo(0,0)}if(a==='back'){current=null;tab='Overview';render(true)}if(a==='worked'){current=101;tab='Overview';scenario='normal';$('#scenario').value='normal';render(true);window.scrollTo(0,0)}if(a==='tab'){tab=b.dataset.tab;render();document.querySelector(`[role=tab][aria-selected=true]`)?.focus()}if(['new','update','action','addmilestone','milestone'].includes(a))forms(a,id);if(a==='close')close();if(a==='filters'){filterOpen=!filterOpen;render();$('.filtertoggle').focus()}if(a==='clear'){filters={q:'',health:'All',owner:'All',stage:'All',sort:filters.sort};render();$('#search')?.focus()}if(a==='recover'){scenario='normal';$('#scenario').value='normal';current=null;render(true)}if(a==='reset'){if(confirm('Reset all temporary changes and return to the original examples?')){projects=structuredClone(seed);current=null;tab='Overview';received=null;handoverState='Awaiting review',handoverFollowup=null;tick=0;filters={q:'',health:'All',owner:'All',stage:'All',sort:'finish'};scenario='normal';$('#scenario').value='normal';render(true);notice('Original synthetic examples restored')}}if(a==='checksave'){close(true);render();notice('Original preview result confirmed · no duplicate created')}if(a==='acceptlatest'){context.version=selected().version;$('#submitform').disabled=false;$('#formerror').textContent='Your proposal is retained against the latest preview version. Submit when ready.'}if(a==='document'){const d=docData[id];dialog(d[0],`<p>${esc(d[1])}</p><p style="margin:12px 0">${badge(d[2])}</p><p>${esc(d[3])}</p><div class="callout">Synthetic document description only. Exact file/version access must be implemented by the owning document service.</div>`,'view',null)}if(a==='sourcechange'){dialog('Source change needs review',`<div class="previewnote">Proposed r04 has not been accepted or applied.</div><h3>Accepted r03 remains the baseline</h3><ul class="scope-list"><li><strong>r03:</strong> Six irrigation zones.</li><li><strong>Proposed r04:</strong> Eight irrigation zones.</li><li><strong>Impact:</strong> Additional design, materials and verification require review.</li><li><strong>Unchanged:</strong> Existing project dates, actions and received evidence.</li></ul><div class="callout">An amendment needs its own accepted scope and receiving authority. The preview deliberately offers no one-click baseline replacement.</div>`,'view',null)}if(a==='successor'){const m=selected().milestones.find(x=>x.id===id);close(true);context={id};dialog('Create milestone correction',`<div class="formgrid">${field('title','Successor milestone','text',m.title,true,true)}${field('owner','Owner','select',m.owner,true,false,names)}${field('date','Forecast','date','')}<label class="fieldcheck"><input name="date_needed" type="checkbox">Forecast date needed</label>${field('reason','Correction reason','textarea','',true,true)}</div><div class="callout">The original ${esc(m.state.toLowerCase())} milestone remains unchanged.</div>`,'successor','Create correction')}if(a==='returnhandover'){dialog('Return handover for clarification',`<div class="formgrid">${field('note','Reason','textarea','',true,true)}${field('action','Follow-up','text','',true,true)}${field('owner','Owner','select','Alex',true,false,names)}</div>`,'returnhandover','Record return')}if(a==='receive'){if(handoverState==='Returned for clarification'){$('#handovererror').className='alert';$('#handovererror').textContent='This handover was returned. A new reviewed source revision is needed before receiving; use Reset to revisit the original fixture.';return}if(!$('#checksource').checked||!$('#checkscope').checked||!$('#checkunknown').checked){$('#handovererror').className='alert';$('#handovererror').textContent='Complete all three receiving checks before proceeding.';return}if($('#destination').value==='new'){const n=project(Math.max(...projects.map(p=>p.id))+1,'Irrigation controls upgrade — received handover','Demo Grower A','North propagation site','Alex','Intake','Not assessed','','Confirm shutdown window','Sam','2026-09-10T14:00');n.scope=seed[0].scope;n.sourceSnapshot={quote:'SYN-PPO-QUO-000101',revision:'r03',scope:seed[0].scope};event(n,'Handover received','Exact r03 synthetic scope and acceptance fixture received. Initial owned action created.');projects.push(n);received=n.id}else{received=101;event(projects.find(p=>p.id===101),'Handover linked','Exact r03 fixture linked; existing dates, coordinator and history preserved.')}render();notice('Handover received in preview · one destination retained')}if(a==='receiveagain')notice('Original preview receipt: '+ref(projects.find(p=>p.id===received)))});
document.addEventListener('keydown',e=>{if(!e.target.matches('[role=tab]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const list=[...document.querySelectorAll('[role=tab]')],i=list.indexOf(e.target);const next=e.key==='Home'?0:e.key==='End'?list.length-1:(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;list[next].click()});
render();
</script></body></html>
